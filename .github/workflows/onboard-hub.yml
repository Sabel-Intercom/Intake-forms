name: Onboard a client hub

# Put one client hub behind Cloudflare Access and lock its tracker key.
# Run from GitHub: Actions > "Onboard a client hub" > Run workflow, or
#   gh workflow run onboard-hub.yml -f slug=acme -f hub_file=AcmeTracker_v2.html -f email_domains=acme.com
# If the hub file (or a page listed under "also") lacks the hub-auth include,
# this adds the one line and commits it to main. Nothing else is ever committed.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Account > Access: Apps and Policies: Edit; Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  the Sabel Cloudflare account id
#   KICKOFF_TEAM_TOKEN     the team passcode (same value as in Vercel)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Client slug, e.g. cookaborough (tracker key is <slug>-tracker-v1)"
        required: true
      hub_file:
        description: "Hub file name in this repo, e.g. CookaboroughTracker.html"
        required: true
      email_domains:
        description: "Client email domain(s), comma separated, e.g. cookaborough.com"
        required: true
      also:
        description: "Usually blank: forms are found in the hub file. Extra own form pages, comma separated"
        required: false
      keys:
        description: "Usually blank: form keys are found in the hub file. Extra tracker keys, comma separated"
        required: false
      rotate:
        description: "Replace an existing client token"
        type: boolean
        default: false
      dry_run:
        description: "Print the calls, change nothing"
        type: boolean
        default: false

permissions:
  contents: write

# One onboarding at a time: two runs must never race on the Pages variables
# or on the push to main.
concurrency:
  group: onboard-hub
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Onboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KICKOFF_TEAM_TOKEN: ${{ secrets.KICKOFF_TEAM_TOKEN }}
          SLUG: ${{ inputs.slug }}
          HUB_FILE: ${{ inputs.hub_file }}
          DOMAINS: ${{ inputs.email_domains }}
          ALSO: ${{ inputs.also }}
          KEYS: ${{ inputs.keys }}
          ROTATE: ${{ inputs.rotate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -- "$SLUG" "$HUB_FILE" "$DOMAINS"
          if [ -n "$ALSO" ]; then set -- "$@" --also "$ALSO"; fi
          if [ -n "$KEYS" ]; then set -- "$@" --keys "$KEYS"; fi
          if [ "$ROTATE" = "true" ]; then set -- "$@" --rotate; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/onboard-hub.mjs "$@"
      - name: Commit what the script edited
        if: ${{ !inputs.dry_run }}
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          # Only tracked .html files and trackers.json; never anything new.
          # The script adds the include (one line), switches the hub's own
          # link (one line replaced) and names the hub in trackers.json (one
          # line). Anything bigger than that is not committed.
          if git diff --quiet -- '*.html' trackers.json; then
            echo "Already on main; nothing to commit."
            exit 0
          fi
          git diff --stat -- '*.html' trackers.json
          if git diff --numstat -- '*.html' trackers.json | awk '$1 > 2 || $2 > 1 { bad = 1 } END { exit bad ? 0 : 1 }'; then
            echo "::error::Expected at most two added lines and one replaced line per file. Not committing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html' trackers.json
          git commit -m "Publish hub for $SLUG"
          git push origin HEAD:main
