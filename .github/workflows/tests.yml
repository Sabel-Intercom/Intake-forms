name: Tests

# Hub access code: the Pages Functions, hub-auth.js and the two scripts.
# No secrets, no network: every outside call is replaced in the tests.

on:
  pull_request:
    paths:
      - "functions/**"
      - "scripts/**"
      - "tests/**"
      - "hub-auth.js"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/tracker-cli.test.mjs tests/hub-auth.test.mjs tests/access-functions.test.mjs tests/scripts.test.mjs
