name: Tests

# Hub access code: the Pages Functions, hub-auth.js, the scripts, and the
# readiness inputs code inside the readiness form and the two internal pages.
# No secrets, no network: every outside call is replaced in the tests.

on:
  pull_request:
    paths:
      - "functions/**"
      - "scripts/**"
      - "tests/**"
      - "hub-auth.js"
      - "SabelReadinessCheck.html"
      - "SabelReadinessAdmin.html"
      - "SabelInternalOps.html"
      - "trackers.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/client-forms-function.test.mjs tests/tracker-cli.test.mjs tests/hub-auth.test.mjs tests/access-functions.test.mjs tests/scripts.test.mjs tests/readiness-inputs.test.mjs
