<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabel × ELMO Software · Project Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--k0F1117:#0F1117;--k12151D:#12151D;--k12151E:#12151E;--k161B26:#161B26;--k1E2433:#1E2433;--k2A3145:#2A3145;--kE2E8F0:#E2E8F0;--kCBD5E1:#CBD5E1;--k94A3B8:#94A3B8;--k64748B:#64748B;--k475569:#475569;--k334155:#334155;--k4ADE80:#4ADE80;--kF87171:#F87171;--kFBBF24:#FBBF24;--k60A5FA:#60A5FA;--kFB923C:#FB923C;--kC084FC:#C084FC;--kA78BFA:#A78BFA;--k2DD4BF:#2DD4BF;--k38BDF8:#38BDF8;--k34D399:#34D399;}
html.light{--k0F1117:#F4F5F7;--k12151D:#FFFFFF;--k12151E:#FFFFFF;--k161B26:#FFFFFF;--k1E2433:#E4E7EC;--k2A3145:#D0D5DD;--kE2E8F0:#101828;--kCBD5E1:#344054;--k94A3B8:#475467;--k64748B:#667085;--k475569:#7A8699;--k334155:#B9C0CC;--k4ADE80:#15803D;--kF87171:#DC2626;--kFBBF24:#B45309;--k60A5FA:#2563EB;--kFB923C:#C2410C;--kC084FC:#9333EA;--kA78BFA:#7C3AED;--k2DD4BF:#0F766E;--k38BDF8:#0284C7;--k34D399:#047857;}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--k0F1117);color:var(--kE2E8F0);min-height:100vh}
.pw{display:grid;grid-template-columns:176px 1fr;min-height:100vh}
/* Sidebar is pinned and scrolls on its own, so the footer nav (Go-live
   checklist, Out of scope, exports) is always reachable. Without this the
   sidebar stretches to the full page height and margin-top:auto pushes those
   entries to the bottom of a long page, where they read as missing. */
.sb{display:flex;flex-direction:column;background:var(--k161B26);border-right:1px solid var(--k1E2433);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.sb::-webkit-scrollbar{width:6px}
.sb::-webkit-scrollbar-thumb{background:var(--k2A3145);border-radius:3px}
.sb-head{padding:16px 14px 14px;border-bottom:1px solid var(--k1E2433)}
.sb-logo{height:22px;margin-bottom:8px}
.sb-title{font-size:13px;font-weight:600;color:var(--kE2E8F0)}
.sb-sub{font-size:11px;color:var(--k94A3B8);margin-top:1px}
.si{display:block;width:100%;text-align:left;border:none;cursor:pointer;padding:10px 14px;font-family:inherit;background:transparent;border-bottom:1px solid var(--k1E2433);transition:background .12s}
.si:hover{background:var(--k1E2433)}
.sb-sec{padding:5px 14px 3px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--k475569);text-transform:uppercase;border-bottom:1px solid var(--k1E2433)}
.sb-footer{margin-top:auto;padding:14px;border-top:1px solid var(--k1E2433)}
.mn{padding:2.75rem 1.5rem 1.5rem;background:var(--k0F1117)}
.mnw{max-width:1240px;margin:0 auto}
/* cards — overflow:visible so status picker floats above */
.task{background:var(--k161B26);border:1px solid var(--k1E2433);border-radius:10px;margin-bottom:7px;overflow:visible;transition:border-color .12s;position:relative}
.task:hover{border-color:var(--k2A3145)}
.task-client{background:var(--k161B26);border:1px solid rgba(251,191,36,.28);border-radius:10px;margin-bottom:7px;overflow:visible;transition:border-color .12s;position:relative}
.task-client:hover{border-color:rgba(251,191,36,.5)}
.task.done,.task-client.done{opacity:.65}
.task.overdue,.task-client.overdue{border-left:3px solid var(--kF87171)}
/* Parent tasks (SOW deliverables with steps inside) read as containers, not
   another row: heavier surface, a left rail, and a step progress bar. */
.task.parent,.task-client.parent{background:var(--k12151D);border-left:3px solid var(--k60A5FA);box-shadow:inset 0 0 0 1px rgba(96,165,250,.08)}
.task-client.parent{border-left-color:var(--kFBBF24);box-shadow:inset 0 0 0 1px rgba(251,191,36,.08)}
.task.parent.overdue,.task-client.parent.overdue{border-left-color:var(--kF87171)}
.parent-title{font-weight:600!important}
.sub-rail{position:relative;padding-left:11px;margin-left:2px;border-left:1px dashed var(--k2A3145)}
.sub-bar{height:3px;border-radius:2px;background:var(--k1E2433);overflow:hidden;flex:1;min-width:34px;max-width:74px}
.sub-bar>i{display:block;height:100%;background:var(--k60A5FA);border-radius:2px}
.ov-two{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:900px){.ov-two{grid-template-columns:1fr}}
.ms-rail{position:relative}
.ms-rail::before{content:'';position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:var(--k1E2433)}
.ms-row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:13px 0;cursor:pointer}
.ms-row:hover .ms-title{color:#FFFFFF}
.task-inner{border-radius:10px;overflow:hidden}
.task-head{padding:12px;cursor:grab;user-select:none}
.col-drop{border:2px dashed rgba(96,165,250,.45)!important;background:rgba(96,165,250,.04)!important;border-radius:10px!important}
.card-dragging{opacity:.35!important}
.add-task-btn{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;background:transparent;border:1px dashed var(--k1E2433);border-radius:8px;color:var(--k475569);font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;margin-top:6px}
.add-task-btn:hover{border-color:#3B82F6;color:var(--k60A5FA);background:rgba(59,130,246,.05)}
.task-expand{border-top:1px solid var(--k1E2433);padding:12px;background:var(--k0F1117);display:none}
.task-expand textarea,.task-expand input{width:100%;font-size:12px;color:var(--kE2E8F0);background:var(--k161B26);border:1px solid var(--k2A3145);border-radius:6px;padding:7px 10px;font-family:inherit;line-height:1.5;outline:none}
.task-expand textarea{resize:vertical}
.task-expand textarea:focus,.task-expand input:focus{border-color:#3B82F6}
.task-expand label{font-size:11px;font-weight:500;color:var(--k94A3B8);display:block;margin-bottom:4px}
.chk-btn{background:none;border:none;cursor:pointer;padding:0;flex-shrink:0;display:flex;align-items:flex-start;padding-top:1px}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
/* status picker trigger */
.stat-bdg{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 6px 2px 8px;font-size:11px;font-weight:500;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.stat-bdg:hover{filter:brightness(1.15)}
/* filter stat cards */
.sc{border-radius:8px;padding:10px 12px;cursor:pointer;border:1px solid transparent;transition:all .15s;user-select:none;text-align:left;font-family:inherit;width:100%}
.sc.f-on{background:var(--k161B26);border-color:var(--k1E2433)}.sc.f-on.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4)}
.sc.f-att{background:var(--k161B26);border-color:var(--k1E2433)}.sc.f-att.active{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4)}
.sc.f-risk{background:var(--k161B26);border-color:var(--k1E2433)}.sc.f-risk.active{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
.col-head{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:5px}
.phase-cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.ov-top{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.empty-col{font-size:12px;color:var(--k334155);padding:20px 0;text-align:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-card{background:var(--k161B26);border:1px solid var(--k1E2433);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .12s}
.ph-card:hover{border-color:#3B82F6}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.5rem}
/* phase view top row: completion card beside the filter stat cards, to reduce scroll */
.phase-top{display:grid;grid-template-columns:minmax(190px,1fr) 1.7fr;gap:1rem;align-items:stretch;margin-bottom:1rem}
@media(max-width:760px){.phase-top{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--k1E2433);border:1px solid var(--k2A3145);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--k94A3B8);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1001}
.toast.show{opacity:1}
.filter-hint{font-size:11px;color:var(--k475569);display:flex;align-items:center;gap:4px;margin-top:6px}
/* floating status picker */
#status-picker,#owner-picker,#add-picker{position:fixed;display:none;background:var(--k1E2433);border:1px solid var(--k2A3145);border-radius:9px;padding:4px;z-index:1000;min-width:158px;max-height:300px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#add-picker{min-width:240px;max-width:320px}
#status-picker button,#owner-picker button,#add-picker button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:5px;transition:background .1s;text-align:left}
#status-picker button:hover,#owner-picker button:hover,#add-picker button:hover{background:rgba(255,255,255,.06)}
/* tooltip */
#runway-pop,#actions-pop{position:fixed;display:none;background:var(--k1E2433);border:1px solid var(--k2A3145);border-radius:9px;padding:11px 13px;z-index:1001;max-width:270px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.card-flash{animation:cardflash 2.4s ease}
@keyframes cardflash{0%{box-shadow:0 0 0 3px rgba(251,146,60,.95)}55%{box-shadow:0 0 0 3px rgba(251,146,60,.5)}100%{box-shadow:0 0 0 0 rgba(251,146,60,0)}}
#tip-box{position:fixed;display:none;background:var(--k1E2433);border:1px solid var(--k2A3145);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--kE2E8F0);max-width:240px;line-height:1.5;z-index:1002;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* top bar: slim fixed row over the main column (autosave dot + Hide completed
   pill), always on screen in every view and at every scroll position. The main
   column carries enough top padding that nothing hides beneath it */
#top-bar{position:fixed;top:8px;right:16px;display:flex;align-items:center;gap:10px;z-index:999}
#sb-toggle{display:none;position:fixed;top:8px;left:12px;z-index:1201;align-items:center;gap:6px;background:var(--k161B26);border:1px solid var(--k2A3145);border-radius:22px;color:var(--kE2E8F0);font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer}
#sb-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1199}
@media(max-width:700px){
  .pw{grid-template-columns:1fr}
  .sb{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);height:100vh;z-index:1200;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.6)}
  body.sb-open .sb{transform:none}
  body.sb-open #sb-scrim{display:block}
  #sb-toggle{display:inline-flex}
  .mn{padding:3.6rem 12px 1.5rem;min-width:0;overflow-x:hidden}
  .journey>div{min-width:0}
  body .ph-stp{min-width:0;flex-basis:100%}
  body .deliv-grid{grid-template-columns:minmax(0,1fr)}
  body .deliv-grid>*,body .task{min-width:0;max-width:100%}
  body .mn div[style*="nowrap"]{white-space:normal}
  body .mn div[style*="display:flex"][style*="cursor:pointer"]{flex-wrap:wrap}
  body .phase-cols,body .ov-top{grid-template-columns:minmax(0,1fr)}
  body .phase-cols>*,body .ov-top>*{min-width:0}
  #top-bar{right:10px}
}
#autosave-dot{font-size:11px;color:var(--k475569);display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .4s}
#autosave-dot.show{opacity:1}
/* Hide completed is a real switch, not a subtle pill: bigger hit area, a track
   and knob that slide, and a green fill when on (its default). */
#hide-done-pill{display:flex;align-items:center;gap:9px;background:var(--k161B26);border:1px solid var(--k2A3145);border-radius:22px;color:var(--k94A3B8);font-size:12px;font-weight:500;font-family:inherit;padding:7px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#hide-done-pill:hover{border-color:var(--k475569);color:var(--kCBD5E1)}
#hide-done-pill.on{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.5);color:var(--k4ADE80)}
#hide-done-pill .hd-sw{width:30px;height:17px;border-radius:10px;background:var(--k2A3145);position:relative;flex-shrink:0;transition:background .15s}
#hide-done-pill.on .hd-sw{background:var(--k4ADE80)}
#hide-done-pill .hd-sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--k94A3B8);transition:transform .15s,background .15s}
#hide-done-pill.on .hd-sw::after{transform:translateX(13px);background:var(--k0F1117)}
@media(max-width:700px){#hide-done-pill .hd-label{display:none}}

    /* ── Phased tasks (draft) ── */
    .task.phased{background:var(--k12151D);border-left:3px solid var(--k2A3145);box-shadow:inset 0 0 0 1px rgba(148,163,184,.06)}
    .task.phased.with-you{border-left-color:var(--kFBBF24)}
    .task.phased.overdue{border-left-color:var(--kF87171)}
    .task.phased.done{opacity:.6}
    .task.phased .task-head{cursor:pointer}
    .baton{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0}
    .baton::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .baton.you{color:var(--kFBBF24);background:rgba(251,191,36,.14)}
    .baton.sabel{color:var(--k60A5FA);background:rgba(96,165,250,.14)}
    .baton.done{color:var(--k4ADE80);background:rgba(74,222,128,.12)}
    .baton.wait{color:var(--k94A3B8);background:rgba(148,163,184,.12)}
    .baton.blk{color:var(--kF87171);background:rgba(248,113,113,.12)}
    .stp{display:flex;gap:3px;margin:0}
    .sg{flex:1;min-width:0;border:1px solid transparent;border-radius:7px;background:transparent;padding:5px 6px 4px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .12s,border-color .12s}
    .sg:hover{background:rgba(255,255,255,.06);border-color:var(--k2A3145)}
    .sg:hover .lab b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--k64748B)}
    .ph-row{display:flex;gap:14px;align-items:center}
    .ph-title{flex:0 0 250px;min-width:0}
    .ph-stp{flex:1;min-width:280px}
    .ph-baton{display:flex;align-items:center;gap:6px;flex-shrink:0}
    @media(max-width:1000px){.ph-row{flex-wrap:wrap}.ph-title{flex-basis:100%}}
    .task.phased .task-head:hover{background:rgba(255,255,255,.02)}
    .task.phased .baton{cursor:pointer}
    .task.phased .task-head:hover .baton{filter:brightness(1.2)}
    .sg:focus-visible .bar{outline:2px solid #E10600;outline-offset:2px}
    .sg .bar{height:4px;border-radius:2px;background:var(--k2A3145)}
    .sg.done .bar{background:var(--k4ADE80)}
    .sg.active .bar{background:var(--kFBBF24)}
    .sg.active.sabel .bar{background:var(--k60A5FA)}
    .sg.gate:not(.done):not(.active) .bar{background:repeating-linear-gradient(90deg,var(--k2A3145) 0 6px,transparent 6px 10px)}
    .sg.wk .bar{box-shadow:0 0 0 2px rgba(225,6,0,.55)}
    .sg .lab{font-size:10px;margin-top:5px;color:var(--k475569);display:flex;flex-direction:column;gap:1px;line-height:1.25}
    .sg.done .lab,.sg.active .lab{color:var(--kE2E8F0)}
    .sg .lab b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sg .lab i{font-style:normal;font-size:9.5px;color:var(--k475569);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sg.active .lab i{color:var(--k94A3B8)}
    .sg.open .lab b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--k475569)}
    .stage-det .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;margin-bottom:6px;color:var(--k94A3B8)}
    .stage-det .dh b{color:var(--kE2E8F0);font-weight:600}
    .stage-note{font-size:11.5px;color:var(--k94A3B8);margin-top:8px;border-left:2px solid var(--k2A3145);padding-left:8px;line-height:1.5}
    .deliv-strip{margin-bottom:14px}
    .deliv-grid{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
    .you-grp{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--k64748B);display:flex;justify-content:space-between;padding:8px 2px 4px;border-bottom:1px solid var(--k1E2433);margin-bottom:6px}
    .you-grp:first-child{padding-top:0}
    #opt-panel{position:fixed;top:44px;right:16px;display:none;width:340px;background:var(--k1E2433);border:1px solid var(--k2A3145);border-radius:10px;padding:12px 14px;z-index:1000;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#opt-panel label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--k2A3145);font-size:12px;color:var(--kE2E8F0);cursor:pointer;line-height:1.4}
#opt-panel label:first-of-type{border-top:none}
#opt-panel label input{margin-top:3px;accent-color:var(--k4ADE80)}
#opt-panel label span small{display:block;color:var(--k94A3B8);font-size:11px}
.next-line{font-size:11.5px;color:var(--kCBD5E1);margin-top:8px;padding-top:8px;border-top:1px solid var(--k1E2433)}
.next-line b{font-weight:600;color:var(--kE2E8F0)}
.journey{background:var(--k161B26);border:1px solid var(--k1E2433);border-radius:12px;padding:16px;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media(max-width:800px){.journey{grid-template-columns:1fr}}
.journey .segs{display:flex;gap:4px}
.journey .seg{flex:1;min-width:0}
.journey .seg .bar{height:6px;border-radius:3px;background:var(--k2A3145);overflow:hidden}
.journey .seg .bar i{display:block;height:100%}
.journey .seg .lab{font-size:10px;color:var(--k64748B);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journey .seg.cur .lab{color:var(--kE2E8F0);font-weight:600}
.journey .sentence{font-size:13px;color:var(--kCBD5E1);line-height:1.55;margin-top:12px}
.journey .sentence b{color:var(--kE2E8F0);font-weight:600}
.fx-row{display:grid;grid-template-columns:20px 22px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--k1E2433)}
.fx-row:hover{background:rgba(255,255,255,.02)}
.fx-num{font-size:10px;color:var(--k475569);text-align:right;font-variant-numeric:tabular-nums}
.fx-sec{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 4px;display:flex;justify-content:space-between}
.fx-chip{background:transparent;border:1px solid var(--k2A3145);color:var(--k94A3B8);font:inherit;font-size:11.5px;border-radius:20px;padding:5px 12px;cursor:pointer}
.fx-chip.on{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.5);color:var(--kE2E8F0)}
.dash-top{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:stretch}
.dash-top>*{min-width:0}
.journey{min-width:0}
.journey .segs{min-width:0}
@media(max-width:820px){.dash-top{grid-template-columns:1fr}}
.gl-compact{background:var(--k161B26);border:1px solid rgba(225,6,0,.35);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:100%}
.gl-compact:hover{border-color:rgba(225,6,0,.6)}

.pg-so-st.none{background:var(--k12151D);border:1px dashed var(--k2A3145)}
.pg-so-st.requested{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.45)}
.pg-so-st.accepted{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.45)}
.pg-so-st.changes{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.45)}
.pg-so-st b{color:var(--kE2E8F0)}
.pg-so-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pg-btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;font-weight:600;border-radius:7px;padding:6px 12px;cursor:pointer;border:1px solid transparent}
.pg-btn.go{background:#16A34A;color:#fff}.pg-btn.go:hover{background:#15803D}
.pg-btn.red{background:transparent;color:var(--kF87171);border-color:rgba(248,113,113,.5)}
.pg-btn.send{background:#E10600;color:#fff}
.pg-btn.ghost{background:transparent;color:var(--k94A3B8);border-color:var(--k2A3145);font-weight:400}
.pg-btn[disabled]{opacity:.45;cursor:not-allowed}
.pg-link{background:none;border:none;color:var(--k64748B);font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}
.pg-link:hover{color:var(--kE2E8F0)}
.pg-conf{margin-top:10px;padding-top:10px;border-top:1px dashed var(--k2A3145);display:flex;flex-direction:column;gap:8px}
.pg-conf label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--kCBD5E1);cursor:pointer}
.pg-conf input[type=checkbox]{margin-top:3px;accent-color:#16A34A}
.pg-warn{font-size:11.5px;color:var(--kFBBF24)}
.pg-log{margin-top:10px;font-size:11px;color:var(--k64748B);line-height:1.6}
.pg-log b{color:var(--k94A3B8);font-weight:600}
.pgd-so{display:flex;align-items:center;gap:8px;margin:2px 0 6px;padding:6px 8px;border-radius:6px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);font-size:11.5px;color:var(--kE2E8F0);cursor:pointer}
.pgd-so i{color:var(--kFBBF24);font-size:14px}
.pgd-r .so{font-size:12px;margin-left:5px;vertical-align:-1px}
.you-so{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.45);border-left:3px solid #FBBF24;border-radius:8px;margin-bottom:7px;cursor:pointer}
.you-so i{font-size:18px;color:#FBBF24;flex-shrink:0}
.you-so .t{flex:1;min-width:0;font-size:12.5px;color:var(--kE2E8F0);line-height:1.4}.you-so .t small{display:block;font-size:10.5px;color:var(--k94A3B8)}
@media print{.pg-add,.pg-x,.pg-foot,.pg-so-btns,.pg-conf{display:none}}
</style>

// ── Auto-save ─────────────────────────────────────────────────────────────────
function scheduleAutoSave(){
  // The internal tracker is a read-only lens over the client tracker's state:
  // it never writes, so it can never clobber the client's saved plan and its
  // hours can never reach the shared Upstash key.
  if(INTERNAL)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveState(),800);
}
// Conflict guard: each browser session gets an id, and every save carries a
// timestamp. Before saving we check whether someone else has saved since we
// loaded; if so, the user chooses between reloading (recommended) and overwriting.
const SESSION_ID=Math.random().toString(36).slice(2);
let remoteStamp=null;
function buildPayload(){
  const payload={progression:PROG,buildV:BUILD_V,goLive:goLiveDate,groupBy,hideDone,runwayOnDash,panels:{runway:!!panelOpen.runway,call:!!panelOpen.call},weekStarts,statuses:{},notes:cardNotes,links:cardLinks,origStatus,taskData:{},savedAt:Date.now(),savedBy:SESSION_ID};
  P.forEach(ph=>{
    payload.taskData[ph.id]={sabel:[...T[ph.id].sabel],client:[...T[ph.id].client]};
    ['sabel','client'].forEach(grp=>{
      T[ph.id][grp].forEach((t,i)=>{ payload.statuses[ph.id+'-'+(grp==='sabel'?'s':'c')+'-'+i]=t.s; });
    });
  });
  return payload;
}
async function saveState(){
  if(INTERNAL){showToast('Internal view is read-only. Edit in the client tracker');return;}
  const payload=buildPayload();
  try{
    // Check for a save from someone else since we loaded.
    try{
      const r=API?await fetch(API+'?key='+KEY):null;
      const j=r?await r.json():{value:localStorage.getItem('draft-'+KEY)};
      if(j&&j.value){
        const cur=typeof j.value==='string'?JSON.parse(j.value):j.value;
        const curStamp=cur.savedAt||null;if(typeof progMergeRemote==='function')progMergeRemote(cur);
        if(curStamp!==remoteStamp&&cur.savedBy!==SESSION_ID){
          const overwrite=confirm('Someone else has updated this tracker since you opened it.\n\nOK = overwrite with your version\nCancel = keep theirs (then reload the page to see their changes)');
          if(!overwrite){showToast('Not saved. Reload the page to see the latest changes');return;}
        }
      }
    }catch(e){/* conflict check unavailable; fall through and save */}
    if(API)await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,value:JSON.stringify(payload)})});else localStorage.setItem('draft-'+KEY,JSON.stringify(payload));
    remoteStamp=payload.savedAt;
    showAutosaved();
  }catch(e){showToast('Save failed');}
}

// ── Week grouping + scheduling helpers ────────────────────────────────────────
const WEEK1_START='2026-09-21';  // [CLIENT] Monday of Week 1; the week-grid anchor. Task dates derive from this.

let weekStarts={...WEEK_STARTS_DEFAULT}; // Live overrides; editable in the tracker (pencil on a week view) and persisted with saved state.
let editingWeekStart=false;
function weekStartDate(n){
  if(weekStarts[n]){const d=new Date(weekStarts[n]+'T00:00:00');if(!isNaN(d.getTime()))return d;}
  const d=new Date(WEEK1_START+'T00:00:00');d.setDate(d.getDate()+(n-1)*7);return d;

function setWeekStart(n,val){

  const old=weekStartDate(n);

  const mx=maxWeek()+8, upd={};
  for(let i=n;i<=mx;i++){const d=new Date(weekStartDate(i).getTime());d.setDate(d.getDate()+delta);upd[i]=isoDate(d);}
  Object.assign(weekStarts,upd);
  // Go-live is a commitment date: it stays fixed when weeks shift. The buffer
  // between the plan and go-live absorbs slippage; the go-live card warns when
  // the build runs too close to (or past) the go-live date.
  const dd=Math.abs(delta);
  showToast('Week '+n+' moved '+dd+' day'+(dd>1?'s':'')+(delta>0?' later':' earlier')+' · later weeks shifted with it (go-live unchanged)');
  render(); scheduleAutoSave();
}

function isoDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function weekRangeLabel(n){if(!n||n<1)return 'Unscheduled';const s=weekStartDate(n),e=new Date(s);e.setDate(e.getDate()+6);const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});return f(s)+' – '+f(e);}
function isOverdue(t){
  // A task is overdue when it is not Complete and its scheduled period has
  // already ended. For a span (ongoing) task that means its END week: being
  // still in progress mid-span is planned, not overdue. Unscheduled tasks
  // (week 0/missing) are never overdue.
  if(!t||t.s==='Complete'||!t.week||t.week<1)return false;
  const e=new Date(weekStartDate(endWeek(t)).getTime()); e.setDate(e.getDate()+6);

// ── Week ranges (ongoing tasks) and milestones ───────────────────────────────
// A task may span several weeks: `week` is the start, optional `wkEnd` the end.
// Single-week tasks have no wkEnd. `kind:'milestone'` marks checkpoint tasks
// (sign-offs, approvals); level-of-effort work uses a span instead.
function endWeek(t){return (t&&t.wkEnd&&t.week&&t.wkEnd>t.week)?t.wkEnd:((t&&t.week)||0);}

  if(!isSpan(t))return weekRangeLabel(t.week);

function maxWeek(){let mx=0;P.forEach(ph=>['sabel','client'].forEach(g=>inScope(ph.id,g).forEach(t=>{const e=endWeek(t);if(e>mx)mx=e;})));return Math.max(mx,8);}
function weekOptions(sel){let o='';const mx=maxWeek();for(let n=1;n<=mx;n++){o+=`<option value="${n}"${sel===n?' selected':''}>Week ${n} · ${weekRangeLabel(n)}</option>`;}return o;}
function weekEndOptions(t){

function effWeek(t){return weekLabel(t.week||0);}
function weekList(){
  const seen=new Set();
  P.forEach(ph=>['sabel','client'].forEach(g=>inScope(ph.id,g).forEach(t=>{
    if(!t.week||t.week<1){seen.add(effWeek(t));return;}
    for(let w=t.week;w<=endWeek(t);w++)seen.add(weekLabel(w));
  })));
  const arr=[...seen];
  const num=w=>{const m=/(\d+)/.exec(w);return m?parseInt(m[1]):9999;};
  arr.sort((a,b)=>{if(a==='Unscheduled')return 1;if(b==='Unscheduled')return -1;return num(a)-num(b)||a.localeCompare(b);});

function weekGroups(wk){

    T[ph.id][g].forEach((t,i)=>{
      if(t.parked)return; // out of scope tasks never appear in week views
      // Span-aware: a task belongs to every week it covers, so ongoing work
      // shows as active in each week view across its range.
      const m=/(\d+)/.exec(wk), wn=m?parseInt(m[1],10):0;
      const hit=isPhased(t)?(!!wn&&t.phases.some(p=>p.week>=1&&p.week<=wn&&(p.wkEnd||p.week)>=wn)):(wn?(t.week>=1&&t.week<=wn&&endWeek(t)>=wn):(effWeek(t)===wk));

function currentWeek(){

// ── Go-live runway (overview) ─────────────────────────────────────────────────
// The runway shows every go-live blocker as an obstacle between today and the
// go-live date. Blockers are tasks flagged gate:true (anything that makes
// landing unsafe if not done) plus every task in the go-live pillar, which are
// runway items by definition. Cleared obstacles fade into the tarmac; open ones
// stand on it at their scheduled position. Hidden until a go-live date is set.
let runwayOpen=false; // checklist collapsed by default; the strip is always visible
function toggleRunway(){runwayOpen=!runwayOpen;renderMain();}
function gateItems(){
  // Two kinds of runway item: PRE-FLIGHT blockers (gate:true, must be cleared
  // before the day) and ON-THE-DAY cutover actions (gate:'day', or any task in
  // the go-live pillar: channel switches, DNS cutover, phones). Day-of items
  // cluster at the rocket and are never "late" for sitting in go-live week.
  const out=[];
  P.forEach(p=>['sabel','client'].forEach(g=>(T[p.id]&&T[p.id][g]||[]).forEach((t,i)=>{
    if(t.parked)return;
    if(t.gate||p.id==='golive') out.push({t,p,cid:p.id+'-'+(g==='sabel'?'s':'c')+'-'+i,day:(p.id==='golive'||t.gate==='day')});
  })));
  // Pre-flight items order by schedule; day-of items order as a RUN SHEET by
  // their time offset relative to go-live (dayOff minutes, negative = before,
  // e.g. delta migration at T-2h). Untimed day items sink to the end.
  const key=o=>o.day?(100000+(o.t.dayOff!==undefined?o.t.dayOff:9999)):(endWeek(o.t)||99);

function gateState(o){

function togglePanel(k){panelOpen[k]=!panelOpen[k];renderMain();scheduleAutoSave();}

function exportRunway(){
  // One-page branded go-live checklist in the Sabel PDF standard (black page,
  // centred logo, faint red centre stem, dark cards, mono footer). Opens a
  // print-ready window; the browser's Save as PDF produces the document.

  const pre=items.filter(o=>!o.day), day=items.filter(o=>o.day);
  const gl=goLiveDate?new Date(goLiveDate+'T00:00:00'):null;
  const glTxt=(gl&&!isNaN(gl.getTime()))?gl.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'date to be confirmed';
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).toUpperCase();

    ?'<span style="display:inline-flex;width:11px;height:11px;border:1.5px solid #4ADE80;border-radius:3px;align-items:center;justify-content:center;color:#4ADE80;font-size:9px;line-height:1">&#10003;</span>'

      <td style="padding:5px 10px 5px 0;font-size:10.5px;color:${done?'#64748B':'#E2E8F0'};${done?'text-decoration:line-through;':''}line-height:1.45">${esc(o.t.t)}</td>
      <td style="padding:5px 0;white-space:nowrap;font-size:9.5px;color:#94A3B8;vertical-align:top;text-align:right">${esc(o.t.o)}${withTime?'':' · '+spanWeeksText(o.t)}</td>

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Go-Live Checklist · ${esc(CLIENT_NAME)}</title>
  <style>
    @page{size:A4;margin:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box;margin:0;padding:0}
    body{background:#0B0B0C;color:#E2E8F0;font-family:Arial,Helvetica,sans-serif;width:210mm;min-height:296mm;position:relative;padding:34pt 44pt 60pt}
    .stem{position:fixed;left:50%;top:0;bottom:0;width:0.7pt;background:rgba(225,6,0,.22)}
    table{border-collapse:collapse;width:100%}
    .card{background:#161618;border:1px solid #2A3547;border-radius:8px;padding:12pt 14pt;margin-bottom:12pt;position:relative;z-index:1}
    .sec{font-family:monospace;font-size:8.5px;letter-spacing:.12em;color:#E10600;margin-bottom:6pt}
    .footer{position:fixed;left:44pt;right:44pt;bottom:26pt;font-family:monospace;font-size:7.5px;color:#64748B;display:flex;justify-content:space-between;z-index:1}
  </style></head><body>
  <div class="stem"></div>
  <div style="text-align:center;margin-bottom:6pt;position:relative;z-index:1"><img src="${LOGO}" style="height:42pt"></div>
  <div style="font-family:monospace;font-size:8.5px;color:#94A3B8;letter-spacing:.1em;margin-bottom:18pt;position:relative;z-index:1">${today}</div>
  <div style="position:relative;z-index:1;margin-bottom:16pt">
    <div style="font-size:22px;font-weight:bold;color:#FFFFFF">Go-Live Checklist</div>
    <div style="width:34pt;height:2.5pt;background:#E10600;margin:6pt 0 8pt"></div>

  </div>
  ${pre.length?`<div class="card"><div class="sec">CLEAR BEFORE THE DAY</div><table>${pre.map(o=>row(o,false)).join('')}</table></div>`:''}
  ${day.length?`<div class="card"><div class="sec">ON THE DAY · RUN SHEET &nbsp;(T = GO-LIVE)</div><table>${day.map(o=>row(o,true)).join('')}</table></div>`:''}

// ── Call actions (overview) ───────────────────────────────────────────────────
// Actions agreed on the weekly calls. They are ordinary pillar tasks carrying a
// call date (t.call = 'YYYY-MM-DD'), so they count in pillar completion and
// milestones like any other work; this panel is the aggregated view, grouped by
// call, newest first. Quick-add captures actions live during the call.
let callOpen=true; // call action rows listed by default (the panel sits beside What we need from ${CLIENT_LABEL})
function toggleCallActions(){callOpen=!callOpen;renderMain();}
let odOpen=false;   // overdue carry-over rows collapsed to a one-line summary by default
function toggleOverdue(){odOpen=!odOpen;renderMain();}
function fmtCallDate(s){const d=new Date(s+'T00:00:00');return isNaN(d.getTime())?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function setTaskCall(cid,val){
  const t=resolveTask(cid);if(!t)return;
  if(val)t.call=val; else delete t.call;
  renderMain(); scheduleAutoSave();
}
function callItems(){
  const out=[];
  P.forEach(p=>['sabel','client'].forEach(g=>(T[p.id]&&T[p.id][g]||[]).forEach((t,i)=>{
    if(t.call&&!t.parked)out.push({t,p,cid:p.id+'-'+(g==='sabel'?'s':'c')+'-'+i});
  })));
  return out;
}
function addCallAction(){
  const ti=document.getElementById('ca-title');
  const v=(ti&&ti.value||'').trim();
  if(!v){showToast('Give the action a short title first');return;}
  const pid=document.getElementById('ca-pillar').value;
  const side=document.getElementById('ca-side').value;
  const grp=side==='client'?'client':'sabel';
  if(!T[pid]){showToast('Pick a pillar');return;}
  const cd=document.getElementById('ca-date');
  const callDate=(cd&&cd.value)?cd.value:isoDate(new Date());
  const nt={t:v,o:grp==='client'?CLIENT_LABEL:'Chris',s:'Pending',d:'',week:Math.max(currentWeek(),1),call:callDate,notes:'',link:''};
  if(grp==='client')nt.tip='Action agreed on the weekly call.';
  T[pid][grp].push(nt);
  const tp=P.find(p=>p.id===pid);
  callOpen=true; // show the list so the new action is visibly there
  showToast('Call action added to '+(tp?tp.l:pid));
  render(); scheduleAutoSave();
}

const PROG_STATUS={unscheduled:'To be scheduled',booked:'Booked',held:'Held',green:'Green light'};
function progSt(p){return PROG_STATUS[p.status]?p.status:'unscheduled';}
function progPages(){return PROG_IDS.map(id=>PROG[id]).filter(Boolean);}
function progDot(p){const st=progSt(p);return `<b class="pg-dot ${st}" title="${PROG_STATUS[st]||st}"></b>`;}
function progWhen(p){
  if(!p.date)return '';
  const d=new Date(p.date+'T00:00:00');if(isNaN(d))return '';
  let t='';if(p.time){const [h,m]=p.time.split(':').map(Number);if(!isNaN(h))t=' · '+((h%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?'am':'pm');}
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace('Sept','Sep')+t;
}
function progSortKey(p){return p.date?new Date(p.date+'T00:00:00').getTime():(p.week?weekStartDate(p.week).getTime()+4.5*86400000:9e15);} // undated: end of its planned week
function progNext(){return progPages().filter(p=>p.status!=='green').sort((a,b)=>progSortKey(a)-progSortKey(b))[0]||null;}
function progNavHTML(pid){
  if(groupBy!=='pillar')return '';

}

  const bring=nx?(nx.brings||[]).filter(x=>!x.got).map(x=>x.t):[];

function progGet(p,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],p);}
function progSet(id,path,v){const ks=path.split('.');let o=PROG[id];for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;scheduleAutoSave();progMeter(id);}
function progRe(){renderMain();progGrowAll();}
function progTog(id,path){progSet(id,path,!progGet(PROG[id],path));progRe();}
function progAdd(id,key,at,tpl){const a=PROG[id][key]=PROG[id][key]||[];const i=at==null?a.length:at+1;a.splice(i,0,Object.assign({},tpl||PROG_TPL[key]));scheduleAutoSave();progRe();

function progGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function progGrowAll(){document.querySelectorAll('.pg textarea.pg-in').forEach(progGrow);}
function progGreen(id){const p=PROG[id];if(!p.readyBy)p.readyBy=(typeof noteName!=='undefined'&&noteName)||'';if(!p.readyOn)p.readyOn=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace('Sept','Sep');progSet(id,'status','green');render();}
function progDateSet(id){const p=PROG[id];if(p.date&&progSt(p)==='unscheduled')p.status='booked';if(!p.date&&progSt(p)==='booked')p.status='unscheduled';scheduleAutoSave();render();}
// ── End of module sign-off ─────────────────────────────────────────────────────
// The client's nominated person accepts the module being closed. There are no logins, so the
// record is: the name they type, the time, a confirmation tick, and a history of every step.
let soForm={};  // page id -> 'accept' | 'changes' while that form is open
function progSO(p){if(!p.signoff)p.signoff={person:'',role:'',status:'none',log:[]};if(!p.signoff.log)p.signoff.log=[];return p.signoff;}
function soWhen(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).replace('Sept','Sep')+', '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true}).replace(' ','');}
function soLog(so,e,by,note){so.log.push({e,by:by||'',at:Date.now(),note:note||'',nominated:so.person||''});}
function soSender(){return (typeof noteName!=='undefined'&&noteName)||'Sabel';}
function soSend(id){
  const p=PROG[id],so=progSO(p);const b=p.built||[],done=b.filter(x=>x.done).length;
  if(!so.person){showToast('Add the sign-off person first');const el=document.querySelector(`[data-pg="${id}.signoff.person"]`);if(el)el.focus();return;}
  if(b.length&&done<b.length&&!softConfirm('so-'+id,`Only ${done} of ${b.length} items are ticked off. Click Send again to send anyway`))return;
  so.status='requested';so.requestedBy=soSender();so.requestedAt=Date.now();so.by='';so.at=0;so.note='';soLog(so,'requested',so.requestedBy);
  delete soForm[id];scheduleAutoSave();render();showToast('Sent for sign-off. Use Copy message to let '+(String(so.person||'the client').split(' ')[0])+' know');
}
// Ready-to-paste message for Slack or email, with a link straight to this page's sign-off box.
function soMessage(id){
  const p=PROG[id],so=progSO(p),pf=P.find(x=>x.id===p.frm)||{l:'This module'};
  const first=String(so.person||'').trim().split(/\s+/)[0];
  const link=(/^https?:/.test(location.protocol)&&!/localhost|127\.0\.0\.1/.test(location.host)?location.href.split('#')[0]:(PROG_URL||location.href.split('#')[0]))+'#prog/'+id;
  const built=(p.built||[]).filter(x=>String(x.t||'').trim()).map(x=>'• '+x.t.trim());
  return (first?'Hi '+first+',':'Hi,')+'\n\n'+pf.l+' is complete'+(built.length?'. Here is what we delivered:\n'+built.join('\n'):'.')+
    '\n\nPlease review and accept the end of module sign-off here (or tell us what needs changing):\n'+link+'\n\nThanks, '+soSender();
}
function soCopy(id){
  const t=soMessage(id);
  const done=()=>showToast('Message copied. Paste it into Slack or email');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){showToast('Could not copy. Select the message and copy it');}ta.remove();};
  try{navigator.clipboard.writeText(t).then(done,fallback);}catch(e){fallback();}
}
function soCancel(id){const so=progSO(PROG[id]);if(!softConfirm('soc-'+id,'Click again to withdraw the sign-off request'))return;so.status='none';soLog(so,'withdrawn',soSender());scheduleAutoSave();render();}
function soOpen(id,f){soForm[id]=soForm[id]===f?null:f;progRe();setTimeout(()=>{const el=document.getElementById('so-name-'+id);if(el)el.focus();},20);}
function soCheck(id){const n=(document.getElementById('so-name-'+id)||{}).value||'';const c=document.getElementById('so-ok-'+id);const btn=document.getElementById('so-go-'+id);
  const need=soForm[id]==='changes'?String((document.getElementById('so-note-'+id)||{}).value||'').trim():true;
  if(btn)btn.disabled=!(n.trim().length>1&&(!c||c.checked)&&need);
  const w=document.getElementById('so-warn-'+id);const so=progSO(PROG[id]);
  if(w){const a=n.trim().toLowerCase(),b=(so.person||'').trim().toLowerCase();w.style.display=(a&&b&&a!==b&&!b.startsWith(a)&&!a.startsWith(b.split(' ')[0]))?'block':'none';}}
function soSubmit(id){
  const p=PROG[id],so=progSO(p);const name=String((document.getElementById('so-name-'+id)||{}).value||'').trim();if(!name)return;
  if(soForm[id]==='accept'){
    so.status='accepted';so.by=name;so.at=Date.now();so.note='';soLog(so,'accepted',name);
    p.signedBy=name;p.signedOn=soWhen(so.at);
    (p.built||[]).forEach(x=>x.done=true);
    showToast('Accepted. Thank you, '+name.split(' ')[0]);
  }else{
    const note=String((document.getElementById('so-note-'+id)||{}).value||'').trim();if(!note)return;
    so.status='changes';so.by=name;so.at=Date.now();so.note=note;soLog(so,'changes',name,note);
    (p.snags=p.snags||[]).push({t:'Change requested by '+name+': '+note});
    showToast('Changes sent back to Sabel');
  }
  if(typeof noteName!=='undefined'&&!noteName){noteName=name;try{localStorage.setItem('tracker-note-name',name);}catch(e){}}
  delete soForm[id];scheduleAutoSave();render();
}
function soReopen(id){const so=progSO(PROG[id]);if(!softConfirm('sor-'+id,'Click Reopen again to reopen this module. The acceptance stays in the history'))return;so.status='none';soLog(so,'reopened',soSender());scheduleAutoSave();render();}
function soAll(id){const src=progSO(PROG[id]);progPages().forEach(p=>{if(p.id===id)return;const so=progSO(p);if(so.status==='accepted')return;so.person=src.person;so.role=src.role;});scheduleAutoSave();showToast('Sign-off person set on every module not yet accepted');}
function soPending(){return progPages().filter(p=>progSO(p).status==='requested');}
const SO_EV={requested:'Sent for sign-off',accepted:'Accepted',changes:'Changes requested',withdrawn:'Request withdrawn',reopened:'Reopened'};
function soBoxHTML(id){
  const p=PROG[id],so=progSO(p),pf=P.find(x=>x.id===p.frm)||{l:'this module'};const who=esc(so.person||'the sign-off person'),mod=esc(pf.l);
  const b=p.built||[],done=b.filter(x=>x.done).length;
  let st='';
  if(so.status==='accepted')st=`<div class="pg-so-st accepted"><b><i class="ti ti-circle-check-filled" style="color:var(--k4ADE80)"></i> Accepted by ${esc(so.by)}</b><br>${soWhen(so.at)}${so.person&&so.by.toLowerCase()!==so.person.toLowerCase()?`<br><span class="pg-warn">Nominated sign-off person was ${esc(so.person)}</span>`:''}
      <div class="pg-so-btns"><button class="pg-link" onclick="soReopen('${id}')">Reopen</button></div></div>`;
  else if(so.status==='requested')st=`<div class="pg-so-st requested"><b><i class="ti ti-hourglass" style="color:var(--kFBBF24)"></i> Waiting on ${who} to accept</b><br>Sent ${soWhen(so.requestedAt)}${so.requestedBy?' by '+esc(so.requestedBy):''}
      <div class="pg-so-btns"><button class="pg-btn go" onclick="soOpen('${id}','accept')"><i class="ti ti-check"></i>Accept</button><button class="pg-btn red" onclick="soOpen('${id}','changes')"><i class="ti ti-arrow-back-up"></i>Request changes</button><button class="pg-btn ghost" onclick="soCopy('${id}')" title="Copy a ready-to-send message with a link to this page"><i class="ti ti-copy"></i>Copy message for ${esc(String(so.person||'client').split(' ')[0])}</button><button class="pg-link" onclick="soCancel('${id}')">Withdraw request</button></div>
      ${soForm[id]?`<div class="pg-conf">
        ${soForm[id]==='changes'?`<textarea id="so-note-${id}" class="pg-ans" style="margin-top:0" placeholder="What needs to change before you can accept?" oninput="soCheck('${id}')"></textarea>`:''}
        <input id="so-name-${id}" class="pg-fld" placeholder="Your full name" oninput="soCheck('${id}')" onkeydown="if(event.key==='Enter'&&!document.getElementById('so-go-${id}').disabled)soSubmit('${id}')">
        <div id="so-warn-${id}" class="pg-warn" style="display:none">You're not the nominated sign-off person (${who}). Your name will be recorded as the approver.</div>
        ${soForm[id]==='accept'?`<label><input type="checkbox" id="so-ok-${id}" onchange="soCheck('${id}')">I confirm ${mod} is complete and I accept it on behalf of ${esc(CLIENT_LABEL)}.</label>`:''}
        <div><button id="so-go-${id}" class="pg-btn ${soForm[id]==='accept'?'go':'red'}" disabled onclick="soSubmit('${id}')">${soForm[id]==='accept'?'<i class="ti ti-check"></i>Confirm acceptance':'<i class="ti ti-send"></i>Send back to Sabel'}</button> <button class="pg-link" onclick="soOpen('${id}',null)">Cancel</button></div>
      </div>`:''}</div>`;
  else st=`<div class="pg-so-st ${so.status==='changes'?'changes':'none'}">${so.status==='changes'?`<b><i class="ti ti-arrow-back-up" style="color:var(--kF87171)"></i> Changes requested by ${esc(so.by)}</b> · ${soWhen(so.at)}<br>“${esc(so.note)}”<br>`:`${b.length?`<b>${done} of ${b.length}</b> items built are ticked off. `:''}When they are, send this to ${who} to accept.`}
      <div class="pg-so-btns"><button class="pg-btn send" onclick="soSend('${id}')"><i class="ti ti-send"></i>${so.status==='changes'?'Send for sign-off again':'Send for sign-off'}</button></div></div>`;
  const log=so.log.length?`<div class="pg-log">${so.log.slice().reverse().map(x=>`<div><b>${SO_EV[x.e]||x.e}</b> · ${esc(x.by||'')} · ${soWhen(x.at)}${x.note?' · “'+esc(x.note)+'”':''}</div>`).join('')}</div>`:'';
  return `<div class="pg-so"><div class="pg-so-h"><i class="ti ti-signature"></i>End of module sign-off · ${esc((P.find(x=>x.id===p.frm)||{}).l||'')}</div><div class="pg-so-b">
    <div class="pg-so-who"><div><div class="pg-l">Sign-off person</div>${pgFld(id,'signoff.person','Name')}</div><div><div class="pg-l">Role</div>${pgFld(id,'signoff.role','e.g. Project manager')}</div>
      ${so.status!=='accepted'?`<div><button class="pg-link" onclick="soAll('${id}')">Use this person for every module</button></div>`:''}</div>
    <div>${st}</div>${log}</div></div>`;
}
// Dashboard + What we need: sign-offs waiting on the client.
function soAskHTML(cls){return soPending().map(p=>{const so=progSO(p),pf=P.find(x=>x.id===p.frm)||{l:''};
  return `<div class="${cls}" onclick="setP('prog:${p.id}')"><i class="ti ti-signature"></i><span class="t">Accept the end of <b>${esc(pf.l)}</b><small>${esc(so.person||'Sign-off person')} · sent ${soWhen(so.requestedAt).split(',')[0]}</small></span><i class="ti ti-arrow-right" style="font-size:13px;color:var(--k94A3B8)"></i></div>`;}).join('');}
// Saving: never lose a sign-off to an older copy. If the saved version has more sign-off
// history for a page than this browser does, keep the saved one.
function progMergeRemote(cur){try{const rp=cur&&cur.progression;if(!rp)return;Object.keys(rp).forEach(k=>{const r=rp[k]&&rp[k].signoff,l=PROG[k]&&PROG[k].signoff;if(!r||!PROG[k])return;if(((r.log||[]).length)>((l&&l.log||[]).length)){PROG[k].signoff=r;if(r.status==='accepted'){PROG[k].signedBy=rp[k].signedBy;PROG[k].signedOn=rp[k].signedOn;}}});}catch(e){}}

// Field builders. Everything on the page is editable in place.
function pgT(id,path,ph,cls,enterKey,i){const v=progGet(PROG[id],path)||'';
  const enter=enterKey?` onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();progAdd('${id}','${enterKey}',${i})}"`:'';
  return `<textarea rows="1" class="pg-in ${cls||''}" data-pg="${id}.${path}" placeholder="${esc(ph||'')}" oninput="progSet('${id}','${path}',this.value);progGrow(this)"${enter}>${esc(v)}</textarea>`;}
function pgFld(id,path,ph,type){const v=progGet(PROG[id],path)||'';const dt=type==='date'||type==='time';
  return `<input class="pg-fld" type="${type||'text'}" value="${esc(v)}" placeholder="${esc(ph||'')}" ${dt?`onchange="progSet('${id}','${path}',this.value);progDateSet('${id}')"`:`oninput="progSet('${id}','${path}',this.value)"`}>`;}
function pgX(id,key,i,what){return `<button class="pg-x" onclick="progDel('${id}','${key}',${i})" title="Remove this ${what||'item'}"><i class="ti ti-trash"></i></button>`;}
function pgCk(id,path,on){return `<button class="pg-ck${on?' on':''}" onclick="progTog('${id}','${path}')" title="${on?'Done':'Mark done'}"><i class="ti ti-${on?'circle-check-filled':'circle'}"></i></button>`;}
function pgAdd(id,key,label){return `<button class="pg-add" onclick="progAdd('${id}','${key}')"><i class="ti ti-plus"></i>${label}</button>`;}
function pgChecklist(id,key,flag,ph,withOwner,what){
  return `<div>${(PROG[id][key]||[]).map((x,i)=>`<div class="pg-row${x[flag]?' done':''}">${pgCk(id,key+'.'+i+'.'+flag,x[flag])}${pgT(id,key+'.'+i+'.t',ph,'',key,i)}${withOwner?pgT(id,key+'.'+i+'.owner','Who','sm'):''}${pgX(id,key,i,what)}</div>`).join('')}</div>`;
}
function progCounts(p){const n=(a,f)=>(a||[]).filter(f).length;
  return {dq:n(p.decide,x=>String(x.a||'').trim()),dt:(p.decide||[]).length,bq:n(p.brings,x=>x.got)+n(p.prep,x=>x.done),bt:(p.brings||[]).length+(p.prep||[]).length,lq:n(p.leave,x=>x.done),lt:(p.leave||[]).length};}
function progMeterHTML(p){const c=progCounts(p);const it=(a,b,l)=>`<span class="${b&&a===b?'ok':''}"><b>${a}/${b}</b> ${l}</span>`;
  return it(c.bq,c.bt,esc(CLIENT_LABEL)+' items ready')+it(c.dq,c.dt,'decisions made')+it(c.lq,c.lt,'green-light checks');}
function progMeter(id){const el=document.getElementById('pg-meter');if(el&&PROG[id])el.innerHTML=progMeterHTML(PROG[id]);}
function progView(id){

      <div class="pg-route"><span class="from">${esc(pf.l)}</span><i class="ti ti-arrow-right"></i><span class="to">${esc(pt.l)}</span></div>

    </div>
    <div class="pg-facts">
      <div>${L('Date and time',`<div class="pg-dt">${pgFld(id,'date','','date')}${pgFld(id,'time','','time')}</div>${!p.date?`<div style="font-size:11px;color:var(--k64748B);margin-top:4px">To be scheduled${p.hint?' · suggested '+esc(p.hint):''}</div>`:''}`)}</div>
      <div>${L('Length',pgFld(id,'length','e.g. 90 min'))}</div>
      <div>${L('Location',pgFld(id,'where','Office, video call'))}</div>
      <div>${L('Status',`<select class="pg-fld" onchange="progSet('${id}','status',this.value);render()">${Object.entries(PROG_STATUS).map(([k,v])=>`<option value="${k}"${progSt(p)===k?' selected':''}>${v}</option>`).join('')}</select>`)}</div>
    </div>
    <div class="pg-meter" id="pg-meter">${progMeterHTML(p)}</div>
  </div>

  <div class="pg-you">
    <div class="pg-you-h"><i class="ti ti-briefcase"></i><div><b>What ${cl} needs to bring and prepare</b><span>Please have these ready before the session${w?' on '+esc(w):' (date to be scheduled)'}. Tick each one off when it's done.</span></div></div>
    <div class="pg-cols">
      <div>${L('Bring to the meeting',pgChecklist(id,'brings','got','What to bring',true,'item')+pgAdd(id,'brings','Add something to bring'))}</div>
      <div>${L('Prepare beforehand',pgChecklist(id,'prep','done','What to prepare',true,'item')+pgAdd(id,'prep','Add prep'))}</div>
    </div>
  </div>

  <div class="pg-sec close">
    <div class="pg-sh"><span class="pg-n">1</span><h3>Closing ${esc(pf.l)}</h3><small>What we finished, walked through and signed off</small></div>
    <div class="pg-cols">
      <div>${L('What we built',pgChecklist(id,'built','done','What was delivered',false,'item')+pgAdd(id,'built','Add item'))}</div>
      <div>
        <div class="pg-blk">${L('Walkthrough',pgT(id,'walkthrough','Who was walked through what, and when'))}</div>

      </div>
    </div>
    <div style="padding:0 18px 16px">${soBoxHTML(id)}</div>
  </div>

  <div class="pg-sec open">
    <div class="pg-sh"><span class="pg-n">2</span><h3>Opening ${esc(pt.l)}</h3><small>${esc(pt.f||'')}</small></div>
    <div class="pg-cols">
      <div>${L('Decisions to make',(p.decide||[]).map((x,i)=>`<div class="pg-dec"><div class="pg-dec-q"><span class="num">${i+1}</span>${pgT(id,'decide.'+i+'.q','The decision needed')}${pgX(id,'decide',i,'decision')}</div>

      <div>
        <div class="pg-blk">${L('Agenda',`<div>${(p.agenda||[]).map((x,i)=>`<div class="pg-row">${pgT(id,'agenda.'+i+'.m','0–10','xs')}${pgT(id,'agenda.'+i+'.t','Agenda item','','agenda',i)}${pgX(id,'agenda',i,'agenda item')}</div>`).join('')}</div>`+pgAdd(id,'agenda','Add agenda item'))}</div>
        <div class="pg-blk">${L('Who',`<div class="pg-who">${(p.who||[]).map((x,i)=>`<span class="pg-chip${x.s==='s'?' s':''}"><input data-pg="${id}.who.${i}.n" placeholder="Name" value="${esc(x.n)}" oninput="progSet('${id}','who.${i}.n',this.value)"><button onclick="progDel('${id}','who',${i})" title="Remove"><i class="ti ti-x" style="font-size:12px"></i></button></span>`).join('')}</div><button class="pg-add" onclick="progAdd('${id}','who',null,{n:'',s:'c'})"><i class="ti ti-plus"></i>${cl} person</button> <button class="pg-add" onclick="progAdd('${id}','who',null,{n:'',s:'s'})"><i class="ti ti-plus"></i>Sabel person</button>`)}</div>
      </div>
    </div>
  </div>

  <div class="pg-sec go">
    <div class="pg-sh"><span class="pg-n">3</span><h3>Green light for ${esc(pt.l)}</h3><small>Everything below done means the build can start</small></div>
    <div class="pg-cols">
      <div>${L('Leave the session with',pgChecklist(id,'leave','done','Green-light check',false,'check')+pgAdd(id,'leave','Add check'))}</div>
      <div>${L('Actions from the session',`<div>${(p.actions||[]).map((x,i)=>`<div class="pg-row${x.done?' done':''}">${pgCk(id,'actions.'+i+'.done',x.done)}${pgT(id,'actions.'+i+'.t','Action','','actions',i)}${pgT(id,'actions.'+i+'.owner','Owner','sm')}${pgT(id,'actions.'+i+'.due','Due','xs')}${pgX(id,'actions',i,'action')}</div>`).join('')}</div>`+pgAdd(id,'actions','Add action'))}</div>
    </div>
    <div class="pg-green${p.status==='green'?' on':''}"><i class="ti ti-${p.status==='green'?'circle-check-filled':'traffic-lights'}"></i>
      <span style="flex:1;min-width:180px">${p.status==='green'?`<b>Green light.</b> ${esc(pt.l)} is ready to build.`:`Ready to build ${esc(pt.l)}? Record who gave the green light.`}</span>
      ${pgFld(id,'readyBy','Confirmed by')}${pgFld(id,'readyOn','Date')}
      ${p.status!=='green'?`<button class="note-post" onclick="progGreen('${id}')"><i class="ti ti-check"></i>Give green light</button>`:''}
    </div>
  </div>

  <div class="pg-sec">
    <div class="pg-sh"><span class="pg-n" style="background:var(--k334155)"><i class="ti ti-notes" style="font-size:12px"></i></span><h3>Notes from the session</h3></div>
    <div style="padding:14px 18px"><textarea class="pg-notes" placeholder="Anything else said in the room" oninput="progSet('${id}','notes',this.value)">${esc(p.notes||'')}</textarea></div>
  </div>

  <div class="pg-foot">
    ${prev?`<button onclick="setP('prog:${prev}')"><i class="ti ti-arrow-left"></i>Progression ${idx}: <b>${esc(PROG[prev].title||'')}</b></button>`:`<button onclick="setP('${p.frm}')"><i class="ti ti-arrow-left"></i><b>${esc(pf.l)}</b></button>`}
    <button onclick="setP('${p.to}')">Open <b>${esc(pt.l)}</b><i class="ti ti-arrow-right"></i></button>
  </div>
</div>`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function bdg(txt,c,bg){return`<span class="bdg" style="color:${c};background:${bg}">${txt}</span>`;}
function ownerBtn(o,cid){const x=OW[o]||OW.Chris;return`<button class="stat-bdg" style="color:${x.c};background:${x.bg}" onclick="openOwnerPicker(event,'${cid}')" title="Change owner">${o}<i class="ti ti-chevron-down" style="font-size:9px;opacity:.7;margin-left:1px"></i></button>`;}
function oBdg(o){const x=OW[o]||OW.Chris;return bdg(o,x.c,x.bg);}
function gradBar(pct,h=12){
  const p2=Math.min(Math.max(pct||0,0),100);
  return`<div style="background:var(--k1E2433);border-radius:5px;height:${h}px;overflow:hidden">
    <div style="width:100%;height:100%;background:linear-gradient(to right,#E10600 0%,var(--kFBBF24) 50%,var(--k4ADE80) 100%);clip-path:inset(0 ${100-p2}% 0 0)"></div>
  </div>`;
}

// ── Toggle complete (checkbox) ────────────────────────────────────────────────
function toggleComplete(e,cid){
  e.stopPropagation();
  const t=resolveTask(cid);if(!t)return;
  if(isPhased(t)){phasedToggleAll(t);render();scheduleAutoSave();return;}
  if(t.s==='Complete'){
    t.s=origStatus[cid]||(cid.includes('-c-')?'Dependency':'Pending');
    delete origStatus[cid];
    delete t.doneAt;
  } else {
    origStatus[cid]=t.s;t.s='Complete';t.doneAt=isoDate(new Date());
  }
  render();
  scheduleAutoSave();
}

// ── Duplicate guard on add ────────────────────────────────────────────────────
// Both add flows (blank task and the Call actions quick-add) live-search every
// existing task while the title is typed: all pillars, both columns, parked
// included, case-insensitive. Close matches show as "May already exist:" rows
// with an Open button that jumps to and flashes the existing card. The guard
// warns, it never blocks: creating anyway is always allowed.
function dupWords(s){return String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=3);}
function dupMatches(title,excludeCid){
  const tw=dupWords(title); if(!tw.length)return [];
  const out=[];
  P.forEach(p=>['client','sabel'].forEach(g=>(T[p.id]&&T[p.id][g]||[]).forEach((t,i)=>{
    const cid=p.id+'-'+(g==='sabel'?'s':'c')+'-'+i;
    if(cid===excludeCid)return;
    const tl=(t.t||'').toLowerCase();
    const twords=dupWords(tl);
    const all=tw.every(w=>tl.includes(w));                       // every typed word appears
    const overlap=tw.filter(w=>twords.includes(w)).length/tw.length; // or >=60% word overlap
    if(all||overlap>=0.6) out.push({t,p,g,cid});
  })));
  return out.slice(0,3);
}
function dupHintHTML(matches){
  if(!matches.length)return '';
  return`<div style="margin-top:6px;border:1px solid rgba(251,191,36,.35);background:var(--k0F1117);border-radius:6px;padding:6px 9px;width:100%">
    <div style="font-size:10px;font-weight:600;color:var(--kFBBF24);margin-bottom:2px;display:flex;align-items:center;gap:4px"><i class="ti ti-alert-triangle" style="font-size:11px"></i>May already exist:</div>
    ${matches.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0">
      <span style="font-size:11px;color:var(--kE2E8F0);flex:1;min-width:0;line-height:1.4">${esc(m.t.t)}</span>
      <span style="font-size:10px;color:var(--k64748B);white-space:nowrap;flex-shrink:0">${esc(m.p.l)} · ${m.g==='client'?'Client':'Sabel'} · ${m.t.parked?'Out of scope':weekLabel(m.t.week||0)}</span>
      <button onclick="openDup(event,'${m.cid}')" style="background:transparent;border:1px solid var(--k2A3145);color:var(--k94A3B8);font-size:10px;font-family:inherit;border-radius:5px;padding:2px 8px;cursor:pointer;flex-shrink:0">Open</button>
    </div>`).join('')}
  </div>`;
}
function dupCheck(cid,val){
  clearTimeout(dupTimer);
  dupTimer=setTimeout(()=>{
    const el=document.getElementById('dup-'+cid); if(!el)return;
    el.innerHTML=dupHintHTML(dupMatches(val,cid));

}
function caDupCheck(val){
  clearTimeout(dupTimer);
  dupTimer=setTimeout(()=>{
    const el=document.getElementById('ca-dup'); if(!el)return;
    el.innerHTML=dupHintHTML(dupMatches(val,null));

// ── Sub-tasks (parent task checklist) ─────────────────────────────────────────
function subCounts(t){
  const m=(t.sub||[]).length;
  return{n:(t.sub||[]).filter(x=>x.s==='Complete').length,m};
}
function toggleSub(e,cid,i){
  e.stopPropagation();
  const t=resolveTask(cid); if(!t||!t.sub||!t.sub[i])return;
  const st=t.sub[i];
  if(st.s==='Complete'){
    st.s='Pending';
    // Unticking a sub-task of a Complete parent reopens the parent.
    if(t.s==='Complete'){t.s='In Progress';delete origStatus[cid];delete t.doneAt;}
  }else{
    st.s='Complete';
    // Ticking the last open sub-task completes the parent.
    if(t.sub.every(x=>x.s==='Complete')&&t.s!=='Complete'){origStatus[cid]=t.s;t.s='Complete';t.doneAt=isoDate(new Date());}
  }
  render(); scheduleAutoSave();
}
function removeSub(e,cid,i){
  e.stopPropagation();
  const t=resolveTask(cid); if(!t||!t.sub)return;
  t.sub.splice(i,1);
  if(!t.sub.length)delete t.sub; else syncParentFromSubs(t);
  renderMain(); scheduleAutoSave();
}
function addSub(cid){
  const el=document.getElementById('sub-add-'+cid);
  const v=(el&&el.value||'').trim();
  if(!v){showToast('Give the sub-task a short title first');return;}
  const t=resolveTask(cid); if(!t)return;
  (t.sub=t.sub||[]).push({t:v,s:'Pending'});
  syncParentFromSubs(t);
  renderMain(); scheduleAutoSave();
  setTimeout(()=>{const nf=document.getElementById('sub-add-'+cid);if(nf)nf.focus();},60);
}
// ── Parent / sub-task restructuring ───────────────────────────────────────────
// A parent task is the SOW-level deliverable (e.g. "Inbox, Teams and Routing");
// its steps live in `sub`. Tasks can be nested under a parent or split back out
// so the board shows deliverables, not a flat list of every step.
function syncParentFromSubs(t){
  // Keep a parent's status honest: complete when every step is ticked, reopened
  // as soon as one is not. Mirrors the same rule used by toggleSub.
  if(!t||!t.sub||!t.sub.length)return;
  const all=t.sub.every(x=>x.s==='Complete');
  if(all&&t.s!=='Complete'){t.s='Complete';t.doneAt=isoDate(new Date());}
  else if(!all&&t.s==='Complete'){t.s='In Progress';delete t.doneAt;}
}
function cidParts(cid){
  const p=cid.split('-');
  const gs=p[p.length-2];
  return {idx:parseInt(p[p.length-1],10),gs,grp:gs==='c'?'client':'sabel',phId:p.slice(0,-2).join('-')};
}
function parentCandidates(cid){
  // Other tasks in the same pillar and column that this task could nest under.
  const {idx,grp,phId}=cidParts(cid);
  const gs=grp==='sabel'?'s':'c';
  return (T[phId]&&T[phId][grp]||[]).map((x,i)=>({t:x,cid:phId+'-'+gs+'-'+i,i}))
    .filter(o=>o.i!==idx&&!o.t.parked);
}
function demoteToSub(cid,parentCid){
  // Nest a standalone task inside a parent as one of its steps.
  if(!parentCid){renderMain();return;}
  const t=resolveTask(cid), pt=resolveTask(parentCid);
  if(!t||!pt||cid===parentCid){renderMain();return;}
  if(t.sub&&t.sub.length){showToast('This task has its own steps. Split those out first.');renderMain();return;}
  const {idx,grp,phId}=cidParts(cid);
  // Nothing is silently dropped: any note or link folds into the parent's notes.
  const nt=String(cardNotes[cid]!==undefined?cardNotes[cid]:(t.notes||'')).trim();
  const lk=String(cardLinks[cid]!==undefined?cardLinks[cid]:(t.link||'')).trim();
  const carried=[nt,lk].filter(Boolean).join(' · ');
  const title=t.t;
  (pt.sub=pt.sub||[]).push({t:title,s:t.s==='Complete'?'Complete':'Pending'});
  remapCids(phId,grp,idx);
  T[phId][grp].splice(idx,1);
  // The parent's own index may have shifted; find it again by identity.
  const pp=cidParts(parentCid);
  const nIdx=(T[pp.phId]&&T[pp.phId][pp.grp]||[]).indexOf(pt);
  const npCid=nIdx>=0?(pp.phId+'-'+pp.gs+'-'+nIdx):null;
  if(npCid){
    if(carried){
      const cur=String(cardNotes[npCid]!==undefined?cardNotes[npCid]:(pt.notes||''));
      cardNotes[npCid]=(cur?cur+'\n':'')+'From "'+title+'": '+carried;
    }
    expandedCards.add(npCid);
  }
  syncParentFromSubs(pt);
  showToast('Nested under "'+pt.t+'"');
  render(); scheduleAutoSave();
}
function promoteSub(e,cid,i){
  // Split a step back out into its own task, inheriting the parent's schedule
  // and owner. Appended to the end, so no existing card ids shift.
  e.stopPropagation();
  const t=resolveTask(cid); if(!t||!t.sub||!t.sub[i])return;
  const st=t.sub[i];
  const {gs,grp,phId}=cidParts(cid);
  const nt={t:st.t,o:t.o,s:st.s==='Complete'?'Complete':'Pending',d:'',week:t.week||0,notes:'',link:''};
  if(t.wkEnd)nt.wkEnd=t.wkEnd;
  if(grp==='client')nt.tip=t.tip||'';
  t.sub.splice(i,1);
  if(!t.sub.length)delete t.sub; else syncParentFromSubs(t);
  T[phId][grp].push(nt);
  const nCid=phId+'-'+gs+'-'+(T[phId][grp].length-1);
  expandedCards.add(nCid);
  showToast('Split out as its own task');
  render(); scheduleAutoSave();
}

  t.parked=true;
  expandedCards.delete(cid);
  showToast('Moved to Out of scope');
  render(); scheduleAutoSave();
}
function unparkTask(e,cid){
  e.stopPropagation();
  const t=resolveTask(cid); if(!t)return;
  delete t.parked;
  expandedCards.delete(cid);
  showToast('Moved back into scope');
  render(); scheduleAutoSave();
}
// Estimated hours on parked cards. Client-visible estimates are a deliberate,
// team-agreed exception for out-of-scope items only (useful when scoping
// future work); the field never renders anywhere outside the Out of scope
// view. Stored as `est` (a positive number or the string 'TBC'), never under
// a name containing the internal hours key, so the build's hour-leak assert
// stays clean. New parked items default to TBC.
function estLabel(t){
  const v=t?t.est:undefined;
  return (v===undefined||v===null||v===''||String(v).toUpperCase()==='TBC')?'Est. TBC':'Est. '+v+'h';
}
function setEst(cid,val){
  const t=resolveTask(cid); if(!t)return;
  const v=String(val==null?'':val).trim();
  if(!v||/^tbc$/i.test(v)){t.est='TBC';}
  else{
    const n=parseFloat(v);
    if(!(n>0)||!/^\d+(\.\d+)?$/.test(v)){showToast('Est. hours must be a positive number or TBC');renderMain();return;}
    t.est=n;
  }
  renderMain(); scheduleAutoSave();
}

function oosDupCheck(val){

  dupTimer=setTimeout(()=>{
    const el=document.getElementById('oos-dup'); if(!el)return;

}

// ── Completed tasks strip (Hide completed on) ─────────────────────────────────
// When Hide completed is on, completed tasks leave the board columns but stay
// reachable: each pillar and week view ends with a collapsed full-width strip
// ("Completed tasks (n)") listing that view's completed tasks as compact
// one-line rows. Clicking a row's tick returns the task to the board (status
// back to In Progress, completion date cleared). The open state is transient:
// it collapses whenever the view changes and is never persisted.
let doneStripOpen=false;
function toggleDoneStrip(){doneStripOpen=!doneStripOpen;renderMain();}
function uncompleteTask(e,cid){
  e.stopPropagation();
  const t=resolveTask(cid); if(!t)return;
  if(isPhased(t)){phasedToggleAll(t);render();scheduleAutoSave();return;}
  t.s='In Progress';
  delete origStatus[cid];
  delete t.doneAt;
  render(); scheduleAutoSave();
}
function wkShort(t){return isSpan(t)?('Wks '+t.week+'–'+t.wkEnd):((t.week&&t.week>=1)?('Wk '+t.week):'');}
function doneStrip(items){
  // items: {client:[{t,cid}...],sabel:[{t,cid}...]} of this view's completed
  // tasks. Renders only while Hide completed is on and there is something in it.
  const n=items.client.length+items.sabel.length;
  if(!hideDone||!n)return '';
  // Rows sit in the same two-column grid as the board (Your actions | Sabel
  // is handling) so the strip reads as a continuation of it. A row click
  // anywhere except the tick expands the full standard editable card detail
  // in place (shared cardExpand via tog()/expandedCards); the tick keeps its
  // un-complete behaviour and stops the click reaching the row handler.
  const row=(o,isClient)=>{
    const isOpen=expandedCards.has(o.cid);
    return`<div id="card-${o.cid}">
      <div onclick="tog('${o.cid}')" style="display:flex;align-items:center;gap:8px;padding:5px 2px;border-top:1px solid var(--k1E2433);cursor:pointer;user-select:none">
        <button class="chk-btn" onclick="uncompleteTask(event,'${o.cid}')" title="Mark incomplete and return to the board" style="display:inline-flex;align-items:center">
          <i class="ti ti-circle-check-filled" style="font-size:15px;color:var(--k4ADE80)"></i>
        </button>
        <span style="font-size:12px;color:var(--k64748B);text-decoration:line-through;flex:1;min-width:0;line-height:1.4">${esc(o.t.t)}</span>
        ${oBdg(o.t.o)}
        <span style="font-size:10px;color:var(--k475569);white-space:nowrap;flex-shrink:0">${wkShort(o.t)}</span>
        <i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:11px;color:var(--k334155);flex-shrink:0"></i>
      </div>
      ${isOpen?`<div class="task-expand" style="display:block;border:1px solid var(--k1E2433);border-radius:8px;margin:2px 0 8px" onclick="event.stopPropagation()">${cardExpand(o.t,o.cid,isClient)}</div>`:''}
    </div>`;
  };
  const col=(title,icon,colour,arr,isClient)=>`<div>
      <p class="col-head" style="color:${colour}"><i class="ti ${icon}" style="font-size:12px"></i>${title} <span style="font-size:10px;color:var(--k475569);font-weight:400;margin-left:4px">${arr.length} completed</span></p>
      ${arr.length?arr.map(o=>row(o,isClient)).join(''):`<div style="font-size:11px;color:var(--k334155);padding:6px 0">None here</div>`}
    </div>`;
  return`<div id="done-strip" style="background:var(--k161B26);border:1px solid var(--k1E2433);border-radius:10px;padding:12px 16px;margin-top:16px">
    <div onclick="toggleDoneStrip()" style="display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none">
      <div style="display:flex;align-items:center;gap:6px">
        <i class="ti ti-circle-check" style="font-size:14px;color:var(--k4ADE80)"></i>
        <span style="font-size:12px;font-weight:600;color:var(--k94A3B8)">Completed tasks (${n})</span>
      </div>
      <i class="ti ti-chevron-${doneStripOpen?'up':'down'}" style="font-size:13px;color:var(--k64748B)"></i>
    </div>
    ${doneStripOpen?`<div class="phase-cols" style="margin-top:8px">${col(CLIENT_LABEL+' actions','ti-alert-circle','#CA8A04',items.client,true)}${col('Sabel is handling','ti-tool','var(--k64748B)',items.sabel,false)}</div>`:''}
  </div>`;
}
function deleteTask(e,cid){
  e.stopPropagation();
  const t=resolveTask(cid);if(!t)return;
  if(!softConfirm('del:'+cid,'Click Remove again to confirm'))return;
  const parts=cid.split('-');
  const idx=parseInt(parts[parts.length-1]);
  const gs=parts[parts.length-2];
  const phId=parts.slice(0,parts.length-2).join('-');
  const grp=gs==='c'?'client':'sabel';
  remapCids(phId,grp,idx);
  T[phId][grp].splice(idx,1);
  render();
  scheduleAutoSave();
}

// ── Drag and drop ─────────────────────────────────────────────────────────────
function remapCids(phId,grp,removedIdx){
  const gs=grp==='sabel'?'s':'c';
  const len=T[phId][grp].length+1;
  for(let i=removedIdx+1;i<len;i++){
    const o=phId+'-'+gs+'-'+i,n=phId+'-'+gs+'-'+(i-1);
    if(cardNotes[o]!==undefined){cardNotes[n]=cardNotes[o];delete cardNotes[o];}
    if(cardLinks[o]!==undefined){cardLinks[n]=cardLinks[o];delete cardLinks[o];}
    if(origStatus[o]!==undefined){origStatus[n]=origStatus[o];delete origStatus[o];}
    if(expandedCards.has(o)){expandedCards.delete(o);expandedCards.add(n);}
    if(dupGuardCids.has(o)){dupGuardCids.delete(o);dupGuardCids.add(n);}
  }
  const rc=phId+'-'+gs+'-'+removedIdx;
  delete cardNotes[rc];delete cardLinks[rc];delete origStatus[rc];expandedCards.delete(rc);dupGuardCids.delete(rc);
}
function clearDropHighlight(){
  if(dragOverCol){const el=document.getElementById(dragOverCol);if(el)el.classList.remove('col-drop');dragOverCol=null;}
}
function onDragStart(e,phId,grp,idx){
  // Ignore drags that begin on an interactive control (owner/status picker,
  // checkbox, link, input) so a click on those controls is never swallowed by
  // the drag-to-reassign gesture. This keeps the owner dropdown reliably clickable.
  if(e.target.closest('button,input,textarea,a,select')){e.preventDefault();return;}
  dragInfo={phId,grp,idx};
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const card=e.currentTarget;if(card)card.classList.add('card-dragging');},0);
}
function onDragEnd(e){
  e.currentTarget.classList.remove('card-dragging');
  clearDropHighlight();
}
function onDragOver(e,colId){
  e.preventDefault();
  if(dragOverCol!==colId){clearDropHighlight();dragOverCol=colId;const el=document.getElementById(colId);if(el)el.classList.add('col-drop');}
}
function onDragLeave(e,colId){

// Hours are Sabel-only. They exist in the build data, they are stripped from the
// client tracker entirely, and they are rendered only when INTERNAL is true,
// which happens in exactly one file: ELMOTracker_internal.html. That
// file is never pushed to Intake-forms and never uploaded to the client-shared
// Project Trackers folder. In the client build every helper here short-circuits
// on INTERNAL and there is no hrs data for it to read even if it did not.
function hrsOf(o){return (o&&typeof o.hrs==='number')?o.hrs:null;}
function subHrsTotal(t){
  const s=(t&&t.sub)||[];
  const v=s.filter(x=>typeof x.hrs==='number');
  return v.length?v.reduce((a,x)=>a+x.hrs,0):null;
}
function fmtH(n){return (Math.round(n*100)/100)+'h';}
// Allotment vs steps for one deliverable: what the SOW line is budgeted, what
// its steps consume, and whether the steps have overrun the budget.
function hrsState(t){
  const a=hrsOf(t), st=subHrsTotal(t);
  return {allotted:a,steps:st,over:(a!==null&&st!==null&&st>a),rem:(a!==null&&st!==null)?a-st:null};
}
// The hours a task counts for in any total: its own allotment, or the sum of
// its steps when the parent carries no allotment of its own.
function hrsEff(t){const h=hrsState(t);return h.allotted!==null?h.allotted:h.steps;}
function hrsBadge(t){
  if(!INTERNAL)return '';
  const h=hrsState(t);
  if(h.allotted===null&&h.steps===null)return '';
  const lbl=h.allotted===null?fmtH(h.steps)+' in steps'
    :(h.steps===null?fmtH(h.allotted):fmtH(h.steps)+' / '+fmtH(h.allotted));
  const c=h.over?'var(--kF87171)':'var(--kA78BFA)';
  const bg=h.over?'rgba(248,113,113,.12)':'rgba(167,139,250,.12)';
  const tip=h.over?'Steps exceed the hours allotted to this deliverable'
    :'Internal hours, never shown in the client tracker';
  return `<span title="${tip}" style="font-size:10px;font-weight:600;color:${c};background:${bg};border-radius:9px;padding:1px 7px;white-space:nowrap">${lbl}${h.over?' over':''}</span>`;
}
function subHrsBadge(s){
  if(!INTERNAL)return '';
  const h=hrsOf(s);
  return h===null?'':`<span title="Internal hours for this step" style="font-size:10px;font-weight:600;color:var(--kA78BFA);flex-shrink:0">${fmtH(h)}</span>`;
}

// Seed hours, captured before any saved state is applied. Saved state is written
// by the client tracker, whose tasks carry no hours, so loadInitial() replacing
// T would otherwise erase every allotment. Titles are the only stable key:
// card ids shift as tasks are added, removed, reordered or moved between
// pillars. Pillar-scoped first, then a global by-title fallback so a task moved
// between pillars in the tracker keeps its hours.
function hrsKey(s){return String(s==null?'':s).trim().toLowerCase();}
function buildHrsSeed(){
  const byPillar={}, byTitle={}, subByPillar={}, subByTitle={};
  if(!INTERNAL)return {byPillar,byTitle,subByPillar,subByTitle};
  P.forEach(ph=>{
    ['sabel','client'].forEach(grp=>{
      ((T[ph.id]||{})[grp]||[]).forEach(t=>{
        const k=hrsKey(t.t);
        if(typeof t.hrs==='number'){
          if(byPillar[ph.id+'|'+k]===undefined)byPillar[ph.id+'|'+k]=t.hrs;
          if(byTitle[k]===undefined)byTitle[k]=t.hrs;
        }
        (t.sub||[]).forEach(s=>{
          if(typeof s.hrs!=='number')return;
          const sk=k+'|'+hrsKey(s.t);
          if(subByPillar[ph.id+'|'+sk]===undefined)subByPillar[ph.id+'|'+sk]=s.hrs;
          if(subByTitle[sk]===undefined)subByTitle[sk]=s.hrs;
        });
      });
    });
  });
  return {byPillar,byTitle,subByPillar,subByTitle};
}
const HRS_SEED=buildHrsSeed();
function reattachHours(){
  if(!INTERNAL)return;
  P.forEach(ph=>{
    ['sabel','client'].forEach(grp=>{
      ((T[ph.id]||{})[grp]||[]).forEach(t=>{
        const k=hrsKey(t.t);
        if(typeof t.hrs!=='number'){
          const v=HRS_SEED.byPillar[ph.id+'|'+k];
          const g=v===undefined?HRS_SEED.byTitle[k]:v;
          if(g!==undefined)t.hrs=g;
        }
        (t.sub||[]).forEach(s=>{
          if(typeof s.hrs==='number')return;
          const sk=k+'|'+hrsKey(s.t);
          const v=HRS_SEED.subByPillar[ph.id+'|'+sk];
          const g=v===undefined?HRS_SEED.subByTitle[sk]:v;
          if(g!==undefined)s.hrs=g;
        });
      });
    });
  });
}

// Rollup behind the Hours view. Because it reads live task data (statuses
// included, once loadInitial has applied the client tracker's saved state) it
// gives a burn-down the build-time CSV never could: what is budgeted, what is
// already delivered, and what is left. Parked work is totalled separately and
// never counted in the project figure, matching every other export.
function hoursRollup(){
  const pillars=[]; let total=0,done=0,parked=0,parkedN=0,untracked=[],overs=[];
  P.forEach(ph=>{
    const rows=[]; let pt=0,pd=0;
    ['sabel','client'].forEach(grp=>{
      ((T[ph.id]||{})[grp]||[]).forEach(t=>{
        const h=hrsState(t), eff=hrsEff(t);
        if(t.parked){ if(eff!==null){parked+=eff;parkedN++;} return; }
        if(eff===null){ untracked.push({pillar:ph.l,task:t.t,owner:t.o}); }
        else{
          pt+=eff; if(t.s==='Complete')pd+=eff;
          if(h.over)overs.push({pillar:ph.l,task:t.t,allotted:h.allotted,steps:h.steps});
        }
        rows.push({t:t,grp:grp,eff:eff,h:h,pillar:ph});
      });
    });
    total+=pt; done+=pd;
    pillars.push({ph:ph,rows:rows,total:pt,done:pd});
  });
  return {pillars,total,done,remaining:total-done,parked,parkedN,untracked,overs};
}
