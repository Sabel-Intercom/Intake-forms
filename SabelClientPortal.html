<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sabel · Client Status</title>
<style>
  :root{
    --bg:#0B0B0C; --card:#0F1113; --card2:#141618; --card3:#191C20;
    --body:#E2E8F0; --muted:#94A3B8; --mono:#64748B; --border:#2A3547; --border2:#1A2232;
    --red:#E10600; --green:#4ADE80; --amber:#FBBF24;
    --gate:#F87171; --auto:#60A5FA; --other:#C9B892;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--body);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
  input,select,textarea,button{font-family:inherit;}
  ::placeholder{color:var(--mono);}
  select option{background:var(--card2);color:var(--body);}
  a{color:#FCA5A5;text-decoration:none;} a:hover{color:#fff;}

  #app{position:relative;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  #app::before{content:"";position:fixed;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,transparent,rgba(225,6,0,0.12),transparent);pointer-events:none;z-index:0;}

  header.top{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;flex:0 0 56px;border-bottom:1px solid var(--border2);}
  header.top img{height:26px;width:auto;display:block;}
  .vline{width:1px;height:18px;background:var(--border);}
  .h-title{font-size:13px;font-weight:600;color:#fff;}
  .h-sub{font-size:10px;color:var(--mono);letter-spacing:.04em;}
  .h-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
  #saveStatus{font-size:10px;letter-spacing:.06em;color:var(--mono);}
  .h-note{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mono);}

  .body{position:relative;z-index:1;flex:1;display:flex;min-height:0;}
  aside{flex:0 0 272px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border2);background:#0D0E10;}
  .add-row{display:flex;gap:6px;padding:12px 12px 10px;}
  .add-row input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:7px 9px;color:var(--body);font-size:12px;outline:none;}
  .add-row button{background:var(--red);color:#fff;border:none;border-radius:5px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px;}
  .chip{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;padding:4px 9px;font-size:10px;font-weight:700;letter-spacing:.02em;cursor:pointer;}
  #clientList{flex:1;overflow-y:auto;padding:0 8px 16px;display:flex;flex-direction:column;gap:4px;}
  .client{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border2);border-left:2px solid var(--mono);border-radius:6px;padding:9px 10px;cursor:pointer;color:var(--body);}
  .client.sel{background:var(--card3);border-color:var(--border);}
  .client .r1{display:flex;align-items:baseline;gap:8px;}
  .client .cname{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .client.sel .cname{color:#fff;}
  .client .left{font-size:10px;font-weight:700;white-space:nowrap;}
  .client .r2{display:flex;align-items:center;gap:8px;margin-top:5px;min-width:0;}
  .client .stg{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
  .client .gl{font-size:9.5px;color:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-empty{padding:18px 10px;font-size:11px;line-height:1.6;color:var(--mono);}

  main{flex:1;min-width:0;overflow-y:auto;}
  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;}
  .placeholder .big{font-size:15px;color:var(--muted);}
  .placeholder .small{font-size:12px;color:var(--mono);text-align:center;line-height:1.7;}
  .panel{max-width:980px;padding:22px 26px 60px;display:flex;flex-direction:column;gap:16px;}
  .name-row{display:flex;align-items:flex-start;gap:16px;}
  #nameInput{flex:1;min-width:0;background:transparent;border:none;padding:2px 0;font-size:23px;font-weight:700;letter-spacing:-.01em;color:#fff;outline:none;}
  .ghost-btn{background:transparent;border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:10px;letter-spacing:.04em;color:var(--muted);cursor:pointer;}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mono);}
  .stage-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .stage-btn{background:var(--card);border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:8px 14px;font-size:11.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .field{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;min-width:0;}
  .field .flbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mono);margin-bottom:6px;display:flex;align-items:baseline;gap:6px;}
  .field .flbl .cd{margin-left:auto;font-size:9.5px;letter-spacing:0;text-transform:none;font-weight:700;}
  .field select,.field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--body);font-size:12px;outline:none;}
  .field .hint{font-size:10px;color:var(--mono);margin-top:5px;line-height:1.5;}
  .field .hint a{color:#FCA5A5;}
  .tierkey{cursor:help;border-bottom:1px dotted var(--mono);}

  .card{background:var(--card);border:1px solid var(--border2);border-radius:10px;overflow:hidden;}
  .card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border2);flex-wrap:wrap;}
  .card-head .dot{width:7px;height:7px;border-radius:50%;}
  .card-head h3{font-size:13px;font-weight:700;color:#fff;}
  .card-head .cnt{font-size:11px;color:var(--muted);}
  .card-head .swap{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:10px;color:var(--muted);cursor:pointer;}
  .step{display:flex;align-items:flex-start;gap:11px;padding:10px 16px 10px 20px;border-bottom:1px solid #15191F;}
  .box{flex:0 0 auto;width:19px;height:19px;margin-top:1px;border-radius:5px;background:transparent;border:1px solid #3F4A5C;color:#0B0B0C;font-size:12px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .step.done .box{background:var(--green);border-color:var(--green);}
  .step-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .step-body textarea.sl{display:block;width:100%;background:transparent;border:none;padding:0;font-size:12.5px;color:var(--body);outline:none;line-height:1.4;resize:none;overflow:hidden;field-sizing:content;min-height:17px;}
  .step.done .sl{color:var(--muted);text-decoration:line-through;}
  .step-body input.sn{width:100%;background:transparent;border:none;padding:0;font-size:11px;color:var(--muted);outline:none;}
  .addnote{align-self:flex-start;background:transparent;border:none;padding:0;font-size:10px;color:#3F4A5C;cursor:pointer;}
  .step-del{flex:0 0 auto;background:transparent;border:none;color:#3F4A5C;font-size:15px;line-height:1;padding:2px 4px;cursor:pointer;}
  .card-foot{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center;}
  .add-step{background:transparent;border:1px dashed var(--border);border-radius:5px;padding:6px 11px;font-size:11px;color:var(--muted);cursor:pointer;}
  .link-btn{background:transparent;border:none;padding:6px 4px;font-size:11px;color:var(--mono);cursor:pointer;}
  .link-btn:hover{color:var(--muted);}

  /* ---- Runbook: the checklist grouped by phase, each with a gate ---- */
  .nextup{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--border2);background:var(--card2);font-size:11.5px;color:var(--muted);}
  .nextup .tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--auto);}
  .nextup b{color:#fff;font-weight:600;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px;border-bottom:1px solid var(--border2);font-size:10px;color:var(--mono);}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:5px;border:1px solid;}
  .legend i.o{border-color:var(--other);background:rgba(201,184,146,.18);}
  .legend i.g{border-color:var(--gate);background:rgba(248,113,113,.16);}
  .legend i.a{border-color:var(--auto);background:rgba(96,165,250,.16);}
  .phase{border-bottom:1px solid var(--border2);}
  .phase:last-of-type{border-bottom:none;}
  .phase-head{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:12px 16px 8px;cursor:pointer;user-select:none;}
  .phase-head:hover{background:rgba(255,255,255,.02);}
  .phase-head .when{font-size:10px;color:var(--mono);letter-spacing:.03em;line-height:1.5;}
  .phase-head .when b{display:block;color:#fff;font-size:12px;letter-spacing:0;font-weight:700;}
  .phase-head .when .due{display:block;color:var(--muted);}
  .phase-head .when .due.late{color:var(--gate);}
  .phase-head .when .due.soon{color:var(--amber);}
  .phase-head .ttl{font-size:12.5px;font-weight:700;color:#fff;line-height:1.4;}
  .phase-head .ttl small{display:block;font-weight:400;font-size:10.5px;color:var(--mono);margin-top:1px;}
  .phase-head .prog{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:2px;}
  .phase-head .prog.ok{color:var(--green);}
  .phase-head .chev{display:inline-block;width:14px;color:var(--mono);font-size:10px;margin-right:2px;transition:transform .15s;}
  .phase.open .chev{transform:rotate(90deg);}
  .phase-side{display:none;flex-wrap:wrap;gap:6px;padding:0 16px 10px 148px;}
  .phase.open .phase-side{display:flex;}
  .phase .steps{display:none;}
  .phase.open .steps{display:block;}
  .pill{font-size:10.5px;line-height:1.45;padding:5px 9px;border:1px solid;border-radius:6px;max-width:100%;}
  .pill .pl{display:block;font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1px;}
  .pill.o{border-color:rgba(201,184,146,.5);background:rgba(201,184,146,.08);color:var(--body);} .pill.o .pl{color:var(--other);}
  .pill.g{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.07);color:var(--body);} .pill.g .pl{color:var(--gate);}
  .pill.g.met{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.07);} .pill.g.met .pl{color:var(--green);}
  .pill.a{border-color:rgba(96,165,250,.5);background:rgba(96,165,250,.07);color:var(--body);} .pill.a .pl{color:var(--auto);}
  .phase.done .phase-head .ttl{color:var(--muted);}
  .phase.cur .phase-head{box-shadow:inset 3px 0 0 var(--auto);}
  .phase.other .phase-head .when b{color:var(--muted);}
  @media (max-width:760px){
    .phase-head{grid-template-columns:minmax(0,1fr) auto;}
    .phase-head .when{grid-column:1/-1;}
    .phase-side{padding-left:16px;}
  }

  .out-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .out-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .out-head .dot{width:7px;height:7px;border-radius:50%;background:var(--red);}
  .out-head h3{font-size:13px;font-weight:700;color:#fff;}
  .out-head .sum{font-size:11px;color:var(--muted);}
  .out-toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .toggle{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .out-grid .flbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mono);margin-bottom:6px;}
  .out-grid input,.out-grid select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--body);font-size:12px;outline:none;}
  #outNote{width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--body);font-size:12px;outline:none;}

  .notes-card{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}
  .notes-card .flbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mono);margin-bottom:8px;}
  #notesInput{width:100%;background:transparent;border:none;padding:0;color:var(--body);font-size:12.5px;line-height:1.7;resize:vertical;outline:none;}

  .modal-bg{position:fixed;inset:0;background:rgba(4,5,6,.72);display:flex;align-items:center;justify-content:center;padding:30px;z-index:50;}
  .modal{width:100%;max-width:720px;max-height:84vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .modal .mh{padding:16px 18px;border-bottom:1px solid var(--border2);}
  .modal .mh h3{font-size:14px;font-weight:700;color:#fff;}
  .modal .mh p{font-size:11px;color:var(--mono);margin-top:4px;line-height:1.6;}
  .modal .tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap;}
  .modal .tab{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;}
  .modal .tab.on{background:rgba(225,6,0,.16);border-color:rgba(225,6,0,.45);color:#fff;}
  .modal .mlist{flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:6px;}
  .te-step{display:flex;align-items:center;gap:8px;}
  .te-step .n{flex:0 0 20px;font-size:10px;color:var(--mono);text-align:right;}
  .te-step input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;color:var(--body);font-size:12px;outline:none;}
  .te-step select{flex:0 0 150px;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 6px;color:var(--muted);font-size:10.5px;outline:none;}
  .te-mv{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:10px;padding:4px 6px;cursor:pointer;}
  .te-del{background:transparent;border:none;color:#3F4A5C;font-size:15px;padding:2px 4px;cursor:pointer;}
  .modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border2);flex-wrap:wrap;}
  .modal .mf .link-btn{margin-right:auto;}
  .btn-ghost{background:transparent;border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;}
  .btn-red{background:var(--red);border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;}

  /* ---- Scoping (proposal out, waiting on the client) ---- */
  .scope-card{background:var(--card);border:1px solid rgba(192,132,252,.38);border-radius:10px;padding:16px;}
  .scope-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .scope-head .dot{width:7px;height:7px;border-radius:50%;background:#C084FC;}
  .scope-head h3{font-size:13px;font-weight:700;color:#fff;}
  .scope-head .sum{font-size:11px;color:var(--muted);}
  .scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
  .scope-grid .flbl,.scope-card .flbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mono);margin-bottom:6px;}
  .scope-grid input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--body);font-size:12px;outline:none;}
  .scope-grid input.err{border-color:#F87171;}
  .scope-grid .hint{font-size:10px;color:var(--mono);margin-top:5px;}
  .scope-grid .hint a{color:#FCA5A5;}
  #scopeNotes{width:100%;margin-top:12px;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--body);font-size:12px;line-height:1.6;resize:vertical;outline:none;}
  .accept-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border2);}
  .btn-accept{background:var(--green);border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:800;color:#052E16;cursor:pointer;}
  .btn-accept:hover{filter:brightness(1.08);}
  .accept-hint{font-size:11px;color:var(--mono);line-height:1.6;flex:1;min-width:200px;}
  .btn-danger{margin-left:auto;background:transparent;border:1px solid rgba(248,113,113,.45);border-radius:6px;padding:8px 14px;font-size:11px;font-weight:700;color:#F87171;cursor:pointer;}
  .btn-danger:hover{background:rgba(248,113,113,.12);}
  .ghost-btn.danger{border-color:rgba(248,113,113,.45);color:#F87171;}
  .ghost-btn.danger:hover{background:rgba(248,113,113,.12);}
  .scope-sum{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:10px 14px;background:var(--card);border:1px solid var(--border2);border-left:2px solid #C084FC;border-radius:8px;font-size:11px;color:var(--muted);}
  .scope-sum .tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C084FC;}
  .scope-sum b{color:var(--body);font-weight:600;}
  .scope-sum .note{flex-basis:100%;white-space:pre-wrap;line-height:1.5;}

  /* ---- Date picker: a real calendar pop-out, white on dark ---- */
  .dp{display:flex;gap:4px;}
  .dp-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:#fff;font-size:12px;cursor:pointer;}
  .dp-btn:hover{border-color:#3F4A5C;}
  .dp-btn.empty{color:var(--mono);}
  .dp-btn svg{flex:0 0 auto;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
  .dp-clear{flex:0 0 auto;background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--muted);padding:0 8px;font-size:13px;line-height:1;cursor:pointer;}
  .dp-clear:hover{color:#fff;border-color:#3F4A5C;}
  .cal{position:fixed;z-index:70;width:252px;background:#15181C;border:1px solid #3F4A5C;border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.65);padding:10px;color:#fff;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;}
  .cal-head b{flex:1;text-align:center;font-size:12.5px;color:#fff;}
  .cal-nav{background:transparent;border:1px solid var(--border);border-radius:5px;color:#fff;width:26px;height:26px;font-size:13px;line-height:1;cursor:pointer;}
  .cal-nav:hover{background:rgba(255,255,255,.08);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 6px;}
  .cal-d{background:transparent;border:none;border-radius:5px;height:30px;color:#fff;font-size:12px;cursor:pointer;}
  .cal-d:hover{background:rgba(255,255,255,.1);}
  .cal-d.other{color:#4B5563;}
  .cal-d.today{box-shadow:inset 0 0 0 1px #64748B;}
  .cal-d.on{background:var(--red);color:#fff;font-weight:700;}
  .cal-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);}
  .cal-foot button{background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:3px 2px;}
  .cal-foot button:hover{color:#fff;}
  input[type=date]{color-scheme:dark;}

  /* ---- Print: one client per sheet, light, no chrome ---- */
  @media print{
    @page{size:A4;margin:10mm;}
    html,body{height:auto;overflow:visible;background:#fff;color:#000;}
    #app{height:auto;overflow:visible;display:block;}
    #app::before,header.top,aside,.stage-row,.lbl,.ghost-btn,.step-del,.addnote,.card-foot,.swap,.legend,.dp-clear,.btn-danger,.accept-row,.modal-bg,.cal{display:none!important;}
    .body{display:block;}
    main{overflow:visible;}
    .panel{max-width:none;padding:0;gap:8px;}
    #nameInput,.card-head h3,.phase-head .ttl,.phase-head .when b,.nextup b{color:#000;}

function setSave(s){

/* Every field the old portal stored is preserved, whether this page shows it
   or not (tracker link, subtitle, goLive source flags, per-step status…). */
function normalise(raw){
  var clients = (raw.clients||[]).map(function(c){
    var o = c.outreach||{};
    ["onboarding","offboarding"].forEach(function(k){
      c[k] = (c[k]||[]).map(function(s){
        var r = {id:s.id||uid(), label:s.label||"", status:s.status||(s.done?"done":"todo"), note:s.note||""};
        if(s.phase) r.phase=s.phase;
        if(s.tag) r.tag=s.tag;
        return r;
      });
    });
    c.id = c.id || uid();
    c.stage = STAGE_ORDER.indexOf(c.stage)>-1 ? c.stage : "Onboarding";
    c.goLiveDate = c.goLiveDate||""; c.owner=c.owner||""; c.type=c.type||"";
    c.intake = c.intake||""; c.notes=c.notes||"";
    /* Scoping record — filled while the proposal is out, kept afterwards for reference. */
    c.proposalSent = c.proposalSent||""; c.contactName = c.contactName||""; c.contactEmail = c.contactEmail||"";
    c.scopingNotes = c.scopingNotes||""; c.acceptedAt = c.acceptedAt||"";
    /* Runbook card — the facts the routines and the Day-30 review compare against. */
    c.tier = TIERS.indexOf(c.tier)>-1 ? c.tier : ""; c.hours = c.hours||"";
    c.signedDate = c.signedDate||""; c.day30Date = c.day30Date||"";
    c.trackerKey = c.trackerKey||""; c.slackChannel = c.slackChannel||"";
    c.outreach = {
      retainerPack:!!o.retainerPack, doNotFollowUp:!!o.doNotFollowUp,
      pitchSent:o.pitchSent||"", nextFollowUp:o.nextFollowUp||"",
      outcome:o.outcome||"", note:o.note||""
    };
    return c;
  });
  var t = raw.templates||defaultTemplates();
  if(!t.runbookVersion){
    /* First open on the runbook build: the stored flat standard becomes the
       runbook. The old list is kept and can be restored from the modal. */
    t.legacyOnboarding = t.onboarding||[];
    t.onboarding = runbookTemplate();
    t.runbookVersion = RUNBOOK_VERSION;
  }
  t.offboarding = t.offboarding||defaultTemplates().offboarding;
  return {clients:clients, templates:t, selectedId:null};
}
function snapshot(){ return {clients:state.clients, templates:state.templates, selectedId:state.selectedId}; }
function scheduleSave(){
  setSave("saving");
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({data:snapshot()})})
      .then(function(r){ if(!r.ok) throw new Error("bad status");
        setSave("saved"); clearTimeout(idleTimer); idleTimer=setTimeout(function(){ setSave("idle"); },1600);
      })
      .catch(function(){ setSave("offline"); });
  }, 900);
}
function load(){
  setSave("loading");
  fetch(API_URL+"&_t="+Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("bad status"); return r.json(); })
    .then(function(j){
      if(j && j.data && j.data.clients){ state = normalise(j.data); setSave("idle"); }
      else { loadLocal(); }
      render();
    })
    .catch(function(){ loadLocal(); render(); });
}
function loadLocal(){
  var raw=null;
  try{ var l=localStorage.getItem(LS_KEY); if(l){ var j=JSON.parse(l); if(j&&j.clients) raw=j; } }catch(e){}
  state = normalise(raw||{clients:[]});
  setSave(raw?"offline":"idle");
}

/* ===================== DATES ===================== */
function daysTo(d){ if(!d) return null; var t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d+"T00:00:00")-t)/864e5); }
function countdown(d){
  var n=daysTo(d); if(n===null) return "";
  if(n===0) return "go-live today";
  return n>0 ? "in "+n+" day"+(n===1?"":"s") : Math.abs(n)+" day"+(n===-1?"":"s")+" ago";
}
function cdColor(d){ var n=daysTo(d); if(n===null) return "var(--mono)"; if(n<0) return "#F87171"; return n<=7?"var(--amber)":"var(--green)"; }
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function iso(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function todayIso(){ var t=new Date(); return iso(t.getFullYear(),t.getMonth(),t.getDate()); }
function addDays(d,n){ if(!d) return ""; var x=new Date(d+"T00:00:00"); if(isNaN(x)) return ""; x.setDate(x.getDate()+n); return iso(x.getFullYear(),x.getMonth(),x.getDate()); }
function fmtDate(d){ if(!d) return ""; var p=d.split("-"); if(p.length<3) return d; return (+p[2])+" "+MONTHS[+p[1]-1].slice(0,3)+" "+p[0]; }
function fmtShort(d){ if(!d) return ""; var p=d.split("-"); if(p.length<3) return d; return (+p[2])+" "+MONTHS[+p[1]-1].slice(0,3); }
function sinceText(d){ var n=daysTo(d); if(n===null) return ""; if(n===0) return "today"; if(n>0) return "in "+n+" day"+(n===1?"":"s"); n=-n; return n+" day"+(n===1?"":"s")+" ago"; }
function dayN(c){ var n=daysTo(c.signedDate); return n===null ? null : -n; }
function isEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

/* Date field markup: a button that opens the calendar pop-out, plus a clear. */
var CAL_ICON='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateField(id,val,placeholder){
  return '<div class="dp"><button type="button" class="dp-btn'+(val?"":" empty")+'" data-dp="'+id+'">'+CAL_ICON+'<span>'+(val?esc(fmtDate(val)):esc(placeholder||"Pick a date"))+'</span></button>'+
    (val?'<button type="button" class="dp-clear" data-dpclear="'+id+'" title="Clear date">×</button>':"")+'</div>';
}
var cal=null; // {el, anchor, y, m, value, onPick}
function closeCal(){ if(cal&&cal.el) cal.el.remove(); cal=null; }
function openCal(anchor,value,onPick){
  closeCal();
  var t=new Date(); var base = value ? new Date(value+"T00:00:00") : t;
  cal={anchor:anchor, y:base.getFullYear(), m:base.getMonth(), value:value||"", onPick:onPick, el:document.createElement("div")};
  cal.el.className="cal";
  document.body.appendChild(cal.el);
  drawCal();
}
function drawCal(){
  if(!cal) return;
  var y=cal.y, m=cal.m, today=todayIso();
  var first=new Date(y,m,1), startDow=(first.getDay()+6)%7; // Monday first
  var daysIn=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
  var cells=[];
  for(var i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, other:true, iso:iso(m===0?y-1:y,(m+11)%12,prevDays-i)});
  for(var d=1;d<=daysIn;d++) cells.push({d:d, other:false, iso:iso(y,m,d)});
  while(cells.length%7) { var n=cells.length-startDow-daysIn+1; cells.push({d:n, other:true, iso:iso(m===11?y+1:y,(m+1)%12,n)}); }
  cal.el.innerHTML='<div class="cal-head"><button class="cal-nav" data-cal="-1">‹</button><b>'+MONTHS[m]+' '+y+'</b><button class="cal-nav" data-cal="1">›</button></div>'+
    '<div class="cal-grid">'+["Mo","Tu","We","Th","Fr","Sa","Su"].map(function(w){ return '<div class="cal-dow">'+w+'</div>'; }).join("")+
    cells.map(function(c){ return '<button class="cal-d'+(c.other?" other":"")+(c.iso===today?" today":"")+(c.iso===cal.value?" on":"")+'" data-pick="'+c.iso+'">'+c.d+'</button>'; }).join("")+'</div>'+
    '<div class="cal-foot"><button data-pick="'+today+'">Today</button><button data-pick="">Clear</button></div>';
  // position under the anchor, kept inside the viewport
  var r=cal.anchor.getBoundingClientRect(), w=252, h=cal.el.offsetHeight||300;
  var left=Math.min(r.left, window.innerWidth-w-8), top=r.bottom+6;
  if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-6);
  cal.el.style.left=Math.max(8,left)+"px"; cal.el.style.top=top+"px";
  cal.el.querySelectorAll("[data-cal]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); cal.m+= +b.getAttribute("data-cal"); if(cal.m<0){cal.m=11;cal.y--;} if(cal.m>11){cal.m=0;cal.y++;} drawCal(); }); });
  cal.el.querySelectorAll("[data-pick]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); var v=b.getAttribute("data-pick"); var fn=cal.onPick; closeCal(); fn(v); }); });
}
document.addEventListener("mousedown",function(e){ if(cal && !cal.el.contains(e.target) && !cal.anchor.contains(e.target)) closeCal(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeCal(); });
window.addEventListener("resize",closeCal);
/* Wire every date field rendered in the main panel: fields = {id:{get,set}} */
function wireDates(fields){
  document.querySelectorAll("[data-dp]").forEach(function(b){
    var f=fields[b.getAttribute("data-dp")]; if(!f) return;
    b.addEventListener("click",function(e){ e.stopPropagation(); if(cal&&cal.anchor===b){ closeCal(); return; } openCal(b,f.get(),function(v){ f.set(v); scheduleSave(); render(); }); });
  });
  document.querySelectorAll("[data-dpclear]").forEach(function(b){
    var f=fields[b.getAttribute("data-dpclear")]; if(!f) return;
    b.addEventListener("click",function(){ f.set(""); scheduleSave(); render(); });
  });
}

/* ===================== RUNBOOK HELPERS ===================== */
/* Group a client's steps by phase, in runbook order, with un-phased steps last. */
function groupSteps(steps){
  var groups=[], byId={};
  PHASES.forEach(function(p){ var g={phase:p, steps:[]}; byId[p.id]=g; groups.push(g); });
  var other={phase:null, steps:[]};
  steps.forEach(function(s){ var g=s.phase&&byId[s.phase]; (g||other).steps.push(s); });
  groups.push(other);
  return groups.filter(function(g){ return g.steps.length; });
}
/* The phase the client is in: first phase with an open step. */
function currentPhase(c){
  var gs=groupSteps(c.onboarding||[]);
  for(var i=0;i<gs.length;i++){ if(gs[i].steps.some(function(s){ return s.status!=="done"; })) return gs[i]; }
  return null;
}
function nextStep(c){
  var g=currentPhase(c); if(!g) return null;
  return g.steps.filter(function(s){ return s.status!=="done"; })[0]||null;
}
/* Add the runbook steps that apply to this client's type. Keeps whatever is there. */
function loadRunbook(c){
  var have={}; (c.onboarding||[]).forEach(function(s){ have[s.label]=1; });
  var added=0;
  (state.templates.onboarding||[]).forEach(function(s){
    if(!s.phase || !applies(s,c) || have[s.label]) return;
    var n={id:uid(),label:s.label,status:"todo",note:"",phase:s.phase}; if(s.tag) n.tag=s.tag;
    c.onboarding.push(n); added++;
  });
  return added;
}

function dueHtml(p,c){

function phaseBlock(g,c,cur){
  var p=g.phase;
  var done=g.steps.filter(function(s){ return s.status==="done"; }).length, total=g.steps.length;
  var allDone = done===total;
  var isCur = cur && ((cur.phase&&p&&cur.phase.id===p.id) || (!cur.phase&&!p));
  var pid = p?p.id:"other";
  var pref = openPhases[c.id]||{};
  var open = (pref[pid]!==undefined) ? pref[pid] : (isCur || !hasRunbook(c));
  var head = p
    ? '<div class="when"><b>'+esc(p.when)+'</b>'+esc(p.name)+dueHtml(p,c)+'</div>'+
      '<div class="ttl"><span class="chev">▶</span>'+esc(p.title)+'<small>'+esc(p.meta||"")+'</small></div>'
    : '<div class="when"><b>Other</b>outside the runbook</div>'+
      '<div class="ttl"><span class="chev">▶</span>Steps kept from before the runbook, or added by hand<small>tick, rename or remove them like any other step</small></div>';
  var side = p ? (
    (p.other?'<div class="pill o"><span class="pl">'+esc(p.who||"Someone else")+'</span>'+esc(p.other)+'</div>':"")+
    (p.auto?'<div class="pill a"><span class="pl">Lands automatically</span>'+esc(p.auto)+'</div>':"")+

  return '<div class="phase'+(open?" open":"")+(allDone?" done":"")+(isCur?" cur":"")+(p?"":" other")+'" data-phase="'+pid+'">'+
    '<div class="phase-head" data-phead="'+pid+'">'+head+'<div class="prog'+(allDone?" ok":"")+'">'+(allDone?"✓ ":"")+done+' of '+total+'</div></div>'+

    '<div class="steps">'+g.steps.map(stepRow).join("")+'</div>'+

}

      '<div><div class="flbl">Date pitch sent</div>'+dateField("outPitch",o.pitchSent)+'</div>'+
      '<div><div class="flbl">Next follow-up</div>'+dateField("outNext",o.nextFollowUp)+'</div>'+
      '<div><div class="flbl">Outcome</div><select id="outOutcome">'+optionsHtml(OUTCOMES,o.outcome)+'</select></div>'+
    '</div>'+
    '<input id="outNote" value="'+esc(o.note)+'" placeholder="Outreach note — what was pitched, who replied…"></div>'
  ) : "";

  var scoping = c.stage==="Discovery";
  var sentAge = c.proposalSent ? -daysTo(c.proposalSent) : null;
  var scopeSum = [];
  if(c.proposalSent) scopeSum.push("proposal sent "+sinceText(c.proposalSent));
  if(c.contactName) scopeSum.push(c.contactName);
  if(sentAge!==null && sentAge>14) scopeSum.push("waiting "+sentAge+" days");

  var scopingCard = scoping ? (
    '<div class="scope-card"><div class="scope-head"><span class="dot"></span><h3>Scoping — proposal out, waiting on the client</h3>'+
    '<span class="sum">'+(scopeSum.length?esc(scopeSum.join(" · ")):"nothing logged yet")+'</span></div>'+
    '<div class="scope-grid">'+
      '<div><div class="flbl">Proposal sent</div>'+dateField("proposalInput",c.proposalSent,"When did Richard send it?")+'</div>'+
      '<div><div class="flbl">Possible go-live</div>'+dateField("goLiveInput",c.goLiveDate,"If known")+
        (c.goLiveDate?'<div class="hint" style="color:'+cdColor(c.goLiveDate)+'">'+esc(countdown(c.goLiveDate))+'</div>':"")+'</div>'+
      '<div><div class="flbl">Contact name</div><input id="contactName" value="'+esc(c.contactName)+'" placeholder="Who is reviewing the proposal"></div>'+
      '<div><div class="flbl">Contact email</div><input id="contactEmail" type="email" class="'+(isEmail(c.contactEmail)?"":"err")+'" value="'+esc(c.contactEmail)+'" placeholder="name@company.com">'+
        (c.contactEmail && isEmail(c.contactEmail) ? '<div class="hint"><a href="mailto:'+esc(c.contactEmail)+'">Email '+esc(c.contactName||c.contactEmail)+'</a></div>' : (c.contactEmail?'<div class="hint" style="color:#F87171">That does not look like an email address</div>':""))+'</div>'+
    '</div>'+
    '<textarea id="scopeNotes" rows="3" placeholder="Additional notes — what was proposed, hours, objections, who else is involved, when to chase…">'+esc(c.scopingNotes)+'</textarea>'+
    '<div class="accept-row"><button class="btn-accept" id="acceptBtn">✓ Proposal accepted — move to Onboarding</button>'+
      '<span class="accept-hint">Sets today as Day 0 (signed), opens the runbook for this client and ticks any "proposal" step. The scoping details stay on the record.</span>'+
      '<button class="btn-danger" id="deleteBtn2">Delete client</button></div>'+
    '</div>'
  ) : (
    (c.proposalSent||c.contactName||c.contactEmail||c.scopingNotes||c.acceptedAt) ?
    '<div class="scope-sum"><span class="tag">From scoping</span>'+
      (c.proposalSent?'<span>Proposal sent <b>'+esc(fmtDate(c.proposalSent))+'</b></span>':"")+
      (c.acceptedAt?'<span>Accepted <b>'+esc(fmtDate(c.acceptedAt))+'</b></span>':"")+
      (c.contactName?'<span>Contact <b>'+esc(c.contactName)+'</b></span>':"")+
      (c.contactEmail?'<span><a href="mailto:'+esc(c.contactEmail)+'">'+esc(c.contactEmail)+'</a></span>':"")+
      (c.scopingNotes?'<span class="note">'+esc(c.scopingNotes)+'</span>':"")+
    '</div>' : ""
  );

  /* ---- checklist: runbook phases for onboarding, flat list for offboarding ---- */
  var checklistCard = "";
  if(!scoping){
    var groups = groupSteps(steps);
    var cur = key==="onboarding" ? currentPhase(c) : null;
    var nx = key==="onboarding" ? nextStep(c) : null;
    var runbook = key==="onboarding" && hasRunbook(c);
    var body;
    if(runbook || (key==="onboarding" && !steps.length)){
      var dn = dayN(c);
      var strip = '<div class="nextup"><span class="tag">'+(nx?"Next up":"Runbook complete")+'</span>'+
        (nx ? '<span><b>'+esc(nx.label)+'</b></span><span>'+esc(cur.phase?cur.phase.name:"Other steps")+'</span>' : '<span>Every step is ticked. Close or extend by change request.</span>')+
        (dn!==null?'<span>'+(dn>=0?"Day "+dn:"signs in "+(-dn)+"d")+'</span>':'<span style="color:var(--amber)">Set the signed date to put dates on the phases</span>')+
        (c.goLiveDate?'<span>go-live '+esc(countdown(c.goLiveDate))+'</span>':"")+
        '</div>'+
        '<div class="legend"><span><i class="o"></i>Someone else\'s move</span><span><i class="g"></i>Gate that closes the phase</span><span><i class="a"></i>Lands automatically</span><span style="margin-left:auto">Click a phase to open or close it</span></div>';
      body = strip + groups.map(function(g){ return phaseBlock(g,c,cur); }).join("");
      if(!steps.length) body = strip + '<div class="side-empty" style="padding:16px">No steps yet. Load the runbook below, or add steps by hand.</div>';
    } else {
      body = steps.map(stepRow).join("");
    }
    var foot = '<div class="card-foot"><button class="add-step" id="addStepBtn">+ Add step</button>';
    if(key==="onboarding" && !runbook) foot += '<button class="add-step" id="loadRunbookBtn" style="border-style:solid;border-color:rgba(96,165,250,.5);color:var(--auto)">Load the runbook'+(steps.length?" (keeps these steps)":"")+'</button>';
    foot += '<button class="link-btn" id="tmplBtn">Edit the standard</button>'+
            '<button class="link-btn" id="printBtn" title="One client per sheet, phases open">Print</button></div>';
    checklistCard =
      '<div class="card"><div class="card-head"><span class="dot" style="background:'+listCol+'"></span>'+
        '<h3>'+(key==="onboarding"?(runbook?"Runbook · signature to Day 30":"Onboarding checklist"):"Offboarding checklist")+'</h3>'+
        '<span class="cnt">'+(steps.length?done+" of "+steps.length+" done":"no steps yet")+'</span>'+
        '<button class="swap" id="swapBtn">'+(key==="onboarding"?"Show offboarding":"Show onboarding")+'</button></div>'+
        body + foot + '</div>';
  }

  /* ---- the client card ---- */
  var day30Hint = c.day30Date ? '' : (c.goLiveDate ? '<div class="hint">Suggest <a href="#" id="day30Suggest">'+esc(fmtDate(addDays(c.goLiveDate,30)))+'</a> (go-live + 30)</div>' : '');
  var meta =
    '<div class="field"><div class="flbl">Project lead</div><select id="ownerSel">'+optionsHtml(OWNERS,c.owner)+'</select></div>'+
    '<div class="field"><div class="flbl">Project type</div><select id="typeSel">'+optionsHtml(TYPES,c.type,TYPE_LABEL)+'</select></div>'+
    '<div class="field"><div class="flbl">Intake source</div><select id="intakeSel">'+optionsHtml(INTAKES,c.intake)+'</select></div>'+
    '<div class="field"><div class="flbl"><span class="tierkey" title="'+esc(TIER_KEY)+'">Tier</span></div><select id="tierSel">'+optionsHtml(TIERS,c.tier)+'</select></div>'+
    '<div class="field"><div class="flbl">Hours (SOW)</div><input id="hoursInput" inputmode="decimal" value="'+esc(c.hours)+'" placeholder="e.g. 40"></div>'+
    (scoping ? "" :
    '<div class="field"><div class="flbl">Signed · Day 0'+(dayN(c)!==null&&dayN(c)>=0?'<span class="cd" style="color:var(--muted)">Day '+dayN(c)+'</span>':'')+'</div>'+dateField("signedInput",c.signedDate,"Signature date")+'</div>'+
    '<div class="field"><div class="flbl">Go-live<span class="cd" style="color:'+cdColor(c.goLiveDate)+'">'+(countdown(c.goLiveDate)||"not set")+'</span></div>'+dateField("goLiveInput",c.goLiveDate,"Set at kickoff")+'</div>'+
    '<div class="field"><div class="flbl">Day-30 review'+(c.day30Date?'<span class="cd" style="color:'+cdColor(c.day30Date)+'">'+esc(sinceText(c.day30Date))+'</span>':'')+'</div>'+dateField("day30Input",c.day30Date,"Set at kickoff")+day30Hint+'</div>'+
    '<div class="field"><div class="flbl">Tracker key</div><input id="trackerKeyInput" value="'+esc(c.trackerKey)+'" placeholder="client-tracker-v1" spellcheck="false">'+
      (c.trackerKey?'<div class="hint"><a href="'+API+'?key='+encodeURIComponent(c.trackerKey)+'" target="_blank" rel="noopener">Open the store</a></div>':'')+'</div>'+
    '<div class="field"><div class="flbl">Slack channel</div><input id="slackInput" value="'+esc(c.slackChannel)+'" placeholder="#ext-client-sabel, or email only"></div>');

  host.innerHTML =
    '<div class="panel">'+
      '<div class="name-row"><input id="nameInput" value="'+esc(c.name)+'">'+
        '<button class="ghost-btn danger" id="deleteBtn">Delete</button></div>'+

      '<div><div class="lbl">Status — this is what feeds your dashboard</div>'+
        '<div class="stage-row">'+stageBtns+'</div></div>'+

      '<div class="meta">'+meta+'</div>'+

      scopingCard+
      checklistCard+
      outreachCard+

      '<div class="notes-card"><div class="flbl">Notes</div>'+
        '<textarea id="notesInput" rows="3" placeholder="Anything worth remembering about this client…">'+esc(c.notes)+'</textarea></div>'+
    '</div>';

  wireMain(c,key);
}

/* ===================== WIRING ===================== */
function wireMain(c,key){
  function on(id,ev,fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }

  document.getElementById("nameInput").addEventListener("input", function(e){ c.name=e.target.value; scheduleSave(); });
  document.getElementById("nameInput").addEventListener("blur", render);
  function del(){
    if(!confirm("Delete "+c.name+" and everything logged against it? This cannot be undone.")) return;
    state.clients = state.clients.filter(function(x){ return x.id!==c.id; });
    state.selectedId=null; closeCal(); scheduleSave(); render();
  }
  on("deleteBtn","click",del);
  on("deleteBtn2","click",del);
  on("acceptBtn","click",function(){
    if(!confirm("Move "+c.name+" to Onboarding? Today becomes Day 0 and the runbook opens.")) return;
    c.stage="Onboarding"; c.acceptedAt=todayIso();
    if(!c.signedDate) c.signedDate=todayIso();
    if(!hasRunbook(c)) loadRunbook(c);
    (c.onboarding||[]).forEach(function(s){ if(/^proposal/i.test(s.label)) s.status="done"; });
    filter="Onboarding"; showOther=false;
    try{ localStorage.setItem(PREF_KEY, JSON.stringify({filter:filter})); }catch(e){}
    scheduleSave(); render();
  });
  on("contactName","input",function(e){ c.contactName=e.target.value; scheduleSave(); });
  on("contactEmail","input",function(e){ c.contactEmail=e.target.value.trim(); scheduleSave(); });
  on("contactEmail","blur",render);
  on("scopeNotes","input",function(e){ c.scopingNotes=e.target.value; scheduleSave(); });
  wireDates({
    goLiveInput:{get:function(){ return c.goLiveDate; }, set:function(v){ c.goLiveDate=v; c.goLiveManual=true; c.goLiveSource="manual"; }},
    proposalInput:{get:function(){ return c.proposalSent; }, set:function(v){ c.proposalSent=v; }},
    signedInput:{get:function(){ return c.signedDate; }, set:function(v){ c.signedDate=v; }},
    day30Input:{get:function(){ return c.day30Date; }, set:function(v){ c.day30Date=v; }},
    outPitch:{get:function(){ return c.outreach.pitchSent; }, set:function(v){ c.outreach.pitchSent=v; }},
    outNext:{get:function(){ return c.outreach.nextFollowUp; }, set:function(v){ c.outreach.nextFollowUp=v; }}
  });
  on("day30Suggest","click",function(e){ e.preventDefault(); c.day30Date=addDays(c.goLiveDate,30); scheduleSave(); render(); });
  document.querySelectorAll("[data-stage]").forEach(function(b){
    b.addEventListener("click",function(){
      var s=b.getAttribute("data-stage");
      c.stage=s; showOther=false; closeCal();
      if(s==="Onboarding" && !c.signedDate && c.acceptedAt) c.signedDate=c.acceptedAt;
      scheduleSave(); render();
    });
  });
  on("ownerSel","change",function(e){ c.owner=e.target.value; scheduleSave(); });
  on("typeSel","change",function(e){
    c.type=e.target.value;
    /* Runbook steps that no longer apply to this type: offer to drop them. */
    var gone=(c.onboarding||[]).filter(function(s){ return s.phase && s.status!=="done" && !applies(s,c); });
    if(gone.length && confirm("Remove the "+gone.length+" runbook step"+(gone.length===1?"":"s")+" that do"+(gone.length===1?"es":"")+" not apply to \""+TYPE_LABEL[c.type]+"\"?")){
      c.onboarding=c.onboarding.filter(function(s){ return gone.indexOf(s)<0; });
    }
    scheduleSave(); render();
  });
  on("intakeSel","change",function(e){ c.intake=e.target.value; scheduleSave(); });
  on("tierSel","change",function(e){ c.tier=e.target.value; scheduleSave(); });
  on("hoursInput","input",function(e){ c.hours=e.target.value.trim(); scheduleSave(); });
  on("trackerKeyInput","input",function(e){ c.trackerKey=e.target.value.trim(); scheduleSave(); });
  on("trackerKeyInput","blur",render);
  on("slackInput","input",function(e){ c.slackChannel=e.target.value; scheduleSave(); });
  on("swapBtn","click",function(){ showOther=!showOther; render(); });
  on("addStepBtn","click",function(){
    var n={id:uid(),label:"New step",status:"todo",note:""};
    /* Inside the runbook a new step joins the phase you are looking at. */
    if(key==="onboarding" && hasRunbook(c)){ var g=currentPhase(c); if(g&&g.phase) n.phase=g.phase.id; }
    c[key].push(n); scheduleSave(); render();
    var el=document.querySelector('[data-label="'+n.id+'"]');
    if(el){ var ph=el.closest(".phase"); if(ph && !ph.classList.contains("open")){ openPhases[c.id]=openPhases[c.id]||{}; openPhases[c.id][ph.getAttribute("data-phase")]=true; render(); el=document.querySelector('[data-label="'+n.id+'"]'); } if(el){ el.focus(); el.select(); } }
  });
  on("loadRunbookBtn","click",function(){
    var n=loadRunbook(c);
    if(!n){ alert("Every runbook step is already on this client."); return; }
    openPhases[c.id]={}; scheduleSave(); render();
  });
  on("tmplBtn","click",openTemplate);
  on("printBtn","click",function(){ window.print(); });
  on("notesInput","input",function(e){ c.notes=e.target.value; scheduleSave(); });

  document.querySelectorAll("[data-phead]").forEach(function(h){
    h.addEventListener("click",function(e){
      if(e.target.closest("a,button,input")) return;
      var pid=h.getAttribute("data-phead"), ph=h.closest(".phase");
      openPhases[c.id]=openPhases[c.id]||{};
      openPhases[c.id][pid]=!ph.classList.contains("open");
      ph.classList.toggle("open");
    });
  });
  document.querySelectorAll("[data-toggle]").forEach(function(b){
    b.addEventListener("click",function(){
      var s=findStep(c,b.getAttribute("data-toggle"));
      if(s){ s.status = s.status==="done" ? "todo" : "done"; scheduleSave(); render(); }
    });
  });
  function fit(el){ if(CSS.supports && CSS.supports("field-sizing","content")) return; el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
  document.querySelectorAll("[data-label]").forEach(function(el){
    fit(el);
    el.addEventListener("input",function(){ fit(el); var s=findStep(c,el.getAttribute("data-label")); if(s){ s.label=el.value; scheduleSave(); } });
    el.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
  document.querySelectorAll("[data-note]").forEach(function(el){
    el.addEventListener("input",function(){ var s=findStep(c,el.getAttribute("data-note")); if(s){ s.note=el.value; scheduleSave(); } });
  });
  document.querySelectorAll("[data-addnote]").forEach(function(b){
    b.addEventListener("click",function(){
      openNotes[b.getAttribute("data-addnote")]=true; render();
      var el=document.querySelector('[data-note="'+b.getAttribute("data-addnote")+'"]'); if(el) el.focus();
    });
  });
  document.querySelectorAll("[data-delstep]").forEach(function(b){
    b.addEventListener("click",function(){
      var id=b.getAttribute("data-delstep");
      c[key]=c[key].filter(function(s){ return s.id!==id; }); scheduleSave(); render();
    });
  });

  if(c.stage==="Outreach"||c.stage==="Complete"){
    on("tRetainer","click",function(){ c.outreach.retainerPack=!c.outreach.retainerPack; scheduleSave(); render(); });
    on("tDnf","click",function(){ c.outreach.doNotFollowUp=!c.outreach.doNotFollowUp; scheduleSave(); render(); });
    on("outOutcome","change",function(e){ c.outreach.outcome=e.target.value; scheduleSave(); render(); });
    on("outNote","input",function(e){ c.outreach.note=e.target.value; scheduleSave(); });
  }
}
function findStep(c,id){
  var all=(c.onboarding||[]).concat(c.offboarding||[]);
  for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; }
  return null;
}

/* ===================== ADD CLIENT ===================== */
function addClient(){
  var input=document.getElementById("newName");
  var name=input.value.trim();
  if(!name) return;
  var t=state.templates||defaultTemplates();
  function mk(arr){ return arr.map(function(s){ var n={id:uid(),label:s.label,status:"todo",note:""}; if(s.phase) n.phase=s.phase; if(s.tag) n.tag=s.tag; return n; }); }
  var c={
    id:uid(), name:name, subtitle:"", stage:"Discovery", owner:"", type:"", intake:"", notes:"",
    goLiveDate:"", trackerUrl:"", trackerKey:"", trackerFile:"", goLiveManual:false,
    proposalSent:"", contactName:"", contactEmail:"", scopingNotes:"", acceptedAt:"",
    tier:"", hours:"", signedDate:"", day30Date:"", slackChannel:"",
    createdAt:new Date().toISOString(),
    onboarding:mk(t.onboarding), offboarding:mk(t.offboarding),
    outreach:{retainerPack:false,doNotFollowUp:false,pitchSent:"",nextFollowUp:"",outcome:"",note:""}
  };
  state.clients.push(c); state.selectedId=c.id;
  input.value=""; filter="Discovery"; showOther=false;
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({filter:filter})); }catch(e){}
  scheduleSave(); render();
}

/* ===================== STANDARD CHECKLIST ===================== */
function openTemplate(){
  var t=state.templates||defaultTemplates();
  function cp(a){ return (a||[]).map(function(s){ var r={id:s.id,label:s.label}; if(s.phase) r.phase=s.phase; if(s.tag) r.tag=s.tag; return r; }); }
  tmpl={ onboarding:cp(t.onboarding), offboarding:cp(t.offboarding) };
  tmplTab="onboarding";
  renderTemplate();
}
function renderTemplate(){
  var old=document.querySelector(".modal-bg"); if(old) old.remove();
  if(!tmpl) return;
  var isOn = tmplTab==="onboarding";
  var phaseOpts = '<option value="">Other</option>'+PHASES.map(function(p){ return '<option value="'+p.id+'">'+esc(p.when+" · "+p.name)+'</option>'; }).join("");
  var bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML='<div class="modal"><div class="mh"><h3>Standard checklist</h3>'+
    '<p>The steps every new client starts with. Renaming a step also corrects it on existing clients; adding, removing or re-phasing affects new clients (and "Load the runbook") only.'+
    (isOn?' The onboarding standard is the New Client Runbook v'+RUNBOOK_VERSION+'; each step belongs to a phase.':'')+'</p></div>'+
    '<div class="tabs">'+
      '<button class="tab'+(isOn?" on":"")+'" data-tab="onboarding">Runbook (onboarding)</button>'+
      '<button class="tab'+(!isOn?" on":"")+'" data-tab="offboarding">Offboarding</button></div>'+
    '<div class="mlist">'+ tmpl[tmplTab].map(function(s,i){
      return '<div class="te-step"><span class="n">'+(i+1)+'</span>'+
        '<input data-ti="'+i+'" value="'+esc(s.label)+'">'+
        (isOn?'<select data-tp="'+i+'">'+phaseOpts.replace('value="'+(s.phase||"")+'"','value="'+(s.phase||"")+'" selected')+'</select>':"")+
        '<button class="te-mv" data-up="'+i+'">↑</button>'+
        '<button class="te-mv" data-dn="'+i+'">↓</button>'+
        '<button class="te-del" data-rm="'+i+'">×</button></div>';
    }).join("")+
    '<button class="add-step" id="teAdd" style="align-self:flex-start;margin-top:4px">+ Add step</button></div>'+
    '<div class="mf">'+
    (isOn?'<button class="link-btn" id="teReset">Reset to runbook v'+RUNBOOK_VERSION+'</button>':"")+
    (isOn&&(state.templates.legacyOnboarding||[]).length?'<button class="link-btn" id="teLegacy">Restore the pre-runbook list</button>':"")+
    '<button class="btn-ghost" id="teCancel">Cancel</button>'+
    '<button class="btn-red" id="teSave">Save standard</button></div></div>';
  document.body.appendChild(bg);

  bg.addEventListener("click",function(e){ if(e.target===bg){ tmpl=null; renderTemplate(); } });
  bg.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click",function(){ tmplTab=b.getAttribute("data-tab"); renderTemplate(); }); });
  bg.querySelectorAll("[data-ti]").forEach(function(el){ el.addEventListener("input",function(){ tmpl[tmplTab][+el.getAttribute("data-ti")].label=el.value; }); });
  bg.querySelectorAll("[data-tp]").forEach(function(el){ el.addEventListener("change",function(){ var s=tmpl[tmplTab][+el.getAttribute("data-tp")]; if(el.value) s.phase=el.value; else delete s.phase; }); });
  bg.querySelectorAll("[data-up]").forEach(function(b){ b.addEventListener("click",function(){ mvTmpl(+b.getAttribute("data-up"),-1); }); });
  bg.querySelectorAll("[data-dn]").forEach(function(b){ b.addEventListener("click",function(){ mvTmpl(+b.getAttribute("data-dn"),1); }); });
  bg.querySelectorAll("[data-rm]").forEach(function(b){ b.addEventListener("click",function(){ tmpl[tmplTab].splice(+b.getAttribute("data-rm"),1); renderTemplate(); }); });
  bg.querySelector("#teAdd").addEventListener("click",function(){ tmpl[tmplTab].push({id:"tn"+uid().slice(0,6),label:"New step"}); renderTemplate(); });
  bg.querySelector("#teCancel").addEventListener("click",function(){ tmpl=null; renderTemplate(); });
  bg.querySelector("#teSave").addEventListener("click",saveTemplate);
  var rs=bg.querySelector("#teReset"); if(rs) rs.addEventListener("click",function(){ if(confirm("Replace the onboarding standard with the runbook as published?")){ tmpl.onboarding=runbookTemplate(); renderTemplate(); } });
  var lg=bg.querySelector("#teLegacy"); if(lg) lg.addEventListener("click",function(){ if(confirm("Replace the onboarding standard with the flat list used before the runbook? New clients would get that list instead.")){ tmpl.onboarding=(state.templates.legacyOnboarding||[]).map(function(s){ return {id:s.id,label:s.label}; }); renderTemplate(); } });
}
function mvTmpl(i,d){
  var a=tmpl[tmplTab], j=i+d;
  if(j<0||j>=a.length) return;
  var x=a[i]; a[i]=a[j]; a[j]=x; renderTemplate();
}
function saveTemplate(){
  var old=state.templates||defaultTemplates(), renames={};
  ["onboarding","offboarding"].forEach(function(k){
    (tmpl[k]||[]).forEach(function(s){
      var prev=(old[k]||[]).filter(function(o){ return o.id===s.id; })[0];
      if(prev && prev.label!==s.label.trim()) renames[prev.label]=s.label.trim();
    });
  });
  if(Object.keys(renames).length){
    state.clients.forEach(function(c){ ["onboarding","offboarding"].forEach(function(k){
      (c[k]||[]).forEach(function(s){ if(renames[s.label]!==undefined) s.label=renames[s.label]; });
    }); });
  }
  function clean(k){ return (tmpl[k]||[]).map(function(s){ var r={id:s.id,label:s.label.trim()}; if(s.phase) r.phase=s.phase; if(s.tag) r.tag=s.tag; return r; }).filter(function(s){ return s.label; }); }
  state.templates={onboarding:clean("onboarding"), offboarding:clean("offboarding"), runbookVersion:RUNBOOK_VERSION, legacyOnboarding:old.legacyOnboarding||[]};
  tmpl=null; renderTemplate(); scheduleSave(); render();
}

/* ===================== TOP LEVEL ===================== */
function render(){ renderChips(); renderList(); renderMain(); }

document.getElementById("addBtn").addEventListener("click",addClient);
document.getElementById("newName").addEventListener("keydown",function(e){ if(e.key==="Enter") addClient(); });
document.getElementById("chips").addEventListener("click",function(e){
  var b=e.target.closest("[data-filter]"); if(!b) return;
  filter=b.getAttribute("data-filter");
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({filter:filter})); }catch(e2){}
  render();
});
document.getElementById("clientList").addEventListener("click",function(e){
  var b=e.target.closest("[data-open]"); if(!b) return;
  state.selectedId=b.getAttribute("data-open"); showOther=false; closeCal(); render();
});

try{
  var p=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
  if(p.filter) filter=p.filter;
}catch(e){}
render();
load();
</script>
</body>
</html>
