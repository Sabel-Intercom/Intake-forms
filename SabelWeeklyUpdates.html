<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weekly Client Updates</title>
<style>
  :root{
    --bg:#0B0B0C; --surface:#0F1113; --card:#141618; --card2:#191C20; --card3:#1E2228;
    --border:#2A3547; --border2:#1A2232; --red:#E10600;
    --w:#FFFFFF; --body:#E2E8F0; --muted:#94A3B8; --mono:#64748B;
    --green:#4ADE80; --blue:#60A5FA; --amber:#FBBF24; --purple:#C084FC; --redText:#F87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--body);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  select,textarea,input{font-family:inherit;}
  a{color:#FCA5A5;text-decoration:none;} a:hover{color:#fff;text-decoration:underline;}
  ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* header */
  .header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:13px 22px;background:rgba(11,11,12,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border2);}
  .logo-img{height:24px;width:auto;display:block;}
  .tag{font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mono);}
  h1{font-size:15px;font-weight:800;color:var(--w);letter-spacing:-.01em;}
  .hright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stamp{font-size:10px;color:var(--mono);letter-spacing:.03em;}
  .stamp b{color:var(--green);}
  .btn{font-size:11px;font-weight:700;padding:6px 12px;border-radius:6px;border:1px solid var(--border2);
    background:var(--card);color:var(--muted);transition:.12s;}
  .btn:hover{color:var(--w);border-color:var(--border);}
  .btn.on{background:var(--red);color:#fff;border-color:var(--red);}
  .wknav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:3px;}
  .wknav button{font-size:12px;padding:3px 8px;border-radius:4px;color:var(--muted);}
  .wknav button:hover{color:var(--w);background:var(--card3);}
  .wklab{font-size:11px;font-weight:700;color:var(--body);padding:0 6px;white-space:nowrap;}
  .who{font-size:11px;background:var(--card);border:1px solid var(--border2);color:var(--body);border-radius:6px;padding:6px 8px;}

  .wrap{max-width:1080px;margin:0 auto;padding:22px;}

  /* progress strip */
  .strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border2);
    border-radius:11px;padding:14px 17px;margin-bottom:18px;}
  .strip .lead{font-size:12.5px;color:var(--muted);}
  .strip b{color:var(--w);}
  .bar{flex:1;min-width:140px;height:5px;background:var(--card3);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s;}

  /* client tiles */
  .list{display:flex;flex-direction:column;gap:9px;}
  details.tile{background:var(--card);border:1px solid var(--border2);border-radius:11px;overflow:hidden;}
  details.tile[open]{border-color:var(--border);}
  details.tile.sent{border-left:3px solid var(--green);}
  details.tile.review{border-left:3px solid var(--amber);}
  details.tile.skip{opacity:.5;border-left:3px solid var(--border);}
  details.tile.skip:hover,details.tile.skip[open]{opacity:1;}
  .pill.skip{color:var(--mono);background:var(--card3);}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:14px 17px;}
  summary::-webkit-details-marker{display:none;}
  summary:hover{background:var(--card2);}
  .chev{color:var(--mono);font-size:11px;transition:transform .15s;}
  details[open] .chev{transform:rotate(90deg);}
  .cname{font-size:14px;font-weight:700;color:var(--w);}
  .pill{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .pill.stage{color:var(--blue);background:rgba(96,165,250,.13);}
  .pill.draft{color:var(--mono);background:var(--card3);}
  .pill.review{color:var(--amber);background:rgba(251,191,36,.13);}
  .pill.sent{color:var(--green);background:rgba(74,222,128,.13);}
  .sright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rev{font-size:10px;color:var(--mono);letter-spacing:.03em;}
  .rev b{color:var(--body);}

  .body{padding:2px 17px 17px;border-top:1px solid var(--border2);}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0;}
  .lab{font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mono);flex:0 0 92px;}
  .modes{display:flex;gap:5px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:4px;}
  .modes button{font-size:11.5px;font-weight:700;padding:7px 14px;border-radius:5px;color:var(--muted);}
  .modes button:hover{color:var(--w);}
  .modes button.on{background:var(--red);color:#fff;}
  select.pick{font-size:11.5px;background:var(--card2);border:1px solid var(--border2);color:var(--body);
    border-radius:6px;padding:7px 10px;min-width:120px;}
  select.pick:focus{outline:none;border-color:var(--red);}

  .note{font-size:11.5px;color:var(--mono);line-height:1.55;margin:2px 0 10px;}
  .note b{color:var(--muted);}
  textarea.draft{width:100%;min-height:190px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;
    color:var(--body);font:13px/1.65 inherit;padding:13px 15px;resize:vertical;}
  textarea.draft:focus{outline:none;border-color:var(--red);}
  .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .src{font-size:10px;color:var(--mono);margin-left:auto;letter-spacing:.03em;}
  .src.warn{color:var(--amber);}
  .empty{font-size:12px;color:var(--mono);padding:18px 0;}

  footer{max-width:1080px;margin:26px auto 0;padding:16px 22px 0;border-top:1px solid var(--border2);
    font-size:9px;color:var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
</style>
</head>

<script>
/* ──────────────────────────────────────────────────────────────
   WEEKLY CLIENT UPDATES

   One list. Every active client is a tile; open a tile and you get the two
   things you actually do each week:

     Monday check-in  — what we need FROM the client this coming week
     Friday recap     — what got DONE this week, from Notion and the tracker,
                        merged into one editable draft

   Plus a reviewer to check with before it goes out, and a status to mark it
   sent. Nothing here writes to a client tracker or to Notion — the draft is
   yours to edit and send.

   SOURCES
     trackers.json          the registry of client trackers
     client-portal-v1       which clients are active, and their stage
     <client>-tracker-v1    the plan: tasks, owners, statuses, dates
     /api/notion            tasks completed this week (replaces /api/motion)
     sabel-weekly-updates-v1  the drafts, shared across the team

   Notion and the trackers describe the same work. Every Notion task carries a
   'Tracker task id' of the form '<key>:<phase>-s|c-<n>', which is exactly the
   tracker's own task key — so the merge de-duplicates exactly, and '-c-'
   tells us a task sits with the client rather than with us.
   ────────────────────────────────────────────────────────────── */

var API        = 'https://sabel-webhook.vercel.app/api/tracker';
var NOTION_API = 'https://sabel-webhook.vercel.app/api/notion';
var BASE       = 'https://sabel-intercom.github.io/Intake-forms/';
var STORE_KEY  = 'sabel-weekly-updates-v1';
var PORTAL_KEY = 'client-portal-v1';
var REFRESH_MS = 5 * 60 * 1000;

var TEAM      = ['Chris','Richard','Greg','Nikki'];
var REVIEWERS = ['Chris','Richard','Greg'];
var STATUSES  = ['Draft','With reviewer','Sent'];
/* Stage is shown on the tile for context only. Whether a client appears is
   decided by Status = Active in Notion, not by stage. */

var CLIENTS = [];          // [{key,name,file,stage,lead,tasks:[...]}]
var NOTION  = {tasks:[], ok:null, err:''};
var WEEK_OFFSET = 0;
var WHO = localStorage.getItem('sabel_who') || '';
var LIVE = {at:null, ok:0, total:0};
var PROJECTS_OK = null;   // did the Notion client list load?

/* The v2 store lives beside the old one so nothing already written is lost.
   { v2: { weeks: { '<mon>': { '<key>': { mode, monday:{...}, friday:{...} } } },
           reviewers: { '<key>': 'Chris' } } }                                  */
var STORE = {v2:{weeks:{},reviewers:{}}};
var SAVE_T = null, TYPING = false;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── the week ── */
function weekStart(offset){
  var d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7) + (offset||0)*7);
  return d;
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function wkKey(){ return iso(weekStart(WEEK_OFFSET)); }
function wkEnd(){ var d=weekStart(WEEK_OFFSET); d.setDate(d.getDate()+6); return d; }
function fmtDay(d){ return d.getDate()+' '+MON[d.getMonth()]; }
function inThisWeek(isoDate){
  if(!isoDate) return false;
  var s=iso(weekStart(WEEK_OFFSET)), e=iso(wkEnd());
  var d=String(isoDate).slice(0,10);
  return d>=s && d<=e;
}
function shiftWeek(n,today){ WEEK_OFFSET = today ? 0 : WEEK_OFFSET+n; render(); loadNotion(); }

/* ── store ── */
function bucket(){
  var w=wkKey();
  if(!STORE.v2) STORE.v2={weeks:{},reviewers:{}};
  if(!STORE.v2.weeks[w]) STORE.v2.weeks[w]={};
  return STORE.v2.weeks[w];
}
function entry(key){
  var b=bucket();
  if(!b[key]) b[key]={mode:defaultMode(), monday:blank(), friday:blank(), skip:false};
  return b[key];
}
function blank(){ return {text:'', status:'Draft', by:'', at:0, generated:false}; }
/* Before Wednesday the week is still ahead of you, so the check-in is the
   likely job; from Wednesday on you are heading for the recap. */
function defaultMode(){ var d=new Date().getDay(); return (d>=3 || d===0) ? 'friday' : 'monday'; }
function reviewerFor(key){ return (STORE.v2 && STORE.v2.reviewers && STORE.v2.reviewers[key]) || ''; }

/* A client can be marked not-required for THIS WEEK — nothing to say, handled on
   a call, paused. It is a per-week decision, so it clears when the week rolls
   over and you make the call again with fresh eyes.

   They stay on the list rather than being hidden, because the point of the list
   is knowing you have accounted for everyone on the radar. They just drop out of
   the count and sit at the bottom. Stored in the week's bucket and shared, so
   whoever picks the week up sees the same calls. */
function skipFor(key){ return !!entry(key).skip; }
function toggleSkip(key,ev){
  if(ev) ev.stopPropagation();
  var e=entry(key);
  if(e.skip){
    e.skip=false;
  } else {
    e.skip=true;
    // Collapse it first. render() carries open tiles across a re-render, so
    // without this the tile drops to the bottom of the list still expanded and
    // has to be chased down and closed by hand.
    // Matched by attribute rather than a selector: keys contain colons and
    // spaces ("notracker:the foot hub") that would need escaping.
    var tiles=document.querySelectorAll('details.tile');
    for(var i=0;i<tiles.length;i++){
      if(tiles[i].getAttribute('data-key')===key) tiles[i].open=false;
    }
  }
  saveStore(); render();
}

function saveLocal(){ try{ localStorage.setItem('sabel_weekly_v2', JSON.stringify(STORE)); }catch(e){} }
function saveStore(){
  saveLocal();
  if(SAVE_T) clearTimeout(SAVE_T);
  SAVE_T=setTimeout(function(){
    fetch(API+'?key='+encodeURIComponent(STORE_KEY)+'&_t='+Date.now(),{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data:STORE})
    }).catch(function(){ /* offline — localStorage holds it */ });
  }, 1000);
}
/* The first version of this stored not-required permanently per client. Carry
   those marks into the current week once, so nobody's calls are lost, then leave
   the old key alone. */
function migrateSkips(){
  if(!STORE.v2 || !STORE.v2.skip || STORE.v2.skipMigrated) return;
  var b=bucket(), n=0;
  Object.keys(STORE.v2.skip).forEach(function(k){
    if(!STORE.v2.skip[k]) return;
    entry(k).skip=true; n++;
  });
  STORE.v2.skipMigrated=true;
  if(n) saveStore();
}
function loadStore(){
  return fetch(API+'?key='+encodeURIComponent(STORE_KEY)+'&_t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j && j.ok && j.data && typeof j.data==='object'){
        STORE=j.data;
        if(!STORE.v2) STORE.v2={weeks:{},reviewers:{}};        // first run on the new shape
        if(!STORE.v2.weeks) STORE.v2.weeks={};
        if(!STORE.v2.reviewers) STORE.v2.reviewers={};
        saveLocal();
      }
    }).catch(function(){
      try{ var l=localStorage.getItem('sabel_weekly_v2'); if(l) STORE=JSON.parse(l); }catch(e){}
    });
}

/* ── tracker parsing (same three shapes the dashboards handle) ── */
var SKILL_MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function skillDate(d){
  if(!d) return '';
  var ms=String(d).match(/([A-Z][a-z]{2})\s*(\d{1,2})/g); if(!ms) return '';
  var m=ms[ms.length-1].match(/([A-Z][a-z]{2})\s*(\d{1,2})/);
  var mo=SKILL_MONTHS[m[1]]; if(mo==null) return '';
  return new Date().getFullYear()+'-'+String(mo+1).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
}
/* ── the week grid ──
   A task pinned to a week takes its date from the week grid (WEEK1_START plus
   any weekStarts overrides), not from its `d` string — the tracker's own
   taskDatesText() falls back to `d` only when there is no week, and shifting a
   week never rewrites `d`. WEEK1_START sits in the tracker's HTML, so it is
   read once per tracker and cached. */
var WEEK1 = {};
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hasWeeks(data){
  if(!data || !data.taskData) return false;
  return Object.keys(data.taskData).some(function(pid){
    var g=data.taskData[pid]||{};
    return ['sabel','client'].some(function(s){ return (g[s]||[]).some(function(t){ return t && t.week; }); });
  });
}
function loadWeek1(c){
  if(WEEK1[c.key]!==undefined) return Promise.resolve();
  if(!c.file){ WEEK1[c.key]=null; return Promise.resolve(); }
  return fetch(BASE+c.file,{cache:'no-store'})
    .then(function(r){ return r.ok?r.text():''; })
    .then(function(txt){
      var m=txt.match(/WEEK1_START\s*=\s*['"]([\d-]{10})['"]/);
      WEEK1[c.key]= m ? m[1] : null;
    }).catch(function(){ WEEK1[c.key]=null; });
}
function weekEndDate(n, week1, weekStarts){
  var d;
  if(weekStarts && weekStarts[n]) d=new Date(weekStarts[n]+'T00:00:00');
  else { d=new Date(week1+'T00:00:00'); d.setDate(d.getDate()+(n-1)*7); }
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate()+6);
  return isoOf(d);
}
function taskDue(t, week1, weekStarts){
  if(t.week && t.week>=1 && week1){
    var wk=(t.wkEnd && t.wkEnd>t.week) ? t.wkEnd : t.week;
    return weekEndDate(wk, week1, weekStarts);
  }
  return skillDate(t.d);
}

/* Returns [{taskKey, task, owner, status, end, clientSide}] — taskKey matches
   the '<phase>-s|c-<n>' half of Notion's 'Tracker task id'. */
function tasksFrom(data, key){
  if(!data) return [];
  var out=[];
  if(data.taskData && typeof data.taskData==='object'){
    var st=data.statuses||{};
    var w1=WEEK1[key]||null, ws=data.weekStarts||{};
    Object.keys(data.taskData).forEach(function(pid){
      var g=data.taskData[pid]||{};
      (g.sabel||[]).forEach(function(t,i){
        out.push({taskKey:pid+'-s-'+i, task:t.t, owner:t.o, status:st[pid+'-s-'+i]||t.s, end:taskDue(t,w1,ws), clientSide:false});
      });
      (g.client||[]).forEach(function(t,i){
        out.push({taskKey:pid+'-c-'+i, task:t.t, owner:t.o, status:st[pid+'-c-'+i]||t.s, end:taskDue(t,w1,ws), clientSide:true});
      });
    });
    return out;
  }
  var ph = Array.isArray(data) ? data : (Array.isArray(data.phases)?data.phases:null);
  if(ph){
    ph.forEach(function(p,pi){
      (p.tasks||[]).forEach(function(k,i){
        out.push({taskKey:(p.id||('p'+pi))+'-'+(k.dep?'c':'s')+'-'+i, task:k.task, owner:k.owner,
                  status:k.status, end:k.end||k.start||'', clientSide:!!k.dep});
      });
    });
    return out;
  }
  if(Array.isArray(data.groups)){
    data.groups.forEach(function(g,gi){
      (g.items||[]).forEach(function(it,i){
        out.push({taskKey:(g.id||('g'+gi))+'-s-'+i, task:it.task, owner:it.owner,
                  status: it.done?'Complete':(it.status==='red'?'Blocked':'In Progress'),
                  end:it.iso||it.date||'', clientSide:!!it.dep});
      });
    });
  }
  return out;
}

/* ── loading ── */
function fetchKey(key){
  return fetch(API+'?key='+encodeURIComponent(key)+'&_t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ return (j&&j.ok)?j.data:null; })
    .catch(function(){ return null; });
}
function loadNotion(){
  var since = weekStart(WEEK_OFFSET).toISOString();
  NOTION.ok=null;
  return fetch(NOTION_API+'?since='+encodeURIComponent(since)+'&_t='+Date.now(),{cache:'no-store'})
    .then(function(r){
      if(r.status===404) throw new Error('The Notion bridge is not deployed yet (api/notion).');
      return r.json();
    })
    .then(function(j){
      if(j && j.ok){ NOTION.tasks=j.tasks||[]; NOTION.ok=true; NOTION.err=''; }
      else { NOTION.ok=false; NOTION.err=(j&&j.error)||'The Notion bridge returned an error.'; }
      render();
    })
    .catch(function(e){
      // A missing endpoint fails CORS preflight, so the browser reports a bare
      // "Failed to fetch" — say what that actually means rather than passing it on.
      NOTION.ok=false;
      NOTION.err = /failed to fetch|networkerror/i.test(e.message||'')
        ? 'bridge not deployed yet (api/notion) — Friday recaps fall back to the tracker'
        : (e.message||'could not reach the bridge');
      render();
    });
}
/* Every client on this page comes from ONE list: the Sabel Ops › Projects
   database in Notion, filtered to Status = Active. Add a client there and a tile
   appears here on the next refresh; mark it Done and the tile goes.

   This used to be driven by the portal intersected with trackers.json, which
   silently dropped any client without a deployed tracker — Bulk Nutrients,
   Cannabis Clinic, RMS Cloud and the rest never showed up. A client still needs
   an update written whether or not a tracker exists, so the tracker is now
   optional: it fills the draft in automatically when present, and you write the
   update by hand when it is not. */
function loadProjects(){
  return fetch(NOTION_API+'?kind=projects&_t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ return (j && j.ok && Array.isArray(j.projects)) ? j.projects : null; })
    .catch(function(){ return null; });
}
function loadAll(manual){
  return Promise.all([
    fetch(BASE+'trackers.json',{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }),
    fetchKey(PORTAL_KEY),
    loadProjects(),
    manual ? loadStore() : Promise.resolve()
  ]).then(function(res){
    var reg    = Array.isArray(res[0]) ? res[0] : [];
    var portal = (res[1] && Array.isArray(res[1].clients)) ? res[1].clients : [];
    var projs  = res[2];

    var byKey={}, byName={}, byPortal={};
    reg.forEach(function(t){ if(t.key) byKey[t.key]=t; byName[norm(t.name)]=t; });
    portal.forEach(function(pc){ byPortal[norm(pc.name)]=pc; });

    var picked=[];
    if(projs){
      PROJECTS_OK=true;
      projs.forEach(function(p){
        if((p.status||'')!=='Active') return;
        // The tracker is looked up by key first, then by name — a project can be
        // live in Notion before anyone has registered its tracker.
        var t=(p.trackerKey&&byKey[p.trackerKey]) || byName[norm(p.name)] || null;
        var pc=byPortal[norm(p.name)] || null;
        picked.push({
          key: (t&&t.key) || p.trackerKey || ('notracker:'+norm(p.name)),
          hasTracker: !!(t&&t.key) || !!p.trackerKey,
          name: p.name,
          file: (t&&t.file) || '',
          trackerUrl: p.trackerUrl || ((t&&t.file) ? BASE+t.file : ''),
          stage: (pc&&pc.stage) || 'Active',
          lead: (pc&&pc.owner) || '',
          tasks: []
        });
      });
    } else {
      // Notion unreachable — fall back to the registry so the page still works.
      PROJECTS_OK=false;
      reg.forEach(function(t){
        if(!t.active || !t.key) return;
        var pc=byPortal[norm(t.name)] || null;
        picked.push({key:t.key, hasTracker:true, name:t.name, file:t.file,
                     trackerUrl:BASE+t.file, stage:(pc&&pc.stage)||'Active',
                     lead:(pc&&pc.owner)||'', tasks:[]});
      });
    }

    LIVE.total=picked.filter(function(c){ return c.hasTracker; }).length; LIVE.ok=0;
    return Promise.all(picked.map(function(c){
      if(!c.hasTracker) return Promise.resolve();      // nothing to fetch; tile still shows
      return fetchKey(c.key).then(function(d){
        if(d) LIVE.ok++;
        // Week-pinned trackers need WEEK1_START from their HTML — fetched once each.
        return (hasWeeks(d) ? loadWeek1(c) : Promise.resolve())
          .then(function(){ c.tasks=tasksFrom(d, c.key); });
      });
    })).then(function(){
      CLIENTS=picked.sort(function(a,b){ return a.name.toLowerCase()<b.name.toLowerCase()?-1:1; });
      LIVE.at=new Date(); render();
    });
  });
}
function norm(n){
  return String(n||'').toLowerCase().replace(/[().,'"&]/g,' ')
    .replace(/\b(ltd|limited|inc|oy|ab|pty|nz|usa|global|labs?|renewal)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}

/* ── building the two drafts ──────────────────────────────────
   Friday: everything finished this week. Notion is the system of record now,
   so it leads; a tracker task that is Complete but has no Notion twin is
   added so nothing is silently dropped while the two are still converging.
   Monday: what sits with the client — their open tasks due soon, and anything
   of ours that is blocked waiting on them.                                  */
function completedFor(c){
  var seen={}, rows=[];
  NOTION.tasks.forEach(function(t){
    if(t.trackerKey!==c.key) return;
    if(!inThisWeek(t.completedAt)) return;
    var k=(t.trackerTaskId||'').split(':')[1] || ('notion:'+t.id);
    seen[k]=1;
    rows.push({task:t.title, owner:t.owner, from:'Notion'});
  });
  c.tasks.forEach(function(t){
    var s=(t.status||'').toLowerCase();
    if(s!=='complete' && s!=='done') return;
    if(seen[t.taskKey]) return;
    if(!inThisWeek(t.end)) return;              // trackers have no completion date either
    rows.push({task:t.task, owner:t.owner, from:'tracker'});
  });
  return rows;
}
function neededFor(c){
  var rows=[], end=iso(wkEnd()), today=iso(new Date());
  c.tasks.forEach(function(t){
    var s=(t.status||'').toLowerCase();
    if(s==='complete' || s==='done') return;
    var due=t.end||'', waiting=(s==='blocked'||s==='dependency');
    // Dated work only counts if it lands by Sunday (overdue included — still needed).
    // Undated work is kept but set aside: some trackers carry no dates at all, so
    // dropping it would silently lose real asks, and lumping it in with this week's
    // would overstate the urgency.
    if(due && due>end) return;
    if(t.clientSide){
      rows.push({task:t.task, owner:t.owner, due:due, dated:!!due,
                 why:(due && due<today)?'overdue':''});
    } else if(waiting){
      rows.push({task:t.task, owner:t.owner, due:due, dated:!!due,
                 why:s==='blocked'?'blocked on them':'waiting on them'});
    }
  });
  // Late things first, then by date, so the ask leads with what is holding us up.
  rows.sort(function(a,b){
    var al=a.why==='overdue'?0:1, bl=b.why==='overdue'?0:1;
    if(al!==bl) return al-bl;
    return (a.due||'9999')<(b.due||'9999')?-1:1;
  });
  return rows;
}
function buildDraft(c, mode){
  var L=[];
  if(mode==='friday'){
    var done=completedFor(c);
    L.push('Hi team,'); L.push('');
    L.push('Quick wrap-up of where we got to this week on '+c.name+'.');
    L.push('');
    if(done.length){
      L.push('Completed this week:');
      done.forEach(function(r){ L.push('  • '+r.task+(r.owner?'  ('+r.owner+')':'')); });
    } else {
      L.push('Completed this week:');
      L.push('  • (nothing recorded as finished this week — worth a sanity check before sending)');
    }
    L.push(''); L.push('Anything you would like us to prioritise next week, just say.');
    L.push(''); L.push('Thanks,'); L.push(WHO||'');
  } else {
    var need=neededFor(c);
    L.push('Hi team,'); L.push('');
    L.push('Kicking off the week on '+c.name+'. Here is what we need from your side to keep things moving.');
    L.push('');
    var dated=need.filter(function(r){ return r.dated; });
    var undated=need.filter(function(r){ return !r.dated; });
    L.push('With you this week:');
    if(dated.length){
      dated.forEach(function(r){
        L.push('  • '+r.task + (r.due?'  (due '+r.due+')':'') + (r.why?'  — '+r.why:''));
      });
    } else if(!undated.length){
      L.push('  • Nothing outstanding on your side — all yours to enjoy.');
    } else {
      L.push('  • Nothing with a date this week, but the below is still open.');
    }
    if(undated.length){
      L.push('');
      L.push('Also still with you (no date set):');
      undated.forEach(function(r){
        L.push('  • '+r.task + (r.why?'  — '+r.why:''));
      });
    }
    L.push(''); L.push('Shout if any of that needs a hand or a re-plan.');
    L.push(''); L.push('Thanks,'); L.push(WHO||'');
  }
  return L.join('\n');
}

/* ── actions ── */
function setWho(v){ WHO=v; localStorage.setItem('sabel_who',v); render(); }
function setMode(key,m,ev){ if(ev) ev.stopPropagation(); entry(key).mode=m; saveStore(); render(); }
function setReviewer(key,v){
  if(!STORE.v2.reviewers) STORE.v2.reviewers={};
  STORE.v2.reviewers[key]=v; saveStore(); render();
}
function setStatus(key,v){
  var e=entry(key); e[e.mode].status=v; e[e.mode].by=WHO; e[e.mode].at=Date.now();
  saveStore(); render();
}
function onDraft(key,val){
  var e=entry(key); e[e.mode].text=val; e[e.mode].by=WHO; e[e.mode].at=Date.now();
  saveStore(); progress();
}
function regen(key,ev){
  if(ev) ev.stopPropagation();
  var c=findClient(key); if(!c) return;
  var e=entry(key);
  if(e[e.mode].text && !confirm('Rebuild this draft from Notion and the tracker?\n\nYour edits to it will be replaced.')) return;
  e[e.mode].text=buildDraft(c,e.mode); e[e.mode].generated=true; e[e.mode].at=Date.now();
  saveStore(); render();
}
function copyDraft(key,ev){
  if(ev) ev.stopPropagation();
  var e=entry(key), txt=e[e.mode].text||'';
  var btn=ev?ev.target:null;
  function done(ok){ if(btn){ var o=btn.textContent; btn.textContent=ok?'Copied':'Copy failed'; setTimeout(function(){btn.textContent=o;},1500); } }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});
  else done(false);
}
function findClient(key){ for(var i=0;i<CLIENTS.length;i++) if(CLIENTS[i].key===key) return CLIENTS[i]; return null; }

/* ── render ── */
function progress(){
  var due=0, sent=0, skipped=0;
  CLIENTS.forEach(function(c){
    if(skipFor(c.key)){ skipped++; return; }      // not counted either way
    due++;
    var e=entry(c.key); if(e[e.mode].status==='Sent') sent++;
  });
  var el=document.getElementById('progLead'), bar=document.getElementById('progBar');
  if(el) el.innerHTML='<b>'+sent+'</b> of <b>'+due+'</b> clients updated this week'+
    (skipped?' <span style="color:var(--mono)">&middot; '+skipped+' not required this week</span>':'');
  if(bar) bar.style.width=(due?Math.round(sent/due*100):0)+'%';
}
function render(){
  var ws=weekStart(WEEK_OFFSET), we=wkEnd();
  document.getElementById('wkLabel').textContent='Mon '+fmtDay(ws)+' – Sun '+fmtDay(we);
  var stamp=document.getElementById('stamp');
  stamp.textContent = LIVE.at ? (LIVE.ok+'/'+LIVE.total+' trackers · '+LIVE.at.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})) : 'loading…';

  var sel=document.getElementById('whoSel');
  if(sel && !sel.options.length){
    sel.innerHTML='<option value="">Who are you?</option>'+TEAM.map(function(n){return '<option>'+n+'</option>';}).join('');
    sel.value=WHO;
  }
  var note=document.getElementById('srcNote');
  if(note) note.textContent = NOTION.ok===false ? ('Notion: '+NOTION.err) : (NOTION.ok? 'Notion connected · '+NOTION.tasks.length+' completed tasks in range' : 'Notion: checking…');

  var box=document.getElementById('list');
  if(!CLIENTS.length){ box.innerHTML='<div class="empty">No active clients with a tracker. Check the portal stages and trackers.json.</div>'; progress(); return; }

  // keep whichever tiles are open across a re-render
  var open={}; box.querySelectorAll('details.tile[open]').forEach(function(d){ open[d.getAttribute('data-key')]=1; });

  // Not-required clients sink to the bottom but stay visible — the list is the
  // check that nobody on the radar has been missed.
  var ordered=CLIENTS.slice().sort(function(a,b){
    var sa=skipFor(a.key)?1:0, sb=skipFor(b.key)?1:0;
    if(sa!==sb) return sa-sb;
    return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
  });
  box.innerHTML=ordered.map(function(c){
    var e=entry(c.key), m=e.mode, d=e[m];
    var skip = skipFor(c.key);
    var cls = skip?'skip':(d.status==='Sent'?'sent':(d.status==='With reviewer'?'review':''));
    var pill= d.status==='Sent'?'sent':(d.status==='With reviewer'?'review':'draft');
    var rv  = reviewerFor(c.key);
    var count = m==='friday' ? completedFor(c).length : neededFor(c).length;
    var srcWarn = (m==='friday' && NOTION.ok===false);

    return '<details class="tile '+cls+'" data-key="'+esc(c.key)+'"'+(open[c.key]?' open':'')+'>'+
      '<summary>'+
        '<span class="chev">&#9656;</span>'+
        '<span class="cname">'+esc(c.name)+'</span>'+
        '<span class="pill stage">'+esc(c.stage)+'</span>'+
        (c.hasTracker?'':'<span class="pill draft" title="No tracker deployed for this client">no tracker</span>')+
        '<span class="sright">'+
          '<span class="rev">'+(rv?'check with <b>'+esc(rv)+'</b>':'<span style="color:var(--amber)">no reviewer set</span>')+'</span>'+
          (skip?'<span class="pill skip">not required</span>'
                :'<span class="pill '+pill+'">'+esc(d.status)+'</span>')+
        '</span>'+
      '</summary>'+
      '<div class="body">'+
        '<div class="row">'+
          '<span class="lab">This week</span>'+
          '<div class="modes">'+
            '<button class="'+(m==='monday'?'on':'')+'" onclick="setMode(\''+esc(c.key)+'\',\'monday\',event)">Monday check-in</button>'+
            '<button class="'+(m==='friday'?'on':'')+'" onclick="setMode(\''+esc(c.key)+'\',\'friday\',event)">Friday recap</button>'+
          '</div>'+
        '</div>'+
        '<div class="row">'+
          '<span class="lab">Check with</span>'+
          '<select class="pick" onchange="setReviewer(\''+esc(c.key)+'\',this.value)">'+
            '<option value="">&mdash; pick a reviewer &mdash;</option>'+
            REVIEWERS.map(function(r){ return '<option'+(rv===r?' selected':'')+'>'+r+'</option>'; }).join('')+
          '</select>'+
          '<span class="lab" style="flex:0 0 auto;margin-left:10px">Status</span>'+
          '<select class="pick" onchange="setStatus(\''+esc(c.key)+'\',this.value)"'+(skip?' disabled':'')+'>'+
            STATUSES.map(function(s){ return '<option'+(d.status===s?' selected':'')+'>'+s+'</option>'; }).join('')+
          '</select>'+
          '<button class="btn'+(skip?' on':'')+'" style="margin-left:auto" onclick="toggleSkip(\''+esc(c.key)+'\',event)" '+
            'title="Skip this client for this week only — clears when the week rolls over">'+
            (skip?'&#10003; Not required this week':'Not required this week')+'</button>'+
        '</div>'+
        '<div class="note">'+
          (!c.hasTracker
            ? 'No tracker for this client, so there is nothing to build a draft from &mdash; write the update by hand. It will still be saved, reviewed and marked sent like any other.'
            : (m==='friday'
              ? '<b>'+count+'</b> task'+(count===1?'':'s')+' finished this week, from Notion and the tracker, de-duplicated.'
              : '<b>'+count+'</b> thing'+(count===1?'':'s')+' sitting with the client — their open tasks due by Sunday, plus anything of ours blocked on them.'))+
        '</div>'+
        '<textarea class="draft" placeholder="Write the update, or hit Build from source to start from the data."'+
          ' oninput="onDraft(\''+esc(c.key)+'\',this.value)">'+esc(d.text)+'</textarea>'+
        '<div class="acts">'+
          (c.hasTracker?'<button class="btn" onclick="regen(\''+esc(c.key)+'\',event)">'+(d.text?'Rebuild from source':'Build from source')+'</button>':'')+
          '<button class="btn" onclick="copyDraft(\''+esc(c.key)+'\',event)">Copy</button>'+
          (c.trackerUrl?'<a class="btn" href="'+esc(c.trackerUrl)+'" target="_blank" style="text-decoration:none">Open tracker</a>':'')+
          '<span class="src'+(srcWarn?' warn':'')+'">'+
            (srcWarn ? 'Notion unavailable — tracker only' :
             (d.at ? 'edited '+(d.by?'by '+esc(d.by)+' ':'')+new Date(d.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'not started'))+
          '</span>'+
        '</div>'+
      '</div>'+
    '</details>';
  }).join('');
  progress();
}

/* boot */
loadStore().then(function(){ migrateSkips(); render(); return loadAll(false); }).then(loadNotion);
setInterval(function(){ if(!document.querySelector('textarea.draft:focus')) { loadAll(false); loadNotion(); } }, REFRESH_MS);
</script>
</body></html>
