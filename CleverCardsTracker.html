<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabel × CleverCards · Project Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F1117;color:#E2E8F0;min-height:100vh}
.pw{display:grid;grid-template-columns:176px 1fr;min-height:100vh}
/* Sidebar is pinned and scrolls on its own, so the footer nav (Go-live
   checklist, Out of scope, exports) is always reachable. Without this the
   sidebar stretches to the full page height and margin-top:auto pushes those
   entries to the bottom of a long page, where they read as missing. */
.sb{display:flex;flex-direction:column;background:#161B26;border-right:1px solid #1E2433;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.sb::-webkit-scrollbar{width:6px}
.sb::-webkit-scrollbar-thumb{background:#2A3145;border-radius:3px}
.sb-head{padding:16px 14px 14px;border-bottom:1px solid #1E2433}
.sb-logo{height:22px;margin-bottom:8px}
.sb-title{font-size:13px;font-weight:600;color:#E2E8F0}
.sb-sub{font-size:11px;color:#94A3B8;margin-top:1px}
.si{display:block;width:100%;text-align:left;border:none;cursor:pointer;padding:10px 14px;font-family:inherit;background:transparent;border-bottom:1px solid #1E2433;transition:background .12s}
.si:hover{background:#1E2433}
.sb-sec{padding:5px 14px 3px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#475569;text-transform:uppercase;border-bottom:1px solid #1E2433}
.sb-footer{margin-top:auto;padding:14px;border-top:1px solid #1E2433}
.mn{padding:2.75rem 1.5rem 1.5rem;background:#0F1117}
.mnw{max-width:1240px;margin:0 auto}
/* cards — overflow:visible so status picker floats above */
.task{background:#161B26;border:1px solid #1E2433;border-radius:10px;margin-bottom:7px;overflow:visible;transition:border-color .12s;position:relative}
.task:hover{border-color:#2A3145}
.task-client{background:#161B26;border:1px solid rgba(251,191,36,.28);border-radius:10px;margin-bottom:7px;overflow:visible;transition:border-color .12s;position:relative}
.task-client:hover{border-color:rgba(251,191,36,.5)}
.task.done,.task-client.done{opacity:.65}
.task.overdue,.task-client.overdue{border-left:3px solid #F87171}
/* Parent tasks (SOW deliverables with steps inside) read as containers, not
   another row: heavier surface, a left rail, and a step progress bar. */
.task.parent,.task-client.parent{background:#12151D;border-left:3px solid #60A5FA;box-shadow:inset 0 0 0 1px rgba(96,165,250,.08)}
.task-client.parent{border-left-color:#FBBF24;box-shadow:inset 0 0 0 1px rgba(251,191,36,.08)}
.task.parent.overdue,.task-client.parent.overdue{border-left-color:#F87171}
.parent-title{font-weight:600!important}
.sub-rail{position:relative;padding-left:11px;margin-left:2px;border-left:1px dashed #2A3145}
.sub-bar{height:3px;border-radius:2px;background:#1E2433;overflow:hidden;flex:1;min-width:34px;max-width:74px}
.sub-bar>i{display:block;height:100%;background:#60A5FA;border-radius:2px}
.ov-two{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:900px){.ov-two{grid-template-columns:1fr}}
.ms-rail{position:relative}
.ms-rail::before{content:'';position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:#1E2433}
.ms-row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:13px 0;cursor:pointer}
.ms-row:hover .ms-title{color:#FFFFFF}
.task-inner{border-radius:10px;overflow:hidden}
.task-head{padding:12px;cursor:grab;user-select:none}
.col-drop{border:2px dashed rgba(96,165,250,.45)!important;background:rgba(96,165,250,.04)!important;border-radius:10px!important}
.card-dragging{opacity:.35!important}
.add-task-btn{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;background:transparent;border:1px dashed #1E2433;border-radius:8px;color:#475569;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;margin-top:6px}
.add-task-btn:hover{border-color:#3B82F6;color:#60A5FA;background:rgba(59,130,246,.05)}
.task-expand{border-top:1px solid #1E2433;padding:12px;background:#0F1117;display:none}
.task-expand textarea,.task-expand input{width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:7px 10px;font-family:inherit;line-height:1.5;outline:none}
.task-expand textarea{resize:vertical}
.task-expand textarea:focus,.task-expand input:focus{border-color:#3B82F6}
.task-expand label{font-size:11px;font-weight:500;color:#94A3B8;display:block;margin-bottom:4px}
.chk-btn{background:none;border:none;cursor:pointer;padding:0;flex-shrink:0;display:flex;align-items:flex-start;padding-top:1px}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
/* status picker trigger */
.stat-bdg{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 6px 2px 8px;font-size:11px;font-weight:500;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.stat-bdg:hover{filter:brightness(1.15)}
/* filter stat cards */
.sc{border-radius:8px;padding:10px 12px;cursor:pointer;border:1px solid transparent;transition:all .15s;user-select:none;text-align:left;font-family:inherit;width:100%}
.sc.f-on{background:#161B26;border-color:#1E2433}.sc.f-on.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4)}
.sc.f-att{background:#161B26;border-color:#1E2433}.sc.f-att.active{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4)}
.sc.f-risk{background:#161B26;border-color:#1E2433}.sc.f-risk.active{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
.col-head{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:5px}
.phase-cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.ov-top{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.empty-col{font-size:12px;color:#334155;padding:20px 0;text-align:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-card{background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:12px;cursor:pointer;transition:border-color .12s}
.ph-card:hover{border-color:#3B82F6}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.5rem}
/* phase view top row: completion card beside the filter stat cards, to reduce scroll */
.phase-top{display:grid;grid-template-columns:minmax(190px,1fr) 1.7fr;gap:1rem;align-items:stretch;margin-bottom:1rem}
@media(max-width:760px){.phase-top{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;right:20px;background:#1E2433;border:1px solid #2A3145;border-radius:8px;padding:9px 14px;font-size:12px;color:#94A3B8;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1001}
.toast.show{opacity:1}
.filter-hint{font-size:11px;color:#475569;display:flex;align-items:center;gap:4px;margin-top:6px}
/* floating status picker */
#status-picker,#owner-picker,#add-picker{position:fixed;display:none;background:#1E2433;border:1px solid #2A3145;border-radius:9px;padding:4px;z-index:1000;min-width:158px;max-height:300px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#add-picker{min-width:240px;max-width:320px}
#status-picker button,#owner-picker button,#add-picker button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:5px;transition:background .1s;text-align:left}
#status-picker button:hover,#owner-picker button:hover,#add-picker button:hover{background:rgba(255,255,255,.06)}
/* tooltip */
#runway-pop,#actions-pop{position:fixed;display:none;background:#1E2433;border:1px solid #2A3145;border-radius:9px;padding:11px 13px;z-index:1001;max-width:270px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.card-flash{animation:cardflash 2.4s ease}
@keyframes cardflash{0%{box-shadow:0 0 0 3px rgba(251,146,60,.95)}55%{box-shadow:0 0 0 3px rgba(251,146,60,.5)}100%{box-shadow:0 0 0 0 rgba(251,146,60,0)}}
#tip-box{position:fixed;display:none;background:#1E2433;border:1px solid #2A3145;border-radius:8px;padding:9px 12px;font-size:12px;color:#E2E8F0;max-width:240px;line-height:1.5;z-index:1002;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* top bar: slim fixed row over the main column (autosave dot + Hide completed
   pill), always on screen in every view and at every scroll position. The main
   column carries enough top padding that nothing hides beneath it */
#top-bar{position:fixed;top:8px;right:16px;display:flex;align-items:center;gap:10px;z-index:999}
#autosave-dot{font-size:11px;color:#475569;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .4s}
#autosave-dot.show{opacity:1}
/* Hide completed is a real switch, not a subtle pill: bigger hit area, a track
   and knob that slide, and a green fill when on (its default). */
#hide-done-pill{display:flex;align-items:center;gap:9px;background:#161B26;border:1px solid #2A3145;border-radius:22px;color:#94A3B8;font-size:12px;font-weight:500;font-family:inherit;padding:7px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#hide-done-pill:hover{border-color:#475569;color:#CBD5E1}
#hide-done-pill.on{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.5);color:#4ADE80}
#hide-done-pill .hd-sw{width:30px;height:17px;border-radius:10px;background:#2A3145;position:relative;flex-shrink:0;transition:background .15s}
#hide-done-pill.on .hd-sw{background:#4ADE80}
#hide-done-pill .hd-sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#94A3B8;transition:transform .15s,background .15s}
#hide-done-pill.on .hd-sw::after{transform:translateX(13px);background:#0F1117}
@media(max-width:700px){#hide-done-pill .hd-label{display:none}}
</style>
</head>
<body>
<div class="pw">
  <div class="sb" id="sidebar"></div>
  <div class="mn" id="main"></div>
</div>
<div id="status-picker"></div>
<div id="owner-picker"></div>
<div id="runway-pop" onclick="event.stopPropagation()"></div>
<div id="actions-pop" onclick="event.stopPropagation()"></div>
<div id="add-picker"></div>
<div id="tip-box"></div>
<div id="top-bar">
  <div id="autosave-dot"><i class="ti ti-cloud-check" style="font-size:13px"></i>Autosaved</div>
  <button id="hide-done-pill" onclick="toggleHideDone()" title="Hide Complete tasks from every board view. Progress bars, counts and exports are unaffected"></button>
</div>
<div class="toast" id="toast"></div>

// ── Auto-save ─────────────────────────────────────────────────────────────────
function scheduleAutoSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveState(),800);
}
// Conflict guard: each browser session gets an id, and every save carries a
// timestamp. Before saving we check whether someone else has saved since we
// loaded; if so, the user chooses between reloading (recommended) and overwriting.
const SESSION_ID=Math.random().toString(36).slice(2);
let remoteStamp=null;
function buildPayload(){
  const payload={buildV:BUILD_V,goLive:goLiveDate,groupBy,hideDone,runwayOnDash,panels:{runway:!!panelOpen.runway,call:!!panelOpen.call},weekStarts,statuses:{},notes:cardNotes,links:cardLinks,origStatus,taskData:{},savedAt:Date.now(),savedBy:SESSION_ID};
  P.forEach(ph=>{
    payload.taskData[ph.id]={sabel:[...T[ph.id].sabel],client:[...T[ph.id].client]};
    ['sabel','client'].forEach(grp=>{
      T[ph.id][grp].forEach((t,i)=>{ payload.statuses[ph.id+'-'+(grp==='sabel'?'s':'c')+'-'+i]=t.s; });
    });
  });
  return payload;
}
async function saveState(){
  const payload=buildPayload();
  try{
    // Check for a save from someone else since we loaded.
    try{
      const r=await fetch(API+'?key='+KEY);
      const j=await r.json();
      if(j&&j.value){
        const cur=typeof j.value==='string'?JSON.parse(j.value):j.value;
        const curStamp=cur.savedAt||null;
        if(curStamp!==remoteStamp&&cur.savedBy!==SESSION_ID){
          const overwrite=confirm('Someone else has updated this tracker since you opened it.\n\nOK = overwrite with your version\nCancel = keep theirs (then reload the page to see their changes)');
          if(!overwrite){showToast('Not saved. Reload the page to see the latest changes');return;}
        }
      }
    }catch(e){/* conflict check unavailable; fall through and save */}
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,value:JSON.stringify(payload)})});
    remoteStamp=payload.savedAt;
    showAutosaved();
  }catch(e){showToast('Save failed');}
}
async function loadInitial(){
  try{
    const r=await fetch(API+'?key='+KEY);
    const j=await r.json();
    if(j&&j.value){
      const d=typeof j.value==='string'?JSON.parse(j.value):j.value;
      remoteStamp=d.savedAt||null;
      if(d.buildV!==undefined&&d.buildV!==BUILD_V){showToast('Plan updated since last save, showing the new plan');return;}
      if(d.taskData){
        P.forEach(ph=>{
          if(d.taskData[ph.id]){
            if(d.taskData[ph.id].sabel&&d.taskData[ph.id].sabel.length) T[ph.id].sabel=d.taskData[ph.id].sabel;
            if(d.taskData[ph.id].client&&d.taskData[ph.id].client.length) T[ph.id].client=d.taskData[ph.id].client;
          }
        });
      }
      if(d.statuses) Object.entries(d.statuses).forEach(([k,v])=>{
        const parts=k.split('-');
        const idx=parseInt(parts[parts.length-1]);
        const gs=parts[parts.length-2];
        const phId=parts.slice(0,parts.length-2).join('-');
        const gf=gs==='c'?'client':'sabel';
        if(T[phId]&&T[phId][gf]&&T[phId][gf][idx]) T[phId][gf][idx].s=v;
      });
      if(d.notes) cardNotes=d.notes;
      if(d.links) cardLinks=d.links;
      if(d.origStatus) origStatus=d.origStatus;
      if(d.goLive!==undefined) goLiveDate=d.goLive;
      if(d.weekStarts) weekStarts={...WEEK_STARTS_DEFAULT,...d.weekStarts};
      if(d.groupBy) groupBy=d.groupBy;
      if(typeof d.hideDone==='boolean') hideDone=d.hideDone;           // older saves: default off
      if(d.runwayOnDash) runwayOnDash=d.runwayOnDash;                  // older saves: default auto
      if(d.panels) panelOpen={runway:!!d.panels.runway,call:!!d.panels.call}; // older saves: default collapsed
      // A view link in the URL wins over the remembered view.
      applyHash();
      render();
    }
  }catch(e){showToast('Could not load saved progress');}
}

// ── Stats ─────────────────────────────────────────────────────────────────────
// Parked (out of scope) tasks are excluded from every stat, view, count and
// export by default; they live only in the Out of scope view.
function inScope(pid,g){return (T[pid]&&T[pid][g]||[]).filter(t=>!t.parked);}
function hiddenByDone(t){return hideDone&&t.s==='Complete';}
function hiddenDoneCount(){let n=0;P.forEach(p=>['sabel','client'].forEach(g=>inScope(p.id,g).forEach(t=>{if(t.s==='Complete')n++;})));return n;}
function parkedCount(){let n=0;P.forEach(p=>['sabel','client'].forEach(g=>(T[p.id][g]||[]).forEach(t=>{if(t.parked)n++;})));return n;}
function globalStats(){
  let total=0,complete=0,usedH=0,on=0,att=0,risk=0;
  P.forEach(ph=>{
    const tasks=[...inScope(ph.id,'sabel'),...inScope(ph.id,'client')];
    const done=tasks.filter(t=>t.s==='Complete').length;
    const inprog=tasks.filter(t=>t.s==='In Progress').length;
    total+=tasks.length;complete+=done;
    if(tasks.length>0)usedH+=((done+inprog*.5)/tasks.length)*ph.h;
    tasks.forEach(t=>{
      if(['Complete','In Progress'].includes(t.s))on++;
      else if(t.s==='Blocked')risk++;
      else att++;
    });
  });
  return{total,complete,usedH:Math.round(usedH),on,att,risk};
}
function phaseStats(id){
  const ph=P.find(p=>p.id===id);
  const tasks=[...inScope(id,'sabel'),...inScope(id,'client')];
  let on=0,att=0,risk=0,done=0,inprog=0;
  tasks.forEach(t=>{
    if(t.s==='Complete'){on++;done++;}
    else if(t.s==='In Progress'){on++;inprog++;}
    else if(t.s==='Blocked')risk++;
    else att++;
  });
  const consumed=tasks.length>0?Math.round(((done+inprog*.5)/tasks.length)*ph.h):0;
  return{on,att,risk,consumed,done,total:tasks.length};
}
function phaseMini(id){
  const tasks=[...inScope(id,'sabel'),...inScope(id,'client')];
  return{done:tasks.filter(t=>t.s==='Complete').length,total:tasks.length};
}
// ── Week grouping + scheduling helpers ────────────────────────────────────────
const WEEK1_START='2026-08-24';  // [CLIENT] Monday of Week 1; the week-grid anchor. Task dates derive from this.
const WEEK_STARTS_DEFAULT={};    // [CLIENT] Optional per-week start date overrides, e.g. {3:'2026-06-01'} if Week 3 starts late (holiday, client delay). Weeks not listed derive from WEEK1_START.
let weekStarts={...WEEK_STARTS_DEFAULT}; // Live overrides; editable in the tracker (pencil on a week view) and persisted with saved state.
let editingWeekStart=false;
function weekStartDate(n){
  if(weekStarts[n]){const d=new Date(weekStarts[n]+'T00:00:00');if(!isNaN(d.getTime()))return d;}
  const d=new Date(WEEK1_START+'T00:00:00');d.setDate(d.getDate()+(n-1)*7);return d;
}
function setWeekStart(n,val){
  editingWeekStart=false;
  if(!val){renderMain();return;}
  const nd=new Date(val+'T00:00:00'); if(isNaN(nd.getTime())){renderMain();return;}
  const old=weekStartDate(n);
  const delta=Math.round((nd-old)/86400000);
  if(delta===0){renderMain();return;}
  const mx=maxWeek()+8, upd={};
  for(let i=n;i<=mx;i++){const d=new Date(weekStartDate(i).getTime());d.setDate(d.getDate()+delta);upd[i]=isoDate(d);}
  Object.assign(weekStarts,upd);
  // Go-live is a commitment date: it stays fixed when weeks shift. The buffer
  // between the plan and go-live absorbs slippage; the go-live card warns when
  // the build runs too close to (or past) the go-live date.
  const dd=Math.abs(delta);
  showToast('Week '+n+' moved '+dd+' day'+(dd>1?'s':'')+(delta>0?' later':' earlier')+' · later weeks shifted with it (go-live unchanged)');
  render(); scheduleAutoSave();
}
function resetWeekStart(n){
  const mx=maxWeek()+8;
  for(let i=n;i<=mx;i++) delete weekStarts[i];
  editingWeekStart=false;
  showToast('Week '+n+' onwards back to the default schedule');
  render(); scheduleAutoSave();
}
function openPicker(e,el){
  // Open the native date calendar from a direct user click on the input.
  // Called inside a real click gesture on a stable DOM, so the popup stays open.
  e.stopPropagation();
  try{el.showPicker();}catch(err){/* older browsers: field is still typeable */}
}
function toggleWeekStartEdit(e){
  if(e)e.stopPropagation();
  editingWeekStart=!editingWeekStart;
  renderMain();
  // Focus only; the picker opens on a direct click of the input (see openPicker).
  // Auto-calling showPicker() during a re-render makes the popup close instantly.
  if(editingWeekStart)setTimeout(()=>{const el=document.getElementById('wk-start-input');if(el)el.focus();},0);
}
function isoDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function weekRangeLabel(n){if(!n||n<1)return 'Unscheduled';const s=weekStartDate(n),e=new Date(s);e.setDate(e.getDate()+6);const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});return f(s)+' – '+f(e);}
function isOverdue(t){
  // A task is overdue when it is not Complete and its scheduled period has
  // already ended. For a span (ongoing) task that means its END week: being
  // still in progress mid-span is planned, not overdue. Unscheduled tasks
  // (week 0/missing) are never overdue.
  if(!t||t.s==='Complete'||!t.week||t.week<1)return false;
  const e=new Date(weekStartDate(endWeek(t)).getTime()); e.setDate(e.getDate()+6);
  const now=new Date(); now.setHours(0,0,0,0);
  return e<now;
}
function weekLabel(n){return (n&&n>=1)?'Week '+n:'Unscheduled';}
// ── Week ranges (ongoing tasks) and milestones ───────────────────────────────
// A task may span several weeks: `week` is the start, optional `wkEnd` the end.
// Single-week tasks have no wkEnd. `kind:'milestone'` marks checkpoint tasks
// (sign-offs, approvals); level-of-effort work uses a span instead.
function endWeek(t){return (t&&t.wkEnd&&t.week&&t.wkEnd>t.week)?t.wkEnd:((t&&t.week)||0);}
function isSpan(t){return !!(t&&t.week&&t.wkEnd&&t.wkEnd>t.week);}
function spanWeeksText(t){return isSpan(t)?('Wks '+t.week+'–'+t.wkEnd):weekLabel(t.week||0);}
function taskDatesText(t){
  if(!t.week||t.week<1)return t.d||'';
  if(!isSpan(t))return weekRangeLabel(t.week);
  const s=weekStartDate(t.week),e=new Date(weekStartDate(t.wkEnd));e.setDate(e.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return 'Wks '+t.week+'–'+t.wkEnd+' · '+f(s)+' – '+f(e);
}
function maxWeek(){let mx=0;P.forEach(ph=>['sabel','client'].forEach(g=>inScope(ph.id,g).forEach(t=>{const e=endWeek(t);if(e>mx)mx=e;})));return Math.max(mx,8);}
function weekOptions(sel){let o='';const mx=maxWeek();for(let n=1;n<=mx;n++){o+=`<option value="${n}"${sel===n?' selected':''}>Week ${n} · ${weekRangeLabel(n)}</option>`;}return o;}
function weekEndOptions(t){
  let o=`<option value="0"${!isSpan(t)?' selected':''}>Single week</option>`;
  const mx=Math.max(maxWeek(),endWeek(t));
  for(let n=(t.week||0)+1;n<=mx;n++){o+=`<option value="${n}"${t.wkEnd===n?' selected':''}>to Week ${n} · ends ${weekRangeLabel(n).split('–')[1].trim()}</option>`;}
  return o;
}
function effWeek(t){return weekLabel(t.week||0);}
function weekList(){
  const seen=new Set();
  P.forEach(ph=>['sabel','client'].forEach(g=>inScope(ph.id,g).forEach(t=>{
    if(!t.week||t.week<1){seen.add(effWeek(t));return;}
    for(let w=t.week;w<=endWeek(t);w++)seen.add(weekLabel(w));
  })));
  const arr=[...seen];
  const num=w=>{const m=/(\d+)/.exec(w);return m?parseInt(m[1]):9999;};
  arr.sort((a,b)=>{if(a==='Unscheduled')return 1;if(b==='Unscheduled')return -1;return num(a)-num(b)||a.localeCompare(b);});
  return arr;
}
function weekGroups(wk){
  const out={sabel:[],client:[]};
  P.forEach(ph=>['sabel','client'].forEach(g=>{
    T[ph.id][g].forEach((t,i)=>{
      if(t.parked)return; // out of scope tasks never appear in week views
      // Span-aware: a task belongs to every week it covers, so ongoing work
      // shows as active in each week view across its range.
      const m=/(\d+)/.exec(wk), wn=m?parseInt(m[1],10):0;
      const hit=wn?(t.week>=1&&t.week<=wn&&endWeek(t)>=wn):(effWeek(t)===wk);
      if(hit) out[g].push({t,cid:ph.id+'-'+(g==='sabel'?'s':'c')+'-'+i,c:ph.c,l:ph.l});
    });
  }));
  return out;
}
function weekMini(wk){const g=weekGroups(wk);const a=[...g.sabel,...g.client];return{done:a.filter(o=>o.t.s==='Complete').length,total:a.length};}
function weekStats(wk){
  const g=weekGroups(wk);const a=[...g.sabel,...g.client];let on=0,att=0,risk=0,done=0;
  a.forEach(o=>{const s=o.t.s;if(s==='Complete'){on++;done++;}else if(s==='In Progress')on++;else if(s==='Blocked')risk++;else att++;});
  return{on,att,risk,done,total:a.length,client:g.client,sabel:g.sabel};
}
function currentWeek(){
  const now=new Date(); now.setHours(0,0,0,0);
  const mx=maxWeek()+8; let cur=0;
  for(let n=1;n<=mx;n++){ if(weekStartDate(n)<=now) cur=n; }
  return cur; // 0 = today is before Week 1 starts (project not yet begun)
}
function focusWeek(){
  // The week the This week panel shows. now:true only when that week genuinely
  // contains today; before the project starts (currentWeek 0) the first week
  // with tasks is shown as "Coming up" instead of masquerading as this week.
  const cw=currentWeek(), mx=maxWeek();
  const has=n=>{const g=weekGroups('Week '+n);return (g.sabel.length+g.client.length)>0;};
  if(cw>=1&&has(cw))return{n:cw,now:true};
  for(let n=Math.max(cw,0)+1;n<=mx+8;n++){ if(has(n))return{n,now:false}; }
  return{n:cw<1?1:cw,now:cw>=1};
}
// ── Go-live runway (overview) ─────────────────────────────────────────────────
// The runway shows every go-live blocker as an obstacle between today and the
// go-live date. Blockers are tasks flagged gate:true (anything that makes
// landing unsafe if not done) plus every task in the go-live pillar, which are
// runway items by definition. Cleared obstacles fade into the tarmac; open ones
// stand on it at their scheduled position. Hidden until a go-live date is set.
let runwayOpen=false; // checklist collapsed by default; the strip is always visible
function toggleRunway(){runwayOpen=!runwayOpen;renderMain();}
function gateItems(){
  // Two kinds of runway item: PRE-FLIGHT blockers (gate:true, must be cleared
  // before the day) and ON-THE-DAY cutover actions (gate:'day', or any task in
  // the go-live pillar: channel switches, DNS cutover, phones). Day-of items
  // cluster at the rocket and are never "late" for sitting in go-live week.
  const out=[];
  P.forEach(p=>['sabel','client'].forEach(g=>(T[p.id]&&T[p.id][g]||[]).forEach((t,i)=>{
    if(t.parked)return;
    if(t.gate||p.id==='golive') out.push({t,p,cid:p.id+'-'+(g==='sabel'?'s':'c')+'-'+i,day:(p.id==='golive'||t.gate==='day')});
  })));
  // Pre-flight items order by schedule; day-of items order as a RUN SHEET by
  // their time offset relative to go-live (dayOff minutes, negative = before,
  // e.g. delta migration at T-2h). Untimed day items sink to the end.
  const key=o=>o.day?(100000+(o.t.dayOff!==undefined?o.t.dayOff:9999)):(endWeek(o.t)||99);
  out.sort((a,b)=>key(a)-key(b));
  return out;
}
function fmtOff(m){
  if(m===undefined||m===null)return 'Time TBC';
  if(m===0)return 'At go-live';
  const a=Math.abs(m), txt=a>=60?(a/60)+'h':a+'m';
  return (m<0?'T−':'T+')+txt;
}
function setTaskWhen(cid,val){
  const t=resolveTask(cid);if(!t)return;
  const n=parseInt(val,10);
  if(isNaN(n))delete t.dayOff; else t.dayOff=n;
  renderMain(); scheduleAutoSave();
}
function gateState(o){
  if(o.t.s==='Complete')return 'cleared';
  if(o.day)return isOverdue(o.t)?'risk':'day';
  if(!goLiveDate)return 'approach';
  const gl=new Date(goLiveDate+'T00:00:00');
  let e=null;
  if(o.t.week&&o.t.week>=1){e=new Date(weekStartDate(endWeek(o.t)).getTime());e.setDate(e.getDate()+6);}
  if(isOverdue(o.t)||(e&&!isNaN(gl.getTime())&&e>gl))return 'risk';
  return 'approach';
}

function gotoTask(cid){
  // Navigate to the task's pillar (or the Out of scope view for parked tasks),
  // scroll it into view and flash-highlight it.
  closeRunwayPop();
  const t=resolveTask(cid);
  if(t&&t.parked){setP('parked');}
  else{
    const parts=cid.split('-');
    const phId=parts.slice(0,-2).join('-');
    setGroupBy('pillar');setP(phId);
  }
  setTimeout(()=>{
    const el=document.getElementById('card-'+cid);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('card-flash');
      setTimeout(()=>el.classList.remove('card-flash'),2400);
    }
  },80);
}

function actionRows(side){
  const rows=[];
  P.forEach((p,pi)=>['client','sabel'].forEach(g=>{
    if(side==='client'&&g!=='client')return;
    if(side==='sabel'&&g!=='sabel')return;
    inScope(p.id,g).forEach(t=>{ // parked tasks are excluded from exports by default
      const ew=endWeek(t);
      let due='';
      if(ew&&ew>=1){const d=new Date(weekStartDate(ew));d.setDate(d.getDate()+4);due=isoDate(d);}
      let urg='Upcoming';
      if(t.s==='Complete')urg='Done';
      else if(isOverdue(t))urg='Overdue';
      else if(t.gate==='day'||p.id==='golive')urg='Go-live day';
      else if(ew&&ew===currentWeek())urg='Due this week';
      const flags=[t.kind==='milestone'?'Milestone':'',t.gate===true?'Blocker':'',t.gate==='day'?'On the day':'',t.call?('Call '+t.call):''].filter(Boolean).join('; ');
      rows.push({pi,cells:[t.t,p.l,g==='client'?'Client':'Sabel',t.o,t.week?spanWeeksText(t):'Unscheduled',due,urg,t.s,flags],due});
    });
  }));
  rows.sort((a,b)=>((a.due||'9999')).localeCompare(b.due||'9999')||a.pi-b.pi);
  return rows;
}
function actionMatrix(side){
  const clean=v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ');
  return [['Task','Pillar','Action for','Owner','Week(s)','Due date','Urgency','Status','Flags']]
    .concat(actionRows(side).map(r=>r.cells.map(clean)));
}

// ── Key milestones chart (overview) ───────────────────────────────────────────
// The milestones are the PILLARS: each pillar is one entry, Complete only when
// every task in it is Complete. If a pillar has milestone-flagged tasks (kind:
// 'milestone'), those named gates represent it instead, so trackers upgrade
// automatically once the task library carries MILESTONE lines. The go-live and
// post go-live pillars are excluded; the fixed Go-live · Cutover row covers launch.
function pillarComplete(pid){const m=phaseMini(pid);return m.total>0&&m.done===m.total;}
function weekDueDate(n){if(!n||n<1)return '';const d=new Date(weekStartDate(n));d.setDate(d.getDate()+4);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function pillarWeekSpan(pid){
  let fw=0,lw=0;
  ['sabel','client'].forEach(g=>inScope(pid,g).forEach(t=>{
    if(!t.week||t.week<1)return;
    if(!fw||t.week<fw)fw=t.week;
    const e=endWeek(t); if(e>lw)lw=e;
  }));
  return{fw,lw};
}
function milestoneEntries(){
  const out=[];
  P.forEach(p=>{
    if(p.id==='golive'||p.id==='post')return;
    const flagged=[];
    ['sabel','client'].forEach(g=>inScope(p.id,g).forEach(t=>{if(t.kind==='milestone')flagged.push(t);}));
    if(flagged.length){
      flagged.forEach(t=>out.push({type:'task',t,p,due:endWeek(t)}));
    }else{
      out.push({type:'pillar',p,due:pillarWeekSpan(p.id).lw});
    }
  });
  out.sort((a,b)=>(a.due||99)-(b.due||99));
  return out;
}
function milestoneState(e){
  const cw=currentWeek(),m=phaseMini(e.p.id);
  if(pillarComplete(e.p.id))return{label:'Achieved',clr:'#4ADE80'};
  if(e.type==='task'&&e.t.s==='Complete')return{label:'Signed off · pillar work ongoing',clr:'#60A5FA'};
  if(e.due&&cw>e.due)return{label:'Overdue · was due Week '+e.due,clr:'#F87171'};
  if(e.due&&cw===e.due)return{label:'Due now · Week '+e.due,clr:'#C084FC'};
  const fw=e.type==='pillar'?pillarWeekSpan(e.p.id).fw:0;
  if(e.type==='pillar'&&fw&&cw>=fw&&m.done>0)return{label:'In progress · '+m.done+'/'+m.total+' done',clr:'#60A5FA'};
  return{label:'Upcoming'+(e.due?' · Week '+e.due:''),clr:'#475569'};
}

// ── Duplicate guard on add ────────────────────────────────────────────────────
// Both add flows (blank task and the Call actions quick-add) live-search every
// existing task while the title is typed: all pillars, both columns, parked
// included, case-insensitive. Close matches show as "May already exist:" rows
// with an Open button that jumps to and flashes the existing card. The guard
// warns, it never blocks: creating anyway is always allowed.
function dupWords(s){return String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=3);}
function dupMatches(title,excludeCid){
  const tw=dupWords(title); if(!tw.length)return [];
  const out=[];
  P.forEach(p=>['client','sabel'].forEach(g=>(T[p.id]&&T[p.id][g]||[]).forEach((t,i)=>{
    const cid=p.id+'-'+(g==='sabel'?'s':'c')+'-'+i;
    if(cid===excludeCid)return;
    const tl=(t.t||'').toLowerCase();
    const twords=dupWords(tl);
    const all=tw.every(w=>tl.includes(w));                       // every typed word appears
    const overlap=tw.filter(w=>twords.includes(w)).length/tw.length; // or >=60% word overlap
    if(all||overlap>=0.6) out.push({t,p,g,cid});
  })));
  return out.slice(0,3);
}
function dupHintHTML(matches){
  if(!matches.length)return '';
  return`<div style="margin-top:6px;border:1px solid rgba(251,191,36,.35);background:#0F1117;border-radius:6px;padding:6px 9px;width:100%">

}

// ── Sub-tasks (parent task checklist) ─────────────────────────────────────────
function subCounts(t){

}
function toggleSub(e,cid,i){

  const st=t.sub[i];
  if(st.s==='Complete'){
    st.s='Pending';

    if(t.s==='Complete'){t.s='In Progress';delete origStatus[cid];delete t.doneAt;}
  }else{
    st.s='Complete';
    // Ticking the last open sub-task completes the parent.
    if(t.sub.every(x=>x.s==='Complete')&&t.s!=='Complete'){origStatus[cid]=t.s;t.s='Complete';t.doneAt=isoDate(new Date());}
  }
  render(); scheduleAutoSave();

  renderMain(); scheduleAutoSave();

// ── Parent / sub-task restructuring ───────────────────────────────────────────
// A parent task is the SOW-level deliverable (e.g. "Inbox, Teams and Routing");
// its steps live in `sub`. Tasks can be nested under a parent or split back out
// so the board shows deliverables, not a flat list of every step.
function syncParentFromSubs(t){
  // Keep a parent's status honest: complete when every step is ticked, reopened
  // as soon as one is not. Mirrors the same rule used by toggleSub.
  if(!t||!t.sub||!t.sub.length)return;
  const all=t.sub.every(x=>x.s==='Complete');
  if(all&&t.s!=='Complete'){t.s='Complete';t.doneAt=isoDate(new Date());}
  else if(!all&&t.s==='Complete'){t.s='In Progress';delete t.doneAt;}
}
function cidParts(cid){
  const p=cid.split('-');
  const gs=p[p.length-2];
  return {idx:parseInt(p[p.length-1],10),gs,grp:gs==='c'?'client':'sabel',phId:p.slice(0,-2).join('-')};
}
function parentCandidates(cid){
  // Other tasks in the same pillar and column that this task could nest under.
  const {idx,grp,phId}=cidParts(cid);
  const gs=grp==='sabel'?'s':'c';
  return (T[phId]&&T[phId][grp]||[]).map((x,i)=>({t:x,cid:phId+'-'+gs+'-'+i,i}))
    .filter(o=>o.i!==idx&&!o.t.parked);
}
function demoteToSub(cid,parentCid){
  // Nest a standalone task inside a parent as one of its steps.
  if(!parentCid){renderMain();return;}
  const t=resolveTask(cid), pt=resolveTask(parentCid);
  if(!t||!pt||cid===parentCid){renderMain();return;}
  if(t.sub&&t.sub.length){showToast('This task has its own steps. Split those out first.');renderMain();return;}
  const {idx,grp,phId}=cidParts(cid);
  // Nothing is silently dropped: any note or link folds into the parent's notes.
  const nt=String(cardNotes[cid]!==undefined?cardNotes[cid]:(t.notes||'')).trim();
  const lk=String(cardLinks[cid]!==undefined?cardLinks[cid]:(t.link||'')).trim();
  const carried=[nt,lk].filter(Boolean).join(' · ');
  const title=t.t;
  (pt.sub=pt.sub||[]).push({t:title,s:t.s==='Complete'?'Complete':'Pending'});
  remapCids(phId,grp,idx);
  T[phId][grp].splice(idx,1);
  // The parent's own index may have shifted; find it again by identity.
  const pp=cidParts(parentCid);
  const nIdx=(T[pp.phId]&&T[pp.phId][pp.grp]||[]).indexOf(pt);
  const npCid=nIdx>=0?(pp.phId+'-'+pp.gs+'-'+nIdx):null;
  if(npCid){
    if(carried){
      const cur=String(cardNotes[npCid]!==undefined?cardNotes[npCid]:(pt.notes||''));
      cardNotes[npCid]=(cur?cur+'\n':'')+'From "'+title+'": '+carried;
    }

// ── Drag and drop ─────────────────────────────────────────────────────────────
function remapCids(phId,grp,removedIdx){
  const gs=grp==='sabel'?'s':'c';
  const len=T[phId][grp].length+1;
  for(let i=removedIdx+1;i<len;i++){
    const o=phId+'-'+gs+'-'+i,n=phId+'-'+gs+'-'+(i-1);
    if(cardNotes[o]!==undefined){cardNotes[n]=cardNotes[o];delete cardNotes[o];}
    if(cardLinks[o]!==undefined){cardLinks[n]=cardLinks[o];delete cardLinks[o];}
    if(origStatus[o]!==undefined){origStatus[n]=origStatus[o];delete origStatus[o];}
    if(expandedCards.has(o)){expandedCards.delete(o);expandedCards.add(n);}
    if(dupGuardCids.has(o)){dupGuardCids.delete(o);dupGuardCids.add(n);}
  }
  const rc=phId+'-'+gs+'-'+removedIdx;
  delete cardNotes[rc];delete cardLinks[rc];delete origStatus[rc];expandedCards.delete(rc);dupGuardCids.delete(rc);
}
function clearDropHighlight(){
  if(dragOverCol){const el=document.getElementById(dragOverCol);if(el)el.classList.remove('col-drop');dragOverCol=null;}
}
function onDragStart(e,phId,grp,idx){
  // Ignore drags that begin on an interactive control (owner/status picker,
  // checkbox, link, input) so a click on those controls is never swallowed by
  // the drag-to-reassign gesture. This keeps the owner dropdown reliably clickable.
  if(e.target.closest('button,input,textarea,a,select')){e.preventDefault();return;}
  dragInfo={phId,grp,idx};
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const card=e.currentTarget;if(card)card.classList.add('card-dragging');},0);
}
function onDragEnd(e){
  e.currentTarget.classList.remove('card-dragging');
  clearDropHighlight();
}
function onDragOver(e,colId){
  e.preventDefault();
  if(dragOverCol!==colId){clearDropHighlight();dragOverCol=colId;const el=document.getElementById(colId);if(el)el.classList.add('col-drop');}
}
function onDragLeave(e,colId){
  if(!e.currentTarget.contains(e.relatedTarget)){const el=document.getElementById(colId);if(el)el.classList.remove('col-drop');if(dragOverCol===colId)dragOverCol=null;}
}
function onDrop(e,tPhId,tGrp){
  e.preventDefault();
  clearDropHighlight();
  if(!dragInfo)return;
  const{phId:sPhId,grp:sGrp,idx:sIdx}=dragInfo;dragInfo=null;
  if(sPhId===tPhId&&sGrp===tGrp)return;
  const sCid=sPhId+'-'+(sGrp==='sabel'?'s':'c')+'-'+sIdx;
  const keepNotes=cardNotes[sCid],keepLink=cardLinks[sCid],keepOrig=origStatus[sCid],wasOpen=expandedCards.has(sCid);
  const task={...T[sPhId][sGrp][sIdx]};
  if(tGrp==='client'){task.o=CLIENT_LABEL;if(!task.tip)task.tip='';}
  else{if(!SABEL_TEAM.includes(task.o))task.o='Chris';delete task.tip;}
  remapCids(sPhId,sGrp,sIdx);
  T[sPhId][sGrp].splice(sIdx,1);
  T[tPhId][tGrp].push(task);
  const tCid=tPhId+'-'+(tGrp==='sabel'?'s':'c')+'-'+(T[tPhId][tGrp].length-1);
  if(keepNotes!==undefined)cardNotes[tCid]=keepNotes;
  if(keepLink!==undefined)cardLinks[tCid]=keepLink;
  if(keepOrig!==undefined)origStatus[tCid]=keepOrig;
  if(wasOpen)expandedCards.add(tCid);
  render();
  scheduleAutoSave();
}

function moveTaskToPillar(cid,pid){
  // Move a task to another pillar, keeping its group (client/Sabel), status,

  const parts=cid.split('-');

  const gs=parts[parts.length-2];
  const grp=gs==='s'?'sabel':'client';
  const phId=parts.slice(0,-2).join('-');
  if(!pid||pid===phId||!T[pid]||!T[phId]||!T[phId][grp][idx]){renderMain();return;}
  const keepNotes=cardNotes[cid],keepLink=cardLinks[cid],keepOrig=origStatus[cid],wasOpen=expandedCards.has(cid);
  const task={...T[phId][grp][idx]};

  T[phId][grp].splice(idx,1);

  if(keepNotes!==undefined)cardNotes[tCid]=keepNotes;

// ── Expanded card detail (shared) ─────────────────────────────────────────────
// The full editable detail body (chips, title, schedule, pillar, sub-tasks,
// notes, link, footer actions). Used inside board cards and reused by the
// completed-tasks strip rows, so both expand through the same
// tog()/expandedCards mechanism without duplicated markup.
function cardExpand(t,cid,isClient){
  const _p=cid.split('-');

          isSpan(t)&&!done?`<span title="Level-of-effort work running across Weeks ${t.week}–${t.wkEnd}" style="font-size:10px;font-weight:600;color:#38BDF8;background:rgba(56,189,248,.12);padding:1px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-arrows-horizontal" style="font-size:10px"></i>Ongoing</span>`:'',
          t.kind==='milestone'&&!done?`<span title="Checkpoint task: a sign-off or approval" style="font-size:10px;font-weight:600;color:#C084FC;background:rgba(192,132,252,.12);padding:1px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-diamonds" style="font-size:10px"></i>Milestone</span>`:'',
          t.gate&&t.gate!=='day'&&!done?`<span title="Must be cleared before go-live (shows on the runway)" style="font-size:10px;font-weight:600;color:#FB923C;background:rgba(251,146,60,.12);padding:1px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-flag" style="font-size:10px"></i>Blocker</span>`:'',
          t.gate==='day'&&!done?`<span title="Cutover action: happens on go-live day (channel switch, DNS, phones)" style="font-size:10px;font-weight:600;color:#E10600;background:rgba(225,6,0,.12);padding:1px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-rocket" style="font-size:10px"></i>On the day</span>`:'',
          t.call&&!done?`<span title="Action from the call on ${fmtCallDate(t.call)}" style="font-size:10px;font-weight:600;color:#2DD4BF;background:rgba(45,212,191,.12);padding:1px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-phone" style="font-size:10px"></i>Call · ${fmtCallDate(t.call)}</span>`:'',
          late?`<span style="font-size:10px;font-weight:600;color:#F87171;background:rgba(248,113,113,.12);padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em">Overdue</span>`:'',
          hasNote&&!done?`<span style="font-size:10px;color:#475569;background:#1E2433;padding:1px 5px;border-radius:3px">note</span>`:'',

        ].filter(Boolean))}
        <div style="margin-bottom:10px">
          <label>${(t.sub||[]).length?'Steps in this task':'Sub-tasks'}</label>
          ${(t.sub||[]).length?`<div class="sub-rail">${(t.sub||[]).map((st,i)=>{const sd=st.s==='Complete';return`<div style="display:flex;align-items:center;gap:7px;padding:3px 0">
            <button class="chk-btn" onclick="toggleSub(event,'${cid}',${i})" title="${sd?'Mark step incomplete':'Mark step complete'}" style="padding-top:0;align-items:center">

            </button>

            <button onclick="removeSub(event,'${cid}',${i})" title="Remove step" style="background:none;border:none;color:#475569;cursor:pointer;padding:2px;display:flex;flex-shrink:0"><i class="ti ti-x" style="font-size:12px"></i></button>
          </div>`;}).join('')}</div>`:'<div style="font-size:11px;color:#475569;padding:2px 0 4px">No steps yet. Add one below to turn this into a parent task.</div>'}
          <div style="display:flex;gap:6px;margin-top:6px" onclick="event.stopPropagation()">
            <input id="sub-add-${cid}" type="text" placeholder="${(t.sub||[]).length?'Add another step...':'Add a step (makes this a parent task)...'}" onkeydown="if(event.key==='Enter')addSub('${cid}')" style="flex:1">
            <button onclick="addSub('${cid}')" style="background:transparent;border:1px solid #2A3145;color:#94A3B8;font-size:11px;font-family:inherit;border-radius:6px;padding:4px 12px;cursor:pointer;flex-shrink:0">Add step</button>
          </div>
        </div>
        ${(nt=>nt?`<div style="margin-bottom:10px"><label>Notes</label><div style="font-size:12px;color:#94A3B8;line-height:1.5;white-space:pre-wrap">${esc(nt)}</div></div>`:'')(curNotes)}
        ${hasLink?`<div style="margin-bottom:10px"><label>${linkLabel}</label>${linkEl}</div>`:''}
        <div style="display:flex;justify-content:flex-end;margin-bottom:${editCards.has(cid)?'10':'0'}px">
          <button onclick="toggleEdit(event,'${cid}')" title="Show the full set of task fields" style="background:transparent;border:1px solid #2A3145;color:${editCards.has(cid)?'#E2E8F0':'#94A3B8'};font-size:11px;font-family:inherit;border-radius:6px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px">
            <i class="ti ti-${editCards.has(cid)?'x':'pencil'}" style="font-size:12px"></i>${editCards.has(cid)?'Done editing':'Edit task'}
          </button>
        </div>
        ${editCards.has(cid)?`
        <div style="border-top:1px solid #1E2433;padding-top:12px">
        <div style="margin-bottom:10px">
          <label>Task title</label>
          <input id="ttl-${cid}" type="text" value="${safeTitle}" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box" placeholder="Task title..." onclick="event.stopPropagation()"${dupGuardCids.has(cid)?` oninput="dupCheck('${cid}',this.value)"`:''} onchange="saveTitle('${cid}',this.value)">
          ${dupGuardCids.has(cid)?`<div id="dup-${cid}" onclick="event.stopPropagation()"></div>`:''}
        </div>
        <div style="margin-bottom:10px">
          <label>Schedule</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <select onclick="event.stopPropagation()" onchange="setTaskWeek('${cid}',this.value)" style="flex:1;min-width:130px;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit">
              <option value="0"${(!t.week||t.week<1)?' selected':''}>Unscheduled</option>
              ${weekOptions(t.week||0)}
            </select>
            ${t.week?`<select onclick="event.stopPropagation()" onchange="setTaskWeekEnd('${cid}',this.value)" title="Ongoing work? Set the week it runs until" style="flex:1;min-width:120px;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit">
              ${weekEndOptions(t)}

            <input type="date" value="${t.week?isoDate(weekStartDate(t.week)):''}" onclick="openPicker(event,this)" onchange="setTaskWeekByDate('${cid}',this.value)" title="Pick a date to move this task (a span keeps its length)" style="font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:5px 8px;font-family:inherit">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap">
            <span style="font-size:10px;color:#475569">${t.week?(spanWeeksText(t)+' · '+ (isSpan(t)?taskDatesText(t).split('·')[1].trim():weekRangeLabel(t.week))):'Not scheduled to a week yet'}</span>
            <span style="display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#C084FC;cursor:pointer;user-select:none">
              <input type="checkbox" ${t.kind==='milestone'?'checked':''} onchange="setTaskKind('${cid}',this.checked)" style="accent-color:#C084FC;width:12px;height:12px">
              Milestone (checkpoint / sign-off)
            </label>
            <label onclick="event.stopPropagation()" title="Blockers appear on the go-live runway. 'Before the day' must be cleared ahead of launch; 'On the day' are cutover actions (channel switches, DNS, phones) done at go-live" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#FB923C;cursor:pointer;user-select:none">
              Go-live:
              <select onchange="setTaskGate('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
                <option value=""${!t.gate?' selected':''}>Not a blocker</option>
                <option value="pre"${(t.gate===true||t.gate==='pre')?' selected':''}>Blocker · before the day</option>
                <option value="day"${t.gate==='day'?' selected':''}>Cutover · on the day</option>
              </select>
            </label>
            ${(t.gate==='day'||_ph==='golive')?`<label onclick="event.stopPropagation()" title="When on go-live day this happens, relative to the go-live moment (e.g. the delta migration runs at T−2h)" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#E10600;cursor:pointer;user-select:none">
              When:
              <select onchange="setTaskWhen('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
                <option value=""${t.dayOff===undefined?' selected':''}>Time TBC</option>
                <option value="-240"${t.dayOff===-240?' selected':''}>T−4h</option>
                <option value="-120"${t.dayOff===-120?' selected':''}>T−2h</option>
                <option value="-60"${t.dayOff===-60?' selected':''}>T−1h</option>
                <option value="-30"${t.dayOff===-30?' selected':''}>T−30m</option>
                <option value="0"${t.dayOff===0?' selected':''}>At go-live</option>
                <option value="30"${t.dayOff===30?' selected':''}>T+30m</option>
                <option value="60"${t.dayOff===60?' selected':''}>T+1h</option>
                <option value="120"${t.dayOff===120?' selected':''}>T+2h</option>
              </select>
            </label>`:''}
            <label onclick="event.stopPropagation()" title="Flag this task as an action from a weekly call; it will appear in the Call actions panel on the overview" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#2DD4BF;cursor:pointer;user-select:none">
              From call:
              <input type="date" value="${t.call||''}" onclick="openPicker(event,this)" onchange="setTaskCall('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
            </label>
            </span>
          </div>
        </div>
        <div style="margin-bottom:10px">
          <label>Pillar</label>
          <select onclick="event.stopPropagation()" onchange="moveTaskToPillar('${cid}',this.value)" title="Move this task to a different pillar (notes, links and schedule move with it)" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box">
            ${P.map(p=>`<option value="${p.id}"${p.id===_ph?' selected':''}>${p.l}</option>`).join('')}
          </select>
        </div>
        ${(t.sub&&t.sub.length)?'':(c=>c.length?`<div style="margin-bottom:10px">
          <label>Nest under a parent task</label>
          <select onclick="event.stopPropagation()" onchange="demoteToSub('${cid}',this.value)" title="Move this task inside another task as one of its steps" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box">
            <option value="">Keep as its own task</option>
            ${c.map(o=>`<option value="${o.cid}">${esc(o.t.t)}${o.t.sub&&o.t.sub.length?' ('+o.t.sub.length+' steps)':''}</option>`).join('')}
          </select>
        </div>`:'')(parentCandidates(cid))}
        <div style="margin-bottom:10px">
          <label>Notes</label>
          <textarea rows="3" placeholder="Add notes for this action..." oninput="saveNote('${cid}',this.value)">${esc(curNotes)}</textarea>
        </div>
        <div>
          <label>${linkLabel}</label>
          ${hasLink?`<input type="url" value="${esc(curLink)}" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box" placeholder="Paste a link..." onclick="event.stopPropagation()" onchange="saveLink('${cid}',this.value)">`:linkEl}
        </div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px">
          <button onclick="parkTask(event,'${cid}')" title="Agreed as out of scope for this engagement: parks the task in the Out of scope list" style="background:transparent;border:1px solid rgba(251,146,60,.3);color:#FB923C;font-size:11px;font-family:inherit;border-radius:6px;padding:4px 10px;cursor:pointer">Move to out of scope</button>
          <button onclick="deleteTask(event,'${cid}')" style="background:transparent;border:1px solid rgba(248,113,113,.3);color:#F87171;font-size:11px;font-family:inherit;border-radius:6px;padding:4px 10px;cursor:pointer">Remove task</button>
        </div>
        </div>`:''}`;
}

// ── Shared blocks ─────────────────────────────────────────────────────────────
function pillarBarsHTML(){
  return P.map(p=>{
    const m=phaseMini(p.id);
    const pPct=m.total>0?Math.round(m.done/m.total*100):0;
    return`<div style="display:flex;align-items:center;gap:8px">
      <span style="width:7px;height:7px;border-radius:50%;background:${p.c};flex-shrink:0;display:inline-block"></span>
      <span style="font-size:11px;color:#94A3B8;width:82px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.l}</span>
      <div style="flex:1;background:#1E2433;border-radius:2px;height:5px;overflow:hidden"><div style="height:100%;width:${pPct}%;background:${p.c}"></div></div>
      <span style="font-size:11px;width:26px;text-align:right;flex-shrink:0;font-weight:${pPct>0?'500':'400'};color:${pPct===100?'#4ADE80':pPct>0?p.c:'#475569'}">${pPct}%</span>
    </div>`;
  }).join('');
}
function ovTopCards(gs){
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const pctClr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  const completion=`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#475569;margin-bottom:10px">Overall completion</div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">
        <span style="font-size:36px;font-weight:700;color:${pctClr};line-height:1">${pct}%</span>
        <span style="font-size:13px;color:#475569">${gs.complete} / ${gs.total} actions</span>
      </div>
      ${gradBar(pct,10)}
      <div style="font-size:10px;font-weight:600;letter-spacing:.06em;color:#475569;text-transform:uppercase;margin:12px 0 8px">by pillar</div>
      <div style="display:flex;flex-direction:column;gap:7px">${pillarBarsHTML()}</div>
    </div>`;
  const glc=goLiveCard();
  // When there is no go-live date, the completion card spans the full width.
  return`<div class="ov-top"${glc?'':' style="grid-template-columns:1fr"'}>${completion}${glc}</div>`;
}
function phaseCompletionCard(pct,done,total){
  const clr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  // Compact card showing only THIS pillar's progress. Sits beside the filter
  // stat cards (see .phase-top) so the board is visible with less scrolling.
  return`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:center;height:100%">
    <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569;margin-bottom:8px">Phase completion</div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">
      <span style="font-size:28px;font-weight:700;color:${clr};line-height:1">${pct}%</span>
      <span style="font-size:11px;color:#475569">${done} / ${total} actions</span>
    </div>
    ${gradBar(pct,10)}
  </div>`;
}
function filterStatCards(on,att,risk,inPhase){
  const aOn=activeFilters.has('on'),aAtt=activeFilters.has('att'),aRisk=activeFilters.has('risk');
  const anyActive=aOn||aAtt||aRisk;
  const hint=inPhase?(anyActive?`<div class="filter-hint"><i class="ti ti-filter-filled" style="font-size:11px;color:#E10600"></i>Filtered view, click active card to clear</div>`:`<div class="filter-hint"><i class="ti ti-filter" style="font-size:11px"></i>Click a card to filter tasks below</div>`):'';
  return`<div class="stat-grid">
    <button class="sc f-on${aOn?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'on\')':''}">
      <div style="font-size:22px;font-weight:600;color:#4ADE80">${on}</div>
      <div style="font-size:11px;color:${aOn?'#4ADE80':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aOn?'<i class="ti ti-eye" style="font-size:11px"></i>':''}On track</div>
    </button>
    <button class="sc f-att${aAtt?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'att\')':''}">
      <div style="font-size:22px;font-weight:600;color:#FBBF24">${att}</div>
      <div style="font-size:11px;color:${aAtt?'#FBBF24':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aAtt?'<i class="ti ti-eye" style="font-size:11px"></i>':''}Needs attention</div>
    </button>
    <button class="sc f-risk${aRisk?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'risk\')':''}">
      <div style="font-size:22px;font-weight:600;color:#F87171">${risk}</div>
      <div style="font-size:11px;color:${aRisk?'#F87171':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aRisk?'<i class="ti ti-eye" style="font-size:11px"></i>':''}At risk</div>
    </button>
  </div>${hint}`;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  const gs=globalStats();
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const pctClr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  const oa=cur==='overview';
  const ovBtn=`<button class="si" style="border-left:3px solid ${oa?'#E10600':'transparent'};${oa?'background:rgba(255,255,255,.03)':''}" onclick="setP('overview')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <div><div style="font-size:12px;font-weight:500;color:${oa?'#E2E8F0':'#94A3B8'}">Dashboard</div>
      <div style="font-size:10px;color:#475569;margin-top:1px">Where the project stands</div></div>
      <span style="font-size:12px;font-weight:600;color:${pctClr}">${pct}%</span>
    </div>${gradBar(pct,3)}
  </button>`;
  const phBtns=P.map(p=>{
    const m=phaseMini(p.id);
    const act=groupBy==='pillar'&&p.id===cur;
    const dPct=m.total>0?Math.round(m.done/m.total*100):0;
    const dClr=dPct===100?'#4ADE80':dPct>0?p.c:'#475569';
    return`<button class="si" style="border-left:3px solid ${act?p.c:'transparent'};${act?'background:rgba(255,255,255,.03)':''}" onclick="setP('${p.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px">
        <div style="min-width:0;flex:1">
          <div style="font-size:12px;font-weight:${act?'500':'400'};color:${act?'#E2E8F0':'#94A3B8'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.l}</div>
          <div style="font-size:10px;color:#475569;margin-top:1px">${p.w}</div>
        </div>
        <span style="font-size:11px;font-weight:${dPct>0?'600':'400'};color:${dClr};flex-shrink:0">${dPct}%</span>
      </div>
      <div style="background:#1E2433;border-radius:2px;height:3px;overflow:hidden"><div style="height:100%;width:${dPct}%;background:${p.c}"></div></div>
    </button>`;
  }).join('');
  const weekBtns=weekList().map(w=>{
    const m=weekMini(w);
    const act=groupBy==='week'&&w===cur;
    const dPct=m.total>0?Math.round(m.done/m.total*100):0;
    const dClr=dPct===100?'#4ADE80':dPct>0?'#E10600':'#475569';
    return`<button class="si" style="border-left:3px solid ${act?'#E10600':'transparent'};${act?'background:rgba(255,255,255,.03)':''}" onclick="setP('${w}')">

// ── Dashboard overview (interactive tiles) ────────────────────────────────────
// The overview is a set of tiles that each open a detail overlay, plus the task
// board. Tiles read live task data; edits inside an overlay autosave through the
// same path as the board. The go-live runway is NOT here (own sidebar view).
let ovv=null;          // open overlay {view,arg} or null
let ovSel=P[0].id;     // pillar selected in the Pillar boards overlay chips
function ovExpand(view,arg){ovv={view,arg:arg||null};renderMain();}
function ovClose(){ovv=null;renderMain();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovv){ovv=null;renderMain();}});
function ovSelect(id){ovSel=id;renderMain();}
// "What we need from you" rows expand in place to show the client-facing detail
// (what it involves, steps, notes, link) with no edit form; the full card is one
// click away via gotoTask.
let youOpen=new Set();
function toggleYou(e,cid){
  e.stopPropagation();
  if(youOpen.has(cid))youOpen.delete(cid); else youOpen.add(cid);
  renderMain();
}
// Go-live runway on the Dashboard: auto within RUNWAY_DASH_DAYS of go-live.
function dashRunwayShow(){
  if(runwayOnDash==='off')return false;
  if(!goLiveDate||!gateItems().length)return false;
  if(runwayOnDash==='on')return true;
  const g=ovGoLive();
  return !!g&&g.d<=RUNWAY_DASH_DAYS;
}
function setRunwayOnDash(v){runwayOnDash=v;renderMain();scheduleAutoSave();}
function ovAll(){
  // Every in-scope task with its card id and pillar context.
  const out=[];
  P.forEach(ph=>['sabel','client'].forEach(g=>{
    (T[ph.id][g]||[]).forEach((t,i)=>{ if(!t.parked) out.push({t,cid:ph.id+'-'+(g==='sabel'?'s':'c')+'-'+i,pid:ph.id,pc:ph.c,pl:ph.l,side:g}); });
  }));
  return out;
}
function ovVis(list){return list.filter(o=>!hiddenByDone(o.t));}
function ovDueKey(t){return (t&&t.week&&t.week>=1)?endWeek(t):9999;}
function ovCard(o){return makeCard(o.t,o.cid,o.side==='client',{noDrag:true});}
function ovCardP(o){return makeCard(o.t,o.cid,o.side==='client',{c:o.pc,l:o.pl,noDrag:true});}
function ovGoLive(){
  if(!goLiveDate)return null;
  const gl=new Date(goLiveDate+'T00:00:00'); if(isNaN(gl.getTime()))return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=Math.ceil((gl-now)/86400000);
  return{gl,d,big:d>0?d:(d===0?'Today':'Live'),
    sub:d>0?(d===1?'day until go-live':'days until go-live'):(d===0?'go-live day':'launched'),
    long:gl.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
}
function ovBoardChip(active,label,color,onclick){
  return`<button onclick="${onclick}" style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;font-family:inherit;border-radius:9px;padding:7px 14px;cursor:pointer;transition:all .12s;${active?'color:#fff;background:#E10600;border:1px solid #E10600':'color:#CBD5E1;background:#12151E;border:1px solid #1E2433'}"><span style="width:9px;height:9px;border-radius:50%;background:${active?'#fff':color};flex-shrink:0"></span>${esc(label)}</button>`;
}

    <div onclick="ovExpand('status','att')" style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#FBBF24;text-transform:uppercase;letter-spacing:.06em">Needs attention</div>

    <div onclick="ovExpand('status','risk')" style="background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}

  </div>`;
  const w=bufferWarning();
  const glCard=gl?`<div onclick="ovExpand('golive')" style="background:#161B26;border:1px solid rgba(225,6,0,.35);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#E10600;font-weight:600;text-transform:uppercase;letter-spacing:.07em;align-self:flex-start"><i class="ti ti-rocket" style="font-size:11px"></i> Go-live</div>
      <div style="font-size:44px;font-weight:700;color:#E10600;line-height:1;margin:12px 0 4px">${gl.big}</div>

      ${w?`<div style="font-size:10px;color:${w.clr};margin-top:6px"><i class="ti ti-alert-triangle" style="font-size:11px"></i> ${w.msg}</div>`:''}</div>`
    :`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#475569;font-size:12px">No go-live date set</div>`;
  const pillarProg=`<div onclick="ovExpand('pillars')" style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;cursor:pointer;position:relative">${exp}

  const msRows=milestoneEntries().slice(0,6).map(e=>{const s=milestoneState(e);const title=e.type==='task'?esc(e.t.t):esc(e.p.l)+' complete';return`<div style="display:flex;gap:9px;align-items:flex-start"><span style="width:9px;height:9px;border-radius:50%;background:${s.clr};margin-top:2px;flex-shrink:0"></span><div style="min-width:0"><div style="font-size:11px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div style="font-size:10px;color:${s.clr}">${s.label}</div></div></div>`;}).join('');
  const msCard=`<div onclick="ovExpand('milestones')" style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;cursor:pointer;position:relative">${exp}

  const row2=`<div style="display:grid;grid-template-columns:280px 1fr 300px;gap:12px;align-items:stretch">${glCard}${pillarProg}${msCard}</div>`;
  // ── What we need from you: the hero panel. Always expanded, never collapsed

function buildBufferDays(){
  // Days between the end of the last incomplete build task and the go-live date.
  // Excludes the go-live and post go-live pillars (their tasks belong at/after
  // go-live by design). Returns null when there is nothing to measure.
  // The buffer itself is internal and never displayed while healthy; the
  // go-live card only warns when it drops below WARN_BUFFER_DAYS or negative.
  if(!goLiveDate)return null;
  const gl=new Date(goLiveDate+'T00:00:00'); if(isNaN(gl.getTime()))return null;
  let last=null;
  P.forEach(p=>{ if(p.id==='golive'||p.id==='post')return;
    ['sabel','client'].forEach(g=>inScope(p.id,g).forEach(t=>{
      if(t.s==='Complete'||!t.week||t.week<1)return;
      const e=new Date(weekStartDate(endWeek(t)).getTime()); e.setDate(e.getDate()+6);
      if(!last||e>last)last=e;
    }));
  });
  if(!last)return null;
  return Math.round((gl-last)/86400000);
}
const WARN_BUFFER_DAYS=7;
function bufferWarning(){
  // '' when healthy; otherwise {msg,clr} for the go-live card.
  const b=buildBufferDays();
  if(b===null||b>=WARN_BUFFER_DAYS)return null;
  // Qualitative only: never disclose the number of buffer days on the card.
  if(b<0)return{msg:'Build tasks are scheduled after go-live',clr:'#F87171'};
  return{msg:'Build schedule is running close to go-live',clr:'#FBBF24'};
}
function goLiveCard(){
  // Go-live countdown, styled as a card so it sits beside Overall completion
  // in the overview top row. Returns '' when no go-live date is set.
  const accentBase='#E10600';
  // Edit mode: show a date picker (also reachable when there is currently no date).
  if(editingGoLive){
    return `<div style="background:#161B26;border:1px solid ${accentBase}55;border-radius:10px;padding:16px;display:flex;flex-direction:column">
      <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:${accentBase};display:flex;align-items:center;gap:6px;margin-bottom:14px"><i class="ti ti-rocket" style="font-size:13px"></i>Go-live</div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px">
        <label style="font-size:12px;color:#94A3B8">Set the go-live date</label>
        <input type="date" id="golive-input" value="${goLiveDate||''}" onchange="setGoLive(this.value)" onclick="openPicker(event,this)" style="cursor:pointer;width:100%;font-size:13px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:8px 10px;font-family:inherit;box-sizing:border-box">
        <button onclick="cancelGoLiveEdit(event)" style="align-self:flex-start;background:transparent;border:1px solid #2A3145;color:#94A3B8;font-size:11px;font-family:inherit;border-radius:6px;padding:5px 12px;cursor:pointer">Cancel</button>
      </div>
    </div>`;
  }
  if(!goLiveDate) return '';
  const gl=new Date(goLiveDate+'T00:00:00');
  if(isNaN(gl.getTime())) return '';
  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.ceil((gl-now)/86400000);
  const dateStr=gl.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let big,sub,accent=accentBase;
  if(days>0){ big=days; sub=(days===1?'day ':'days ')+'until go-live'; }
  else if(days===0){ big='Today'; sub='go-live day'; accent='#4ADE80'; }
  else { big='Live'; sub='launched '+Math.abs(days)+' days ago'; accent='#4ADE80'; }
  const numeric=typeof big==='number';
  return `<div style="background:#161B26;border:1px solid ${accent}55;border-radius:10px;padding:16px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:${accent};display:flex;align-items:center;gap:6px"><i class="ti ti-rocket" style="font-size:13px"></i>Go-live</div>
      <button onclick="toggleGoLiveEdit(event)" title="Edit go-live date" style="background:transparent;border:none;cursor:pointer;color:#64748B;padding:2px;display:flex"><i class="ti ti-pencil" style="font-size:13px"></i></button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 0">
      <span style="font-size:${numeric?'58':'40'}px;font-weight:700;color:${accent};line-height:.95;font-variant-numeric:tabular-nums">${big}</span>
      <span style="font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;margin-top:8px">${sub}</span>
    </div>
    <div style="border-top:1px solid ${accent}33;padding-top:12px">
      <div style="font-size:13px;font-weight:600;color:#E2E8F0">${dateStr}</div>
      <div style="font-size:12px;color:#94A3B8;margin-top:4px;display:flex;align-items:flex-start;gap:5px"><i class="ti ti-flag" style="font-size:12px;color:${accent};margin-top:2px;flex-shrink:0"></i><span>${GO_LIVE_NOTE}</span></div>
      ${(w=>w?`<div style="font-size:11px;color:${w.clr};margin-top:6px;display:flex;align-items:center;gap:5px"><i class="ti ti-alert-triangle" style="font-size:12px"></i>${w.msg}</div>`:'')(bufferWarning())}
    </div>
  </div>`;
}
