/* ── go-live timeline ──────────────────────────────────────────
   Lives here rather than on Client Contracts because clustering is a delivery
   question, not a contract one. Each dot is an active project's go-live; a red
   band marks a week where two or more land together, which is the whole point
   of showing it. Colour matches the client cards: red inside a week, amber
   inside three, green beyond. */
function isoWeekKey(d){
  var t=new Date(d.getTime());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate() - ((t.getDay()+6)%7));    // back to Monday
  return isoOf(t);
}
function endOfWeek(){ return WK_END; }
function endOfMonth(){ var d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0); d.setHours(0,0,0,0); return d; }

/* Lanes, not a ribbon.
   The ribbon squeezed four months into one strip, so names overlapped and were
   unreadable, and clients whose go-live had long passed sat in the middle of it
   making everything else harder to read. Every lane here is relative to today,
   which removes the need for a "today" marker and turns the stale ones into a
   labelled pile that asks to be closed off rather than clutter. */
function renderTimeline(L){
  var box=document.getElementById('tl'); if(!box) return;
  var live=L.filter(function(c){ return c.gl && c.stage!=='Complete'; });
  if(!live.length){ box.innerHTML=''; return; }

  var wkEnd=endOfWeek().getTime(), moEnd=endOfMonth().getTime();
  var lanes=[
    {k:'past',  label:'Date has passed',  hint:'close off or move the date', color:'#F87171', list:[]},
    {k:'week',  label:'This week',        hint:'', color:'#F87171', list:[]},
    {k:'two',   label:'Next two weeks',   hint:'', color:'#FBBF24', list:[]},
    {k:'month', label:'Rest of this month', hint:'', color:'#60A5FA', list:[]},
    {k:'later', label:'Later',            hint:'', color:'#4ADE80', list:[]}
  ];
  function lane(k){ for(var i=0;i<lanes.length;i++) if(lanes[i].k===k) return lanes[i]; }

  var sameDay={};
  live.forEach(function(c){ (sameDay[c.gl]=sameDay[c.gl]||[]).push(c.name); });

  live.sort(function(a,b){ return a.gl<b.gl?-1:1; });
  live.forEach(function(c){
    var t=new Date(c.gl+'T00:00:00').getTime();
    var k = c.days<0 ? 'past' : (t<=wkEnd ? 'week' : (c.days<=14 ? 'two' : (t<=moEnd ? 'month' : 'later')));
    lane(k).list.push(c);
  });

  var pinch=0;
  Object.keys(sameDay).forEach(function(d){ if(sameDay[d].length>1) pinch++; });

  var body=lanes.filter(function(l){ return l.list.length; }).map(function(l){
    var chips=l.list.map(function(c){
      var peers=sameDay[c.gl].length;
      var bits=[];
      if(c.overdue) bits.push(c.overdue+' overdue');
      if(c.blocked) bits.push(c.blocked+' blocked');
      var tip=c.name+' \u2014 go-live '+fmtFull(c.gl)+' \u00b7 '+c.stage+' \u00b7 lead '+c.lead+
              ' \u00b7 '+c.outstanding+' open'+(bits.length?' ('+bits.join(', ')+')':'')+
              (peers>1?' \u00b7 '+peers+' clients land this same day':'');
      return '<button class="glc'+(c.atRisk?' risk':'')+'" title="'+esc(tip)+'" onclick="tlGo(\''+c.id+'\')">'+
        '<i style="background:'+c.daysColor+'"></i>'+
        '<span class="gnm">'+esc(c.name)+'</span>'+
        '<span class="gdt mono">'+esc(fmt(c.gl))+'</span>'+
        '<span class="gdy mono" style="color:'+c.daysColor+'">'+esc(c.shortDays)+'</span>'+
        (peers>1?'<span class="gpin" title="More than one client lands this day">\u25cf'+peers+'</span>':'')+
        (c.atRisk?'<span class="gpin risky" title="Landing soon and barely started">!</span>':'')+
      '</button>';
    }).join('');
    return '<div class="glane"><div class="glh" style="color:'+l.color+'">'+esc(l.label)+
      '<span class="gn">'+l.list.length+'</span>'+
      (l.hint?'<span class="ghint">'+esc(l.hint)+'</span>':'')+'</div>'+
      '<div class="glr">'+chips+'</div></div>';
  }).join('');

  var pastN=lane('past').list.length;
  box.innerHTML=
    '<div class="tlbox"><div class="tlhead">'+
      '<span class="sec-h">Go-live</span>'+
      '<span class="sub">'+live.length+' dated'+
        (pastN?' \u00b7 '+pastN+' past their date and still open':'')+
        (pinch?' \u00b7 '+pinch+' day'+(pinch===1?'':'s')+' with two or more landing together':'')+
        ' \u00b7 click a client to open it below</span>'+
      '<span class="tlkey">'+
        '<span><i style="background:#4ADE80"></i>comfortable</span>'+
        '<span><i style="background:#FBBF24"></i>tight</span>'+
        '<span><i style="background:#F87171"></i>this week or past</span>'+
      '</span>'+
    '</div>'+
    '<div class="glanes">'+body+'</div></div>';
}

/* ── timeline hover ──
   The dots used to carry a plain `title`, which meant a second's wait for a
   native tooltip, nothing at all on the ones that were overlapped, and no way to
   see a go-live date without hitting an 11px circle. This is a real tooltip on a
   real hit area, and hovering the label lights up its dot and vice versa. */
var TLP=[];
function fmtFull(iso){
  if(!iso) return 'TBC';
  var d=new Date(iso+'T00:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
}
function tlMark(i, on){
  var els=document.querySelectorAll('.tl [data-tl="'+i+'"]');
  for(var k=0;k<els.length;k++) els[k].classList.toggle('on', on);
}
function tlOver(i, ev){
  var p=TLP[i], box=document.getElementById('tltip');
  if(!p || !box) return;
  box.innerHTML=p.html; box.style.display='block';
  tlMark(i, true); box.dataset.i=i;
  tlMove(ev);
}
function tlMove(ev){
  var box=document.getElementById('tltip');
  if(!box || box.style.display!=='block') return;
  var w=box.offsetWidth, h=box.offsetHeight;
  var x=Math.max(8, Math.min(ev.clientX - w/2, window.innerWidth - w - 8));
  var y=ev.clientY - h - 14;
  if(y < 8) y = ev.clientY + 20;               // near the top, drop below the cursor
  box.style.left=x+'px'; box.style.top=y+'px';
}
function tlOut(){
  var box=document.getElementById('tltip'); if(!box) return;
  box.style.display='none';
  if(box.dataset.i) tlMark(box.dataset.i, false);
}
/* Clicking a go-live used to select the client and nothing appeared to happen,
   because the client it opened was further down the page. Take the eye there. */
function tlGo(id){
  focusClient(id);
  setTimeout(function(){
    var row=document.getElementById('row-'+id);
    if(!row) return;
    row.scrollIntoView({behavior:'smooth', block:'center'});
    row.classList.add('flash');
    setTimeout(function(){ row.classList.remove('flash'); }, 1400);
  }, 30);
}

/* The 5-minute auto-refresh must never yank a half-typed note out from under
   whoever is running the call. If a note has focus, wait for them to leave it. */
function safeRender(){ render(); }
function render(){
  var L=all();
  // Nothing to draw until the first fetch lands — the view indexes into the
  // client list, so painting it empty would throw.
  if(!L.length){
    document.getElementById('kpis').innerHTML='';
    document.getElementById('tl').innerHTML='';
    document.getElementById('view').innerHTML =
      '<div class="empty" style="padding:60px;text-align:center">'+
      (LIVE.state==='offline'
        ? 'Could not reach the trackers. Check the connection and hit &#8635; to retry.'
        : 'Reading the trackers…')+'</div>';
    return;
  }
  renderKpis(L);
  renderTimeline(L);
  document.getElementById('view').innerHTML = viewC(L);
}

/* boot */
(function(){
  var ws=weekStart(), we=WK_END;
  document.getElementById('weekLabel').textContent =
    'Mon '+ws.getDate()+' \u2013 Sun '+we.getDate()+' '+MON[we.getMonth()]+' '+we.getFullYear();
  render();                     // paint the shell straight away
  loadAll(false);               // then the trackers
  setInterval(function(){ loadAll(false); }, REFRESH_MS);
})();
</script>
