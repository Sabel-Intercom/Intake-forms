<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sabel Project Dashboard</title>
<style>
  :root{
    --bg:#0B0B0C; --surface:#0F1113; --card:#141618; --card2:#191C20; --card3:#1E2228;
    --border:#2A3547; --border2:#1A2232; --red:#E10600;
    --w:#FFFFFF; --body:#E2E8F0; --muted:#94A3B8; --mono:#64748B; --dim:#3F4756;
    --green:#4ADE80; --blue:#60A5FA; --amber:#FBBF24; --purple:#C084FC; --redText:#F87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--body);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}
  a{color:#FCA5A5;text-decoration:none;}
  a:hover{color:#fff;text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}::-webkit-scrollbar-track{background:transparent;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* header */
  .header{display:flex;align-items:center;gap:16px;padding:15px 28px;border-bottom:1px solid var(--border2);background:rgba(11,11,12,.94);position:sticky;top:0;z-index:40;min-width:1180px;backdrop-filter:blur(6px);}
  .logo-img{height:26px;width:auto;display:block;}
  .tag{font-size:8px;letter-spacing:.2em;color:var(--mono);text-transform:uppercase;}
  .header h1{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--w);text-transform:uppercase;margin-left:6px;}
  .hright{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .stamp{font-size:10px;color:var(--mono);letter-spacing:.04em;}
  .stamp b{color:var(--green);}
  .chip-week{font-size:10px;color:var(--mono);letter-spacing:.04em;border:1px solid var(--border2);background:var(--card2);border-radius:5px;padding:6px 11px;}
  .tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px;}
  .tab{border-radius:5px;padding:7px 13px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:.14s;}
  .tab:hover{color:var(--w);}
  .tab.on{background:var(--red);color:#fff;}

  .wrap{max-width:1240px;min-width:1180px;margin:0 auto;padding:22px 28px 0;}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}
  .kpi .l{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mono);margin-bottom:7px;}
  .kpi .v{font-size:27px;font-weight:800;line-height:1;color:var(--w);}
  .kpi .s{font-size:10px;color:var(--mono);margin-top:5px;}

  .panel{background:var(--card);border:1px solid var(--border2);border-radius:12px;}
  .hero{background:linear-gradient(160deg,rgba(225,6,0,.08),var(--card));border:1px solid rgba(225,6,0,.30);border-radius:12px;padding:16px 18px;margin-bottom:22px;}
  .sec-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px;}
  .count{font-size:9px;color:var(--mono);background:var(--card2);border:1px solid var(--border2);padding:1px 8px;border-radius:20px;}
  h2.big{font-size:14px;font-weight:800;letter-spacing:.03em;color:var(--w);text-transform:uppercase;}
  .sub{font-size:10px;color:var(--mono);}

  .pill{border-radius:5px;padding:6px 11px;font-size:10px;font-weight:700;letter-spacing:.03em;background:var(--surface);border:1px solid var(--border2);color:var(--muted);transition:.14s;}
  .pill:hover{color:var(--w);border-color:var(--border);}
  .pill.on{background:rgba(225,6,0,.16);border-color:rgba(225,6,0,.55);color:#FCA5A5;}
  .btn-red{background:var(--red);border:1px solid var(--red);color:#fff;border-radius:6px;padding:7px 15px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
  .btn-red:hover{background:#FF2A24;}
  .btn-ghost{background:var(--card2);border:1px solid var(--border);color:var(--body);border-radius:6px;padding:8px 15px;font-size:12px;font-weight:700;}
  .btn-ghost:hover{color:var(--w);border-color:var(--mono);}

  .stg{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
  .bar > i{display:block;height:100%;}
  .tick{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim);color:var(--green);font-size:9px;line-height:12px;text-align:center;cursor:pointer;background:none;padding:0;}
  .tick.on{border-color:var(--green);background:rgba(74,222,128,.16);}
  .ttx{font-size:12px;line-height:1.35;text-wrap:pretty;}
  .ttx.done{color:#4E5768;text-decoration:line-through;}

  /* ── go-live timeline (compact) ──
     Small on purpose: it answers one question — where are go-lives bunching up. */
  .tlbox{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:14px 18px 8px;margin-bottom:22px;}
  .tlhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .tlkey{margin-left:auto;display:flex;gap:12px;align-items:center;}
  .tlkey span{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
  .tlkey i{width:7px;height:7px;border-radius:50%;display:block;}

  /* ── go-live lanes ─────────────────────────────────────────────
     Replaces the old ribbon. Every lane is relative to today, so a client
     whose date has passed sits in a labelled pile asking to be closed off
     rather than crowding the middle of an axis. */
  .glanes{display:flex;flex-direction:column;gap:2px;padding:6px 0 10px;}
  .glane{display:grid;grid-template-columns:152px 1fr;gap:14px;align-items:start;padding:9px 0;border-top:1px solid var(--border2);}
  .glane:first-child{border-top:none;}
  .glh{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.07em;
       text-transform:uppercase;padding-top:5px;flex-wrap:wrap;}
  .glh .gn{margin-left:0;color:var(--mono);font-size:9px;background:var(--card2);border:1px solid var(--border2);
       padding:1px 7px;border-radius:20px;letter-spacing:0;}
  .glh .ghint{flex-basis:100%;font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--mono);}
  .glr{display:flex;flex-wrap:wrap;gap:7px;}
  .glc{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border2);
       border-radius:20px;padding:5px 12px 5px 9px;cursor:pointer;transition:.14s;max-width:100%;}
  .glc:hover{border-color:var(--red);background:var(--card3);}
  .glc.risk{border-color:rgba(248,113,113,.5);}
  .glc i{width:7px;height:7px;border-radius:50%;display:block;flex:none;}
  .glc .gnm{font-size:11.5px;font-weight:700;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
  .glc .gdt{font-size:9.5px;color:var(--mono);}
  .glc .gdy{font-size:9.5px;font-weight:700;}
  .glc .gpin{font-size:9px;color:#FBBF24;background:rgba(251,191,36,.14);border-radius:20px;padding:1px 6px;}
  .glc .gpin.risky{color:#F87171;background:rgba(248,113,113,.16);font-weight:800;}

  /* project type + at risk */
  .ptb{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .ptb.none{color:var(--mono);background:var(--card2);border:1px dashed var(--border);}
  .riskb{margin-left:7px;font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#F87171;background:rgba(248,113,113,.14);padding:2px 7px;border-radius:20px;vertical-align:middle;}
  .kpi.clk{cursor:pointer;transition:.14s;}
  .kpi.clk:hover{border-color:var(--red);}
  .tdot{width:8px;height:8px;border-radius:50%;display:block;flex:none;margin-top:5px;}

  /* set the type / park, on the open client */
  .dtools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--border2);background:var(--card2);}
  .dtl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mono);margin-right:2px;}
  .pill.tiny{padding:4px 9px;font-size:9px;}
  .pill.tiny.park{color:#FBBF24;border-color:rgba(251,191,36,.35);}
  .pill.tiny.park:hover{background:rgba(251,191,36,.12);}

  /* parked */
  .parkbox{margin-bottom:22px;overflow:hidden;}
  .parkh{display:flex;align-items:center;gap:8px;padding:13px 17px;cursor:pointer;}
  .parkh:hover{background:var(--card2);}
  .parkarrow{margin-left:auto;color:var(--mono);font-size:11px;transition:transform .15s;}
  .parkarrow.open{transform:rotate(180deg);}
  .parkb{border-top:1px solid var(--border2);padding:4px 17px 12px;}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border2);}
  .prow:last-child{border-bottom:none;}
  .pnm{font-size:12.5px;font-weight:700;color:var(--w);}
  .pmt{font-size:9px;color:var(--mono);margin-top:3px;letter-spacing:.03em;}
  .tl{position:relative;height:78px;margin:10px 2px 0;}
  .tl-axis{position:absolute;left:0;right:0;bottom:22px;height:1px;background:var(--border);}
  .tl-band{position:absolute;top:2px;bottom:22px;background:rgba(225,6,0,.13);border-left:1px solid rgba(225,6,0,.35);border-right:1px solid rgba(225,6,0,.35);border-radius:2px;pointer-events:none;}
  .tl-tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:8.5px;color:var(--mono);letter-spacing:.06em;text-transform:uppercase;pointer-events:none;}
  .tl-grid{position:absolute;top:2px;bottom:22px;width:1px;background:rgba(255,255,255,.045);pointer-events:none;}
  /* The hit area is the target, not the dot. Its width is set per dot from the
     gap to its nearest neighbour, so a generous target never covers the one
     next door — which is what made some go-lives unreachable. */
  .tl-hit{position:absolute;bottom:14px;transform:translateX(-50%);height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;}
  .tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);display:block;transition:transform .12s;}
  .tl-hit:hover .tl-dot,.tl-hit.on .tl-dot{transform:scale(1.5);}
  .tl-lab{position:absolute;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:var(--muted);cursor:pointer;z-index:2;padding:2px 3px;border-radius:3px;}
  .tl-lab:hover,.tl-lab.on{color:var(--w);background:rgba(255,255,255,.07);}
  .tl-today{position:absolute;top:0;bottom:22px;width:1px;background:var(--red);opacity:.55;z-index:1;pointer-events:none;}
  .tl-today b{position:absolute;top:-2px;left:3px;font-size:8px;color:#FCA5A5;letter-spacing:.06em;text-transform:uppercase;font-weight:800;}
  /* Fixed to the viewport rather than the box, so it is never clipped by the
     timeline's own bounds and needs no containment maths. */
  #tltip{position:fixed;display:none;z-index:70;pointer-events:none;max-width:330px;
    background:var(--card3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);font-size:11px;line-height:1.5;}
  #tltip b{display:block;font-size:12.5px;color:var(--w);margin-bottom:3px;}
  #tltip .r1{display:block;color:var(--body);}
  #tltip .r2{display:block;color:var(--mono);font-size:10px;}
  #tltip .r3{display:block;margin-top:5px;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#FCA5A5;}

  /* ── all-hands capture ── */
  .tw{border-radius:7px;transition:background .12s;}
  .tw .grow{cursor:pointer;padding:2px 4px;border-radius:7px;}
  .tw .grow:hover{background:rgba(255,255,255,.028);}
  .tw.cap{background:rgba(225,6,0,.05);box-shadow:inset 2px 0 0 var(--red);}
  .tick.cap{border-color:var(--border);color:var(--mono);font-size:10px;}
  .tick.cap.on{background:rgba(225,6,0,.16);border-color:var(--red);color:#FCA5A5;}
  .tick.cap.open{border-color:#FCA5A5;}
  .cmark{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--card3);}
  .cmark.ch{color:#FBBF24;background:rgba(251,191,36,.14);}
  .cmark.nt{color:var(--muted);cursor:help;}

  .cpanel{margin:8px 0 4px 30px;padding:12px 13px;background:var(--card);border:1px solid var(--border2);border-radius:9px;display:flex;flex-direction:column;gap:9px;cursor:default;}
  .crow{display:flex;align-items:flex-start;gap:10px;}
  .clab{flex:0 0 84px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mono);padding-top:6px;}
  .cbtns{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .cbtn{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:5px;border:1px solid var(--border2);background:var(--card2);color:var(--muted);transition:.12s;}
  .cbtn:hover{color:var(--w);border-color:var(--border);}
  .cbtn.on{color:#fff;}
  .cbtn.chase.on{color:#FBBF24;background:rgba(251,191,36,.16);border-color:#FBBF24;}
  .cbtn.clr{color:var(--mono);}
  .cbtn.clr:hover{color:#F87171;border-color:#F87171;}
  .cnote{flex:1;background:var(--card2);border:1px solid var(--border2);border-radius:6px;color:var(--body);font:12px/1.45 inherit;padding:7px 9px;resize:vertical;min-height:38px;}
  .cnote:focus{outline:none;border-color:var(--red);}
  .cwas{font-size:9.5px;color:var(--mono);margin-left:auto;letter-spacing:.03em;}
  .cbtn[disabled]{opacity:.45;cursor:default;}
  .cwk{background:var(--card2);border:1px solid var(--border2);color:var(--body);font:11px inherit;
    border-radius:5px;padding:5px 7px;max-width:240px;cursor:pointer;}
  .cwk:focus{outline:none;border-color:var(--red);}
  /* Date shifts are the one thing this board writes back, so they say so. */
  .cwrite{font-size:9.5px;letter-spacing:.04em;color:var(--mono);}
  .cwrite.busy{color:var(--blue);}
  .cwrite.ok{color:var(--green);}
  .cwrite.bad{color:var(--redText);}

  .capbtn.has{background:rgba(225,6,0,.16);color:#FCA5A5;}
  .capn{display:inline-block;min-width:15px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;line-height:15px;text-align:center;}

  /* post-call summary overlay */
  .sum{position:fixed;inset:0;z-index:60;background:rgba(6,6,7,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:34px;}
  .sum.on{display:flex;}
  .sum-box{width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden;}
  .sum-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border2);}
  .sum-h h2{font-size:15px;font-weight:800;color:var(--w);letter-spacing:.01em;}
  .sum-sub{font-size:11px;color:var(--muted);margin-top:4px;max-width:52ch;line-height:1.5;}
  .sum-count{color:#FCA5A5;font-weight:700;}
  .share-note{display:block;margin-top:5px;font-size:10px;letter-spacing:.03em;}
  .sum-b{overflow-y:auto;padding:6px 20px 20px;}
  .sgrp{margin-top:16px;}
  .sgrp-h{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:7px;border-bottom:1px solid var(--border2);}
  .sgrp-h span{margin-left:auto;color:var(--mono);}
  .srow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);}
  .srow .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:10px;}
  .snote{margin-top:6px;padding:7px 9px;background:var(--card);border-left:2px solid var(--border);border-radius:0 5px 5px 0;font-size:11.5px;line-height:1.5;color:var(--muted);white-space:pre-wrap;}
  .bchip{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;}
  .reb{margin-left:7px;font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:1px 6px;border-radius:20px;color:var(--amber);background:rgba(251,191,36,.13);cursor:help;vertical-align:1px;}

  /* groups */
  .grp{background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:12px 13px;}
  .grp-h{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px;}

  /* all-hands, split by owner — one column per person, so the call can go round
     the room rather than round the urgency buckets */
  .owngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;align-items:start;}
  .preshead{margin-bottom:11px;}
  .grp-h.own{display:flex;align-items:center;gap:9px;margin-bottom:9px;text-transform:none;letter-spacing:0;}
  .oav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;flex:none;}
  .onm{font-size:14px;font-weight:800;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ocount{margin-left:auto;font-size:10px;font-weight:700;color:var(--mono);background:var(--card2);
    border:1px solid var(--border2);padding:1px 8px;border-radius:20px;}
  .obits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
  .obadge{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .grow{display:flex;align-items:flex-start;gap:9px;}
  .grow .m{display:flex;align-items:center;gap:9px;margin-top:5px;}
  .grow .m span{font-size:9px;}
  .empty{font-size:11px;color:var(--dim);}

  /* table */
  /* No overflow:hidden here — it would make the box its own scrollport and the
     sticky header would pin 57px DOWN inside it, on top of the first row. The
     corners are rounded on the first and last children instead. */
  .tbl{background:var(--card);border:1px solid var(--border2);border-radius:11px;}
  .thead,.tr{display:grid;grid-template-columns:minmax(170px,1.4fr) 96px 76px minmax(110px,1fr) 132px;gap:12px;padding:10px 15px;border-bottom:1px solid var(--border2);}
  .thead{background:var(--surface);position:sticky;top:57px;z-index:5;border-radius:10px 10px 0 0;}
  .tbl .tr:last-child{border-bottom:none;border-radius:0 0 10px 10px;}
  .thead span{font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mono);}
  .tr{cursor:pointer;border-left:3px solid transparent;scroll-margin-top:120px;}
  .tr:hover{background:var(--card3);}
  .tr.sel{background:var(--card3);border-left-color:var(--red);}
  /* Arriving from a go-live on the timeline: say where you landed. */
  @keyframes trflash{0%,100%{background:var(--card3);}35%{background:rgba(225,6,0,.20);}}
  .tr.flash{animation:trflash 1.3s ease-in-out;}

  /* client detail panel — the list of actions you work down on a call */
  .dpanel{position:sticky;top:88px;display:flex;flex-direction:column;max-height:calc(100vh - 112px);overflow:hidden;}
  .dhead{padding:14px 16px;border-bottom:1px solid var(--border2);background:linear-gradient(160deg,rgba(225,6,0,.10),var(--card));flex:none;}
  .dnm{font-size:16px;font-weight:800;color:var(--w);letter-spacing:-.01em;line-height:1.2;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dbody{flex:1;min-height:0;overflow:auto;}
  .gsec{border-bottom:1px solid var(--border2);}
  /* Group headings stay put as you scroll a long list, so an action always has
     a heading above it and the client name above that. */
  .gstick{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0;
    padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border2);}
  .gstick .gn{margin-left:auto;color:var(--mono);font-size:9px;}

  /* presenter */
  .pres{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;}
  .pres.on{display:flex;}
  .pres-h{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border2);}
  .pres-b{flex:1;overflow:auto;padding:40px;}

<script>
/* ──────────────────────────────────────────────────────────────
   SABEL PROJECT DASHBOARD
   One screen: the command table. It started as three candidate layouts behind a
   switcher (run sheet / stage board / command table); the command table is the
   one that held up on a live call, so the other two are gone and the pieces only
   they carried — go-live timeline, blockers, pipeline, takeaway actions — moved
   onto it.

   DATA WIRING — two feeds to connect when you are ready:
     1. Stage + go-live per client  → webhook key 'client-portal-v1'
        (the Onboarding / Offboarding portal saves the client list there).
        Portal STAGE_ORDER today is Discovery / Onboarding / Active /
        Offboarding / Complete. Extend it to the eight stages below so the
        two screens speak the same language.
     2. Tasks, owners, due dates, statuses → '[client]-tracker-v1' per tracker,
        same as SabelPortfolioDashboard.html already does.
   Until then CLIENTS below is the single place to edit. Keep the shape and
   the whole dashboard follows.
   ────────────────────────────────────────────────────────────── */

var BASE = 'https://sabel-intercom.github.io/Intake-forms/';
var GO_LIVE_HORIZON = 30;   // "landing soon" window in days

var OW = {
  Chris:   {c:'#60A5FA', bg:'rgba(96,165,250,.14)'},
  Richard: {c:'#C084FC', bg:'rgba(192,132,252,.14)'},
  Greg:    {c:'#34D399', bg:'rgba(52,211,153,.14)'},
  Client:  {c:'#FBBF24', bg:'rgba(251,191,36,.14)'}
};
/* Owners come from the trackers, so the list above won't cover everyone. Unknown
   names get neutral grey — they must not inherit Client amber and read as
   client-side actions on the call. */
var OW_DEFAULT = {c:'#94A3B8', bg:'rgba(148,163,184,.12)'};
var SC = {
  'Complete':    {c:'#4ADE80', bg:'rgba(74,222,128,.12)'},
  'In Progress': {c:'#60A5FA', bg:'rgba(96,165,250,.12)'},
  'Pending':     {c:'#94A3B8', bg:'rgba(148,163,184,.10)'},
  'Blocked':     {c:'#F87171', bg:'rgba(248,113,113,.12)'},
  'Dependency':  {c:'#FBBF24', bg:'rgba(251,191,36,.12)'}
};
/* Pillar colours are keyed on the tracker's own phase ids. Trackers don't all use
   the same set, so anything unlisted falls back to grey rather than going missing. */
var PL = {setup:'#38BDF8', blueprint:'#38BDF8', foundations:'#A78BFA', automation:'#818CF8',
          fin:'#F472B6', migration:'#FB923C', uat:'#34D399', golive:'#F87171', post:'#94A3B8'};
/* 'Active' is the portal's catch-all working stage. Build / Testing / Go-live / On hold
   stay listed so they light up automatically if the portal ever records them —

var STAGE_C = {'Scoping':'#94A3B8','Onboarding':'#FBBF24','Active':'#60A5FA','Build':'#38BDF8','Testing':'#A78BFA','Go-live':'#F87171','Offboarding':'#FB923C','Complete':'#4ADE80','On hold':'#64748B'};
var STAGE_BG = {'Scoping':'rgba(148,163,184,.12)','Onboarding':'rgba(251,191,36,.12)','Active':'rgba(96,165,250,.12)','Build':'rgba(56,189,248,.12)','Testing':'rgba(167,139,250,.12)','Go-live':'rgba(248,113,113,.14)','Offboarding':'rgba(251,146,60,.12)','Complete':'rgba(74,222,128,.12)','On hold':'rgba(100,116,139,.14)'};

/* ──────────────────────────────────────────────────────────────
   LIVE DATA
   Nothing about the portfolio is hardcoded. Four feeds, all read-only:
     1. trackers.json           — the registry: name, Upstash key, file, SOW hours
     2. <tracker key>           — each tracker's saved state via the webhook. For
                                  skill-format trackers this taskData blob is the
                                  authoritative plan, not the seed data in the HTML.
     3. client-portal-v1        — stage, lead and go-live from the on/offboarding portal
     4. sabel-golive-overrides-v1 — shared with SabelPortfolioDashboard.html, so a
                                  go-live set on one screen shows on the other.

   Everything lands in CLIENTS in the shape the rest of this file already renders:
     {id, n, st, gl, lead, f, p, t:[[title, owner, pillar, due, status], ...]}
   This dashboard never writes to a tracker. See the capture panel further down for
   how call decisions are collected instead.
   ────────────────────────────────────────────────────────────── */
var API = 'https://sabel-webhook.vercel.app/api/tracker';
var PORTAL_KEY = 'client-portal-v1';
var OVERRIDES_KEY = 'sabel-golive-overrides-v1';
/* Project type and parking. Kept here rather than in the portal so it can be set
   from this board in one click, and read back on every load.
   Shape: { "<client slug>": {type:'full'|'migration'|'build', parked:true,
            parkedAt:'YYYY-MM-DD', parkNote:'...'} }
   The webhook needs 'sabel-clientmeta-v1' on its key allowlist. Until it is
   there, changes hold on this browser and the board says so. */
var META_KEY = 'sabel-clientmeta-v1';
var META = {};
var META_SHARED = null;
var REFRESH_MS = 5 * 60 * 1000;

var CLIENTS = [];
var REGISTRY = [];
var LIVE = {ok:0, total:0, at:null, state:'loading'};   // state: loading | live | partial | offline

/* The portal's stage vocabulary is narrower than this board's. Map what it has and
   let the rest pass through, so the board gains the finer stages for free the day
   the portal starts recording them. */
var PORTAL_STAGE = {'Discovery':'Scoping','Onboarding':'Onboarding','Active':'Active',
                    'Offboarding':'Offboarding','Complete':'Complete','On hold':'On hold'};

/* The portal, the registry and the trackers spell some clients differently.
   Matching is on a normalised name, with these for the ones normalising can't reach. */
var ALIAS = {
  'yfood labs':'yfood', 'tulka oy':'tulka', 'herotolk tulka':'tulka',
  'huuuge global':'huuuge', 'cronos particle research ltd':'cronos particle research',
  'cannabis clinic renewal':'cannabis clinic'
};
function normName(n){
  var s = String(n||'').toLowerCase()
    .replace(/[().,'"&]/g,' ')
    .replace(/\b(ltd|limited|inc|oy|ab|pty|nz|usa|global|labs?)\b/g,' ')
    .replace(/\s+/g,' ').trim();
  return ALIAS[s] || s;
}
function slug(n){ return String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,18) || 'client'; }

/* ── tracker payload parsing ── */
var SKILL_MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
/* Skill-format trackers store human date ranges ("Jul 7-9"); take the last date.
   Year is assumed current — these trackers don't record one. */
function skillDate(d){
  if(!d) return '';
  var ms = String(d).match(/([A-Z][a-z]{2})\s*(\d{1,2})/g);
  if(!ms) return '';
  var m = ms[ms.length-1].match(/([A-Z][a-z]{2})\s*(\d{1,2})/);
  var mo = SKILL_MONTHS[m[1]]; if(mo==null) return '';
  return TODAY.getFullYear()+'-'+String(mo+1).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
}
/* ── the week grid ──────────────────────────────────────────────
   Trackers schedule work two ways. A task can carry a plain date string in `d`
   ("Jul 7-9"), or it can be pinned to a week number. The tracker's own
   taskDatesText() uses `d` ONLY when there is no week — once a task has one,
   the displayed date is computed from the week grid: WEEK1_START plus any
   per-week overrides in weekStarts. Shifting a week moves every task in it and
   after, and leaves every `d` string untouched.

   So reading `d` alone shows the plan as first written, not as it stands now.
   WEEK1_START lives in the tracker's HTML rather than its saved state, so it is
   read from the file once per tracker and cached. */
/* Each tracker's HTML holds things its saved state does not: the week-grid
   anchor, the build stamp, and the freshly built plan itself. Read once per
   tracker per session and cached — a redeploy mid-session is picked up on the
   next page reload, not on the 5-minute refresh. */
var TRK = {};   // trackerKey -> {week1, buildV, goLive, seed, weekStarts}
var TRK_EMPTY = {week1:null, buildV:null, goLive:null, seed:null, weekStarts:null};
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* Pull one balanced {...} literal out of a source file, starting at `from`.
   String-aware, so a brace inside a task title cannot end the object early. */
function braceBlock(src, from){
  var i = src.indexOf('{', from);
  if(i < 0) return '';
  var depth=0, q='', esc=false;
  for(var j=i; j<src.length; j++){
    var ch = src.charAt(j);
    if(q){
      if(esc) esc=false;
      else if(ch==='\\') esc=true;
      else if(ch===q) q='';
      continue;
    }
    if(ch==='"'||ch==="'"||ch==='`'){ q=ch; continue; }
    if(ch==='{') depth++;
    else if(ch==='}'){ depth--; if(!depth) return src.slice(i, j+1); }
  }
  return '';
}
/* Trackers built by the current skill write their plan as JSON. Older ones write
   a JS object literal — unquoted keys, single quotes — which JSON.parse cannot
   read. The source is our own tracker file, from our own Pages origin, already
   fetched above; evaluating just the literal is the only way to read that shape. */
function parseObjLiteral(src){
  if(!src) return null;
  try{ return JSON.parse(src); }catch(e){}
  try{ return (new Function('return ('+src+');'))(); }catch(e){}
  return null;
}
function loadTracker(tr){
  if(TRK[tr.key]) return Promise.resolve();                     // cached
  if(!tr.file){ TRK[tr.key]=TRK_EMPTY; return Promise.resolve(); }
  return fetch(BASE+tr.file,{cache:'no-store'})
    .then(function(r){ return r.ok?r.text():''; })
    .then(function(txt){
      var w1  = txt.match(/WEEK1_START\s*=\s*['"]([\d-]{10})['"]/);
      var bv  = txt.match(/BUILD_V\s*=\s*['"]?(\d+)/);
      var gl  = txt.match(/GO_LIVE\s*=\s*['"]([\d-]{10})['"]/);
      var tm  = txt.match(/(?:const|var|let)\s+T\s*=\s*\{/);
      var wsm = txt.match(/WEEK_STARTS_DEFAULT\s*=\s*\{/);
      TRK[tr.key] = {
        week1:  w1 ? w1[1] : null,
        buildV: bv ? bv[1] : null,
        goLive: gl ? gl[1] : null,
        seed:   tm  ? parseObjLiteral(braceBlock(txt, tm.index))  : null,
        weekStarts: wsm ? (parseObjLiteral(braceBlock(txt, wsm.index)) || null) : null
      };
    })
    .catch(function(){ TRK[tr.key]=TRK_EMPTY; });
}

/* ── which plan to believe ──────────────────────────────────────
   A tracker stamps BUILD_V into its saved state. Rebuild and redeploy the file
   and that stamp moves on — at which point the tracker itself throws its whole
   saved state away on load and shows the freshly built plan instead
   (its loadInitial: `if(d.buildV!==BUILD_V) return`).

   This board has to make the same call. It used to read the saved state
   unconditionally, so for any tracker rebuilt since its last save it reported a
   plan the tracker no longer shows: superseded owners (tasks reassigned to
   Richard still reading Chris), superseded dates, and tasks that had been added
   or removed. Same rule, same answer, both screens. */
function planFor(reg){
  var trk = TRK[reg.key] || TRK_EMPTY, saved = reg._data;
  // Only a build stamp we could actually read can invalidate anything. If the
  // file did not load, trust the saved state as before.
  var rebuilt = !!(trk.buildV && saved && saved.buildV!==undefined &&
                   String(saved.buildV) !== String(trk.buildV));
  if(trk.seed && (!saved || rebuilt)){
    return {data:{taskData:trk.seed, weekStarts:trk.weekStarts||{}, goLive:trk.goLive||''},
            rebuilt:rebuilt, seeded:true};
  }
  return {data:saved, rebuilt:false, seeded:false};
}
/* The Sunday of week n — a task pinned to a week is not late until that week is out. */
function weekEndDate(n, week1, weekStarts){
  var d;
  if(weekStarts && weekStarts[n]) d=new Date(weekStarts[n]+'T00:00:00');
  else { d=new Date(week1+'T00:00:00'); d.setDate(d.getDate()+(n-1)*7); }
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate()+6);
  return isoOf(d);
}
function taskDue(t, week1, weekStarts){
  if(t.week && t.week>=1 && week1){
    var wk = (t.wkEnd && t.wkEnd>t.week) ? t.wkEnd : t.week;   // a span ends in its last week
    return weekEndDate(wk, week1, weekStarts);
  }
  return skillDate(t.d);
}

/* Trackers exist in three shapes. Normalise all of them to
   [{id, tasks:[{task, owner, status, end, dep}]}].
   Skill-format tasks also carry where they live in the tracker — phase, side and
   index — which is what lets a date shift be written back to the right slot. */
function phasesFrom(data, key){
  if(!data) return null;
  // 1. Skill format: {taskData:{phase:{sabel:[],client:[]}}, statuses:{phase-s-0:'…'}}
  if(data.taskData && typeof data.taskData==='object'){
    var st = data.statuses || {};
    var trk = TRK[key] || TRK_EMPTY;
    var w1 = trk.week1 || null, ws = data.weekStarts || {};
    return Object.keys(data.taskData).map(function(pid){
      var grp = data.taskData[pid] || {}, tasks = [];
      ['sabel','client'].forEach(function(side){
        var sfx = side==='sabel' ? '-s-' : '-c-';
        (grp[side]||[]).forEach(function(t,i){
          tasks.push({task:t.t, owner:t.o, status: st[pid+sfx+i] || t.s,
            end: taskDue(t,w1,ws), dep: side==='client',
            at:{key:key, pid:pid, side:side, idx:i, week:t.week||0, wkEnd:t.wkEnd||0}});
        });
      });
      return {id:pid, tasks:tasks};
    });
  }
  // 2. Phase format: [...] or {phases:[...]}
  var ph = Array.isArray(data) ? data : (Array.isArray(data.phases) ? data.phases : null);
  if(ph) return ph.map(function(p){
    return {id:p.id, tasks:(p.tasks||[]).map(function(k){
      return {task:k.task, owner:k.owner, status:k.status, end:k.end||k.start||'', dep:!!k.dep};
    })};
  });
  // 3. Older groups board (BTS)
  if(Array.isArray(data.groups)) return data.groups.map(function(g,i){
    return {id:g.id||('phase'+i), tasks:(g.items||[]).map(function(it){
      return {task:it.task, owner:it.owner, end:it.iso||it.date||'', dep:!!it.dep,
        status: it.done ? 'Complete' : it.status==='red' ? 'Blocked' : 'In Progress'};
    })};
  });
  return null;
}
function tallyOf(phases){
  var n=0, done=0;
  phases.forEach(function(p){ (p.tasks||[]).forEach(function(k){
    n++; var s=(k.status||'').toLowerCase();
    if(s==='complete'||s==='done') done++;
  });});
  return {total:n, done:done};
}
function deriveGoLive(phases){
  var gl=[], all=[];
  phases.forEach(function(p){ (p.tasks||[]).forEach(function(k){
    if(!k.end) return; all.push(k.end);
    if(/go[\s-]?live/i.test(k.task||'')) gl.push(k.end);
  });});
  if(gl.length) return gl.sort().pop();
  if(all.length) return all.sort().pop();
  return null;
}

/* ── fetch ── */
function fetchKey(key){
  return fetchKeyMeta(key).then(function(m){ return m.data; });
}
/* A tracker that answers with no saved state is a registered-but-unused tracker,
   not a failure. Keep the two apart so an empty tracker doesn't flag the whole
   board as degraded. */
function fetchKeyMeta(key){
  return fetch(API+'?key='+encodeURIComponent(key)+'&_t='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ return j && j.ok ? {reached:true, data:j.data} : {reached:false, data:null}; })
    .catch(function(){ return {reached:false, data:null}; });
}

/* Build CLIENTS from the portal (who our clients are and what stage they're at)
   joined to the registry + tracker payloads (what the actual work is). */
function buildClients(portal, overrides){
  var byKey={}, byNorm={};
  REGISTRY.forEach(function(t){ if(t.key) byKey[t.key]=t; byNorm[normName(t.name)]=t; });

  function regFor(pc){
    return (pc.trackerKey && byKey[pc.trackerKey]) || byNorm[normName(pc.name)] || null;
  }
  function make(name, stage, lead, portalGl, reg, portalType){
    var pl = reg ? planFor(reg) : {data:null, rebuilt:false};
    var phases = pl.data ? phasesFrom(pl.data, reg.key) : null;
    var tasks = [], p = 0, nd = true, auto = null;
    if(phases){
      nd = false;
      phases.forEach(function(ph){ (ph.tasks||[]).forEach(function(k){
        tasks.push([k.task, k.dep ? 'Client' : (k.owner||'Sabel'), ph.id || 'other',
                    k.end || '', k.status || 'Pending', k.at || null]);
      });});
      var tl = tallyOf(phases);
      p = tl.total ? Math.round(tl.done/tl.total*100) : 0;
      auto = deriveGoLive(phases);
      // The week grid this tracker is actually running on, so the date-shift
      // controls can label weeks with real dates and offer a sensible range.
      if(reg.key){
        WS[reg.key] = pl.data.weekStarts || {};
        var mw = 0;
        tasks.forEach(function(row){
          var a = row[5]; if(!a) return;
          var e = (a.wkEnd && a.wkEnd>a.week) ? a.wkEnd : a.week;
          if(e > mw) mw = e;
        });
        MAXW[reg.key] = mw;
      }
    }
    var trackerGl = pl.data && pl.data.goLive ? pl.data.goLive : null;
    var gl = overrides[name] || (reg ? overrides[reg.name] : null) || portalGl || trackerGl || auto || '';
    return {id:slug(name), n:name, st:stage, gl:gl, lead:lead||'—', pt:portalType||'',
            f:(reg && reg.file) || '', p:p, nd:nd, t:tasks,
            key:(reg && reg.key) || '', rebuilt:!!pl.rebuilt};
  }

  var out=[], used={};
  portal.forEach(function(pc){
    var reg = regFor(pc);
    // Complete clients only stay on the board while their tracker is still active,
    // otherwise the Complete column fills with years of finished work.
    if(pc.stage==='Complete' && !(reg && reg.active)) return;
    if(reg) used[reg.key||reg.name]=1;
    out.push(make(pc.name, PORTAL_STAGE[pc.stage] || pc.stage || 'Active',
                  pc.owner, pc.goLiveDate, reg, pc.type));
  });
  // An active tracker the portal doesn't know about still deserves a card.
  REGISTRY.forEach(function(t){
    if(!t.active || used[t.key||t.name]) return;
    out.push(make(t.name, 'Active', '', null, t));
  });
  return out;
}

/* ── project type ──
   Guessed from the pillars the tracker actually carries, then overridden by
   whatever someone has set on the board. A guess is marked as such so nobody
   mistakes it for a decision. */
var BUILD_PILLARS = ['fin','automation','foundations','setup','blueprint','uat','golive','post'];
function guessType(tasks){
  var has={}; tasks.forEach(function(t){ has[t.pillar]=1; });
  var mig=!!has.migration, other=false;
  BUILD_PILLARS.forEach(function(p){ if(has[p]) other=true; });
  if(mig && other) return 'full';
  if(mig) return 'migration';
  return other ? 'build' : '';
}
/* The onboarding portal already records this per client as Migration / Project /
   Both, so read it rather than asking anyone to set it twice. The pillar guess
   below is only for clients the portal has no type for. */
var PORTAL_TYPE = {'Migration':'migration','Project':'build','Both':'full',
                   'migration':'migration','project':'build','both':'full'};
var TYPE_LABEL = {full:'Full project', migration:'Migration only', build:'Build only'};
var TYPE_SHORT = {full:'Full', migration:'Migration', build:'Build'};
var TYPE_C     = {full:'#A78BFA', migration:'#FB923C', build:'#38BDF8'};
var TYPE_BG    = {full:'rgba(167,139,250,.14)', migration:'rgba(251,146,60,.14)', build:'rgba(56,189,248,.14)'};

function metaFor(id){ return META[id] || {}; }
function saveMeta(){
  return fetch(API+'?key='+encodeURIComponent(META_KEY)+'&_t='+Date.now(), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:META_KEY, value: JSON.stringify({clients:META, at:Date.now()})})
  }).then(function(r){ META_SHARED = r.ok; }).catch(function(){ META_SHARED=false; });
}
function setType(id, t, ev){
  if(ev) ev.stopPropagation();
  META[id] = META[id] || {};
  if(t) META[id].type = t; else delete META[id].type;
  saveMeta(); render();
}
function parkClient(id, ev){
  if(ev) ev.stopPropagation();
  var why = prompt('Why is '+(find(allIncludingParked(),id)||{}).name+' being parked? (optional)') ;
  if(why===null) return;
  META[id] = META[id] || {};
  META[id].parked = true;
  META[id].parkedAt = isoOf(TODAY);
  META[id].parkNote = why || '';
  if(S.sel===id) S.sel='';
  saveMeta(); save(); render();
}
function unparkClient(id, ev){
  if(ev) ev.stopPropagation();
  if(META[id]){ delete META[id].parked; delete META[id].parkedAt; delete META[id].parkNote; }
  saveMeta(); render();
}
function toggleParked(){ S.showParked=!S.showParked; save(); render(); }

function setStamp(){
  var el = document.getElementById('stamp'); if(!el) return;
  var wrap = el.parentNode;
  if(LIVE.state==='loading'){ el.textContent='loading…'; wrap.firstChild.textContent='Live · '; return; }
  var when = LIVE.at ? LIVE.at.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '—';
  if(LIVE.state==='offline'){
    wrap.firstChild.textContent='Offline · ';
    el.textContent='no data · last tried '+when;
    el.style.color='#F87171';
  } else {
    wrap.firstChild.textContent = LIVE.state==='partial' ? 'Partial · ' : 'Live · ';
    el.textContent = LIVE.ok+'/'+LIVE.total+' trackers'+(LIVE.empty?' ('+LIVE.empty+' not started)':'')+' · '+when;
    el.style.color = LIVE.state==='partial' ? '#FBBF24' : '';
    el.title = LIVE.empty ? LIVE.empty+' registered tracker(s) have no saved plan yet' : '';
  }
}

function loadAll(manual){
  var btn=document.getElementById('refreshBtn'); if(btn) btn.classList.add('spin');
  if(!CLIENTS.length) LIVE.state='loading';
  setStamp();
  return Promise.all([
    fetch(BASE+'trackers.json',{cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    fetchKey(PORTAL_KEY),
    fetchKey(OVERRIDES_KEY),
    fetchKey(META_KEY)
  ]).then(function(res){
    META = (res[3] && typeof res[3]==='object' && res[3].clients && typeof res[3].clients==='object')
             ? res[3].clients : (META||{});
    REGISTRY = Array.isArray(res[0]) ? res[0].slice() : [];
    var portal = (res[1] && Array.isArray(res[1].clients)) ? res[1].clients : [];
    var overrides = (res[2] && typeof res[2]==='object') ? res[2] : {};
    var keyed = REGISTRY.filter(function(t){ return t.key; });
    LIVE.total = keyed.length; LIVE.ok = 0; LIVE.empty = 0;
    return Promise.all(keyed.map(function(t){
      return fetchKeyMeta(t.key).then(function(m){
        t._data = m.data;
        if(m.reached){ LIVE.ok++; if(!m.data) LIVE.empty++; }
        // Every tracker's HTML is read once — it carries the build stamp that
        // says whether the saved state is still the live plan, the week-grid
        // anchor, and the plan itself as a fallback. Cached, so later refreshes
        // fetch nothing extra.
        return loadTracker(t);
      });
    })).then(function(){
      CLIENTS = buildClients(portal, overrides);
      LIVE.at = new Date();
      LIVE.state = !CLIENTS.length ? 'offline' : (LIVE.ok < LIVE.total ? 'partial' : 'live');
      if(btn) btn.classList.remove('spin');
      setStamp(); safeRender();
    });
  }).catch(function(){
    LIVE.at=new Date(); LIVE.state='offline';
    if(btn) btn.classList.remove('spin');
    setStamp(); safeRender();
  });
}

/* Scoping pipeline and what starts next — edit freely. */
/* The pipeline panel is derived from the portal, not hand-kept. It used to be a
   typed list with its own notes, which went stale the moment a stage changed —
   it was still calling finished and cancelled engagements "upcoming". Reading
   the stage means the panel cannot contradict the portal, because it is the
   portal. Set a client's stage there and this follows. */
function pipelineFor(L){
  return L.filter(function(c){ return c.stage==='Scoping' || c.stage==='Onboarding'; })
          .sort(function(a,b){
            if(a.stage!==b.stage) return a.stage==='Onboarding'?-1:1;   // nearest to starting first
            return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
          });
}

var FILTERS = ['All open','Overdue','Due this week','Blocked'];
var MS = 86400000;
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── state (persisted) ── */
var PK = 'sabel_dash_refresh_v1';
var S = {sel:'', filter:'All open', cap:{}, capOpen:'', pIdx:0, showParked:false, ptFilter:''};
try{ var saved = JSON.parse(localStorage.getItem(PK)||'null'); if(saved) for(var k in saved) S[k]=saved[k]; }catch(e){}
if(!S.cap || typeof S.cap!=='object') S.cap={};
function save(){ try{ localStorage.setItem(PK, JSON.stringify(S)); }catch(e){} }
/* Stable per-task key: the title, normalised. */
function tkey(title){ return String(title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }

/* ── dates ── */
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function weekEnd(){ var d=today(); var dow=(d.getDay()+6)%7; var e=new Date(d.getTime()+(6-dow)*MS); return e; }
var TODAY=today(), WK_END=weekEnd();
function weekStart(){ var d=today(); var dow=(d.getDay()+6)%7; return new Date(d.getTime()-dow*MS); }
function fmt(iso){ if(!iso) return 'TBC'; var d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MON[d.getMonth()]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── derive ── */
function urgency(t,id){
  if(t[4]==='Complete') return 'done';
  if(t[4]==='Blocked' || t[4]==='Dependency') return 'blocked';
  if(!t[3]) return 'later';
  var d=new Date(t[3]+'T00:00:00');
  if(d<TODAY) return 'overdue';
  if(d<=WK_END) return 'week';
  return 'later';
}
function enrich(c){
  var tasks=c.t.map(function(t,i){
    // Keyed on the task title, not its index, so a capture stays attached to its
    // task when the tracker is re-ordered or a task is inserted above it.
    var id=c.id+'::'+tkey(t[0]), cap=S.cap[id]||null;
    // The tracker's status is the truth; a capture is only what we intend to
    // change it to. Showing the captured value keeps the board honest during the
    // call, and the summary carries both so the update is unambiguous afterwards.
    var live=t[4]||'Pending', eff=(cap&&cap.status)||live;
    var u=urgency([t[0],t[1],t[2],t[3],eff],id), done=eff==='Complete';
    var ow=OW[t[1]]||OW_DEFAULT, st=SC[eff]||SC.Pending;
    return {id:id, t:t[0], o:t[1], s:eff, liveStatus:live, u:u, pillar:t[2],
      pillarColor:PL[t[2]]||'#94A3B8', ownerColor:ow.c, ownerBg:ow.bg,
      statusColor:st.c, statusBg:st.bg, done:done,
      cap:cap, capStatus:(cap&&cap.status)||'', capNote:(cap&&cap.note)||'',
      chase:!!(cap&&cap.chase), captured:!!cap,
      dueLabel:fmt(t[3])+(u==='overdue'?' !':''), due:t[3],
      dueColor:u==='overdue'?'#F87171':(u==='week'?'#FBBF24':'#64748B'),
      // Where this task sits in its tracker, so a date shift can be written
      // back to the right slot. Absent on the older tracker shapes.
      at:t[5]||null, trackerKey:c.key||'',
      client:c.n, clientId:c.id};
  });
  var out=tasks.filter(function(t){return t.u!=='done';});
  var overdue=out.filter(function(t){return t.u==='overdue';}).length;
  var week=out.filter(function(t){return t.u==='week';}).length;
  var blocked=out.filter(function(t){return t.u==='blocked';}).length;
  var clientSide=out.filter(function(t){return t.o==='Client';}).length;

  var days=null, key=9999;
  if(c.gl){ days=Math.round((new Date(c.gl+'T00:00:00')-TODAY)/MS); key=days>=0?days:400-days; }
  if(c.st==='Scoping') key=700;
  if(c.st==='On hold') key=800;
  if(c.st==='Complete') key=900;

  var daysNum='—', daysUnit='go-live TBC', shortDays='TBC', daysColor='#64748B';
  if(days!==null && days>=0){
    daysNum=String(days); daysUnit=days===1?'day to go-live':'days to go-live';
    shortDays='T\u2011'+days+'d';
    daysColor=days<=7?'#F87171':(days<=21?'#FBBF24':'#4ADE80');
  } else if(days!==null){
    daysNum=String(-days); daysUnit='days since go-live'; shortDays='+'+(-days)+'d'; daysColor='#94A3B8';
  }

  var chips=[];
  if(overdue) chips.push({label:overdue+' overdue', short:overdue+' od', c:'#F87171', bg:'rgba(248,113,113,.12)'});
  if(blocked) chips.push({label:blocked+' blocked', short:blocked+' bl', c:'#FBBF24', bg:'rgba(251,191,36,.12)'});
  if(week)    chips.push({label:week+' due', short:week+' due', c:'#60A5FA', bg:'rgba(96,165,250,.12)'});
  if(!chips.length) chips.push({label:'clear', short:'clear', c:'#4ADE80', bg:'rgba(74,222,128,.12)'});

  var pillars=[]; out.forEach(function(t){ if(pillars.indexOf(t.pillar)<0) pillars.push(t.pillar); });
  var glTxt = c.gl ? (days>=0 ? 'Go-live '+fmt(c.gl) : 'Live since '+fmt(c.gl)) : 'No go-live set';

  var mt = metaFor(c.id);
  var fromPortal = PORTAL_TYPE[c.pt] || '';
  var guessed = fromPortal || guessType(tasks);
  var ptype = mt.type || guessed || '';
  var atRisk = (days!==null && days>=0 && days<=GO_LIVE_HORIZON && c.p<25);

  return {id:c.id, name:c.n, stage:c.st, lead:c.lead, gl:c.gl, key:c.key||'', rebuilt:!!c.rebuilt,
    ptype:ptype, ptypeGuessed:!mt.type && !fromPortal && !!guessed, atRisk:atRisk,
    parked:!!mt.parked || c.st==='On hold', parkedAt:mt.parkedAt||'', parkNote:mt.parkNote||'',
    noLead:(!c.lead || c.lead==='\u2014'),
    stageColor:STAGE_C[c.st], stageBg:STAGE_BG[c.st],
    prog:c.p, progPct:c.p+'%', meta:glTxt+' · lead '+c.lead+' · '+out.length+' open',
    daysNum:daysNum, daysUnit:daysUnit, shortDays:shortDays, daysColor:daysColor, key:key, days:days,
    overdue:overdue, week:week, blocked:blocked, clientSide:clientSide, chips:chips,
    outstanding:out.length, allTasks:tasks, outTasks:out,
    trackerUrl: c.f ? BASE+c.f : '',
    noData: !!c.nd,
    pillarNote: c.nd ? 'No tracker connected yet' : (pillars.length ? 'Open across '+pillars.join(', ') : 'Nothing outstanding'),
    foot: c.nd ? 'No tracker connected' : out.length+' open · '+c.p+'% complete'};
}
function applyFilter(list){
  if(S.filter==='Overdue') return list.filter(function(t){return t.u==='overdue';});
  if(S.filter==='Due this week') return list.filter(function(t){return t.u==='week'||t.u==='overdue';});
  if(S.filter==='Blocked') return list.filter(function(t){return t.u==='blocked';});
  return list;
}
/* The filter pills used to sit above the command table doing nothing — only the
   run sheet honoured them. They narrow the client's list of actions. */
function groupsFor(c){
  var list=applyFilter(c.outTasks);
  return [
    {label:'Overdue', color:'#F87171', tasks:list.filter(function(t){return t.u==='overdue';})},
    {label:'Due this week', color:'#60A5FA', tasks:list.filter(function(t){return t.u==='week';})},
    {label:'Blocked & waiting', color:'#FBBF24', tasks:list.filter(function(t){return t.u==='blocked';})},
    {label:'Coming up', color:'#64748B', tasks:list.filter(function(t){return t.u==='later';})}
  ];
}
function allIncludingParked(){ return CLIENTS.map(enrich).sort(function(a,b){return a.key-b.key;}); }
function all(){ return allIncludingParked().filter(function(c){ return !c.parked; }); }
function parkedList(){ return allIncludingParked().filter(function(c){ return c.parked; }); }
function find(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return list[0]; }

/* ── actions ── */
function focusClient(id){ S.sel=id; save(); render(); }
function setFilter(f){ S.filter=f; save(); render(); }
function startPresent(){ S.pIdx=0; save(); document.getElementById('pres').classList.add('on'); renderPres(); }
function stopPresent(){ document.getElementById('pres').classList.remove('on'); }
function presMove(d){ var L=all(); S.pIdx=Math.max(0,Math.min(L.length-1,S.pIdx+d)); save(); renderPres(); }

/* ──────────────────────────────────────────────────────────────
   ALL-HANDS CAPTURE
   This dashboard is read-only against the trackers. Nothing here ever writes to
   a client's tracker — a capture records what we DECIDED on the call, and the
   post-call summary is the list of updates to go and make.

   A capture holds up to three things per task: the status it should move to, a
   note, and whether the client needs chasing. Captures sync to a shared key so
   whoever runs the call and whoever does the updates see the same list.
   ────────────────────────────────────────────────────────────── */
var CAPTURE_KEY = 'sabel-allhands-v1';
var CAP_STATUSES = ['Complete','In Progress','Blocked','Dependency','Pending'];
var capSyncTimer = null, CAP_SYNCED = null, CAP_SHARED = null;   // null = not tried yet

function capOf(id){ return S.cap[id] || null; }
function capCount(){ return Object.keys(S.cap).length; }
function capEnsure(id, t){
  if(!S.cap[id]) S.cap[id] = {status:'', note:'', chase:false,
    task:t?t.t:'', client:t?t.client:'', clientId:t?t.clientId:'',
    owner:t?t.o:'', was:t?t.liveStatus:'', due:t?t.due:'', at:Date.now()};
  return S.cap[id];
}
function capPrune(id){
  var c=S.cap[id];
  if(c && !c.status && !c.note && !c.chase) delete S.cap[id];
}
function capOpen(id, ev){
  if(ev) ev.stopPropagation();
  var closing = S.capOpen===id;
  S.capOpen = closing ? '' : id;
  if(closing) delete WRITE[id];        // the date-shift result was for that visit
  save(); render();
}
function capSetStatus(id, st, ev){
  if(ev) ev.stopPropagation();
  var L=all(), t=capFindTask(L,id); var c=capEnsure(id,t);
  c.status = (c.status===st) ? '' : st;      // click the active one again to clear
  c.at = Date.now();
  capPrune(id); save(); capSync(); render();
}
function capSetNote(id, val){
  var L=all(), t=capFindTask(L,id); var c=capEnsure(id,t);
  c.note = val; c.at = Date.now();
  capPrune(id); save(); capSync();
  capBadge();   // refresh the counter without re-rendering under the cursor
}
function capToggleChase(id, ev){
  if(ev) ev.stopPropagation();
  var L=all(), t=capFindTask(L,id); var c=capEnsure(id,t);
  c.chase = !c.chase; c.at = Date.now();
  capPrune(id); save(); capSync(); render();
}
function capClearOne(id, ev){
  if(ev) ev.stopPropagation();
  delete S.cap[id]; save(); capSync(); render();
}
function capClearAll(){
  if(!capCount()) return;
  if(!confirm('Clear all '+capCount()+' captured items?\n\nDo this once the tracker updates are done — it cannot be undone.')) return;
  S.cap={}; S.capOpen=''; save(); capSync(); render(); renderSummary();
}
function capFindTask(L,id){
  for(var i=0;i<L.length;i++){
    var ts=L[i].allTasks;
    for(var j=0;j<ts.length;j++) if(ts[j].id===id) return ts[j];
  }
  return null;
}

/* ── capture persistence ──
   Captures are written to localStorage immediately and pushed to a shared key so
   whoever runs the call and whoever applies the updates see the same list.

   The webhook only accepts keys on its allowlist. Until 'sabel-allhands-v1' is
   added to it in the sabel-webhook project, the POST returns 404 and captures
   stay on this browser only — which the summary says out loud rather than
   pretending the team can see them. */
function capSync(){
  if(capSyncTimer) clearTimeout(capSyncTimer);
  capSyncTimer = setTimeout(function(){
    fetch(API+'?key='+encodeURIComponent(CAPTURE_KEY)+'&_t='+Date.now(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data:{cap:S.cap, at:Date.now()}})
    }).then(function(r){
      CAP_SHARED = r.ok;
      if(r.ok) CAP_SYNCED = Date.now();
      capShareNote();
    }).catch(function(){ CAP_SHARED=false; capShareNote(); });
  }, 1200);
}
function capShareNote(){
  var el=document.getElementById('shareNote'); if(!el) return;
  if(CAP_SHARED===true){
    el.textContent='Shared with the team.'; el.style.color='var(--green)';
  } else if(CAP_SHARED===false){
    el.textContent='Saved on this browser only — the shared key is not enabled yet.';
    el.style.color='#FBBF24';
  } else { el.textContent=''; }
}
function loadCapture(){
  return fetchKey(CAPTURE_KEY).then(function(d){
    if(!d || !d.cap || typeof d.cap!=='object') return;
    // Merge rather than replace: whoever is mid-call keeps their unsynced edits.
    Object.keys(d.cap).forEach(function(k){
      var mine=S.cap[k], theirs=d.cap[k];
      if(!mine || (theirs.at||0) > (mine.at||0)) S.cap[k]=theirs;
    });
    CAP_SYNCED=Date.now(); save(); safeRender();
  });
}

/* ──────────────────────────────────────────────────────────────
   SHIFTING DATES
   The one thing this board writes back. Everything else it collects into Call
   capture for someone to apply by hand, but a slipped date is different: the
   point of moving it is that the next person to open the tracker sees the new
   one.

   A skill-format tracker does not store a date on a task. It stores a WEEK, and
   the date is derived from the week grid — WEEK1_START plus any per-week
   overrides in weekStarts. So there are two honest ways to move a date, and they
   are the two the tracker itself offers:

     move task   one task goes to a different week. Its span length is kept and
                 nothing else in the plan moves.
     slip week   a week's start date moves and every later week cascades with it,
                 for when the whole plan slides. Go-live is a commitment and
                 deliberately stays put — the tracker's own setWeekStart() does
                 the same, and the buffer to go-live is what absorbs the slip.

   Older trackers keep their plan in a shape with no week grid and no per-task
   address; those say so and stay read-only rather than being written blind.
   ────────────────────────────────────────────────────────────── */
var WS = {};        // trackerKey -> live weekStarts overrides
var MAXW = {};      // trackerKey -> highest week used by the plan
var WRITE = {};     // task id -> {state:'saving'|'saved'|'failed', msg}

function weekStartOf(key, n){
  var trk=TRK[key]||TRK_EMPTY, ws=WS[key]||{};
  if(ws[n]) return new Date(ws[n]+'T00:00:00');
  if(!trk.week1) return null;
  var d=new Date(trk.week1+'T00:00:00'); d.setDate(d.getDate()+(n-1)*7); return d;
}
function weekRange(key, n){
  var s=weekStartOf(key,n); if(!s||isNaN(s.getTime())) return '';
  var e=new Date(s.getTime()); e.setDate(e.getDate()+6);
  return s.getDate()+' '+MON[s.getMonth()]+' – '+e.getDate()+' '+MON[e.getMonth()];
}

/* Read the tracker fresh, apply `mutate`, write it back in the tracker's own
   save shape. Reading immediately before writing is the conflict check: anyone
   with the tracker open gets its "someone else has updated this" prompt on
   their next save rather than silently overwriting this change. */
function trackerWrite(key, mutate){
  var trk = TRK[key] || TRK_EMPTY;
  return fetch(API+'?key='+encodeURIComponent(key)+'&_t='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var saved = (j && j.ok) ? j.data : null;
      var rebuilt = !!(trk.buildV && saved && saved.buildV!==undefined &&
                       String(saved.buildV) !== String(trk.buildV));
      var payload;
      if(!saved || rebuilt){
        // The saved state has been superseded by a rebuild, so the tracker is
        // already ignoring it. Writing into it would put the change somewhere
        // nothing reads. Start from the built plan — what the tracker actually
        // shows today — and stamp it with the live build.
        if(!trk.seed) throw new Error('cannot read this tracker’s plan');
        payload = {buildV: trk.buildV ? +trk.buildV : undefined,
                   goLive: trk.goLive || '',
                   weekStarts: JSON.parse(JSON.stringify(trk.weekStarts||{})),
                   statuses:{}, notes:{}, links:{}, origStatus:{},
                   taskData: JSON.parse(JSON.stringify(trk.seed))};
      } else {
        payload = JSON.parse(JSON.stringify(saved));
        if(!payload.taskData) throw new Error('this tracker keeps no task data');
      }
      mutate(payload);
      payload.savedAt = Date.now();
      payload.savedBy = 'ops-dashboard';
      return fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
                         body: JSON.stringify({key:key, value: JSON.stringify(payload)})})
        .then(function(r){ if(!r.ok) throw new Error('the tracker refused the save ('+r.status+')'); });
    });
}
function rowAt(payload, a, title){
  var grp = payload.taskData && payload.taskData[a.pid];
  var row = grp && grp[a.side] && grp[a.side][a.idx];
  // The index is only trustworthy while it still points at the same task. If the
  // plan moved underneath us, stop rather than edit a neighbour by accident.
  if(!row || row.t !== title) throw new Error('that task has moved in the tracker — hit ↻ and try again');
  return row;
}
function shiftTaskWeek(t, delta, target){
  var a = t.at;
  return trackerWrite(a.key, function(p){
    var row = rowAt(p, a, t.t);
    var from = row.week || 0;
    var to = target || Math.max(1, from + delta);
    if(row.wkEnd && from && row.wkEnd > from) row.wkEnd = row.wkEnd + (to - from);   // keep the span length
    row.week = to;
    // A leftover free-text date would now contradict the week it sits in, and
    // both the tracker and this board prefer the week. Clear it.
    if(row.d) row.d = '';
  });
}
function slipWeek(t, days){
  var a = t.at, n = a.week;
  return trackerWrite(a.key, function(p){
    var trk = TRK[a.key] || TRK_EMPTY;
    if(!trk.week1) throw new Error('this tracker has no week grid to slip');
    var ws = p.weekStarts || (p.weekStarts = {});
    function startOf(i){
      if(ws[i]) return new Date(ws[i]+'T00:00:00');
      var d=new Date(trk.week1+'T00:00:00'); d.setDate(d.getDate()+(i-1)*7); return d;
    }
    var mx = 0;
    Object.keys(p.taskData||{}).forEach(function(pid){
      ['sabel','client'].forEach(function(side){
        ((p.taskData[pid]||{})[side]||[]).forEach(function(r){
          var e = (r.wkEnd && r.week && r.wkEnd>r.week) ? r.wkEnd : (r.week||0);
          if(e>mx) mx=e;
        });
      });
    });
    mx = Math.max(mx, 8) + 8;
    for(var i=n; i<=mx; i++){
      var d = startOf(i); d.setDate(d.getDate()+days); ws[i] = isoOf(d);
    }
  });
}
function runShift(id, fn, okMsg){
  WRITE[id] = {state:'saving'}; render();
  fn().then(function(){
    WRITE[id] = {state:'saved', msg:okMsg};
    return loadAll(true);          // re-read, so the board shows what the tracker now says
  }).catch(function(e){
    WRITE[id] = {state:'failed', msg:(e && e.message) || 'the write failed'};
    render();
  });
}
function shiftTask(id, delta, ev){
  if(ev) ev.stopPropagation();
  var t = capFindTask(all(), id); if(!t || !t.at) return;
  var to = Math.max(1, (t.at.week||0) + delta);
  runShift(id, function(){ return shiftTaskWeek(t, delta, 0); },
           'Moved to week '+to+' · '+(weekRange(t.at.key, to)||'dates follow the week grid'));
}
function shiftTaskTo(id, val){
  var t = capFindTask(all(), id); if(!t || !t.at || !val) return;
  runShift(id, function(){ return shiftTaskWeek(t, 0, +val); },
           'Moved to week '+val+' · '+(weekRange(t.at.key, +val)||'dates follow the week grid'));
}
function slipFrom(id, days, ev){
  if(ev) ev.stopPropagation();
  var t = capFindTask(all(), id); if(!t || !t.at || !t.at.week) return;
  var dd = Math.abs(days), when = days>0 ? 'later' : 'earlier';
  if(!confirm('Slip week '+t.at.week+' of '+t.client+' by '+dd+' day'+(dd===1?'':'s')+' '+when+'?\n\n'+
              'Every week from '+t.at.week+' onwards moves with it, for every task in this tracker. '+
              'Go-live stays where it is.\n\nThis writes to the live tracker.')) return;
  runShift(id, function(){ return slipWeek(t, days); },
           'Week '+t.at.week+' and later moved '+dd+' day'+(dd===1?'':'s')+' '+when);
}

/* ── capture UI ── */
function weekOptsHTML(t){
  var key=t.at.key, cur=t.at.week||0;
  var mx=Math.max(MAXW[key]||8, (t.at.wkEnd||cur)+2, 8), o='';
  if(!cur) o+='<option value="" selected>Put it in a week…</option>';
  for(var n=1;n<=mx;n++){
    var r=weekRange(key,n);
    o+='<option value="'+n+'"'+(n===cur?' selected':'')+'>Week '+n+(r?' · '+r:'')+'</option>';
  }
  return o;
}
function shiftRowHTML(t){
  if(!t.at || !t.at.key){
    return '<div class="crow"><span class="clab">Dates</span>'+
      '<span class="sub" style="padding-top:6px;line-height:1.5">This tracker keeps its plan in an older shape with no week grid, '+
      'so dates have to be moved in the tracker itself.</span></div>';
  }
  var w = WRITE[t.id] || {}, busy = w.state==='saving', dis = busy?' disabled':'';
  var cur = t.at.week||0;
  var span = (t.at.wkEnd && t.at.wkEnd>cur) ? ' – '+t.at.wkEnd : '';
  var note = w.state==='saving' ? '<span class="cwrite busy">saving to the tracker…</span>'
           : w.state==='saved'  ? '<span class="cwrite ok">'+esc(w.msg||'saved')+'</span>'
           : w.state==='failed' ? '<span class="cwrite bad">'+esc(w.msg||'failed')+'</span>'
           : '<span class="cwrite">writes straight to the tracker</span>';
  var move = (cur ? '<button class="cbtn"'+dis+' title="Move this task one week earlier" onclick="shiftTask(\''+t.id+'\',-1,event)">&larr; 1 wk</button>'+
                    '<button class="cbtn"'+dis+' title="Move this task one week later" onclick="shiftTask(\''+t.id+'\',1,event)">1 wk &rarr;</button>' : '')+
             '<select class="cwk"'+dis+' onchange="shiftTaskTo(\''+t.id+'\',this.value)">'+weekOptsHTML(t)+'</select>';
  var slip = cur
    ? '<div class="crow"><span class="clab">Slip plan</span><div class="cbtns">'+
        '<button class="cbtn"'+dis+' title="Move week '+cur+' and every later week one day earlier" onclick="slipFrom(\''+t.id+'\',-1,event)">&larr; 1 day</button>'+
        '<button class="cbtn"'+dis+' onclick="slipFrom(\''+t.id+'\',1,event)">1 day &rarr;</button>'+
        '<button class="cbtn"'+dis+' onclick="slipFrom(\''+t.id+'\',7,event)">1 week &rarr;</button>'+
        '<span class="sub" style="margin-left:2px">week '+cur+' onwards, whole tracker · go-live unchanged</span>'+
      '</div></div>'
    : '';
  return '<div class="crow"><span class="clab">Move task</span><div class="cbtns">'+move+
    '<span class="cwas">'+(cur?'now week '+cur+span:'unscheduled')+'</span></div></div>'+
    slip+
    '<div class="crow"><span class="clab"></span><div class="cbtns">'+note+'</div></div>';
}
function capBadge(){ return; }
function unusedCapBadge(){
  var b=document.getElementById('capBtn'); if(!b) return;
  var n=capCount();
  b.innerHTML = '&#9998; Call capture'+(n?' <span class="capn">'+n+'</span>':'');
  b.classList.toggle('has', n>0);
}
function capMarkHTML(t){ return ''; }
function unusedCapMarkHTML(t){
  if(!t.captured) return '';
  var bits=[];
  if(t.capStatus) bits.push('<span class="cmark st" style="color:'+(SC[t.capStatus]||SC.Pending).c+'">&rarr; '+esc(t.capStatus)+'</span>');
  if(t.chase) bits.push('<span class="cmark ch">chase client</span>');
  if(t.capNote) bits.push('<span class="cmark nt" title="'+esc(t.capNote)+'">note</span>');
  return bits.join('');

/* ── post-call summary ── */
function capItems(){
  return Object.keys(S.cap).map(function(id){
    var c=S.cap[id]; return {id:id, c:c};
  }).sort(function(a,b){
    var an=a.c.client||'', bn=b.c.client||'';
    return an<bn?-1:an>bn?1:(a.c.at||0)-(b.c.at||0);
  });
}
function openSummary(){ document.getElementById('sum').classList.add('on'); renderSummary(); }
function closeSummary(){ document.getElementById('sum').classList.remove('on'); }
function summaryText(){
  var items=capItems();
  if(!items.length) return 'Nothing captured.';
  var out=['Sabel all-hands — actions to apply', new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}), ''];
  var cur='';
  items.forEach(function(it){
    var c=it.c;
    if(c.client!==cur){ cur=c.client; out.push(''); out.push(cur.toUpperCase()); }
    var line='  • '+c.task;
    if(c.status) line+='  [status: '+(c.was||'—')+' → '+c.status+']';
    if(c.chase) line+='  [CHASE CLIENT]';
    out.push(line);
    if(c.note) out.push('      note: '+c.note);
  });
  out.push('');
  out.push('Apply these in each client tracker. Statuses, notes and chases are only captured here.');
  out.push('Any dates shifted on the board are already in the tracker and are not listed above.');
  return out.join('\n');
}
function copySummary(){
  var txt=summaryText();
  var btn=document.getElementById('copyBtn');
  function done(ok){ if(btn){ btn.textContent = ok?'Copied':'Copy failed'; setTimeout(function(){ btn.textContent='Copy all'; },1600); } }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});
  } else {
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done(ok);
  }
}
function renderSummary(){
  var box=document.getElementById('sumBody'); if(!box) return;
  var items=capItems();
  document.getElementById('sumCount').textContent = items.length ? items.length+' to apply' : '';
  capShareNote();
  if(!items.length){
    box.innerHTML='<div class="empty" style="padding:40px;text-align:center">Nothing captured yet.<br><span style="font-size:11px">Click any task on the board to record a status change, a note or a client chase.</span></div>';
    return;
  }
  var byClient={}, order=[];
  items.forEach(function(it){
    var n=it.c.client||'—';
    if(!byClient[n]){ byClient[n]=[]; order.push(n); }
    byClient[n].push(it);
  });
  box.innerHTML = order.map(function(n){
    return '<div class="sgrp"><div class="sgrp-h">'+esc(n)+'<span>'+byClient[n].length+'</span></div>'+
      byClient[n].map(function(it){
        var c=it.c, bits=[];
        if(c.status) bits.push('<span class="cmark st" style="color:'+(SC[c.status]||SC.Pending).c+'">'+esc(c.was||'—')+' &rarr; '+esc(c.status)+'</span>');
        if(c.chase) bits.push('<span class="cmark ch">chase client</span>');
        return '<div class="srow"><div style="flex:1;min-width:0">'+
          '<div class="ttx">'+esc(c.task)+'</div>'+
          '<div class="m"><span style="color:var(--mono)">'+esc(c.owner||'—')+'</span>'+bits.join('')+'</div>'+
          (c.note?'<div class="snote">'+esc(c.note)+'</div>':'')+
          '</div><button class="cbtn clr" onclick="capClearOne(\''+it.id+'\',event);renderSummary()">&times;</button></div>';
      }).join('')+'</div>';

/* ── by owner ──
   The all-hands view is a workload conversation, not a triage one: on the call
   you go round the room person by person and ask what each of them is carrying.
   So the presenter splits a client's open actions by owner. The client detail
   panel stays split by urgency, which is the right cut when you are working a
   single client's list down. */
function ownerGroupsFor(c){
  var by={}, order=[];
  applyFilter(c.outTasks).forEach(function(t){
    if(!by[t.o]){ by[t.o]=[]; order.push(t.o); }
    by[t.o].push(t);
  });
  var rank={overdue:0, blocked:1, week:2, later:3};
  return order.map(function(o){
    var tasks=by[o].slice().sort(function(a,b){
      var d=rank[a.u]-rank[b.u]; if(d) return d;                      // most pressing first
      return (a.due||'9999-99-99') < (b.due||'9999-99-99') ? -1 : 1;
    });
    var ow=OW[o]||OW_DEFAULT;
    return {label:o, color:ow.c, bg:ow.bg, tasks:tasks,
      overdue:tasks.filter(function(t){return t.u==='overdue';}).length,
      blocked:tasks.filter(function(t){return t.u==='blocked';}).length,
      week:tasks.filter(function(t){return t.u==='week';}).length};
  }).sort(function(a,b){
    // Client actions are what we are chasing, not what we are doing — last.
    if((a.label==='Client')!==(b.label==='Client')) return a.label==='Client'?1:-1;
    if(a.overdue!==b.overdue) return b.overdue-a.overdue;             // then whoever is most behind
    return b.tasks.length-a.tasks.length;
  });
}

  if(g.blocked) bits.push('<span class="obadge" style="color:#FBBF24;background:rgba(251,191,36,.14)">'+g.blocked+' blocked</span>');
  if(g.week)    bits.push('<span class="obadge" style="color:#60A5FA;background:rgba(96,165,250,.14)">'+g.week+' this week</span>');
  var rows = g.tasks.map(function(t){ return taskRowHTML(t, true); }).join('');
  return '<div class="grp"><div class="grp-h own" style="color:'+g.color+'">'+
    '<span class="oav" style="color:'+g.color+';background:'+g.bg+'">'+esc(g.label.slice(0,2))+'</span>'+
    '<span class="onm">'+esc(g.label)+'</span>'+
