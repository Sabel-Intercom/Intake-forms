function applyTheme(light){document.documentElement.classList.toggle('light',light);}
let LIGHT=false;try{LIGHT=localStorage.getItem('sabel-hub-theme')==='light';}catch(e){}
applyTheme(LIGHT);
function refreshAll(){Object.keys(TRK).forEach(k=>delete TRK[k]);pullOv();loadAll();}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.getAttribute('data-act'),host=a.closest('[data-id]'),id=host?host.getAttribute('data-id'):null;
  const t=id?findTask(id):null;
  switch(act){
    case 'flt':{const f=a.getAttribute('data-f');S.flt=(f&&S.flt!==f)?f:'';S.open=null;render();break;}
    case 'flt-clear':S.flt='';S.client='';render();break;
    case 'tab':S.tab=a.getAttribute('data-t');save();history.replaceState(null,'',S.tab==='summary'?'#summary':'#'+COORD.toLowerCase());render();window.scrollTo(0,0);break;
    case 'period':S.period=a.getAttribute('data-p');save();render();break;
    case 'group':S.group=a.getAttribute('data-g');save();render();break;
    case 'goto':if(t){S.who=t.owner;S.mode='list';S.flt='';S.client='';S.open=id;S.draft='';save();history.replaceState(null,'','#'+S.who.toLowerCase());render();
      const el=[].slice.call(document.querySelectorAll('.row')).find(r=>r.getAttribute('data-id')===id);if(el)el.scrollIntoView({block:'center'});}break;
    case 'timer':toggleTimer(id);break;
    case 'time-add':addTime(id);break;
    case 'time-del':delTime(id,a.closest('[data-eid]').getAttribute('data-eid'));break;
    case 'who':S.needQ=false;S.timeDraft='';S.who=a.getAttribute('data-who');S.flt='';S.client='';S.open=null;S.draft='';S.tag=false;history.replaceState(null,'','#'+S.who.toLowerCase());save();render();window.scrollTo(0,0);break;
    case 'mode':S.mode=a.getAttribute('data-m');S.open=null;S.draft='';S.tag=false;save();render();break;
    case 'open':S.editNote=null;S.delNote='';S.needQ=false;S.timeDraft='';S.open=(S.mode==='list'&&S.open===id)?null:id;S.draft='';S.tag=false;save();render();break;
    case 'close':S.open=null;S.draft='';S.tag=false;save();render();break;
    case 'full':S.full[a.getAttribute('data-col')]=true;render();break;
    case 'dot':cycle(id);break;
    case 'next':e.stopPropagation();cycle(id);break;
    case 'start':if(t)act2(id,t.status==='In Progress'?'Pending':'In Progress');break;
    case 'done':if(t)act2(id,isDone(t)?'Pending':'Complete');break;
    case 'flag':flagBlocked(id);break;
    case 'step':e.stopPropagation();tickStep(id,a.getAttribute('data-step'));break;
    case 'tag':S.tag=!S.tag;render();break;
    case 'post':postNote(id);break;
    case 'note-edit':{const nd=a.closest('[data-nid]').getAttribute('data-nid'),n=t&&t.notes.find(x=>x.id===nd);if(n){S.editNote={id:nd,txt:n.txt};S.delNote='';render();const el=document.querySelector('[data-ta="note"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}break;}
    case 'note-save':saveNoteEdit(id);break;
    case 'note-cancel':S.editNote=null;render();break;
    case 'note-del':S.delNote=a.closest('[data-nid]').getAttribute('data-nid');S.editNote=null;render();break;
    case 'note-del-no':S.delNote='';render();break;
    case 'note-del-yes':deleteNote(id,a.closest('[data-nid]').getAttribute('data-nid'));break;
    case 'park':park(id);break;
    case 'answer':answer(id,false);break;
    case 'reply':answer(id,true);break;
    case 'desk-done':act2(id,'Complete',COORD);break;
    case 'unblock':act2(id,'In Progress',COORD);break;
    case 'desk-toggle':S.deskOpen[id]=!S.deskOpen[id];render();break;
    case 'refresh':refreshAll();break;
    case 'theme':LIGHT=!LIGHT;applyTheme(LIGHT);try{localStorage.setItem('sabel-hub-theme',LIGHT?'light':'dark');}catch(x){}render();break;
    case 'audit':S.audit=!S.audit;if(S.audit&&!onDesk())S.mode='list';save();render();break;
    case 'aud-off':S.audit=false;save();render();break;
    case 'aud-undo':delete AUD[id];saveAud();project();render();break;
    case 'aud-clear':if(confirm('Clear all '+Object.keys(AUD).length+' queued changes?')){AUD={};saveAud();project();render();}break;
    case 'aud-copy':{
      const txt=auditText(),done=ok=>{const b=document.getElementById('aud-copy');if(b)b.textContent=ok?'Copied':'Select the box below and copy';};
      const sel=()=>{const x=document.getElementById('aud-text');if(x){x.focus();x.select();}done(false);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>done(true),sel);else sel();
      break;}
  }
});
const act2=act;   // inside the click handler `act` is the action name
document.addEventListener('input',e=>{
  const ta=e.target.getAttribute&&e.target.getAttribute('data-ta');if(!ta)return;
  if(ta==='draft'){S.draft=e.target.value;if(S.needQ&&S.draft.trim()){S.needQ=false;e.target.classList.remove('need');const m=document.querySelector('.needm');if(m)m.remove();}}
  else if(ta==='time')S.timeDraft=e.target.value;
  else if(ta==='note'){if(S.editNote)S.editNote.txt=e.target.value;}
  else S.deskDraft[ta.slice(5)]=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-ta')==='time'){e.preventDefault();const host=e.target.closest('[data-id]');if(host)addTime(host.getAttribute('data-id'));return;}
  if(e.key==='Escape'&&S.open&&S.mode==='board'&&!onDesk()){S.open=null;save();render();return;}
  if(e.key!=='Enter'||!(e.metaKey||e.ctrlKey))return;
  const ta=e.target.getAttribute&&e.target.getAttribute('data-ta');
  if(ta==='draft'&&S.open){e.preventDefault();postNote(S.open);}
  if(ta==='note'){e.preventDefault();const host=e.target.closest('[data-id]');if(host)saveNoteEdit(host.getAttribute('data-id'));}
});
document.addEventListener('change',e=>{
  if(e.target.getAttribute&&e.target.getAttribute('data-sel')==='client'){S.client=e.target.value;S.open=null;render();return;}
  const f=e.target.getAttribute&&e.target.getAttribute('data-aud');if(!f)return;
  setAudit(e.target.closest('.row').getAttribute('data-id'),f,e.target.value);
});
window.addEventListener('hashchange',()=>{if(/^#summary$/i.test(location.hash)){S.who=COORD;S.tab='summary';save();render();return;}const w=hashWho();if(w&&w!==S.who){S.who=w;S.open=null;save();render();}});

/* ── go ─────────────────────────────────────────────────────────────────── */
/* Running clocks tick on screen between renders. */
setInterval(()=>{document.querySelectorAll('[data-run]').forEach(el=>{el.textContent=fMins(elapsed(+el.getAttribute('data-run')));});},20000);
const typing=()=>{const ae=document.activeElement;return !!(ae&&ae.getAttribute&&ae.getAttribute('data-ta')&&ae.value);};
render();
pullOv().then(ch=>{if(!FIRST){project();render();}});
loadAll();
setInterval(()=>{if(document.hidden)return;pullOv().then(ch=>{if(ch&&!FIRST){project();render();}});},POLL_MS);
setInterval(()=>{if(!document.hidden&&!typing())loadAll();},REFRESH_MS);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!LOADED_AT)return;
  pullOv().then(ch=>{if(ch){project();render();}});
  if(Date.now()-LOADED_AT>REFRESH_MS)loadAll();
});
</script>
</body>
</html>
