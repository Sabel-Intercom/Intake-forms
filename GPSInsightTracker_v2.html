            ${t.week?`<select onclick="event.stopPropagation()" onchange="setTaskWeekEnd('${cid}',this.value)" title="Ongoing work? Set the week it runs until" style="flex:1;min-width:120px;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit">
              ${weekEndOptions(t)}
            </select>`:''}
            <input type="date" value="${t.week?isoDate(weekStartDate(t.week)):''}" onclick="openPicker(event,this)" onchange="setTaskWeekByDate('${cid}',this.value)" title="Pick a date to move this task (a span keeps its length)" style="font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:5px 8px;font-family:inherit">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap">
            <span style="font-size:10px;color:#475569">${t.week?(spanWeeksText(t)+' · '+ (isSpan(t)?taskDatesText(t).split('·')[1].trim():weekRangeLabel(t.week))):'Not scheduled to a week yet'}</span>
            <span style="display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#C084FC;cursor:pointer;user-select:none">
              <input type="checkbox" ${t.kind==='milestone'?'checked':''} onchange="setTaskKind('${cid}',this.checked)" style="accent-color:#C084FC;width:12px;height:12px">
              Milestone (checkpoint / sign-off)
            </label>
            <label onclick="event.stopPropagation()" title="Blockers appear on the go-live runway. 'Before the day' must be cleared ahead of launch; 'On the day' are cutover actions (channel switches, DNS, phones) done at go-live" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#FB923C;cursor:pointer;user-select:none">
              Go-live:
              <select onchange="setTaskGate('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
                <option value=""${!t.gate?' selected':''}>Not a blocker</option>
                <option value="pre"${(t.gate===true||t.gate==='pre')?' selected':''}>Blocker · before the day</option>
                <option value="day"${t.gate==='day'?' selected':''}>Cutover · on the day</option>
              </select>
            </label>
            ${(t.gate==='day'||_ph==='golive')?`<label onclick="event.stopPropagation()" title="When on go-live day this happens, relative to the go-live moment (e.g. the delta migration runs at T−2h)" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#E10600;cursor:pointer;user-select:none">
              When:
              <select onchange="setTaskWhen('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
                <option value=""${t.dayOff===undefined?' selected':''}>Time TBC</option>
                <option value="-240"${t.dayOff===-240?' selected':''}>T−4h</option>
                <option value="-120"${t.dayOff===-120?' selected':''}>T−2h</option>
                <option value="-60"${t.dayOff===-60?' selected':''}>T−1h</option>
                <option value="-30"${t.dayOff===-30?' selected':''}>T−30m</option>
                <option value="0"${t.dayOff===0?' selected':''}>At go-live</option>
                <option value="30"${t.dayOff===30?' selected':''}>T+30m</option>
                <option value="60"${t.dayOff===60?' selected':''}>T+1h</option>
                <option value="120"${t.dayOff===120?' selected':''}>T+2h</option>
              </select>
            </label>`:''}
            <label onclick="event.stopPropagation()" title="Flag this task as an action from a weekly call; it will appear in the Call actions panel on the overview" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#2DD4BF;cursor:pointer;user-select:none">
              From call:
              <input type="date" value="${t.call||''}" onclick="openPicker(event,this)" onchange="setTaskCall('${cid}',this.value)" style="font-size:11px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:3px 6px;font-family:inherit">
            </label>
            </span>
          </div>
        </div>
        <div style="margin-bottom:10px">
          <label>Pillar</label>
          <select onclick="event.stopPropagation()" onchange="moveTaskToPillar('${cid}',this.value)" title="Move this task to a different pillar (notes, links and schedule move with it)" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box">
            ${P.map(p=>`<option value="${p.id}"${p.id===_ph?' selected':''}>${p.l}</option>`).join('')}
          </select>
        </div>
        ${(t.sub&&t.sub.length)?'':(c=>c.length?`<div style="margin-bottom:10px">
          <label>Nest under a parent task</label>
          <select onclick="event.stopPropagation()" onchange="demoteToSub('${cid}',this.value)" title="Move this task inside another task as one of its steps" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box">
            <option value="">Keep as its own task</option>
            ${c.map(o=>`<option value="${o.cid}">${esc(o.t.t)}${o.t.sub&&o.t.sub.length?' ('+o.t.sub.length+' steps)':''}</option>`).join('')}
          </select>
        </div>`:'')(parentCandidates(cid))}
        <div style="margin-bottom:10px">
          <label>Notes</label>
          <textarea rows="3" placeholder="Add notes for this action..." oninput="saveNote('${cid}',this.value)">${esc(curNotes)}</textarea>
        </div>
        <div>
          <label>${linkLabel}</label>
          ${hasLink?`<input type="url" value="${esc(curLink)}" style="width:100%;font-size:12px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:6px 10px;font-family:inherit;box-sizing:border-box" placeholder="Paste a link..." onclick="event.stopPropagation()" onchange="saveLink('${cid}',this.value)">`:linkEl}
        </div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px">
          <button onclick="parkTask(event,'${cid}')" title="Agreed as out of scope for this engagement: parks the task in the Out of scope list" style="background:transparent;border:1px solid rgba(251,146,60,.3);color:#FB923C;font-size:11px;font-family:inherit;border-radius:6px;padding:4px 10px;cursor:pointer">Move to out of scope</button>
          <button onclick="deleteTask(event,'${cid}')" style="background:transparent;border:1px solid rgba(248,113,113,.3);color:#F87171;font-size:11px;font-family:inherit;border-radius:6px;padding:4px 10px;cursor:pointer">Remove task</button>
        </div>
        </div>`:''}`;
}

// ── Shared blocks ─────────────────────────────────────────────────────────────
function pillarBarsHTML(){
  return P.map(p=>{
    const m=phaseMini(p.id);
    const pPct=m.total>0?Math.round(m.done/m.total*100):0;
    return`<div style="display:flex;align-items:center;gap:8px">
      <span style="width:7px;height:7px;border-radius:50%;background:${p.c};flex-shrink:0;display:inline-block"></span>
      <span style="font-size:11px;color:#94A3B8;width:82px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.l}</span>
      <div style="flex:1;background:#1E2433;border-radius:2px;height:5px;overflow:hidden"><div style="height:100%;width:${pPct}%;background:${p.c}"></div></div>
      <span style="font-size:11px;width:26px;text-align:right;flex-shrink:0;font-weight:${pPct>0?'500':'400'};color:${pPct===100?'#4ADE80':pPct>0?p.c:'#475569'}">${pPct}%</span>
    </div>`;
  }).join('');
}
function ovTopCards(gs){
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const pctClr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  const completion=`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:16px">
      <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#475569;margin-bottom:10px">Overall completion</div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">
        <span style="font-size:36px;font-weight:700;color:${pctClr};line-height:1">${pct}%</span>
        <span style="font-size:13px;color:#475569">${gs.complete} / ${gs.total} actions</span>
      </div>
      ${gradBar(pct,10)}
      <div style="font-size:10px;font-weight:600;letter-spacing:.06em;color:#475569;text-transform:uppercase;margin:12px 0 8px">by pillar</div>
      <div style="display:flex;flex-direction:column;gap:7px">${pillarBarsHTML()}</div>
    </div>`;
  const glc=goLiveCard();
  // When there is no go-live date, the completion card spans the full width.
  return`<div class="ov-top"${glc?'':' style="grid-template-columns:1fr"'}>${completion}${glc}</div>`;
}
function phaseCompletionCard(pct,done,total){
  const clr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  // Compact card showing only THIS pillar's progress. Sits beside the filter
  // stat cards (see .phase-top) so the board is visible with less scrolling.
  return`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:center;height:100%">
    <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569;margin-bottom:8px">Phase completion</div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">
      <span style="font-size:28px;font-weight:700;color:${clr};line-height:1">${pct}%</span>
      <span style="font-size:11px;color:#475569">${done} / ${total} actions</span>
    </div>
    ${gradBar(pct,10)}
  </div>`;
}
function filterStatCards(on,att,risk,inPhase){
  const aOn=activeFilters.has('on'),aAtt=activeFilters.has('att'),aRisk=activeFilters.has('risk');
  const anyActive=aOn||aAtt||aRisk;
  const hint=inPhase?(anyActive?`<div class="filter-hint"><i class="ti ti-filter-filled" style="font-size:11px;color:#E10600"></i>Filtered view, click active card to clear</div>`:`<div class="filter-hint"><i class="ti ti-filter" style="font-size:11px"></i>Click a card to filter tasks below</div>`):'';
  return`<div class="stat-grid">
    <button class="sc f-on${aOn?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'on\')':''}">
      <div style="font-size:22px;font-weight:600;color:#4ADE80">${on}</div>
      <div style="font-size:11px;color:${aOn?'#4ADE80':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aOn?'<i class="ti ti-eye" style="font-size:11px"></i>':''}On track</div>
    </button>
    <button class="sc f-att${aAtt?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'att\')':''}">
      <div style="font-size:22px;font-weight:600;color:#FBBF24">${att}</div>
      <div style="font-size:11px;color:${aAtt?'#FBBF24':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aAtt?'<i class="ti ti-eye" style="font-size:11px"></i>':''}Needs attention</div>
    </button>
    <button class="sc f-risk${aRisk?' active':''}"${inPhase?'':' style="cursor:default"'} onclick="${inPhase?'toggleFilter(\'risk\')':''}">
      <div style="font-size:22px;font-weight:600;color:#F87171">${risk}</div>
      <div style="font-size:11px;color:${aRisk?'#F87171':'#475569'};margin-top:2px;display:flex;align-items:center;gap:4px">${aRisk?'<i class="ti ti-eye" style="font-size:11px"></i>':''}At risk</div>
    </button>
  </div>${hint}`;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  const gs=globalStats();
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const pctClr=pct>66?'#4ADE80':pct>33?'#FBBF24':'#E10600';
  const oa=cur==='overview';
  const ovBtn=`<button class="si" style="border-left:3px solid ${oa?'#E10600':'transparent'};${oa?'background:rgba(255,255,255,.03)':''}" onclick="setP('overview')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <div><div style="font-size:12px;font-weight:500;color:${oa?'#E2E8F0':'#94A3B8'}">Dashboard</div>
      <div style="font-size:10px;color:#475569;margin-top:1px">Where the project stands</div></div>
      <span style="font-size:12px;font-weight:600;color:${pctClr}">${pct}%</span>
    </div>${gradBar(pct,3)}
  </button>`;
  const phBtns=P.map(p=>{
    const m=phaseMini(p.id);
    const act=groupBy==='pillar'&&p.id===cur;
    const dPct=m.total>0?Math.round(m.done/m.total*100):0;
    const dClr=dPct===100?'#4ADE80':dPct>0?p.c:'#475569';
    return`<button class="si" style="border-left:3px solid ${act?p.c:'transparent'};${act?'background:rgba(255,255,255,.03)':''}" onclick="setP('${p.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px">
        <div style="min-width:0;flex:1">
          <div style="font-size:12px;font-weight:${act?'500':'400'};color:${act?'#E2E8F0':'#94A3B8'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.l}</div>
          <div style="font-size:10px;color:#475569;margin-top:1px">${p.w}</div>
        </div>
        <span style="font-size:11px;font-weight:${dPct>0?'600':'400'};color:${dClr};flex-shrink:0">${dPct}%</span>
      </div>
      <div style="background:#1E2433;border-radius:2px;height:3px;overflow:hidden"><div style="height:100%;width:${dPct}%;background:${p.c}"></div></div>
    </button>`;
  }).join('');
  const weekBtns=weekList().map(w=>{
    const m=weekMini(w);
    const act=groupBy==='week'&&w===cur;
    const dPct=m.total>0?Math.round(m.done/m.total*100):0;
    const dClr=dPct===100?'#4ADE80':dPct>0?'#E10600':'#475569';
    return`<button class="si" style="border-left:3px solid ${act?'#E10600':'transparent'};${act?'background:rgba(255,255,255,.03)':''}" onclick="setP('${w}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px">
        <div style="min-width:0;flex:1">
          <div style="font-size:12px;font-weight:${act?'500':'400'};color:${act?'#E2E8F0':'#94A3B8'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w}</div>
          <div style="font-size:10px;color:#475569;margin-top:1px">${m.done}/${m.total} done</div>
        </div>
        <span style="font-size:11px;font-weight:${dPct>0?'600':'400'};color:${dClr};flex-shrink:0">${dPct}%</span>
      </div>
      <div style="background:#1E2433;border-radius:2px;height:3px;overflow:hidden"><div style="height:100%;width:${dPct}%;background:#E10600"></div></div>
    </button>`;
  }).join('');
  const groupBtns=groupBy==='week'?weekBtns:phBtns;
  const secLabel=groupBy==='week'?'Weeks':'Pillars';
  const toggle=`<div style="padding:10px 12px;border-bottom:1px solid #1E2433">
    <div style="display:flex;background:#0F1117;border:1px solid #1E2433;border-radius:7px;padding:2px">
      <button onclick="setGroupBy('pillar')" style="flex:1;border:none;cursor:pointer;font-family:inherit;font-size:11px;padding:5px 6px;border-radius:5px;background:${groupBy==='pillar'?'#E10600':'transparent'};color:${groupBy==='pillar'?'#fff':'#94A3B8'}">By pillar</button>
      <button onclick="setGroupBy('week')" style="flex:1;border:none;cursor:pointer;font-family:inherit;font-size:11px;padding:5px 6px;border-radius:5px;background:${groupBy==='week'?'#E10600':'transparent'};color:${groupBy==='week'?'#fff':'#94A3B8'}">By week</button>
    </div>
  </div>`;
  document.getElementById('sidebar').innerHTML=`
    ${INTERNAL?`<div title="Hours mode is on because the URL ends in #hours. Remove it to hide them again" style="background:rgba(167,139,250,.12);border-bottom:1px solid rgba(167,139,250,.35);padding:7px 12px;display:flex;align-items:center;gap:7px">
      <i class="ti ti-clock-dollar" style="font-size:13px;color:#A78BFA;flex-shrink:0"></i>
      <div style="font-size:10px;color:#A78BFA;line-height:1.4">Hours mode on. Drop <b>#hours</b> from the URL to hide them</div>
    </div>`:''}
    <div class="sb-head">
      <img src="${LOGO}" class="sb-logo" alt="Sabel">
      <div class="sb-title">GPS Insight</div>
      <div class="sb-sub">Project tracker · Jun-Sep 2026</div>
      ${goLiveDate?`<div title="Target go-live date" style="font-size:11px;font-weight:600;color:#E10600;margin-top:6px;display:flex;align-items:center;gap:5px"><i class="ti ti-rocket" style="font-size:12px"></i>Go-live ${new Date(goLiveDate+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>`:''}
    </div>
    ${toggle}${ovBtn}<div class="sb-sec">${secLabel}</div>${groupBtns}
    <div style="margin-top:auto">
      ${(g=>g?`<button class="si" id="runway-nav" style="border-top:1px solid #1E2433;border-left:3px solid ${cur==='runway'?'#E10600':'transparent'};${cur==='runway'?'background:rgba(255,255,255,.03)':''}" onclick="setP('runway')">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
          <div style="display:flex;align-items:center;gap:6px;min-width:0">
            <i class="ti ti-rocket" style="font-size:13px;color:#E10600;flex-shrink:0"></i>
            <span style="font-size:12px;font-weight:${cur==='runway'?'500':'400'};color:${cur==='runway'?'#E2E8F0':'#94A3B8'}">Go-live checklist</span>
          </div>
          ${(n=>n?`<span title="Still to clear before go-live" style="font-size:10px;font-weight:600;color:#E10600;background:rgba(225,6,0,.12);border-radius:10px;padding:1px 7px;flex-shrink:0">${n}</span>`:`<i class="ti ti-check" title="Runway clear" style="font-size:12px;color:#4ADE80;flex-shrink:0"></i>`)(g.filter(o=>o.t.s!=='Complete').length)}
        </div>
      </button>`:'')(goLiveDate?gateItems():null)}
      ${(n=>n?`<button class="si" id="parked-nav" style="border-top:1px solid #1E2433;border-left:3px solid ${cur==='parked'?'#FB923C':'transparent'};${cur==='parked'?'background:rgba(255,255,255,.03)':''}" onclick="setP('parked')">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
          <div style="display:flex;align-items:center;gap:6px;min-width:0">
            <i class="ti ti-archive" style="font-size:13px;color:#FB923C;flex-shrink:0"></i>
            <span style="font-size:12px;font-weight:${cur==='parked'?'500':'400'};color:${cur==='parked'?'#E2E8F0':'#94A3B8'}">Out of scope</span>
          </div>
          <span id="parked-count" style="font-size:10px;font-weight:600;color:#FB923C;background:rgba(251,146,60,.12);border-radius:10px;padding:1px 7px;flex-shrink:0">${n}</span>
        </div>
      </button>`:'')(parkedCount())}
      ${INTERNAL?`<button class="si" id="hours-nav" style="border-top:1px solid #1E2433;border-left:3px solid ${cur==='hours'?'#A78BFA':'transparent'};${cur==='hours'?'background:rgba(255,255,255,.03)':''}" onclick="setP('hours')">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
          <div style="display:flex;align-items:center;gap:6px;min-width:0">
            <i class="ti ti-clock-dollar" style="font-size:13px;color:#A78BFA;flex-shrink:0"></i>
            <span style="font-size:12px;font-weight:${cur==='hours'?'500':'400'};color:${cur==='hours'?'#E2E8F0':'#94A3B8'}">Hours</span>
          </div>
          ${(r=>`<span title="Delivered of planned hours" style="font-size:10px;font-weight:600;color:#A78BFA;background:rgba(167,139,250,.12);border-radius:10px;padding:1px 7px;flex-shrink:0">${fmtH(r.done)}/${fmtH(r.total)}</span>`)(hoursRollup())}
        </div>
      </button>`:''}
      <div class="sb-footer">
        <button onclick="openActionsPop(event)" title="Export every action as a table (CSV or copy-paste) filtered to Client, Sabel or both" style="width:100%;background:transparent;border:1px solid #1E2433;color:#64748B;font-size:11px;font-family:inherit;border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-table-export" style="font-size:12px"></i>Export actions</button>
        <button onclick="openStatusReport()" title="Open a print-ready, Sabel-branded status report, then use Save as PDF in the print dialog" style="margin-top:8px;width:100%;background:transparent;border:1px solid #1E2433;color:#64748B;font-size:11px;font-family:inherit;border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-file-analytics" style="font-size:12px"></i>Snapshot</button>
        <button onclick="downloadSnapshot()" title="Download the current plan state as a date-stamped JSON file for backup or restore" style="margin-top:6px;width:100%;background:transparent;border:none;color:#475569;font-size:10px;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;text-align:center">Download data backup (JSON)</button>
      </div>
    </div>`;
}

// ── Dashboard overview (interactive tiles) ────────────────────────────────────
// The overview is a set of tiles that each open a detail overlay, plus the task
// board. Tiles read live task data; edits inside an overlay autosave through the
// same path as the board. The go-live runway is NOT here (own sidebar view).
let ovv=null;          // open overlay {view,arg} or null
let ovSel=P[0].id;     // pillar selected in the Pillar boards overlay chips
function ovExpand(view,arg){ovv={view,arg:arg||null};renderMain();}
function ovClose(){ovv=null;renderMain();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovv){ovv=null;renderMain();}});
function ovSelect(id){ovSel=id;renderMain();}
// "What we need from you" rows expand in place to show the client-facing detail
// (what it involves, steps, notes, link) with no edit form; the full card is one
// click away via gotoTask.
let youOpen=new Set();
function toggleYou(e,cid){
  e.stopPropagation();
  if(youOpen.has(cid))youOpen.delete(cid); else youOpen.add(cid);
  renderMain();
}
// Go-live runway on the Dashboard: auto within RUNWAY_DASH_DAYS of go-live.
function dashRunwayShow(){
  if(runwayOnDash==='off')return false;
  if(!goLiveDate||!gateItems().length)return false;
  if(runwayOnDash==='on')return true;
  const g=ovGoLive();
  return !!g&&g.d<=RUNWAY_DASH_DAYS;
}
function setRunwayOnDash(v){runwayOnDash=v;renderMain();scheduleAutoSave();}
function ovAll(){
  // Every in-scope task with its card id and pillar context.
  const out=[];
  P.forEach(ph=>['sabel','client'].forEach(g=>{
    (T[ph.id][g]||[]).forEach((t,i)=>{ if(!t.parked) out.push({t,cid:ph.id+'-'+(g==='sabel'?'s':'c')+'-'+i,pid:ph.id,pc:ph.c,pl:ph.l,side:g}); });
  }));
  return out;
}
function ovVis(list){return list.filter(o=>!hiddenByDone(o.t));}
function ovDueKey(t){return (t&&t.week&&t.week>=1)?endWeek(t):9999;}
function ovCard(o){return makeCard(o.t,o.cid,o.side==='client',{noDrag:true});}
function ovCardP(o){return makeCard(o.t,o.cid,o.side==='client',{c:o.pc,l:o.pl,noDrag:true});}
function ovGoLive(){
  if(!goLiveDate)return null;
  const gl=new Date(goLiveDate+'T00:00:00'); if(isNaN(gl.getTime()))return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=Math.ceil((gl-now)/86400000);
  return{gl,d,big:d>0?d:(d===0?'Today':'Live'),
    sub:d>0?(d===1?'day until go-live':'days until go-live'):(d===0?'go-live day':'launched'),
    long:gl.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
}
function ovBoardChip(active,label,color,onclick){
  return`<button onclick="${onclick}" style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;font-family:inherit;border-radius:9px;padding:7px 14px;cursor:pointer;transition:all .12s;${active?'color:#fff;background:#E10600;border:1px solid #E10600':'color:#CBD5E1;background:#12151E;border:1px solid #1E2433'}"><span style="width:9px;height:9px;border-radius:50%;background:${active?'#fff':color};flex-shrink:0"></span>${esc(label)}</button>`;
}
function ovDashboard(gs){
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const all=ovAll();
  const clientOpen=all.filter(o=>o.side==='client'&&o.t.s!=='Complete').sort((a,b)=>ovDueKey(a.t)-ovDueKey(b.t));
  const gl=ovGoLive();
  const exp='<span style="position:absolute;top:9px;right:11px;font-size:11px;color:#475569">⤢</span>';
  const kpi=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
    <div onclick="ovExpand('completion')" style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:.06em">Completion</div>
      <div style="font-size:26px;font-weight:700;color:#4ADE80;margin:4px 0 6px">${pct}%</div>
      <div style="height:4px;background:#0F1117;border-radius:2px"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#E10600,#4ADE80);border-radius:2px"></div></div></div>
    <div onclick="ovExpand('status','on')" style="background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.3);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#4ADE80;text-transform:uppercase;letter-spacing:.06em">On track</div>
      <div style="font-size:26px;font-weight:700;color:#4ADE80;margin-top:4px">${gs.on}</div>
      <div style="font-size:10px;color:#64748B">complete + in progress</div></div>
    <div onclick="ovExpand('status','att')" style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#FBBF24;text-transform:uppercase;letter-spacing:.06em">Needs attention</div>
      <div style="font-size:26px;font-weight:700;color:#FBBF24;margin-top:4px">${gs.att}</div>
      <div style="font-size:10px;color:#64748B">pending + dependencies</div></div>
    <div onclick="ovExpand('status','risk')" style="background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#F87171;text-transform:uppercase;letter-spacing:.06em">At risk</div>
      <div style="font-size:26px;font-weight:700;color:#F87171;margin-top:4px">${gs.risk}</div>
      <div style="font-size:10px;color:#64748B">blocked items</div></div>
  </div>`;
  const w=bufferWarning();
  const glCard=gl?`<div onclick="ovExpand('golive')" style="background:#161B26;border:1px solid rgba(225,6,0,.35);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#E10600;font-weight:600;text-transform:uppercase;letter-spacing:.07em;align-self:flex-start"><i class="ti ti-rocket" style="font-size:11px"></i> Go-live</div>
      <div style="font-size:44px;font-weight:700;color:#E10600;line-height:1;margin:12px 0 4px">${gl.big}</div>
      <div style="font-size:10px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em">${gl.sub}</div>
      <div style="border-top:1px solid rgba(225,6,0,.2);margin-top:12px;padding-top:10px;font-size:11px;color:#94A3B8;width:100%">${gl.long}</div>
      ${w?`<div style="font-size:10px;color:${w.clr};margin-top:6px"><i class="ti ti-alert-triangle" style="font-size:11px"></i> ${w.msg}</div>`:''}</div>`
    :`<div style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#475569;font-size:12px">No go-live date set</div>`;
  const pillarProg=`<div onclick="ovExpand('pillars')" style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Pillar progress</div>
      <div style="display:flex;flex-direction:column;gap:9px">${P.map(p=>{const m=phaseMini(p.id);const pp=m.total>0?Math.round(m.done/m.total*100):0;const clr=pp===100?'#4ADE80':pp>0?p.c:'#475569';return`<div style="display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center"><span style="font-size:11px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.l)}</span><div style="height:6px;background:#0F1117;border-radius:3px"><div style="height:100%;width:${pp}%;background:${p.c};border-radius:3px"></div></div><span style="font-size:11px;font-weight:600;text-align:right;color:${clr}">${pp}%</span></div>`;}).join('')}</div></div>`;
  const msRows=milestoneEntries().slice(0,6).map(e=>{const s=milestoneState(e);const title=e.type==='task'?esc(e.t.t):esc(e.p.l)+' complete';return`<div style="display:flex;gap:9px;align-items:flex-start"><span style="width:9px;height:9px;border-radius:50%;background:${s.clr};margin-top:2px;flex-shrink:0"></span><div style="min-width:0"><div style="font-size:11px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div style="font-size:10px;color:${s.clr}">${s.label}</div></div></div>`;}).join('');
  const msCard=`<div onclick="ovExpand('milestones')" style="background:#161B26;border:1px solid #1E2433;border-radius:10px;padding:14px;cursor:pointer;position:relative">${exp}
      <div style="font-size:10px;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">Milestones</div>

  const row2=`<div style="display:grid;grid-template-columns:280px 1fr 300px;gap:12px;align-items:stretch">${glCard}${pillarProg}${msCard}</div>`;
  // ── What we need from you: the hero panel. Always expanded, never collapsed

  const youRow=o=>{
    const t=o.t,od=isOverdue(t),due=t.week>=1?weekDueDate(endWeek(t)):'',sc=SC[t.s]||SC.Pending,st=subCounts(t);
    const open=youOpen.has(o.cid);
    const notes=String(cardNotes[o.cid]!==undefined?cardNotes[o.cid]:(t.notes||'')).trim();
    const link=String(cardLinks[o.cid]!==undefined?cardLinks[o.cid]:(t.link||'')).trim();
    const hasDetail=!!(t.tip||notes||link||st.m);
    // Expanded body: the context a client needs (what it involves, notes, link,
    // steps) with no edit form. "Open in <pillar>" hands off to the full card.
    const body=open?`<div style="border-top:1px solid #1E2433;margin-top:10px;padding-top:10px">

            <button class="chk-btn" onclick="toggleSub(event,'${o.cid}',${i})" title="${sd?'Mark step incomplete':'Mark step complete'}" style="padding-top:0;align-items:center"><i class="ti ti-${sd?'circle-check-filled':'circle'}" style="font-size:14px;color:${sd?'#4ADE80':'#334155'}"></i></button>
            <span style="font-size:11.5px;color:${sd?'#475569':'#CBD5E1'};${sd?'text-decoration:line-through':''};line-height:1.4">${esc(s.t)}</span>
          </div>`;}).join('')}</div></div>`:''}
        ${notes?`<div style="margin-bottom:10px"><div style="font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#64748B;margin-bottom:3px">Notes</div><div style="font-size:11.5px;color:#94A3B8;line-height:1.55;white-space:pre-wrap">${esc(notes)}</div></div>`:''}
        ${link?`<div style="margin-bottom:10px"><a href="${esc(link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11.5px;color:#60A5FA;display:inline-flex;align-items:center;gap:5px;text-decoration:none"><i class="ti ti-external-link" style="font-size:12px"></i>${esc(link.replace('https://','').split('/').slice(0,3).join('/'))}</a></div>`:''}
        <button onclick="event.stopPropagation();gotoTask('${o.cid}')" style="background:transparent;border:1px solid #2A3145;color:#94A3B8;font-size:11px;font-family:inherit;border-radius:7px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px">Open in ${esc(o.pl)}<i class="ti ti-arrow-right" style="font-size:12px"></i></button>
      </div>`:'';
    return`<div style="padding:10px 12px;background:#12151D;border:1px solid ${od?'rgba(248,113,113,.35)':'rgba(251,191,36,.22)'};border-left:3px solid ${od?'#F87171':'#FBBF24'};border-radius:8px">
      <div onclick="toggleYou(event,'${o.cid}')" style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none">
      <button class="chk-btn" onclick="toggleComplete(event,'${o.cid}')" title="Mark complete" style="padding-top:0;align-items:center"><i class="ti ti-circle" style="font-size:17px;color:#475569"></i></button>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:12.5px;color:#E2E8F0;line-height:1.4">${esc(t.t)}</span>
          ${st.m?`<span title="${st.n} of ${st.m} steps done" style="font-size:9px;font-weight:600;color:#94A3B8;background:#1E2433;padding:1px 6px;border-radius:10px">${st.n}/${st.m}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
          <span style="font-size:10px;color:${o.pc}">${esc(o.pl)}</span>
          ${od?`<span style="font-size:9px;font-weight:600;color:#F87171;background:rgba(248,113,113,.15);padding:1px 6px;border-radius:3px;letter-spacing:.03em">OVERDUE</span>`
              :(due?`<span style="font-size:10px;color:#64748B">due ${due}</span>`:'')}
        </div>
      </div>
      <button class="stat-bdg" style="color:${sc.c};background:${sc.bg};flex-shrink:0" onclick="openStatusPicker(event,'${o.cid}')">${t.s}<i class="ti ti-chevron-down" style="font-size:9px;opacity:.7;margin-left:1px"></i></button>
      <i class="ti ti-chevron-${open?'up':'down'}" title="${hasDetail?'Show details':'Open this task'}" style="font-size:13px;color:#475569;flex-shrink:0"></i>
      </div>
      ${body}
    </div>`;};
  const youPanel=`<div style="background:#161B26;border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:16px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap">
        <i class="ti ti-hand-click" style="font-size:17px;color:#FBBF24"></i>
        <span style="font-size:16px;font-weight:600;color:#E2E8F0">What we need from you</span>
        <span style="font-size:11px;font-weight:600;color:#FBBF24;background:rgba(251,191,36,.14);border-radius:12px;padding:2px 9px">${clientOpen.length} open</span>
        ${(n=>n?`<span style="font-size:11px;font-weight:600;color:#F87171;background:rgba(248,113,113,.14);border-radius:12px;padding:2px 9px">${n} overdue</span>`:'')(clientOpen.filter(o=>isOverdue(o.t)).length)}
      </div>
      <div style="font-size:11px;color:#64748B;margin-bottom:12px">Earliest due first. Tick one off as soon as it is done, or hover the info icon for what it involves.</div>
      ${clientOpen.length?`<div style="display:flex;flex-direction:column;gap:7px">${clientOpen.map(youRow).join('')}</div>`
        :`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#4ADE80;padding:10px 0"><i class="ti ti-circle-check-filled" style="font-size:17px"></i>Nothing outstanding, thank you. We will let you know when we need the next thing.</div>`}
    </div>`;
  // ── What Sabel is working on: active Sabel work, so the client can see
  // movement without opening a pillar.
  const sabelActive=ovVis(all.filter(o=>o.side==='sabel'&&o.t.s==='In Progress'))
    .sort((a,b)=>ovDueKey(a.t)-ovDueKey(b.t));
  const sabelNext=ovVis(all.filter(o=>o.side==='sabel'&&o.t.s==='Pending'))
    .sort((a,b)=>ovDueKey(a.t)-ovDueKey(b.t)).slice(0,3);
  const workRow=(o,dim)=>{const st=subCounts(o.t);const sc=SC[o.t.s]||SC.Pending;return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #1E2433">
      <span style="width:7px;height:7px;border-radius:50%;background:${o.pc};flex-shrink:0"></span>
      <span style="font-size:12px;flex:1;min-width:0;color:${dim?'#94A3B8':'#E2E8F0'};line-height:1.4">${esc(o.t.t)}</span>
      ${st.m?`<span style="font-size:9px;font-weight:600;color:#94A3B8;background:#1E2433;padding:1px 6px;border-radius:10px;flex-shrink:0">${st.n}/${st.m}</span>`:''}
      <span style="font-size:10px;color:${(OW[o.t.o]||OW.Chris).c};flex-shrink:0">${esc(o.t.o)}</span>
      <span style="font-size:9px;color:${sc.c};background:${sc.bg};border-radius:10px;padding:2px 8px;white-space:nowrap;flex-shrink:0">${o.t.s}</span>
    </div>`;};
  const sabelPanel=`<div style="background:#161B26;border:1px solid #1E2433;border-radius:12px;padding:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <i class="ti ti-tool" style="font-size:16px;color:#60A5FA"></i>
        <span style="font-size:15px;font-weight:600;color:#E2E8F0">What Sabel is working on</span>
      </div>
      <div style="font-size:11px;color:#64748B;margin-bottom:6px">Live build work on our side, nothing needed from you here.</div>
      ${sabelActive.length?sabelActive.map(o=>workRow(o,false)).join(''):'<div style="font-size:12px;color:#475569;padding:8px 0">Nothing in progress right now.</div>'}
      ${sabelNext.length?`<p style="font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#64748B;margin:10px 0 0">Up next</p>${sabelNext.map(o=>workRow(o,true)).join('')}`:''}
    </div>`;
  // ── Blockers and dependencies: what is actually holding the project up.
  // Blocked work of either side, plus dependencies that have gone past due.
  const blockers=ovVis(all.filter(o=>o.t.s==='Blocked'||(o.t.s==='Dependency'&&isOverdue(o.t))))
    .sort((a,b)=>ovDueKey(a.t)-ovDueKey(b.t));
  const blockRow=o=>{const blocked=o.t.s==='Blocked';const sc=SC[o.t.s]||SC.Pending;return`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #1E2433">
      <i class="ti ti-${blocked?'alert-octagon':'clock-exclamation'}" style="font-size:14px;color:${blocked?'#F87171':'#FBBF24'};flex-shrink:0"></i>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:#E2E8F0;line-height:1.4">${esc(o.t.t)}</div>
        <div style="font-size:10px;color:#64748B;margin-top:2px">${esc(o.pl)} · ${o.side==='client'?'with you':'with '+esc(o.t.o)}${isOverdue(o.t)?' · <span style="color:#F87171">overdue</span>':''}</div>
      </div>
      <span style="font-size:9px;color:${sc.c};background:${sc.bg};border-radius:10px;padding:2px 8px;white-space:nowrap;flex-shrink:0">${o.t.s}</span>
    </div>`;};
  const blockPanel=`<div style="background:#161B26;border:1px solid ${blockers.length?'rgba(248,113,113,.3)':'#1E2433'};border-radius:12px;padding:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <i class="ti ti-alert-triangle" style="font-size:16px;color:${blockers.length?'#F87171':'#4ADE80'}"></i>
        <span style="font-size:15px;font-weight:600;color:#E2E8F0">Blockers &amp; dependencies</span>
        ${blockers.length?`<span style="font-size:11px;font-weight:600;color:#F87171;background:rgba(248,113,113,.14);border-radius:12px;padding:2px 9px">${blockers.length}</span>`:''}
      </div>
      <div style="font-size:11px;color:#64748B;margin-bottom:6px">Anything holding the project up right now.</div>
      ${blockers.length?blockers.map(blockRow).join(''):'<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#4ADE80;padding:8px 0"><i class="ti ti-circle-check" style="font-size:15px"></i>Nothing blocked. The plan is running clear.</div>'}
    </div>`;
  const hasScope=!!(SOW&&((SOW.hours>0)||(SOW.inScope&&SOW.inScope.length)||(SOW.outOfScope&&SOW.outOfScope.length)));
  const scopeCard=hasScope?`<div onclick="ovExpand('scope')" style="background:#161B26;border:1px solid rgba(96,165,250,.25);border-radius:12px;padding:16px;cursor:pointer;position:relative">${exp}
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><i class="ti ti-file-check" style="font-size:16px;color:#60A5FA"></i><span style="font-size:15px;font-weight:600;color:#E2E8F0">Scope &amp; hours</span></div>
      <div style="font-size:11px;color:#64748B;margin-bottom:10px">What we agreed in the SOW.</div>
      ${SOW.hours>0?`<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:26px;font-weight:700;color:#E2E8F0;line-height:1">${SOW.hours}</span><span style="font-size:11px;color:#94A3B8">hours agreed</span></div>`:''}
      <div style="font-size:10px;color:#475569;margin-top:8px">${(SOW.inScope||[]).length} in scope · ${(SOW.outOfScope||[]).length} out of scope · click to view</div></div>`:'';
  const row4=`<div style="display:grid;grid-template-columns:${hasScope?'1.2fr 1fr 0.9fr':'1fr 1fr'};gap:12px;align-items:start">${sabelPanel}${blockPanel}${scopeCard}</div>`;
  // What we need from you sits beside Call actions: the client's to-do list and
  // what was agreed on the calls, read together.
  const row3=`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start">${youPanel}<div>${callActionsPanel()}</div></div>`;
  // The runway joins the Dashboard only when go-live is close (or pinned on),
  // so the page stays calm early and turns into a launch view at the end.
  const runwayBlock=dashRunwayShow()?`<div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:-4px">
        <span style="font-size:10px;color:#475569">Runway on dashboard</span>

function buildBufferDays(){
  // Days between the end of the last incomplete build task and the go-live date.
  // Excludes the go-live and post go-live pillars (their tasks belong at/after
  // go-live by design). Returns null when there is nothing to measure.
  // The buffer itself is internal and never displayed while healthy; the
  // go-live card only warns when it drops below WARN_BUFFER_DAYS or negative.
  if(!goLiveDate)return null;
  const gl=new Date(goLiveDate+'T00:00:00'); if(isNaN(gl.getTime()))return null;
  let last=null;
  P.forEach(p=>{ if(p.id==='golive'||p.id==='post')return;
    ['sabel','client'].forEach(g=>inScope(p.id,g).forEach(t=>{
      if(t.s==='Complete'||!t.week||t.week<1)return;
      const e=new Date(weekStartDate(endWeek(t)).getTime()); e.setDate(e.getDate()+6);
      if(!last||e>last)last=e;
    }));
  });
  if(!last)return null;
  return Math.round((gl-last)/86400000);
}
const WARN_BUFFER_DAYS=7;
function bufferWarning(){
  // '' when healthy; otherwise {msg,clr} for the go-live card.
  const b=buildBufferDays();
  if(b===null||b>=WARN_BUFFER_DAYS)return null;
  // Qualitative only: never disclose the number of buffer days on the card.
  if(b<0)return{msg:'Build tasks are scheduled after go-live',clr:'#F87171'};
  return{msg:'Build schedule is running close to go-live',clr:'#FBBF24'};
}
function goLiveCard(){
  // Go-live countdown, styled as a card so it sits beside Overall completion
  // in the overview top row. Returns '' when no go-live date is set.
  const accentBase='#E10600';
  // Edit mode: show a date picker (also reachable when there is currently no date).
  if(editingGoLive){
    return `<div style="background:#161B26;border:1px solid ${accentBase}55;border-radius:10px;padding:16px;display:flex;flex-direction:column">
      <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:${accentBase};display:flex;align-items:center;gap:6px;margin-bottom:14px"><i class="ti ti-rocket" style="font-size:13px"></i>Go-live</div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px">
        <label style="font-size:12px;color:#94A3B8">Set the go-live date</label>
        <input type="date" id="golive-input" value="${goLiveDate||''}" onchange="setGoLive(this.value)" onclick="openPicker(event,this)" style="cursor:pointer;width:100%;font-size:13px;color:#E2E8F0;background:#161B26;border:1px solid #2A3145;border-radius:6px;padding:8px 10px;font-family:inherit;box-sizing:border-box">

      </div>
    </div>`;
  }
  if(!goLiveDate) return '';
  const gl=new Date(goLiveDate+'T00:00:00');
  if(isNaN(gl.getTime())) return '';
  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.ceil((gl-now)/86400000);
  const dateStr=gl.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let big,sub,accent=accentBase;
  if(days>0){ big=days; sub=(days===1?'day ':'days ')+'until go-live'; }

  const numeric=typeof big==='number';

      <span style="font-size:${numeric?'58':'40'}px;font-weight:700;color:${accent};line-height:.95;font-variant-numeric:tabular-nums">${big}</span>
      <span style="font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;margin-top:8px">${sub}</span>
    </div>
    <div style="border-top:1px solid ${accent}33;padding-top:12px">
      <div style="font-size:13px;font-weight:600;color:#E2E8F0">${dateStr}</div>
      <div style="font-size:12px;color:#94A3B8;margin-top:4px;display:flex;align-items:flex-start;gap:5px"><i class="ti ti-flag" style="font-size:12px;color:${accent};margin-top:2px;flex-shrink:0"></i><span>${GO_LIVE_NOTE}</span></div>

// Hide completed pill: lives in the fixed top bar (beside the autosave dot)
// so the toggle is on screen in every view and at every scroll position. The
// active state fills with the Complete green so on/off reads at a glance; the
// label shortens to icon and count on narrow widths (CSS).
function renderHideDonePill(){
  const el=document.getElementById('hide-done-pill'); if(!el)return;
  const h=hiddenDoneCount();
  el.className=hideDone?'on':'';
  el.innerHTML=`<span class="hd-sw"></span><span class="hd-label">Hide completed</span>${hideDone&&h?`<span id="hidden-count" style="font-size:11px;opacity:.85">${h} hidden</span>`:''}`;
}
function render(){renderSidebar();renderMain();renderHideDonePill();syncHash();}
function setP(id){cur=id;activeFilters.clear();editingWeekStart=false;doneStripOpen=false;ovv=null;if(id==='runway'){panelOpen.runway=true;runwayOpen=true;}render();}
// ── Shareable view links ──────────────────────────────────────────────────────
// The current view is mirrored into the URL hash (#overview, #pillar/fin,
// #week/3) so copying the address bar link opens the tracker on that view.
function syncHash(){
  let h='#overview';
  if(cur==='parked')h='#parked';
  else if(cur==='runway')h='#runway';
  else if(cur==='hours')h='#hoursview';
  else if(cur!=='overview')h=groupBy==='week'?('#week/'+String(cur).replace(/\D/g,'')):('#pillar/'+cur);
  // Carry the hours flag through the rewrite, otherwise changing view drops it
  // from the address bar and a refresh silently turns hours mode back off.
  // 'hoursview' deliberately has no word boundary after 'hours', so the view
  // token cannot be mistaken for the flag.
  if(INTERNAL)h+='&hours';
  if(location.hash!==h)history.replaceState(null,'',h);
}
// Hours mode is read fresh from the URL here as well as at load, so adding or
// removing #hours on an open tracker takes effect without a refresh.
function readHoursFlag(){
  const on=/(^|[#&])hours\b/.test(location.hash||'');
  if(on!==INTERNAL){INTERNAL=on;return true;}
  return false;
}
window.addEventListener('hashchange',()=>{
  const changed=readHoursFlag();
  if(!INTERNAL&&cur==='hours')cur='overview';   // never strand anyone on a hidden view
  applyHash();
  if(changed)HRS_SEED_REFRESH();
  render();
});
function applyHash(){
  readHoursFlag();
  const raw=(location.hash||'').replace(/&hours\b/,'');
  const m=/^#(overview|parked|runway|hoursview|pillar\/([\w-]+)|week\/(\d+))$/.exec(raw);
  if(!m)return;
  if(m[1]==='parked'){cur='parked';}
  else if(m[1]==='hoursview'){cur=INTERNAL?'hours':'overview';}
  else if(m[1]==='runway'){cur='runway';panelOpen.runway=true;runwayOpen=true;}
  else if(m[2]&&P.some(p=>p.id===m[2])){groupBy='pillar';cur=m[2];}
  else if(m[3]){groupBy='week';cur='Week '+m[3];}
  else cur='overview';
}
// ── Status report (Snapshot) ──────────────────────────────────────────────────
// The sidebar Snapshot button opens a print-ready, Sabel-branded status report
// in a new window (same PDF standard as the go-live checklist: black page,
// centred logo, faint red centre stem, dark cards, mono footer) and triggers
// the browser print dialog, so Save as PDF produces the document. Parked (out
// of scope) work is excluded from every figure, and hours never appear.
function openStatusReport(){
  const gs=globalStats();
  const pct=gs.total>0?Math.round(gs.complete/gs.total*100):0;
  const now=new Date();
  const longDate=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const stamp=now.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).toUpperCase();
  const ownerCell=o=>`<td style="padding:4px 0;white-space:nowrap;font-size:9.5px;color:#94A3B8;vertical-align:top;text-align:right">${esc(o)}</td>`;
  const emptyLine=txt=>`<div style="font-size:10px;color:#64748B">${txt}</div>`;
  // Progress per pillar: pillars with no tasks in scope are skipped.
  const pillarRows=P.map(p=>{
    const m=phaseMini(p.id);
    if(!m.total)return '';
    const w=Math.round(m.done/m.total*100);
    return`<tr>
      <td style="padding:5px 12px 5px 0;font-size:10.5px;color:#E2E8F0;white-space:nowrap;vertical-align:middle">${esc(p.l)}</td>
      <td style="padding:5px 12px 5px 0;width:99%;vertical-align:middle"><div style="background:#242A38;border-radius:3px;height:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:${p.c}"></div></div></td>
      <td style="padding:5px 0;white-space:nowrap;font-size:9.5px;color:#94A3B8;vertical-align:middle;text-align:right">${m.done}/${m.total} complete</td>
    </tr>`;
  }).join('');
  // This week: same current-week logic as the This week panel (focusWeek).
  const f=focusWeek(), g=weekGroups('Week '+f.n);
  const wkRow=o=>{const done=o.t.s==='Complete';return`<tr>
      <td style="padding:4px 8px 4px 0;vertical-align:top;width:12px"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${o.c}"></span></td>
      <td style="padding:4px 10px 4px 0;font-size:10.5px;color:${done?'#64748B':'#E2E8F0'};${done?'text-decoration:line-through;':''}line-height:1.45">${esc(o.t.t)}</td>
      ${ownerCell(o.t.o)}
    </tr>`;};
  const wkBlock=(label,items)=>items.length?`<div style="font-family:monospace;font-size:8px;letter-spacing:.1em;color:#64748B;margin:8pt 0 2pt">${label}</div><table>${items.map(wkRow).join('')}</table>`:'';
  const wkBody=(g.client.length+g.sabel.length)?(wkBlock('CLIENT ACTIONS',g.client)+wkBlock('SABEL ACTIONS',g.sabel)):emptyLine('Nothing scheduled for this week.');
  // Overdue: any not-Complete task whose scheduled period has already ended.
  const od=[];
  P.forEach(p=>['sabel','client'].forEach(grp=>(T[p.id]&&T[p.id][grp]||[]).forEach(t=>{if(!t.parked&&isOverdue(t))od.push({t,p});})));
  const odRows=od.map(o=>`<tr>
      <td style="padding:4px 8px 4px 0;vertical-align:top;width:12px"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${o.p.c}"></span></td>
      <td style="padding:4px 10px 4px 0;font-size:10.5px;color:#E2E8F0;line-height:1.45">${esc(o.t.t)}</td>
      <td style="padding:4px 10px 4px 0;white-space:nowrap;font-size:9.5px;color:#F87171;vertical-align:top">${spanWeeksText(o.t)}</td>
      ${ownerCell(o.t.o)}
    </tr>`).join('');
  // Completed in the last 7 days: only tasks carrying a completion date
  // (doneAt, recorded when a task is marked Complete). Completions from before
  // the tracker recorded dates count in the total but are never guessed into
  // the recent list.
  const cutoff=new Date(now.getTime()-7*86400000);
  const recent=[];
  P.forEach(p=>['sabel','client'].forEach(grp=>(T[p.id]&&T[p.id][grp]||[]).forEach(t=>{
    if(t.parked||t.s!=='Complete'||!t.doneAt)return;
    const d=new Date(t.doneAt+'T00:00:00');
    if(!isNaN(d.getTime())&&d>=cutoff)recent.push({t,p});
  })));
  const recentRows=recent.map(o=>`<tr>
      <td style="padding:4px 8px 4px 0;vertical-align:top;width:12px"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${o.p.c}"></span></td>
      <td style="padding:4px 10px 4px 0;font-size:10.5px;color:#64748B;line-height:1.45">${esc(o.t.t)}</td>
      ${ownerCell(o.t.o)}
    </tr>`).join('');
  const totalLine=`<div style="font-size:10.5px;color:#E2E8F0">${gs.complete} of ${gs.total} tasks complete.</div>`;
  const doneCard=recent.length
    ?`<div class="card"><div class="sec">COMPLETED IN THE LAST 7 DAYS</div><table>${recentRows}</table><div style="margin-top:6pt;font-size:9.5px;color:#94A3B8">${gs.complete} of ${gs.total} tasks complete overall.</div></div>`
    :`<div class="card"><div class="sec">COMPLETED</div>${totalLine}</div>`;
  const pk=parkedCount();
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Project Status Report · ${esc(CLIENT_NAME)}</title>
  <style>
    @page{size:A4;margin:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box;margin:0;padding:0}
    body{background:#0B0B0C;color:#E2E8F0;font-family:Arial,Helvetica,sans-serif;width:210mm;min-height:296mm;position:relative;padding:34pt 44pt 60pt}
    .stem{position:fixed;left:50%;top:0;bottom:0;width:0.7pt;background:rgba(225,6,0,.22)}

// ── Data backup (JSON) ────────────────────────────────────────────────────────
// Small secondary link beneath the Snapshot button: saves the full current
// state as a date-stamped JSON file for backup and restore.
function downloadSnapshot(){
  const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=KEY+'-snapshot-'+isoDate(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(a.href);
  showToast('Backup downloaded');
}
