<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabel Hours Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F1117;color:#E5E9F0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
a{color:#60A5FA}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
header{display:flex;align-items:center;gap:14px;padding:14px 0 18px;border-bottom:1px solid #232A3B;margin-bottom:18px;flex-wrap:wrap}
header img{height:40px;border-radius:8px}
header h1{font-size:19px;font-weight:700}
header .sub{font-size:12px;color:#8B94A7}
.spacer{flex:1}
.saved{font-size:11px;color:#8B94A7;display:flex;align-items:center;gap:6px}
.saved .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;transition:background .3s}
.saved .dot.saving{background:#FBBF24}
.saved .dot.err{background:#F87171}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:#161B26;border:1px solid #232A3B;color:#B9C2D4;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:#E10600;border-color:#E10600;color:#fff}
.card{background:#161B26;border:1px solid #232A3B;border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;margin-bottom:12px;color:#E5E9F0}
.card h2 .hint{font-weight:400;font-size:11px;color:#8B94A7;margin-left:8px}
label{font-size:11px;color:#8B94A7;display:block;margin-bottom:5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
select,input[type=number],input[type=date],input[type=text]{background:#0F1117;border:1px solid #2A3245;color:#E5E9F0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%}
select:focus,input:focus{outline:none;border-color:#E10600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:130px}
.btn{background:#E10600;border:none;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#C00500}
.btn.ghost{background:transparent;border:1px solid #2A3245;color:#B9C2D4}
.btn.ghost:hover{border-color:#8B94A7;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid #2A3245;background:#0F1117;color:#B9C2D4;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:currentColor}
.quick{display:flex;gap:6px}
.quick button{background:#0F1117;border:1px solid #2A3245;color:#B9C2D4;border-radius:7px;padding:7px 0;font-size:12px;cursor:pointer;flex:1;font-family:inherit}
.quick button:hover{border-color:#E10600;color:#fff}
.seg{display:inline-flex;background:#0F1117;border:1px solid #2A3245;border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:none;color:#8B94A7;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:#1E2433;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#8B94A7;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid #232A3B;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid #1B2130}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.tag .sw{width:8px;height:8px;border-radius:50%}
.del{background:none;border:none;color:#8B94A7;cursor:pointer;font-size:15px;padding:2px 6px}
.del:hover{color:#F87171}
/* timer bar */
.timerbar{background:#12151D;border:1px solid #232A3B;border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timerbar.running{border-color:#E10600;box-shadow:0 0 0 1px #E10600}
.timerbar .elapsed{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px}
.timerbar select{width:auto;min-width:170px}
.timerbar .who{font-size:12px;color:#8B94A7}
.pulse{width:10px;height:10px;border-radius:50%;background:#E10600;animation:pu 1.2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
/* dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.proj{background:#161B26;border:1px solid #232A3B;border-radius:14px;padding:16px}
.proj.warn{border-color:#FBBF24}
.proj.risk{border-color:#E10600}
.proj h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.proj .meta{font-size:11px;color:#8B94A7;margin:3px 0 10px}
.burn{height:14px;background:#0F1117;border-radius:7px;overflow:hidden;display:flex;margin-bottom:6px}
.burn .fill{border-radius:7px 0 0 7px}
.burnlbl{display:flex;justify-content:space-between;font-size:11px;color:#8B94A7;margin-bottom:12px}
.split{display:flex;gap:8px;margin-bottom:12px}
.mini{flex:1;background:#0F1117;border-radius:9px;padding:8px 10px}
.mini .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.mini .k{font-size:10px;color:#8B94A7;text-transform:uppercase;letter-spacing:.4px}
.pstack{height:12px;border-radius:6px;overflow:hidden;display:flex;background:#0F1117;margin-bottom:8px}
.pstack div{border-right:2px solid #161B26}
.pstack div:last-child{border-right:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#B9C2D4}
.legend span{display:flex;align-items:center;gap:5px}
.legend .sw{width:8px;height:8px;border-radius:50%}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#161B26;border:1px solid #232A3B;border-radius:12px;padding:14px 16px}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:#8B94A7;margin-top:2px}
.badge{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:10px}
.badge.ok{background:rgba(74,222,128,.14);color:#4ADE80}
.badge.warn{background:rgba(251,191,36,.14);color:#FBBF24}
.badge.risk{background:rgba(225,6,0,.18);color:#FF6B66}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E2433;border:1px solid #2A3245;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.tip{position:fixed;background:#1E2433;border:1px solid #2A3245;border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:40;display:none;max-width:240px}
.empty{color:#8B94A7;font-size:13px;padding:14px 4px}
.pencil{background:none;border:none;color:#8B94A7;cursor:pointer;font-size:12px}
.pencil:hover{color:#fff}
@media(max-width:620px){.timerbar .elapsed{font-size:20px;min-width:84px}}
</style>
</head>

      <div><button class="btn" id="mAdd">Add</button></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:2"><label>Note (optional)</label><input type="text" id="mNote" placeholder="e.g. weekly client call, Fin setup"></div>
      <div><label>Quick hours</label><div class="quick" id="quick"></div></div>
    </div>
  </div>
  <div class="card">
    <h2>This week's entries<span class="hint" id="wkLabel"></span></h2>
    <div class="row" style="margin-bottom:10px;align-items:center">
      <button class="btn ghost" id="wkPrev">&#8592; Prev week</button>
      <button class="btn ghost" id="wkNext">Next week &#8594;</button>
      <div class="spacer"></div>
    </div>
    <div id="entriesTbl"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="v-dash" style="display:none">
  <div class="statrow" id="statrow"></div>
  <div class="card" style="padding:12px 18px">
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><label style="margin:0 8px 0 0;display:inline">Show</label>
        <div class="seg" id="dashFilter">
          <button class="on" data-f="active">Active projects</button>
          <button data-f="all">All</button>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="legend" id="dashLegend"></div>
    </div>
  </div>
  <div class="grid" id="projGrid"></div>
</div>

<!-- ROCKETLANE -->
<div id="v-rocket" style="display:none">
  <div class="card">
    <h2>Month for RocketLane<span class="hint">hours per project, week by week. Weeks belong to the month their Monday falls in</span></h2>
    <div class="row" style="align-items:center">
      <div style="flex:0 0 170px"><input type="month" id="rMonth" style="background:#0F1117;border:1px solid #2A3245;color:#E5E9F0;border-radius:8px;padding:8px 10px;font-size:13px;width:100%"></div>
      <button class="btn ghost" id="rCopy">Copy table</button>
      <div class="spacer"></div>
    </div>
  </div>
  <div class="card" id="rocketTbl"></div>
</div>

</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
const API='https://sabel-webhook.vercel.app/api/tracker';
const KEY='sabel-hours-v1';
const BUILD_V='202608030355';
const SESSION_ID=Math.random().toString(36).slice(2);
const TRACKERS_URL='trackers.json';
const TRACKERS_FALLBACK=[{"name":"Raiz","key":"raiz-tracker-v1","file":"RaizTracker_v2.html","sowHours":40,"active":true},{"name":"BTS","key":"bts-usa-june-tracker-v1","file":"BTSUSATracker_v2.html","sowHours":83,"active":false},{"name":"Donkey Republic","key":"donkey-republic-tracker-v1","file":"DonkeyRepublicTracker_v2.html","sowHours":72,"active":false},{"name":"FLKItOver","key":"flkitover-tracker-v1","file":"FlkitOverTracker_v2.html","sowHours":null,"active":true},{"name":"YFood","key":"yfood-tracker-v1","file":"YFoodTracker_v2.html","sowHours":60,"active":true},{"name":"Cirqul","key":"cirqul-tracker-v1","file":"CirqulTracker_v2.html","sowHours":null,"active":false},{"name":"Education Perfect","key":"education-perfect-tracker-v1","file":"EducationPerfectTracker_v2.html","sowHours":null,"active":false},{"name":"Huuuge","key":"huuuge-tracker-v1","file":"HuuugeTracker_v2.html","sowHours":99,"active":false},{"name":"GPS Insight","key":"gps-insight-tracker-v1","file":"GPSInsightTracker_v2.html","sowHours":50,"active":true},{"name":"The Giving Movement","key":"thegivingmovement-tracker-v1","file":"TheGivingMovementTracker_v2.html","sowHours":60,"active":true},{"name":"Cronos","key":"cronos-tracker-v1","file":"CronosTracker_v2.html","sowHours":20,"active":true},{"name":"Tulka","key":"tulka-tracker-v1","file":"TulkaTracker_v2.html","sowHours":null,"active":true},{"name":"Positive Salary Packaging","key":"positive-salary-packaging-tracker-v1","file":"PositiveSalaryPackagingTracker_v2.html","sowHours":10,"active":true},{"name":"Sounding Board","key":"soundingboard-tracker-v1","file":"SoundingBoardTracker.html","sowHours":30,"active":true},{"name":"Eugene Labs","key":"eugenelabs-tracker-v1","file":"EugeneLabsTracker.html","sowHours":27.5,"active":true}];
const PEOPLE=[
  {n:'Chris',c:'#60A5FA'},
  {n:'Greg',c:'#34D399'},
  {n:'Richard',c:'#C084FC'},
  {n:'Nikki',c:'#FBBF24'}
];
const PC=Object.fromEntries(PEOPLE.map(p=>[p.n,p.c]));

// ---------- state ----------
let S={entries:[],deleted:[],projectMeta:{},timers:{}};
let projects=[];            // from trackers.json (+ manual)
let me=localStorage_safe('sabel-hours-me')||'';
let viewWeek=mondayOf(new Date());
let dashFilter='active';
let dirty=false, saveTimer=null, loadedAt=0;

function localStorage_safe(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}

// ---------- date helpers ----------
function mondayOf(d){d=new Date(d);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d}
function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function fmtWk(isoMon){const d=new Date(isoMon+'T00:00:00');return 'W/C '+d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

// ---------- projects ----------
async function loadProjects(){
  let list=TRACKERS_FALLBACK;
  try{const r=await fetch(TRACKERS_URL+'?t='+Date.now());if(r.ok)list=await r.json();}catch(e){}
  projects=list.map(t=>({key:t.key,name:t.name,sow:t.sowHours,active:t.active!==false}));
  // manual projects stored in projectMeta with manualName
  for(const[k,m]of Object.entries(S.projectMeta)){
    if(m.manualName&&!projects.find(p=>p.key===k))projects.push({key:k,name:m.manualName,sow:m.contracted||null,active:!m.archived});
  }
  projects.sort((a,b)=>a.name.localeCompare(b.name));
}
function contracted(p){const m=S.projectMeta[p.key];return (m&&m.contracted!=null)?m.contracted:(p.sow||0)}
function pname(key){const p=projects.find(x=>x.key===key);return p?p.name:key}

// ---------- persistence (merge-safe) ----------
async function remoteGet(){
  const r=await fetch(API+'?key='+encodeURIComponent(KEY));
  const j=await r.json();
  if(!j.value)return null;
  try{return JSON.parse(j.value)}catch(e){return null}
}
function mergeStates(remote){
  if(!remote)return;
  const del=new Set([...(S.deleted||[]),...(remote.deleted||[])]);
  const byId={};
  for(const e of (remote.entries||[]))byId[e.id]=e;
  for(const e of (S.entries||[]))byId[e.id]=e;  // local wins
  S.entries=Object.values(byId).filter(e=>!del.has(e.id));
  S.deleted=[...del].slice(-500);
  S.projectMeta=Object.assign({},remote.projectMeta||{},S.projectMeta||{});
  S.timers=Object.assign({},remote.timers||{},S.timers||{});
  for(const[k,v]of Object.entries(S.timers))if(v===null)delete S.timers[k];
}
async function save(){
  setDot('saving','Saving...');
  try{
    const remote=await remoteGet();
    mergeStates(remote);
    const payload=JSON.stringify({BUILD_V,savedAt:Date.now(),savedBy:SESSION_ID,
      entries:S.entries,deleted:S.deleted,projectMeta:S.projectMeta,timers:S.timers});
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:KEY,value:payload})});
    dirty=false;setDot('','Autosaved');renderAll();
  }catch(e){setDot('err','Save failed, will retry');setTimeout(queueSave,4000)}
}
function queueSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(save,800)}
function setDot(cls,txt){const d=document.getElementById('saveDot');d.className='dot '+cls;document.getElementById('saveTxt').textContent=txt}

// ---------- entries ----------
function addEntry(project,person,weekIso,type,hours,note,src){
  if(!project){toast('Pick a project first');return false}
  if(!person){toast('Pick who you are first');return false}
  hours=Math.round(hours*4)/4;
  if(!(hours>0)){toast('Enter hours above zero');return false}
  S.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    project,person,week:weekIso,type,hours,note:note||'',src:src||'manual',at:Date.now()});
  queueSave();return true;
}
function delEntry(id){S.entries=S.entries.filter(e=>e.id!==id);S.deleted=[...(S.deleted||[]),id];queueSave()}

// ---------- timer ----------
function myTimer(){return me?S.timers[me]:null}
function timerTick(){
  const t=myTimer();
  const el=document.getElementById('elapsed');
  const btn=document.getElementById('tBtn');
  const bar=document.getElementById('timerbar');
  const pulse=document.getElementById('timerPulse');
  if(t){
    const s=Math.floor((Date.now()-t.start)/1000);
    el.textContent=Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    btn.textContent='Stop';bar.classList.add('running');pulse.style.display='block';
    document.title='⏺ '+el.textContent+' · '+pname(t.project);
  }else{
    el.textContent='0:00:00';btn.textContent='Start';bar.classList.remove('running');pulse.style.display='none';
    document.title='Sabel Hours Tracker';
  }
}
function toggleTimer(){
  if(!me){toast('Pick who you are first (Log time tab)');return}
  const t=myTimer();
  if(t){
    const hrs=Math.max(0.25,Math.round(((Date.now()-t.start)/3600000)*4)/4);
    addEntry(t.project,me,iso(mondayOf(new Date())),t.type,hrs,'Timer','timer');
    S.timers[me]=null;delete S.timers[me];
    toast('Logged '+hrs+'h on '+pname(t.project));
  }else{
    const proj=document.getElementById('tProject').value;
    if(!proj){toast('Pick a project first');return}
    const type=document.querySelector('#tType .on').dataset.t;
    S.timers[me]={project:proj,type,start:Date.now()};
  }
  queueSave();timerTick();
}

// ---------- rendering ----------
function projOptions(sel,onlyActive){
  const cur=sel.value;
  sel.innerHTML='<option value="">Select project...</option>'+
    projects.filter(p=>!onlyActive||p.active).map(p=>'<option value="'+p.key+'">'+p.name+'</option>').join('');
  if(cur)sel.value=cur;
}
function renderWho(){
  document.getElementById('whoChips').innerHTML=PEOPLE.map(p=>
    '<button class="chip'+(me===p.n?' on':'')+'" style="color:'+(me===p.n?p.c:'')+'" data-p="'+p.n+'">'+
    '<span class="sw" style="background:'+p.c+'"></span>'+p.n+'</button>').join('');
  document.getElementById('tWho').textContent=me?('Logging as '+me):'Pick your name in Log time first';
}
function weekEntries(wIso){return S.entries.filter(e=>e.week===wIso).sort((a,b)=>b.at-a.at)}
function renderEntries(){
  const wIso=iso(viewWeek);
  const wkEnd=addDays(viewWeek,6);document.getElementById('wkLabel').textContent=fmtWk(wIso)+' to '+wkEnd.getDate()+' '+wkEnd.toLocaleString('en-GB',{month:'short'});
  const rows=weekEntries(wIso);
  if(!rows.length){document.getElementById('entriesTbl').innerHTML='<div class="empty">No entries this week yet.</div>';return}
  let tot=0;
  const html='<table><thead><tr><th>Project</th><th>Person</th><th>Type</th><th>Note</th><th class="num">Hours</th><th></th></tr></thead><tbody>'+
    rows.map(e=>{tot+=e.hours;return '<tr><td>'+pname(e.project)+'</td>'+
      '<td><span class="tag" style="color:'+(PC[e.person]||'#B9C2D4')+'"><span class="sw" style="background:'+(PC[e.person]||'#B9C2D4')+'"></span>'+e.person+'</span></td>'+
      '<td>'+(e.type==='call'?'Call':'Delivery')+'</td><td style="color:#8B94A7">'+esc(e.note)+'</td>'+
      '<td class="num">'+fmtH(e.hours).slice(0,-1)+'</td>'+
      '<td><button class="del" data-id="'+e.id+'" title="Delete">&#10005;</button></td></tr>'}).join('')+
    '</tbody><tfoot><tr><td colspan="4" style="font-weight:700">Total</td><td class="num" style="font-weight:700">'+fmtH(tot)+'</td><td></td></tr></tfoot></table>';
  document.getElementById('entriesTbl').innerHTML=html;
}
function fmtH(h){return ((Math.round(h*100)/100).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1'))+'h'}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

function projTotals(key){
  const es=S.entries.filter(e=>e.project===key);
  const t={total:0,call:0,work:0,byPerson:{},byWeek:{}};
  for(const e of es){t.total+=e.hours;t[e.type==='call'?'call':'work']+=e.hours;
    t.byPerson[e.person]=(t.byPerson[e.person]||0)+e.hours;
    t.byWeek[e.week]=(t.byWeek[e.week]||0)+e.hours;}
  return t;
}
function renderDash(){
  const shown=projects.filter(p=>dashFilter==='all'||p.active);
  // stats
  let logged=0,over=0,atRisk=0;
  const cards=shown.map(p=>{
    const t=projTotals(p.key),c=contracted(p);
    logged+=t.total;
    const pct=c?t.total/c:0;
    let cls='',badge='<span class="badge ok">ON TRACK</span>';
    if(c&&pct>=0.9){cls='risk';badge='<span class="badge risk">'+(pct>=1?'OVER':'AT RISK')+'</span>';atRisk++;if(pct>=1)over++;}
    else if(c&&pct>=0.75){cls='warn';badge='<span class="badge warn">WATCH</span>';}
    const fillC=pct>=0.9?'#E10600':pct>=0.75?'#FBBF24':'#4ADE80';
    const stack=PEOPLE.filter(pp=>t.byPerson[pp.n]).map(pp=>
      '<div style="width:'+(t.total?100*t.byPerson[pp.n]/t.total:0)+'%;background:'+pp.c+'" data-tip="'+pp.n+': '+fmtH(t.byPerson[pp.n])+'"></div>').join('');
    const plist=PEOPLE.filter(pp=>t.byPerson[pp.n]).map(pp=>
      '<span><span class="sw" style="background:'+pp.c+'"></span>'+pp.n+' '+fmtH(t.byPerson[pp.n])+'</span>').join('');
    return '<div class="proj '+cls+'"><h3>'+p.name+' '+badge+'</h3>'+
      '<div class="meta">'+(c?('Contracted '+fmtH(c)):'No contracted hours set')+
      ' <button class="pencil" data-edit="'+p.key+'" title="Edit contracted hours">&#9998;</button>'+(p.active?'':' · inactive')+'</div>'+
      '<div class="burn"><div class="fill" style="width:'+Math.min(100,pct*100)+'%;background:'+fillC+'"></div></div>'+
      '<div class="burnlbl"><span>'+fmtH(t.total)+' logged</span><span>'+(c?(pct>=1?fmtH(t.total-c)+' over':fmtH(c-t.total)+' left'):'')+'</span></div>'+
      '<div class="split"><div class="mini"><div class="v">'+fmtH(t.call)+'</div><div class="k">Calls</div></div>'+
      '<div class="mini"><div class="v">'+fmtH(t.work)+'</div><div class="k">Delivery</div></div></div>'+
      (t.total?'<div class="pstack">'+stack+'</div><div class="legend">'+plist+'</div>':'<div class="empty">No hours logged yet.</div>')+
      '</div>';
  }).join('');
  document.getElementById('projGrid').innerHTML=cards||'<div class="empty">No projects.</div>';
  const wIso=iso(mondayOf(new Date()));
  const thisWk=S.entries.filter(e=>e.week===wIso).reduce((a,e)=>a+e.hours,0);
  document.getElementById('statrow').innerHTML=
    '<div class="stat"><div class="v">'+fmtH(logged)+'</div><div class="k">Logged, shown projects</div></div>'+
    '<div class="stat"><div class="v">'+fmtH(thisWk)+'</div><div class="k">This week, all projects</div></div>'+
    '<div class="stat"><div class="v">'+atRisk+'</div><div class="k">Projects at or past 90%</div></div>'+
    '<div class="stat"><div class="v">'+over+'</div><div class="k">Projects over contract</div></div>';
  document.getElementById('dashLegend').innerHTML=PEOPLE.map(pp=>'<span><span class="sw" style="background:'+pp.c+'"></span>'+pp.n+'</span>').join('');
}
function renderRocket(){
  const mv=document.getElementById('rMonth').value;
  if(!mv){document.getElementById('rocketTbl').innerHTML='<div class="empty">Pick a month.</div>';return}
  const[y,m]=mv.split('-').map(Number);
  // Mondays whose date falls in the month
  const weeks=[];let d=mondayOf(new Date(y,m-1,1));
  if(d.getMonth()!==m-1)d=addDays(d,7);
  while(d.getMonth()===m-1&&d.getFullYear()===y){weeks.push(iso(d));d=addDays(d,7)}
  const keys=projects.filter(p=>S.entries.some(e=>e.project===p.key&&weeks.includes(e.week)));
  if(!keys.length){document.getElementById('rocketTbl').innerHTML='<div class="empty">No hours logged in this month.</div>';return}
  let html='<table><thead><tr><th>Project</th>'+weeks.map(w=>'<th class="num">'+fmtWk(w)+'</th>').join('')+'<th class="num">Month total</th></tr></thead><tbody>';
  let colTot=weeks.map(()=>0),grand=0;
  for(const p of keys){
    let rowTot=0;
    html+='<tr><td>'+p.name+'</td>';
    weeks.forEach((w,i)=>{
      const h=S.entries.filter(e=>e.project===p.key&&e.week===w).reduce((a,e)=>a+e.hours,0);
      rowTot+=h;colTot[i]+=h;
      html+='<td class="num">'+(h?fmtH(h):'–')+'</td>';
    });
    grand+=rowTot;
    html+='<td class="num" style="font-weight:700">'+fmtH(rowTot)+'</td></tr>';
  }
  html+='</tbody><tfoot><tr><td style="font-weight:700">All projects</td>'+colTot.map(t=>'<td class="num" style="font-weight:700">'+fmtH(t)+'</td>').join('')+
    '<td class="num" style="font-weight:700">'+fmtH(grand)+'</td></tr></tfoot></table>';
  document.getElementById('rocketTbl').innerHTML=html;
}
function copyRocket(){
  const tbl=document.querySelector('#rocketTbl table');
  if(!tbl){toast('Nothing to copy');return}
  const tsv=[...tbl.rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/h$/,'')).join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>toast('Copied. Paste into RocketLane or a sheet'));
}
function renderAll(){renderWho();renderEntries();renderDash();renderRocket();timerTick();
  projOptions(document.getElementById('tProject'),true);
  projOptions(document.getElementById('mProject'),true);}

// ---------- events ----------
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['log','dash','rocket'].forEach(v=>document.getElementById('v-'+v).style.display=b.dataset.v===v?'':'none');
});
document.getElementById('whoChips').onclick=e=>{
  const b=e.target.closest('[data-p]');if(!b)return;
  me=b.dataset.p;localStorage_safe('sabel-hours-me',me);renderWho();timerTick();
};
document.querySelectorAll('#tType button, #mType button').forEach(b=>b.onclick=()=>{
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
document.getElementById('tBtn').onclick=toggleTimer;
document.getElementById('mAdd').onclick=()=>{
  const proj=document.getElementById('mProject').value;
  const dv=document.getElementById('mDate').value;
  const type=document.querySelector('#mType .on').dataset.t;
  const hrs=parseFloat(document.getElementById('mHours').value);
  const note=document.getElementById('mNote').value;
  const wk=dv?iso(mondayOf(new Date(dv+'T00:00:00'))):iso(mondayOf(new Date()));
  if(addEntry(proj,me,wk,type,hrs,note)){document.getElementById('mHours').value='';document.getElementById('mNote').value='';renderEntries();toast('Added')}
};
document.getElementById('quick').innerHTML=[0.5,1,1.5,2,3].map(h=>'<button data-h="'+h+'">'+h+'h</button>').join('');
document.getElementById('quick').onclick=e=>{const b=e.target.closest('[data-h]');if(b)document.getElementById('mHours').value=b.dataset.h};
document.getElementById('entriesTbl').onclick=e=>{
  const b=e.target.closest('.del');if(!b)return;
  if(confirm('Delete this entry?')){delEntry(b.dataset.id);renderEntries();renderDash();renderRocket()}
};
document.getElementById('wkPrev').onclick=()=>{viewWeek=addDays(viewWeek,-7);renderEntries()};
document.getElementById('wkNext').onclick=()=>{viewWeek=addDays(viewWeek,7);renderEntries()};
document.getElementById('dashFilter').onclick=e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  dashFilter=b.dataset.f;
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  renderDash();
};
document.getElementById('projGrid').onclick=e=>{
  const b=e.target.closest('[data-edit]');if(!b)return;
  const key=b.dataset.edit,p=projects.find(x=>x.key===key);
  const cur=contracted(p);
  const v=prompt('Contracted hours for '+p.name+':',cur||'');
  if(v===null)return;
  S.projectMeta[key]=Object.assign({},S.projectMeta[key],{contracted:parseFloat(v)||0});
  queueSave();renderDash();
};
document.getElementById('rMonth').onchange=renderRocket;
document.getElementById('rCopy').onclick=copyRocket;
// hover tooltip for person stacks
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');const tip=document.getElementById('tip');
  if(t){tip.textContent=t.dataset.tip;tip.style.display='block';
    tip.style.left=Math.min(e.clientX+12,window.innerWidth-250)+'px';tip.style.top=(e.clientY+14)+'px';}
  else tip.style.display='none';
});
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

// ---------- boot ----------
(async function(){
  const _n=new Date();document.getElementById('rMonth').value=_n.getFullYear()+'-'+String(_n.getMonth()+1).padStart(2,'0');
  document.getElementById('mDate').value=iso(new Date());
  try{const remote=await remoteGet();mergeStates(remote);}catch(e){setDot('err','Offline, changes save when back online')}
  await loadProjects();
  renderAll();
  setInterval(timerTick,1000);
  setInterval(async()=>{if(!dirty){try{const r=await remoteGet();mergeStates(r);renderAll()}catch(e){}}},60000);
})();
</script>
</body>
</html>
