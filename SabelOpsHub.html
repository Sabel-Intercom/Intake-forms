  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>Sabel Project Dashboard<\u002Ftitle>\n<style>\n  :root{\n    --bg:#0B0B0C; --surface:#0F1113; --card:#141618; --card2:#191C20; --card3:#1E2228;\n    --border:#2A3547; --border2:#1A2232; --red:#E10600;\n    --w:#FFFFFF; --body:#E2E8F0; --muted:#94A3B8; --mono:#64748B; --dim:#3F4756;\n    --green:#4ADE80; --blue:#60A5FA; --amber:#FBBF24; --purple:#C084FC; --redText:#F87171;\n  }\n  *{margin:0;padding:0;box-sizing:border-box;}\n  body{background:var(--bg);color:var(--body);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}\n  a{color:#FCA5A5;text-decoration:none;}\n  a:hover{color:#fff;text-decoration:underline;}\n  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}\n  select{font-family:inherit;}\n  ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}::-webkit-scrollbar-track{background:transparent;}\n  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}\n\n  /* header */\n  .header{display:flex;align-items:center;gap:16px;padding:15px 28px;border-bottom:1px solid var(--border2);background:rgba(11,11,12,.94);position:sticky;top:0;z-index:40;min-width:1180px;backdrop-filter:blur(6px);}\n  .logo-img{height:26px;width:auto;display:block;}\n  .tag{font-size:8px;letter-spacing:.2em;color:var(--mono);text-transform:uppercase;}\n  .header h1{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--w);text-transform:uppercase;margin-left:6px;}\n  .hright{margin-left:auto;display:flex;align-items:center;gap:12px;}\n  .stamp{font-size:10px;color:var(--mono);letter-spacing:.04em;}\n  .stamp b{color:var(--green);}\n  .chip-week{font-size:10px;color:var(--mono);letter-spacing:.04em;border:1px solid var(--border2);background:var(--card2);border-radius:5px;padding:6px 11px;}\n  .tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px;}\n  .tab{border-radius:5px;padding:7px 13px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:.14s;}\n  .tab:hover{color:var(--w);}\n  .tab.on{background:var(--red);color:#fff;}\n\n  .wrap{max-width:1240px;min-width:1180px;margin:0 auto;padding:22px 28px 0;}\n\n  /* kpis */\n  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}\n  .kpi{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}\n  .kpi .l{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mono);margin-bottom:7px;}\n  .kpi .v{font-size:27px;font-weight:800;line-height:1;color:var(--w);}\n  .kpi .s{font-size:10px;color:var(--mono);margin-top:5px;}\n\n  .panel{background:var(--card);border:1px solid var(--border2);border-radius:12px;}\n  .hero{background:linear-gradient(160deg,rgba(225,6,0,.08),var(--card));border:1px solid rgba(225,6,0,.30);border-radius:12px;padding:16px 18px;margin-bottom:22px;}\n  .sec-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px;}\n  .count{font-size:9px;color:var(--mono);background:var(--card2);border:1px solid var(--border2);padding:1px 8px;border-radius:20px;}\n  h2.big{font-size:14px;font-weight:800;letter-spacing:.03em;color:var(--w);text-transform:uppercase;}\n  .sub{font-size:10px;color:var(--mono);}\n\n  .pill{border-radius:5px;padding:6px 11px;font-size:10px;font-weight:700;letter-spacing:.03em;background:var(--surface);border:1px solid var(--border2);color:var(--muted);transition:.14s;}\n  .pill:hover{color:var(--w);border-color:var(--border);}\n  .pill.on{background:rgba(225,6,0,.16);border-color:rgba(225,6,0,.55);color:#FCA5A5;}\n  .btn-red{background:var(--red);border:1px solid var(--red);color:#fff;border-radius:6px;padding:7px 15px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}\n  .btn-red:hover{background:#FF2A24;}\n  .btn-ghost{background:var(--card2);border:1px solid var(--border);color:var(--body);border-radius:6px;padding:8px 15px;font-size:12px;font-weight:700;}\n  .btn-ghost:hover{color:var(--w);border-color:var(--mono);}\n\n  /* stage lanes */\n  .lanes{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;align-items:start;}\n  .lane-h{display:flex;align-items:center;gap:6px;padding-bottom:7px;margin-bottom:8px;border-bottom:2px solid var(--mono);}\n  .lane-h .nm{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}\n  .lane-h .n{font-size:9px;color:var(--mono);margin-left:auto;}\n  .lane-c{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 7px;border-radius:5px;background:var(--surface);cursor:pointer;}\n  .lane-c:hover{background:var(--card3);}\n  .lane-c .nm{font-size:10.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .lane-c .d{font-size:9px;white-space:nowrap;}\n\n  /* run sheet rows */\n  .arow{background:var(--card2);border:1px solid var(--border2);border-left-width:3px;border-radius:8px;overflow:hidden;}\n  .ahead{display:grid;grid-template-columns:64px minmax(230px,1fr) minmax(0,auto) 118px 16px;gap:14px;align-items:center;padding:11px 14px;cursor:pointer;}\n  .ahead:hover{background:var(--card3);}\n  .ad1{font-size:17px;font-weight:800;line-height:1;}\n  .ad2{font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mono);margin-top:4px;}\n  .anm{font-size:13px;font-weight:700;color:var(--w);}\n  .ameta{font-size:9.5px;color:var(--mono);margin-top:4px;}\n  .stg{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;}\n  .cchip{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}\n  .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}\n  .bar > i{display:block;height:100%;}\n  .abody{border-top:1px solid var(--border2);background:var(--surface);padding:4px 14px 11px;}\n  .trow{display:grid;grid-template-columns:18px 8px 1fr 78px 92px 74px 22px;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);}\n  .trow:last-of-type{border-bottom:none;}\n  .tick{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim);color:var(--green);font-size:9px;line-height:12px;text-align:center;cursor:pointer;background:none;padding:0;}\n  .tick.on{border-color:var(--green);background:rgba(74,222,128,.16);}\n  .dot{width:8px;height:8px;border-radius:2px;}\n  .ttx{font-size:12px;line-height:1.35;text-wrap:pretty;}\n  .ttx.done{color:#4E5768;text-decoration:line-through;}\n  .badge{font-size:9px;font-weight:700;text-align:center;padding:3px 0;border-radius:4px;}\n  .due{font-size:9.5px;text-align:right;}\n  .flag{font-size:12px;text-align:right;color:#2F3644;cursor:pointer;background:none;border:none;}\n  .flag.on{color:var(--amber);}\n  .tfoot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;}\n  .tfoot span{font-size:10px;color:var(--mono);}\n  .tfoot a{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}\n\n  /* board cards */\n  .board{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;align-items:start;margin-bottom:22px;}\n  .bcol{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px;}\n  .bcard{background:var(--card);border:1px solid var(--border2);border-left-width:3px;border-radius:7px;padding:9px 10px;cursor:pointer;}\n  .bcard:hover{border-color:var(--border);}\n  .bcard .nm{font-size:11.5px;font-weight:700;color:var(--w);line-height:1.25;}\n  .bchip{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;}\n\n  /* groups */\n  .grp{background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:12px 13px;}\n  .grp-h{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px;}\n  .grow{display:flex;align-items:flex-start;gap:9px;}\n  .grow .m{display:flex;align-items:center;gap:9px;margin-top:5px;}\n  .grow .m span{font-size:9px;}\n  .empty{font-size:11px;color:var(--dim);}\n\n  /* table */\n  .tbl{background:var(--card);border:1px solid var(--border2);border-radius:11px;overflow:hidden;}\n  .thead,.tr{display:grid;grid-template-columns:minmax(170px,1.4fr) 96px 76px minmax(110px,1fr) 132px;gap:12px;padding:10px 15px;border-bottom:1px solid var(--border2);}\n  .thead{background:var(--surface);}\n  .thead span{font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mono);}\n  .tr{cursor:pointer;border-left:3px solid transparent;}\n  .tr:hover{background:var(--card3);}\n  .tr.sel{background:var(--card3);border-left-color:var(--red);}\n\n  /* presenter */\n  .pres{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;}\n  .pres.on{display:flex;}\n  .pres-h{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border2);}\n  .pres-b{flex:1;overflow:auto;padding:40px;}\n  footer{margin-top:26px;padding:15px 0 0;border-top:1px solid var(--border2);display:flex;justify-content:space-between;gap:10px;font-size:9px;color:var(--mono);letter-spacing:.06em;text-transform:uppercase;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header class=\"header\">\n  <div style=\"display:flex;align-items:center;gap:9px\">\n    <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApEAAADbCAYAAAA1d8roAAAbHElEQVR4nO3dS1bj1trG8ac+QtucEeAzAkjPvXKNoMgISjWCIiMoZwShRoBqBKFGENGjd2AEMSM40Pby4mts6ZgQLtrSq32R/r+1vJxaMdsbY0mP9vXdw8ODAAAAAB//F7sCAAAAyA8hEgAAAN4IkQAAAPBGiAQAAIA3QiQAAAC8ESIBAADgjRAJAAAAb4RIAAAAeCNEAgAAwBshEgAAAN4IkQAAAPBGiAQAAIA3QiQAAAC8ESIBAADgjRAJAAAAb4RIAAAAeCNEAgAAwBshEgA ).replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\n\n/* ── derive ── */\nfunction urgency(t,id){\n  if(S.done[id] || t[4]==='Complete') return 'done';\n  if(t[4]==='Blocked' || t[4]==='Dependency') return 'blocked';\n  var d=new Date(t[3]+'T00:00:00');\n  if(d<TODAY) return 'overdue';\n  if(d<=WK_END) return 'week';\n  return 'later';\n}\nfunction enrich(c){\n  var tasks=c.t.map(function(t,i){\n    var id=c.id+'-'+i, done=!!S.done[id], u=urgency(t,id);\n    var ow=OW[t[1]]||OW.Client, st=SC[done?'Complete':t[4]]||SC.Pending;\n    return {id:id, t:t[0], o:t[1], s:done?'Complete':t[4], u:u, pillar:t[2],\n      pillarColor:PL[t[2]]||'#94A3B8', ownerColor:ow.c, ownerBg:ow.bg,\n      statusColor:st.c, statusBg:st.bg, done:done, flagged:!!S.flags[id],\n      dueLabel:fmt(t[3])+(u==='overdue'?' !':''),\n      dueColor:u==='overdue'?'#F87171':(u==='week'?'#FBBF24':'#64748B'),\n      client:c.n};\n  });\n  var out=tasks.filter(function(t){return t.u!=='done';});\n  var overdue=out.filter(function(t){return t.u==='overdue';}).length;\n  var week=out.filter(function(t){return t.u==='week';}).length;\n  var blocked=out.filter(function(t){return t.u==='blocked';}).length;\n  var clientSide=out.filter(function(t){return t.o==='Client';}).length;\n\n  var days=null, key=9999;\n  if(c.gl){ days=Math.round((new Date(c.gl+'T00:00:00')-TODAY)/MS); key=days>=0?days:400-days; }\n  if(c.st==='Scoping') key=700;\n  if(c.st==='On hold') key=800;\n  if(c.st==='Complete') key=900;\n\n  var daysNum='—', daysUnit='go-live TBC', shortDays='TBC', daysColor='#64748B';\n  if(days!==null && days>=0){\n    daysNum=String(days); daysUnit=days===1?'day to go-live':'days to go-live';\n    shortDays='T\\u2011'+days+'d';\n    daysColor=days<=7?'#F87171':(days<=21?'#FBBF24':'#4ADE80');\n  } else if(days!==null){\n    daysNum=String(-days); daysUnit='days since go-live'; shortDays='+'+(-days)+'d'; daysColor='#94A3B8';\n  }\n\n  var chips=[];\n  if(overdue) chips.push({label:overdue+' overdue', short:overdu ;})}\n  ];\n}\nfunction all(){ return CLIENTS.map(enrich).sort(function(a,b){return a.key-b.key;}); }\nfunction find(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return list[0]; }\n\n/* ── actions ── */\nfunction setView(v){ S.view=v; save(); render(); }\nfunction toggleOpen(id){ S.open[id]=!S.open[id]; S.sel=id; save(); render(); }\nfunction focusClient(id){ S.sel=id; S.open[id]=true; save(); render(); }\nfunction setFilter(f){ S.filter=f; save(); render(); }\nfunction toggleAll(){\n  var any=Object.keys(S.open).some(function(k){return S.open[k];});\n  if(any){ S.open={}; } else { CLIENTS.forEach(function(c){ S.open[c.id]=true; }); }\n  save(); render();\n}\nfunction tick(id,ev){ if(ev) ev.stopPropagation(); S.done[id]=!S.done[id]; save(); render(); }\nfunction flagTask(id,ev){ if(ev) ev.stopPropagation(); S.flags[id]=!S.flags[id]; save(); render(); }\nfunction pickClient(v){ S.sel=v; save(); render(); }\nfunction stepClient(d){ var L=all(); var i=L.findIndex(function(c){return c.id===S.sel;}); S.sel=L[Math.max(0,Math.min(L.length-1,i+d))].id; save(); render(); }\nfunction startPresent(){ S.pIdx=0; save(); document.getElementById('pres').classList.add('on'); renderPres(); }\nfunction stopPresent(){ document.getElementById('pres').classList.remove('on'); }\nfunction presMove(d){ var L=all(); S.pIdx=Math.max(0,Math.min(L.length-1,S.pIdx+d)); save(); renderPres(); }\n\n/* ── shared partials ── */\nfunction chipHTML(ch,cls){ return '<span class=\"'+(cls||'cchip')+'\" style=\"color:'+ch.c+';background:'+ch.bg+'\">'+esc(ch.label)+'<\u002Fspan>'; }\nfunction tickHTML(t){ return '<button class=\"tick'+(t.done?' on':'')+'\" onclick=\"tick(\\''+t.id+'\\',event)\">'+(t.done?'&#10003;':'')+'<\u002Fbutton>'; }\nfunction groupHTML(g){\n  var rows = g.tasks.map(function(t){\n    return '<div class=\"grow\">'+tickHTML(t)+\n      '<div style=\"flex:1;min-width:0\"><div class=\"ttx'+(t.done?' done':'')+'\">'+esc(t.t)+'<\u002Fdiv>'+\n      '<div class=   (risks.map(function(r){\n        return '<div style=\"display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2)\">'+\n          '<span class=\"stg\" style=\"color:'+r.tagColor+';background:'+r.tagBg+'\">'+esc(r.tag)+'<\u002Fspan>'+\n          '<div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;line-height:1.4;text-wrap:pretty\"><b style=\"color:var(--w)\">'+esc(r.client)+'<\u002Fb> '+esc(r.t)+'<\u002Fdiv>'+\n          '<div style=\"font-size:9px;color:var(--mono);margin-top:3px;letter-spacing:.04em;text-transform:uppercase\">'+esc(r.meta)+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n      }).join('') || '<div class=\"empty\">Nothing blocked. Rare and excellent.<\u002Fdiv>')+\n    '<\u002Fdiv>'+\n    '<div class=\"panel\" style=\"padding:15px 17px\">'+\n      '<div class=\"sec-h\" style=\"margin-bottom:4px\">Scoping &amp; upcoming kick-offs <span class=\"count\">'+KICKOFFS.length+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sub\" style=\"margin-bottom:11px\">New clients being scoped and what starts next<\u002Fdiv>'+\n      KICKOFFS.map(function(p){\n        var col = p.tag==='Kick-off' ? '#4ADE80' : (p.tag==='Scoping' ? '#94A3B8' : '#64748B');\n        var bg  = p.tag==='Kick-off' ? 'rgba(74,222,128,.12)' : 'rgba(148,163,184,.12)';\n        return '<div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2)\">'+\n          '<div style=\"min-width:0\"><div style=\"font-size:12.5px;font-weight:600;color:var(--w)\">'+esc(p.name)+'<\u002Fdiv>'+\n          '<div style=\"font-size:9px;color:var(--mono);margin-top:3px\">'+esc(p.note)+'<\u002Fdiv><\u002Fdiv>'+\n          '<span class=\"stg\" style=\"color:'+col+';background:'+bg+'\">'+esc(p.tag)+'<\u002Fspan><\u002Fdiv>';\n      }).join('')+\n    '<\u002Fdiv>'+\n  '<\u002Fdiv>'+\n\n  '<div class=\"panel\" style=\"padding:14px 17px;border-left:3px solid var(--amber)\">'+\n    '<div style=\"display:flex +esc(t.s)+'<\u002Fspan><\u002Fdiv>';\n    }).join('');\n    return '<div style=\"padding:12px 16px;border-bottom:1px solid var(--border2)\">'+\n      '<div class=\"grp-h\" style=\"color:'+g.color+'\">'+esc(g.label)+'<\u002Fdiv>'+\n      '<div style=\"display:flex;flex-direction:column;gap:10px\">'+(rws||'<span class=\"empty\">Nothing here<\u002Fspan>')+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n\n  return ''+\n  '<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px\">'+\n    '<h2 class=\"big\">Portfolio table<\u002Fh2><span class=\"sub\">'+L.length+' clients, go-live first<\u002Fspan>'+\n    '<div style=\"margin-left:auto;display:flex;align-items:center;gap:6px\">'+filtersHTML()+\n      '<button class=\"btn-red\" style=\"margin-left:6px\" onclick=\"startPresent()\">Run all-hands &rarr;<\u002Fbutton><\u002Fdiv><\u002Fdiv>'+\n  '<div style=\"display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start\">'+\n    '<div class=\"tbl\"><div class=\"thead\"><span>Client<\u002Fspan><span>Stage<\u002Fspan><span>Go-live<\u002Fspan><span>Progress<\u002Fspan><span style=\"text-align:right\">Open actions<\u002Fspan><\u002Fdiv>'+rows+'<\u002Fdiv>'+\n    '<div class=\"panel\" style=\"position:sticky;top:88px;overflow:hidden\">'+\n      '<div style=\"padding:15px 16px;border-bottom:1px solid var(--border2)\">'+\n        '<div style=\"display:flex;align-items:center;gap:9px\">'+\n          '<span style=\"width:8px;height:8px;border-radius:50%;background:'+c.stageColor+';display:block\"><\u002Fspan>'+\n          '<span style=\"font-size:15px;font-weight:800;color:var(--w)\">'+esc(c.name)+'<\u002Fspan>'+\n          '<span class=\"mono\" style=\"font-size:12px;margin-left:auto;color:'+c.daysColor+'\">'+c.shortDays+'<\u002Fspan><\u002Fdiv>'+\n        '<div style=\"font-size:10px;color:var(--mono);margin-top:6px;line-height:1.5\">'+esc(c.meta)+'<\u002Fdiv><\u002Fdiv>'+\n      '<div style=\"max-height:520px;overflow:auto\">'+groups+'<\u002Fdiv>'+\n      '<div style=\"padding:12px 16px;display:flex;align-items:center;justify-content:space-between\">'+\n        '<span class=\"sub\">'+esc(c.foot)+'<\u002Fspan>'+\n        (c.trackerUrl?'<a href=\"'+c.trackerUrl+'\" target=\"_blank\" style=\"font-size:10px;font-weight:700;text-transform:uppercase\">Open tracker &rarr;<\u002Fa>':'<span class=\"sub\">No tracker yet<\u002Fspan>')+\n      '<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n}\n\nfunction renderPres(){\n  var L=all(), c=L[Math.max(0,Math.min(S.pIdx,L.length-1))];\n  document.getElementById('presCount').textContent=(S.pIdx+1)+' / '+L.length;\n  document.getElementById('presBody').innerHTML=\n    '<div style=\"max-width:1100px;margin:0 auto\">'+\n      '<div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-bottom:28px\">'+\n        '<div><div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\">'+\n          '<span class=\"stg\" style=\"font-size:9px;padding:4px 11px;color:'+c.stageColor+';background:'+c.stageBg+'\">'+esc(c.stage)+'<\u002Fspan>'+\n          '<span class=\"sub\" style=\"font-size:11px\">'+esc(c.meta)+'<\u002Fspan><\u002Fdiv>'+\n          '<h2 style=\"font-size:42px;font-weight:800;letter-spacing:-.02em;color:var(--w)\">'+esc(c.name)+'<\u002Fh2><\u002Fdiv>'+\n        '<div style=\"text-align:right\"><div class=\"mono\" style=\"font-size:58px;font-weight:800;line-height:1;color:'+c.daysColor+'\">'+c.daysNum+'<\u002Fdiv>'+\n          '<div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mono);margin-top:7px\">'+esc(c.daysUnit)+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'+\n      '<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:13px\">'+groupsFor(c).map(groupHTML).join('')+'<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction renderKpis(L){\n  var od=0,bl=0,wk=0,cl=0;\n  L.forEach(function(c){ od+=c.overdue; bl+=c.blocked; wk+=c.week; cl+=c.clientSide; });\n  var inFlight=L.filter(function(c){return ['Onboarding','Build','Testing','Go-live'].indexOf(c.stage)>-1;}).length;\n  var soon=L.filter(function(c){return c.days!==null && c.days>=0 && c.days<=GO_LIVE_HORIZON;}).length;\n  var K=[\n    {l:'In delivery', v:inFlight, s:'of '+L.length+' clients', c:'#FFFFFF'},\n    {l:'Go-live \\u2264 '+GO_LIVE_HORIZON+'d', v:soon, s:'clients landing', c:'#FBBF24'},\n    {l:'Overdue', v:od, s:'actions past due', c:od?'#F87171':'#4ADE80'},\n    {l:'Due this week', v:wk, s:'across portfolio', c:'#60A5FA'},\n    {l:'Blocked', v:bl, s:'need a decision', c:bl?'#FBBF24':'#4ADE80'},\n    {l:'On the client', v:cl, s:'waiting on them', c:'#FBBF24'}\n  ];\n  document.getElementById('kpis').innerHTML=K.map(function(k){\n    return '<div class=\"kpi\"><div class=\"l\">'+k.l+'<\u002Fdiv><div class=\"v\" style=\"color:'+k.c+'\">'+k.v+'<\u002Fdiv><div class=\"s\">'+esc(k.s)+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\n\nfunction render(){\n  var L=all();\n  ['a','b','c'].forEach(function(v){ document.getElementById('tab-'+v).classList.toggle('on', S.view===v); });\n  renderKpis(L);\n  document.getElementById('view').innerHTML = S.view==='b' ? viewB(L) : (S.view==='c' ? viewC(L) : viewA(L));\n  if(document.getElementById('pres').classList.contains('on')) renderPres();\n}\n\n/* boot */\n(function(){\n  var ws=weekStart(), we=WK_END;\n  document.getElementById('weekLabel').textContent =\n    'Mon '+ws.getDate()+' \\u2013 Sun '+we.getDate()+' '+MON[we.getMonth()]+' '+we.getFullYear();\n  document.getElementById('stamp').textContent =\n    new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});\n  document.addEventListener('keydown', function(e){\n    if(!document.getElementById('pres').classList.contains('on')) return;\n    if(e.key==='ArrowRight') presMove(1);\n    if(e.key==='ArrowLeft') presMove(-1);\n    if(e.key==='Escape') stopPresent();\n  });\n  render();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
